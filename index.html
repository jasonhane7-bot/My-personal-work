策调整或改变，领导人更迭，国际政治风波频仍，在国际舞台上扮演较为","公司自身因素：股票自身价值是决定股价最基本的因素，而这主要取决于发行公司的经营业绩、资信水平以及连带而来的股息红利派发状况、发展前景、股票预期收益水平等。；行业因素：行业在国民经济中地位的变更，行业的发展前景和发展潜力，新兴行业引来的冲击等，以及上市公司在行业中所处的位置、经营业绩、经营状况、资金组合的改变和领导层人事变动等都会影响相关股票的价格。；市场因素：投资者的动向，大户的意向和操纵，公司间的合作或相互持股，信用交易和期货交易的增减，投机者的套利行为，公司的增资方式和增资额度等，均可能对股价形成较大影响。；心理因素：投资人在受到各个方面的影响后产生心理状态改变，往往导致情绪波动，判断失误，做出盲目追随大户、狂抛抢购行为，这往往也是引起股价狂跌暴涨的重要因素。"]},{"no":2,"type":"short","stem":"简述货币政策目标之间的冲突性。","score":8,"body":"货币政策最终目标一般亦称货币政策目标，它是中央银行通过货币政策的操作而达到的最终宏观经济目标。其内涵包括稳定币值、经济增长、充分就业以及平衡国际收支。货币政策目标相互之间的冲突性具体如下：（1）稳定币值与充分就业的冲突：当币值比较稳定，物价上涨率比较低时，失业率往往很高，而要降低失业率，就得以牺牲一定程度的币值稳定为代价。（2）稳定币值与经济增长的冲突：世界各国的经济发挥发展史表明，在经济发展快时，总是伴随着物价较大幅度的上涨，而过分强调币值的稳定，经济的增长与发展又会受阻。（3）稳定币值与平衡国际收支的冲突：国内物价稳定时，国际收支并非一定能平衡，因为国际收支能否平衡还要取决于国内的经济发展战略、资源结构、生产结构与消费结构的对称状况、国家的外贸政策、关税协定、利用外资策略等，同时还要受其他国家政策与经济形势等诸多因素的影响。（4）充分就业与经济增长的冲突：如果就业增加带来的经济增长伴随着社会平均劳动生产率的下降，那就意味着经济增长是以投入产出的比例下降为前提的，它不仅意味本期浪费更多的资源，还会妨碍后期的经济增长，因而是不可取的。（5）充分就业与平衡国际收支的冲突：为了追求充分就业，就需要更多的资金和生产资料，当国内满足不了需求时，就需要引进外资、进口设备与原材料等，这对平衡国际收支又是一大不利因素。（6）经济增长与平衡国际收支的冲突：经济的较快增长又总是对各种生产要素产生较大的需求，这往往又会增加进口，从而引起国际收支逆差的出现。当逆差很大时，国家就得限制进口，压缩国内投资，这又会妨碍国内的经济增长，甚至会引起衰退。","points":["货币政策最终目标一般亦称货币政策目标，它是中央银行通过货币政策的操作而达到的最终宏观经济目标。其内涵包括稳定币值、经济增长、充分就业以及平衡国际收支。货币政策目标相互之间的冲突性具体如下：","稳定币值与充分就业的冲突：当币值比较稳定，物价上涨率比较低时，失业率往往很高，而要降低失业率，就得以牺牲一定程度的币值稳定为代价。","稳定币值与经济增长的冲突：世界各国的经济发挥发展史表明，在经济发展快时，总是伴随着物价较大幅度的上涨，而过分强调币值的稳定，经济的增长与发展又会受阻。","稳定币值与平衡国际收支的冲突：国内物价稳定时，国际收支并非一定能平衡，因为国际收支能否平衡还要取决于国内的经济发展战略、资源结构、生产结构与消费结构的对称状况、国家的外贸政策、关税协定、利用外资策略等，同时还要受其他国家政策与经济形势等诸多因素的影响。","充分就业与经济增长的冲突：如果就业增加带来的经济增长伴随着社会平均劳动生产率的下降，那就意味着经济增长是以投入产出的比例下降为前提的，它不仅意味本期浪费更多的资源，还会妨碍后期的经济增长，因而是不可取的。","充分就业与平衡国际收支的冲突：为了追求充分就业，就需要更多的资金和生产资料，当国内满足不了需求时，就需要引进外资、进口设备与原材料等，这对平衡国际收支又是一大不利因素。；经济增长与平衡国际收支的冲突：经济的较快增长又总是对各种生产要素产生较大的需求，这往往又会增加进口，从而引起国际收支逆差的出现。当逆差很大时，国家就得限制进口，压缩国内投资，这又会妨碍国内的经济增长，甚至会引起衰退。"]},{"no":3,"type":"short","stem":"简述固定汇率制度和浮动汇率制度的优缺点。","score":8,"body":"固定汇率制度指一国货币的汇率基本固定，同时又将汇率的波动限制在一个规定的范围内的汇率制度。浮动汇率制度是指汇率水平完全由外汇市场的供求决定的、政府不加任何干预的汇率制度。（1）固定汇率的优缺点：①固定汇率制的优点是有利于世界经济的发展。由于在固定汇率制下两国货币比价基本固定，或汇率的波动范围被限制在一定幅度之内，这就便于经营国际贸易、国际信贷与国际投资的经济主体进行成本和利润的核算，也使这些国际经济交易的经济主体面临的汇率波动风险损失较小，从而有利于国际经济交易的进行与发展，从而有利于世界经济的发展。②固定汇率制的缺点：第一，汇率基本上不能发挥调节国际收支杠杆作用。汇率变动有着影响国际收支的经济作用，因而汇率可充作调节国际收支的经济杠杆。固定汇率制下，汇率就基本不能发挥其调节国际收支的经济杠杆作用。第二，固定汇率制有牺牲内部平衡之虞。由于汇率基本不能发挥调节国际收支的经济杠杆作用，当一国国际收支失衡时，就需采取紧缩性或扩张性财政货币政策，这会使国内经济增长受到抑制和失业扩大化，或者使通货膨胀与物价上涨严重化。另外，维持汇率波动官定上下限所采取的干预外汇市场的措施，也会有同样的后果：软货币（或称“弱币”，即汇率有下降趋势的货币）发行国货币当局进行干预，一方面会使其外汇储备流失，另一方面又会形成紧缩性的经济影响：硬货币（或称“强币”，即汇率上升趋势的货币）发行国货币当局进行市场干预，会形成扩张性经济影响，使该国通货膨胀与物价上涨加快。第三，易引起国际汇率制度的动荡与混乱，当一国国际收支恶化，进行市场干预仍不能平抑汇价时，该国最后有可能采取法定贬值的措施。这会引起同该国密切经济关系的国家也采取法定贬值的措施，从而导致外汇市场和整个国际汇率制度的动荡与混乱。（2）浮动汇率制度的优缺点：①浮动汇率制度的主要优点：第一，汇率发挥其调节国际收支的经济杠杆作用。一国的国际收支失衡，可以经由汇率的上下浮动而加以消除。第二，只要国际收支失衡不是特别严重，就没有必要调整财政政策和货币政策，从而不会以牺牲内部平衡来换取外部平衡的实现。第三，减少了对储备的需要，并使逆差国避免了外汇储备的流失。这是因为，在浮动汇率制度下，各国货币当局没有干预外汇市场和稳定汇率的义务。这一方面使逆差国避免了外汇储备的流失，另一方面又使各国不必保持太多的外汇储备，从而能把节省的外汇资金用于本国经济的发展。②浮动汇率制度的主要缺点：第一，汇率频繁与剧烈地波动，使进行国际贸易、国际信贷与国际投资等国际经济贸易的经济主体难以核算成本和利润，并使他们面临较大的汇率波动所造成的外汇风险损失，从而对世界经济发展产生不利影响。第二，为外汇投机提供了土壤和条件，助长了外汇投机活动，这必然会加剧国际金融市场的动荡与混乱。","points":["固定汇率制度指一国货币的汇率基本固定，同时又将汇率的波动限制在一个规定的范围内的汇率制度。浮动汇率制度是指汇率水平完全由外汇市场的供求决定的、政府不加任何干预的汇率制度。（1）固定汇率的优缺点：","固定汇率制的优点是有利于世界经济的发展。由于在固定汇率制下两国货币比价基本固定，或汇率的波动范围被限制在一定幅度之内，这就便于经营国际贸易、国际信贷与国际投资的经济主体进行成本和利润的核算，也使这些国际经济交易的经济主体面临的汇率波动风险损失较小，从而有利于国际经济交易的进行与发展，从而有利于世界经济的发展。","固定汇率制的缺点：第一，汇率基本上不能发挥调节国际收支杠杆作用。汇率变动有着影响国际收支的经济作用，因而汇率可充作调节国际收支的经济杠杆。固定汇率制下，汇率就基本不能发挥其调节国际收支的经济杠杆作用。第二，固定汇率制有牺牲内部平衡之虞。由于汇率基本不能发挥调节国际收支的经济杠杆作用，当一国国际收支失衡时，就需采取紧缩性或扩张性财政货币政策，这会使国内经济增长受到抑制和失业扩大化，或者使通货膨胀与物价上涨严重化。另外，维持汇率波动官定上下限所采取的干预外汇市场的措施，也会有同样的后果：软货币（或称“弱币”，即汇率有下降趋势的货币）发行国货币当局进行干预，一方面会使其外汇储备流失，另一方面又会形成紧缩性的经济影响：硬货币（或称“强币”，即汇率上升趋势的货币）发行国货币当局进行市场干预，会形成扩张性经济影响，使该国通货膨胀与物价上涨加快。第三，易引起国际汇率制度的动荡与混乱，当一国国际收支恶化，进行市场干预仍不能平抑汇价时，该国最后有可能采取法定贬值的措施。这会引起同该国密切经济关系的国家也采取法定贬值的措施，从而导致外汇市场和整个国际汇率制度的动荡与混乱。（2）浮动汇率制度的优缺点：","浮动汇率制度的主要优点：第一，汇率发挥其调节国际收支的经济杠杆作用。一国的国际收支失衡，可以经由汇率的上下浮动而加以消除。第二，只要国际收支失衡不是特别严重，就没有必要调整财政政策和货币政策，从而不会以牺牲内部平衡来换取外部平衡的实现。第三，减少了对储备的需要，并使逆差国避免了外汇储备的流失。这是因为，在浮动汇率制度下，各国货币当局没有干预外汇市场和稳定汇率的义务。这一方面使逆差国避免了外汇储备的流失，另一方面又使各国不必保持太多的外汇储备，从而能把节省的外汇资金用于本国经济的发展。","浮动汇率制度的主要缺点：第一，汇率频繁与剧烈地波动，使进行国际贸易、国际信贷与国际投资等国际经济贸易的经济主体难以核算成本和利润，并使他们面临较大的汇率波动所造成的外汇风险损失，从而对世界经济发展产生不利影响。第二，为外汇投机提供了土壤和条件，助长了外汇投机活动，这必然会加剧国际金融市场的动荡与混乱。"]},{"no":4,"type":"short","stem":"简述可转换债券筹资的利。","score":8,"body":"可转换债券是指根据债券合同规定，可以在一定时期内按照事先规定的比率或转换为一定数量的普通股股票的公司债券，兼具债权和期权的特征。债券持有者可以在条件有利的时候将转换债券转换成公司普通股股票，而在条件不利时则不进行转换。（1）可转换债券筹资的优点：①可降低筹资成本；②便于筹集资金；③公司可获得转换溢价；④有利于稳定股票价格和减少对每股收益的稀释；5提高公司声誉，扩大股东基础，增加长期资金来源。（2）可转换债券筹资的缺点：①实际筹资成本较高；②增加了财务风险；③债券低利率的期限不长。","points":["可转换债券是指根据债券合同规定，可以在一定时期内按照事先规定的比率或转换为一定数量的普通股股票的公司债券，兼具债权和期权的特征。债券持有者可以在条件有利的时候将转换债券转换成公司普通股股票，而在条件不利时则不进行转换。（1）可转换债券筹资的优点：；可降低筹资成本；；便于筹集资金；；公司可获得转换溢价；","有利于稳定股票价格和减少对每股收益的稀释；5提高公司声誉，扩大股东基础，增加长期资金来源。（2）可转换债券筹资的缺点：；实际筹资成本较高；；增加了财务风险；；债券低利率的期限不长。"]},{"no":1,"type":"essay","stem":"请讨论数量型货币政策工具与价格型货币政策工具各自的特点，以及各自的局限性。目前我国货币政策操作中应该如何有效地使用这两类工具？","score":14,"body":"货币政策工具分为价格型和数量型。数量型工具主要包括公开市场操作和存款准备金率，价格工具主要包括利率政策和汇率政策。（1）数量型货币政策的特点及其局限性 ①法定存款准备金率调整，是指在国家法律所赋予的权力范围内，通过规定或调整商业银行缴存中央银行的存款准备金率，控制商业银行的信用创造能力，间接地调节社会供应量的活动。中央银行通过调整存款准备金率来改变货币乘数，控制商业银行的货币创造，从而调节货币应量。当经济扩张，发生通货膨胀时，中央银行可以提高存款准备金率，缩小货币乘数，迫使商业银行紧缩信贷规模，从而减少市场货币供应量。法定存款准备金率的局限性在于存款准备金率主要稍加调整，都会对金融和信贷状况发生显著影响。由于其效果过于猛烈，中央银行难以确定调整准备金率的时机和调整的幅度，因而法定存款准备行和不同种类的存款的影响不一致，因而货币政策实现的效果可能因这些复杂情况的存在而不易把握。②公开市场业务，是指中央银行在公开市场上买进卖出有价证券的业务。中央银行通过公开市场上的证券买卖活动，可以达到扩张和收缩信用，调节货币供应量的目的。当金融市场上资金缺乏时，中央银行就通过公开市场业务买进有价证券，向社会投入了一笔基础货币。这些基础货币如果流入社会大众手中，则会直接地增加社会货币供应量；如果是流入商业银行，则会引起信用的扩张和货币供应量的多倍增加。反之，中央银行就可以通过公开市场业务卖出有价证券，从而达到信用规模的收缩和货币供应量的减少的目的。③公开市场业务的局限性在于公开市场业务要有效地发挥其作用，必须具备有一定的条件：一是的操作应具有弹性操纵权，中央银行可根据客观经济需要和货币政策目标的要求自行决定买卖证券的种类和数量；三是金融市场必须是全国性的，用具有相当的独立性，证券种类齐全并达到一定的规模。（2）价格型货币政策的特点及其局限性 ①价格型货币政策主要是指再贴现政策，中央银行通过制定或调整再贴现利率来干预和影响市场利率及货币市场的供应和需求，从而调节市场货币供应量的一种金融手段。②中央银行通过调整再贴现率可以影响或干预商业银行的准备金及市场银根松紧。当中央银行提高再贴现利率，使之高于市场利率时，商业银行向中央银行借款或贴现的资金成本上升，这就必然减少向中央银行借款或贴现，这使商业银行的准备金相应缩减。从而缩减市场的货币供应量。随着市场货币供应量的缩减，银根紧缩，市场利率也相应上升，社会对货币的需求也相应减少。当中央银行降低再贴现利率。使之低于市场利率时，商业银行向中央银行借款或贴现的资金成本降低，借款比较容易，就必然增加向中央银行的借款或贴现，商业银行的准备金相应增加。于是，银行扩大其资产和信贷规模，从而导致市场货币供应量增加，市场利率也随之降低，社会对货币的需求也相应增加。③调整再贴现率的局限性在于：一是中央银行在使用这一工具调整货币和信用时，不能处于完全主动的地位。商业银行是否愿意到中央银行申请再贴现，或再贴现多少，取决于商业银行。二是再贴现率高低有一定限度。在经济繁荣或经济萧条时期，再贴现率无论高低，都无法限制或阻止商业银行或商业银行无所适从。④我国货币政策操作中使用这两类工具的情况：我国逐步形成了以数量目标为主，同时兼顾利率的操作目前体系，将银行体系超额准备金作为主要操作对象，主要操作目的是将银行体系流动性总量保持在相对合理水平，以促进货币信贷调控目标的实现。同时，公开市场操作也根据市场环境变化和调控需要，适时通过操作利率的变化引导和调节市场预期，影响市场利率走势。③从存款准备金率来看，与许多面临外汇大量流入的新兴市场经济体一样，近年来我国也开始频繁使用准备金率工具来对冲银行体系流动性。使用准备金率工具进行外汇对冲操作对于控制货币供应量过速增长和抑制通货膨胀起到了显著作用。准备金率工具对冲量占总对冲量的比重呈上升趋势，已成为最主要的对冲工具。从利率政策来看，近年来，人民银行加强了对利率工具的运用，利率调控方式更为灵活，调控机制日趋完善。利率作为重要的经济杠杆，在国家宏观调控体系中正发挥更加重要的作用。从汇率政策来看，2005年7月21日，人民银行对有管理的浮动汇率制度，正式实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。经过近6年来的实践，汇率调节外部失衡以及宏观经济的作用或已凸显。（3）我国货币政策操作应该如何有效使用两种工具：近年以来，欧债危机反复恶化，全球经济增长明显放缓，国内主要调控房地产市场和化解投融资平台风险，经济增长面临较大下行压力，国内经济运看，可以略微降低法定存款准备金率，放松商业银行的信贷扩张能力，间接调控社会总的货币量，但是由于法定存款准备金率效果过于猛烈，要慎用。公开市场业务操作可以选择买进有价证券，向社会投放基础货币。从价格型货币政策工具角度看，可以降低再贴现率，放松银根。","points":["货币政策工具分为价格型和数量型。数量型工具主要包括公开市场操作和存款准备金率，价格工具主要包括利率政策和汇率政策。（1）数量型货币政策的特点及其局限性","法定存款准备金率调整，是指在国家法律所赋予的权力范围内，通过规定或调整商业银行缴存中央银行的存款准备金率，控制商业银行的信用创造能力，间接地调节社会供应量的活动。中央银行通过调整存款准备金率来改变货币乘数，控制商业银行的货币创造，从而调节货币应量。当经济扩张，发生通货膨胀时，中央银行可以提高存款准备金率，缩小货币乘数，迫使商业银行紧缩信贷规模，从而减少市场货币供应量。法定存款准备金率的局限性在于存款准备金率主要稍加调整，都会对金融和信贷状况发生显著影响。由于其效果过于猛烈，中央银行难以确定调整准备金率的时机和调整的幅度，因而法定存款准备行和不同种类的存款的影响不一致，因而货币政策实现的效果可能因这些复杂情况的存在而不易把握。","公开市场业务，是指中央银行在公开市场上买进卖出有价证券的业务。中央银行通过公开市场上的证券买卖活动，可以达到扩张和收缩信用，调节货币供应量的目的。当金融市场上资金缺乏时，中央银行就通过公开市场业务买进有价证券，向社会投入了一笔基础货币。这些基础货币如果流入社会大众手中，则会直接地增加社会货币供应量；如果是流入商业银行，则会引起信用的扩张和货币供应量的多倍增加。反之，中央银行就可以通过公开市场业务卖出有价证券，从而达到信用规模的收缩和货币供应量的减少的目的。","公开市场业务的局限性在于公开市场业务要有效地发挥其作用，必须具备有一定的条件：一是的操作应具有弹性操纵权，中央银行可根据客观经济需要和货币政策目标的要求自行决定买卖证券的种类和数量；三是金融市场必须是全国性的，用具有相当的独立性，证券种类齐全并达到一定的规模。（2）价格型货币政策的特点及其局限性","价格型货币政策主要是指再贴现政策，中央银行通过制定或调整再贴现利率来干预和影响市场利率及货币市场的供应和需求，从而调节市场货币供应量的一种金融手段。","中央银行通过调整再贴现率可以影响或干预商业银行的准备金及市场银根松紧。当中央银行提高再贴现利率，使之高于市场利率时，商业银行向中央银行借款或贴现的资金成本上升，这就必然减少向中央银行借款或贴现，这使商业银行的准备金相应缩减。从而缩减市场的货币供应量。随着市场货币供应量的缩减，银根紧缩，市场利率也相应上升，社会对货币的需求也相应减少。当中央银行降低再贴现利率。使之低于市场利率时，商业银行向中央银行借款或贴现的资金成本降低，借款比较容易，就必然增加向中央银行的借款或贴现，商业银行的准备金相应增加。于是，银行扩大其资产和信贷规模，从而导致市场货币供应量增加，市场利率也随之降低，社会对货币的需求也相应增加。；调整再贴现率的局限性在于：一是中央银行在使用这一工具调整货币和信用时，不能处于完全主动的地位。商业银行是否愿意到中央银行申请再贴现，或再贴现多少，取决于商业银行。二是再贴现率高低有一定限度。在经济繁荣或经济萧条时期，再贴现率无论高低，都无法限制或阻止商业银行或商业银行无所适从。；我国货币政策操作中使用这两类工具的情况：我国逐步形成了以数量目标为主，同时兼顾利率的操作目前体系，将银行体系超额准备金作为主要操作对象，主要操作目的是将银行体系流动性总量保持在相对合理水平，以促进货币信贷调控目标的实现。同时，公开市场操作也根据市场环境变化和调控需要，适时通过操作利率的变化引导和调节市场预期，影响市场利率走势。；从存款准备金率来看，与许多面临外汇大量流入的新兴市场经济体一样，近年来我国也开始频繁使用准备金率工具来对冲银行体系流动性。使用准备金率工具进行外汇对冲操作对于控制货币供应量过速增长和抑制通货膨胀起到了显著作用。准备金率工具对冲量占总对冲量的比重呈上升趋势，已成为最主要的对冲工具。从利率政策来看，近年来，人民银行加强了对利率工具的运用，利率调控方式更为灵活，调控机制日趋完善。利率作为重要的经济杠杆，在国家宏观调控体系中正发挥更加重要的作用。从汇率政策来看，2005年7月21日，人民银行对有管理的浮动汇率制度，正式实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。经过近6年来的实践，汇率调节外部失衡以及宏观经济的作用或已凸显。（3）我国货币政策操作应该如何有效使用两种工具：近年以来，欧债危机反复恶化，全球经济增长明显放缓，国内主要调控房地产市场和化解投融资平台风险，经济增长面临较大下行压力，国内经济运看，可以略微降低法定存款准备金率，放松商业银行的信贷扩张能力，间接调控社会总的货币量，但是由于法定存款准备金率效果过于猛烈，要慎用。公开市场业务操作可以选择买进有价证券，向社会投放基础货币。从价格型货币政策工具角度看，可以降低再贴现率，放松银根。"]},{"no":2,"type":"essay","stem":"解释中国外部经济失衡的原因，并阐述通过何种措施来降低纠正中国的外部失衡？","score":14,"body":"外部经济失衡是当前中国经济发展面临的一个重要外部矛盾。中国外部经济失衡的主要表现为：对外贸易顺差的扩大和外汇储备的积聚增长。（1）造成中国外部经济失衡的原因是多方面的，主要有以下几点：①国际产业结构调整与转移：20世纪60年代以来，美国、欧洲等发达国家进行了产业结构战略性调整，在国内集中资源重点发展高新技术产业和现代服务业，通过跨国公司将劳动密集型产业、低附加值的加工业以及资源和能源消耗型产业向外转移，使得国内传统产业变为主要的进口竞争性产业。中国拥有良好的制造业和廉价劳动力优势，因而成为国际产业转移的重要场所和世界制造中心。跨国公司将生产加工基地转移到中国，利用劳动力比较优势进行加工制造，然后又将价廉物美的产品返销到发达国家，促进了中国加工贸易和出口贸易的迅速发展，扩大了中国对这些国家的贸易顺差。②不同的经济结构与增长方式：从经济结构来看，技术密集型产业和服务业在欧美等发达的国民经济中占主导地位，而劳动密集型产业和制造业在中国占主导地位。从经济增长方式来看，欧美等发达国家保持着低储蓄、高消费的经济增长方式，主要依赖消费需求来拉动经济增长。而中国主要依赖劳动密集型产业的出口拉动经济增长。中国与发达国家之间的不同经济结构与增长方式造成了中国贸易顺差的持续扩大。③出口导向型发展模式：中国实行对外经济开放政策后，积极引进外资以加快发展制造加工业，大力发展对外贸易尤其是出口贸易，并通过扩大出口和贸易顺差拉动经济增长。出口导向型发展模式大大推动了出口贸易的迅速发展，保持了国民经济持续增长。但是，中国粗放型出口增长方式对经济持续稳定增长的消极影响日益显现。（2）采取措施：中国外部经济失衡的原因是多方面的，因此要积极运用汇率和货币政策、税收和公共支出政策、外资和外贸政策进行调节。①汇率与货币政策首先，中国应当逐渐扩大汇率的波动幅度，通过本币持续小幅度升值，减少或消除过多的国际收支顺差，减缓流动性过剩和通货膨胀的压力。其次，采取紧缩的货币政策，即提高存款准备金率、提高银行存款利率以及公开市场操作，以此来控制银行信贷规模，提高资金使用成本，保护存款人的资产性收入，这不仅有助于抑制经济过热和产能过剩，控制出口规模，而且有助于减缓国际收支巨额顺差而产生的流动性过剩和通货膨胀压力。②税收和公共支出政策首先，适时调整和降低出口退税率，或征收出口税，调整和降低外商直接投资的优惠税收政策，同时采取“奖入限出\"的贸易政策和“严进宽出”的外资政策，不仅能够控制和减少国际收支不平衡，而且能够优化出口结构和增长方式，改善利用外资的结构，提高利用外商直接投资的质量。制定和实施优惠税收政策，鼓励和促进技术创新，促进产业结构调整与升级和经济增长方式的转变。其次，运用积极的收入政策扩大居民的实际收入，同时进一步扩大政府转移支出和财政补贴以增加农民和低收入者的收入，提高家庭消费能力。进一步完善社会保障等制度，促进家庭消费。加强对高科技、先进制造业和现代服务业的财政支持，以促进经济增长方式的转变，扩大中央预算内投资，全面推进中国的经济建设与发展。③外贸与外资政策首先，对外贸易政策：一是适时控制出口规模，以保持国际收支的基本平衡；二是转变出口增长方式，将出口增长方式从数量型转变为质量型，确保出口贸易的稳定增长；三是适当增加出口，不仅有助于缓和贸易收支的巨额顺差，而且能满足国民经济快速增长的需要。其次，利用外资和对外投资政策：一是加强金融监管，狙击投机活动；二是调整利用外资的政策，引进外资的目标从追求数量转向注重质量，以扩大跨国公司的技术溢出效应，促进投资流向从劳动密集型转向资本与技术密集型；三是加大对外投资的力度，有助于缓和外汇储备的急剧增长，保持资本金融项目的基本平衡。","points":["外部经济失衡是当前中国经济发展面临的一个重要外部矛盾。中国外部经济失衡的主要表现为：对外贸易顺差的扩大和外汇储备的积聚增长。（1）造成中国外部经济失衡的原因是多方面的，主要有以下几点：","国际产业结构调整与转移：20世纪60年代以来，美国、欧洲等发达国家进行了产业结构战略性调整，在国内集中资源重点发展高新技术产业和现代服务业，通过跨国公司将劳动密集型产业、低附加值的加工业以及资源和能源消耗型产业向外转移，使得国内传统产业变为主要的进口竞争性产业。中国拥有良好的制造业和廉价劳动力优势，因而成为国际产业转移的重要场所和世界制造中心。跨国公司将生产加工基地转移到中国，利用劳动力比较优势进行加工制造，然后又将价廉物美的产品返销到发达国家，促进了中国加工贸易和出口贸易的迅速发展，扩大了中国对这些国家的贸易顺差。","不同的经济结构与增长方式：从经济结构来看，技术密集型产业和服务业在欧美等发达的国民经济中占主导地位，而劳动密集型产业和制造业在中国占主导地位。从经济增长方式来看，欧美等发达国家保持着低储蓄、高消费的经济增长方式，主要依赖消费需求来拉动经济增长。而中国主要依赖劳动密集型产业的出口拉动经济增长。中国与发达国家之间的不同经济结构与增长方式造成了中国贸易顺差的持续扩大。","出口导向型发展模式：中国实行对外经济开放政策后，积极引进外资以加快发展制造加工业，大力发展对外贸易尤其是出口贸易，并通过扩大出口和贸易顺差拉动经济增长。出口导向型发展模式大大推动了出口贸易的迅速发展，保持了国民经济持续增长。但是，中国粗放型出口增长方式对经济持续稳定增长的消极影响日益显现。（2）采取措施：中国外部经济失衡的原因是多方面的，因此要积极运用汇率和货币政策、税收和公共支出政策、外资和外贸政策进行调节。","汇率与货币政策首先，中国应当逐渐扩大汇率的波动幅度，通过本币持续小幅度升值，减少或消除过多的国际收支顺差，减缓流动性过剩和通货膨胀的压力。其次，采取紧缩的货币政策，即提高存款准备金率、提高银行存款利率以及公开市场操作，以此来控制银行信贷规模，提高资金使用成本，保护存款人的资产性收入，这不仅有助于抑制经济过热和产能过剩，控制出口规模，而且有助于减缓国际收支巨额顺差而产生的流动性过剩和通货膨胀压力。","税收和公共支出政策首先，适时调整和降低出口退税率，或征收出口税，调整和降低外商直接投资的优惠税收政策，同时采取“奖入限出\"的贸易政策和“严进宽出”的外资政策，不仅能够控制和减少国际收支不平衡，而且能够优化出口结构和增长方式，改善利用外资的结构，提高利用外商直接投资的质量。制定和实施优惠税收政策，鼓励和促进技术创新，促进产业结构调整与升级和经济增长方式的转变。其次，运用积极的收入政策扩大居民的实际收入，同时进一步扩大政府转移支出和财政补贴以增加农民和低收入者的收入，提高家庭消费能力。进一步完善社会保障等制度，促进家庭消费。加强对高科技、先进制造业和现代服务业的财政支持，以促进经济增长方式的转变，扩大中央预算内投资，全面推进中国的经济建设与发展。；外贸与外资政策首先，对外贸易政策：一是适时控制出口规模，以保持国际收支的基本平衡；二是转变出口增长方式，将出口增长方式从数量型转变为质量型，确保出口贸易的稳定增长；三是适当增加出口，不仅有助于缓和贸易收支的巨额顺差，而且能满足国民经济快速增长的需要。其次，利用外资和对外投资政策：一是加强金融监管，狙击投机活动；二是调整利用外资的政策，引进外资的目标从追求数量转向注重质量，以扩大跨国公司的技术溢出效应，促进投资流向从劳动密集型转向资本与技术密集型；三是加大对外投资的力度，有助于缓和外汇储备的急剧增长，保持资本金融项目的基本平衡。"]}]},{"year":2013,"included":38,"excluded":2,"questions":[{"no":1,"type":"single","stem":"关于货币的\"交易过程\"起源观，最早由（）提出","options":["管子","司马迁","亚里士多德","马克思"],"answer":"B","expl":"**司马迁的交换需要说认为，货是用来沟通产品交换的手段，因此货币就是为适适应商品交换的需要而自然产生的。**提示：**本题涉及的考点是货币的起源学说。通常以选择题的方式来考查考生对该知识点的记忆。考生务必把握各个起源学说的基本内容以及提出人。本考点涉及的题型有选择题、判断题。","score":1},{"no":2,"type":"single","stem":"信用货币层次划分的依据","options":["流动性","便利性","收益性","风险性"],"answer":"A","expl":"**目前，各国中央银行在对货币进行层次划分时，都以“流动性\"为依据和标准。**提示：**本题涉及的考点是货币层次的划分。考生需要掌握货币层次划分的标准，每种货币层次分别包含了怎样的内容，了解M2，准货币等概念。该考点涉及的题型有选择题、判断题。","score":1},{"no":3,"type":"single","stem":"从我国宏观部门划分角度看，以下哪个部门属于资金净融出部门","options":["居民住户部门","非金融企业部门","政府部门","金融机构部门"],"answer":"A","expl":"**居民个人一般是金融市场上的主要资金供应者。人们为了满足个人需求，比如购买住房、汽车等大宗商品或储蓄养老金等，都希望通过资金投资使其保值增值。居民个人有时也有资金需求，但数量一般较小，比如住房抵押贷款等消费贷款。**提示：**本题涉及的考点是资金的融入融出部门。金融学课本中的第一章历年来考到的概率较小，考生需要做的就是把资金流量表中各组成成分掌握即可。本考点涉及的题型有选择题、判断题。","score":1},{"no":4,"type":"single","stem":"认为利率是由商品市场与货币市场同时实现均衡条件决定的经济学派是","options":["古典经济学派","凯恩斯主义学派","新古典综合学派","新剑桥学派"],"answer":"C","expl":"**在西方利率决定理论发展过程中，先后出现了早期的利率决定理论、实际利率理论、凯恩斯流动性偏好理论、可贷资金理论和新古典综合派的IS-LM理论等利率决定理论。其中，新古典综合派的 IS-LM模型将市场划分为商品市场和货币市场，认为国民经济均衡是商品市场和货币市场同时出现均衡，该模型在进行利率分析时，加入了国民收入这一重要因素，认为利率是在既定的国民收入下由商品市场和货币市场共同决定的。**提示：**本题涉及的考点是利率决定理论。在金融学的考察中的重要性不言而喻，考生务必掌握每种利率决定理论的基本内容以及各学说分别对应什么怎样的学派。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":5,"type":"single","stem":"某公司的优先股面值1元，每年给股东的分红为5%，如果市场无风险债券收益率为4%，那么该优先股的转让价格应该是","options":["1元","5元","1.5元","1.25元"],"answer":"D","expl":"**由于优先股的收益是固定的，所以其价格的计算与永久性债券相同，P=（1x5%）/4%=1.25。**提示：**本题涉及的考点是优先股的定价模型。考生只需掌握好基本的现金流贴现模型即可进行计算，本题的计算非常基础，考生一定要确保在这样的计算题中得分。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":6,"type":"single","stem":"以下关于货币互换描述正确的是","options":["货币互换的目的是降低融资成本","货币互换可以看作是两种不同利率债券的多头组合","货币互换成立的前提是双方的互换价值为相等","货币互换定价是要找到使双方互换价值相等时的利率"],"answer":"A","expl":"**有些投资者或融资者，由于其信用等级比较低，难以获得低利率成本的融资，通过货币互换和利率互换可以得到比直接融资成本更低的资金，节约了费用。**提示：**本题涉及的考点是货币互换的定义，目的以及作用。货币互换属于金融衍生品的一种，考生在复习的时候要掌握各类金融衍生品的基本工作原理和主要的作用。互换这个考点也有可能出现比较复杂的计算，尽管出现的概率比较低。该考点涉及的题型有选择题、判断题、计算题、简答题。","score":1},{"no":7,"type":"single","stem":"银行可以通过项目评估依据借款人投资未来现金流状况发放中长期贷款的资产管理理论","options":["可转换理论","预期收入理论","真实票据理论","可贷资金论"],"answer":"B","expl":"**预期收入理论强调借款人的预期收入是银行选择资产投向的重要标准之一，即商业银行不仅根据短期商业性需要发放贷款和投资于有价证券，而且只要借款人具有可靠的预期收入用于归还贷款，银行就可以对其发放贷款。**提示：**本题涉及的考点是商业银行的经营管理理论。考生需要掌握商业银行经营管理理论的发展历程和每个理论的基本内容，该考点涉及的题型有选择题、判断题、简答题、名词解释。","score":1},{"no":8,"type":"single","stem":"中央银行业务的服务对象是","options":["企业与金融机构","居民与金融机构","金融机构与政府","政府与居民"],"answer":"C","expl":"**中央银行是银行的银行，是指中央银行充当一国（地区）金融体系的核心，为银行及其他金融机构提供金融服务、支付保证，并监督管理各金融机构与金融市场业务活动的职能。中央银行作为银行的银行，它只与商业银行和其他金融机构发生业务往来，并不与工商企业和个人发生直接的信用关 【待核：低置信度】系。**提示：**本题涉及的考点是中央银行的职能。考生需要掌握好中央银行的三大职能：发行的银行，银行的银行，政府的银行，尤其是银行的银行这一职能需要着重记忆。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":9,"type":"single","stem":"鼓励民间投资并控制通货膨胀的财政与货币政策组合模式是","options":["松财政政策、松货币政策","紧财政政策、紧货币政策","松财政政策、紧货币政策","紧财政政策、松货币政策"],"answer":"D","expl":"**利率是投资的成本，所以鼓励民间投资需要降低利率，因此需要实施宽松的货币政策；控制通货膨胀需要控制总需求，所以从总需求的构成来看，在鼓励民间投资的条件下，要控制总需求只能减少政府支出，相应的就是实行紧缩的财政政策。**提示：**本题涉及的考点是货币政策，财政政策的搭配问题。货币政策，财政政策的搭配有四种模式，考生需要理解并牢记每种搭配方式分别对应的经济背景。该考点的题型有选择题、判断题、论述题、简答题。","score":1},{"no":10,"type":"single","stem":"2009年《巴塞尔资本协议Ⅲ》规定，到2015年跨国银行核心资本占风险总资产的比重最低为","options":["4%","6%","8%","12.5%"],"answer":"B","expl":"**核心资本又叫一级资本和产权资本，包括普通股，盈余，优先股，未分配利润，储务账户。巴塞尔委员会规定的银行资本充足率。**提示：**本题涉及的考点是巴塞尔资本协定三。巴塞尔资本协定三里面有很多数据都需要考生去把握和记忆，特别是与核心资本，附属资本有关的数据。本考点涉及的题型有选择题、判断题。","score":1},{"no":11,"type":"single","stem":"从局部均衡（贸易项目）方面来考查国际收支的理论是","options":["吸收分析法","弹性分析法","货币分析法","资产市场分析法"],"answer":"B","expl":"**罗宾逊以马歇尔的局部均衡分析为基础，在研究外汇市场供求时不仅考虑进出口需求弹性，还加入了进出口供给弹性。20世纪40年代初，美国经济学家勒纳特别探讨了既定进出口供求弹性下货币贬值政策的国际收支效应问题，提出著名的马歇尔一勒纳（MI1）条件。另一位美国经济学家梅茨勒，集前人思想之大成，为ML条件补充了进口有限供给弹性的假设，从而形成被称为国际收支弹性分析理论核心的马歇尔一勒纳一罗宾逊（MLR）条件。**提示：**本题涉及的考点是国际收支。国际收支分析是国际金融中非常重要的内容。考生需要记忆国际收支分析中几个重要理论的名称和其大致的内容，能够对比各大理论之间的相同与不同点。本考点涉及的题型有选择题、判断题。","score":1},{"no":12,"type":"single","stem":"J曲线效应是用来描述经常项目的","options":["贬值的效果","升值的效果","先贬值，后升值的效果","先升值，后贬值的效果"],"answer":"C","expl":"**一国货币对外贬值后，国际收支状况在初期将进一步恶化，经过一段时间，贸易收入才会增加，使国际收支状况得到改善。国际收支的这一运动过程，其函数图像酷似大写英文字母“J”。出现这种特点的原因是由于贸易收支的调整过程存在着认识时滞、决策时滞、生产时滞以及取代时滞等。**提示：**本题涉及的考点是J曲线效应，J曲线效应同样也是国际收支均衡理论中的重要内容。J曲线效应的概念，图像的绘制办法，政策作用都考生需要掌握。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":13,"type":"single","stem":"米德冲突说明，一国如果出现国际收支顺差和通货膨胀，要同时实现内外均衡，必须","options":["用财政扩张应对内部失衡，用货币紧缩应对外部失衡","用财政紧缩应对内部失衡，用货币扩张应对外部失衡","用支出减少政策应对内部失衡，用支出转移政策应对外部失衡","用支出扩张政策应对内部失衡，用支出转移政策应对外部失衡"],"answer":"C","expl":"**英国经济学家米德最早提出了固定汇率制下的内部均衡和外部平衡冲突问题，这一观点被称作米德冲突。当国际收支顺差与通货膨胀并存时，运用支出增减政策与支出转换政策的配合可解决“米德冲突”。支出增减政策通常对国内经济的作用较大，而支出转换政策则对国际收支的作用较大，因此，可以用抑制性的支出增减政策应对内部失衡，用支出转换政策应对外部失衡。**提示：**本题涉及的考点是米德冲突。考生需要掌握米德冲突的内涵和政策意义。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":14,"type":"single","stem":"某公司年初净资产为20000元，预计年末净利润为2000元，公司计划将净利润中的800元作为红利发放。假设公司增长完全依靠保留盈余的再投资，并且公司的红利发放比率保持稳定，则该公司的持续增长率大致为多少？","options":["5%","6%","8%","10%"],"answer":"B","expl":"**可持续增长率=ROExb，其中ROA为净资产收益率，b为再投资比率。ROE=- -=10%,b=1- -=60%，所以S公司的可持续增长率=10%x60%=6%。**提示：**本题涉及的考点是公司持续增长率的计算。考生需要掌握持续增长率的基本计算公式，以及内部增长率的基本计算公式，同时也要掌握利润留存率，再投资比率的计算。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":15,"type":"single","stem":"在项目的期末现金流中不包括哪一项","options":["回收的净营运资本投资","处置残余资产所得","项目贷款的本金偿还","与处置残余资产相关的所得税"],"answer":"C","expl":"**期末现金流包括：①处置残余资产，若账面价值与售价之间存在差额，则损失（或收入）要抵税（或者缴税）；②回收的净营运资本；③机会成本。**提示：**本题涉及的考点是项目现金流的组成成分。项目现金流包含了期初现金流.经营现金流以及期末现金流，考生需要掌握现金流中分别包含了怎样的成分。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":16,"type":"single","stem":"根据时间价值计算的“72法则”，假如你在20岁时存入银行100元，以9%的年利率存40年，并以复利计息，则40年后这100元钱的终值约为","options":["1120元","3200元","4800元","5400元"],"answer":"B","expl":"**“72法则”是计算一笔投资需多少年可以倍增的简单公式。用72除以投资的年利率，结果就是投资倍增所需的年数。则投资倍增的时间是72/9=8（年）。根据72规则，如果投资40年，则这笔投资翻了五倍，所以终值为100×2=3200（元）。**提示：**本题的考点是现金流终值的计算，这是公司财务中最基础的计算。考生需要掌握现金流贴现模型，现金流终值和现值的计算。本考点涉及到的七二法则这个概念出现在王汀汀的公司理财课本中，属于拓展性的内容。该考点涉及的题型有选择题、判断题。","score":1},{"no":17,"type":"single","stem":"某公司普通股每股发行价为10元，筹资费用率为5%，第一年末发放股利为1元每股，以后每年增长5%，则该公司的普通股成本约为","options":["10.5%","12.5%","15.5%","17.5%"],"answer":"C","expl":"**由于公司的筹资成本为5%，该公司得到的每股收入为9.5元，设该公司的融资成本为k，则 1 =9.5。解得k=1.55%。k -5% **提示：**本题涉及的考点是普通股成本的计算。考生需要掌握普通股股价的定价模型，掌握如何利用普通股定价模型计算普通股成本。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":18,"type":"single","stem":"以下对内部收益率的描述中最准确的是","options":["内部收益率的计算没有考虑时间价值","内部收益率与项目资本成本比较可以判断项目取舍","内部收益率是项目的实际收益率，随着项目风险的变动而变化","内部收益率比净现值法更科学"],"answer":"B","expl":"**内部收益率是指使得NPV为0的贴现率，其考虑了时间价值，但是它不是实际收益率。若项目的现金流先流入再流出，或者正负相间时，内部收益率法会失效，所以不能认为它比净现值法更科学（在所有的项目评估方法中，只有净现值法是在任何情况都成立的）。内部收益率法是通过比较内部收益率与项目资本成本的大小来决定是否投资一个项目的方法。**提示：**本题涉及的考点是项目内部收益率。内部收益率法是评价公司投资项目决策的一种方法。复习该部分内容时考生需要掌握内部收益率法的基本含义，优点、缺点以及与其他投资决策评价方法的相同点和不同点，本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":19,"type":"single","stem":"公司债务权益比为1，其权益资本成本为16%，公司债务成本为8%。如果公司所得税率为25%，那么在公司债务权益比为0时，其权益成本为多少？","options":["11.11%","12.00%","12.57%","13.33%"],"answer":"C","expl":"**MM命题2，有负债公司的权益资本成本的计算公式如下：B 将题中的数据代入得可得方程：【待核：低置信度】16% = Ro + 1 × (1 - 25%) × (Ro - 8%) 解得R0=12.57% **提示：**本题涉及的考点，同样也是资本成本的计算。该计算使用到了MM2有税的公式。MM理论是公司财务书中最重要的理论之一，考生务必要花时间精力去掌握。本题涉及的题型有选择题、判断题、计算题。","score":1},{"no":20,"type":"single","stem":"根据股利政策的税差理论，投资者偏好以资本利得的方式获得投资回报的主要原因是","options":["一般而言，相对于现金红利，资本利得的税率较低","投资者认为资本利得的风险比现金红利的风险低","年轻投资者希望将资金进行再投资，不愿意获得现金红利","投资者不理性"],"answer":"A","expl":"**美国资本利得税低于股利所得税的现象一直没有消失，在我国，同样存在资本利得和股利所得税收上的差别。目前我国对股利所得征收20%的所得税，而对资本利得到目前为止还没有进行征税。在存在税收差别的情况下，投资者的资本利得收入高于股利收益收入，尤其是那些实行高额累进税率的国家，股东可能更倾向于从股票升值产生的资本利得中获得投资收益。**提示：**本题涉及的考点是股利分配政策和公司价值理论。复习该部分时，需要考生掌握各大股利分配政策与公司价值是否相关的理论，包括理论的名称、基本内涵等。本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":1,"type":"tf","stem":"银行券与纸币产生的职能基础相同，都是交易手段与支付手段。","options":["正确","错误"],"answer":"×","expl":"**银行券是由银行（尤指中央银行）发行的票据，俗称钞票。是银行发行的.用以代替商业票据的银行票据，是一种信用货币。而纸币是指由国家发行的强制使用的货币符号。银行券和纸币本身都没有价值但两者存在着很大的差别：纸币是从货币的作为流通媒介的职能中产生的；而银行券则产生于信用关系，是在货币作为支付手段职能的基础上产生的。\n\n**提示：**本题考查的知识点是银行券与纸币的区别。银行券和纸币有很多的相似之处，但也有不同之处，特别容易混淆，考生需要注意辨析。本考点涉及的题型有选择题、判断题。","score":1},{"no":2,"type":"tf","stem":"在所有经济关系中，信用关系是一种最普遍的经济关系。","options":["正确","错误"],"answer":"√","expl":"**现代经济本质上是信用经济，从企业、居民、政府和金融机构四个部门经济活动的分析中可以看出，企业之间的赊销.预付或借贷，金融机构的存款、贷款或信托、租赁，居民之间的借款赊欠，政府发债或借贷以及跨国赊销、借款、发债等信用活动无处不在。因此，信用关系成为现代经济生活中一种最普遍的经济关系。\n\n**提示：**本题涉及的考点是信用关系。考生只要对信用有初步的理解即可正确回答。本考点涉及的题型有选择题、判断题。","score":1},{"no":3,"type":"tf","stem":"货币的时间价值是对消费推迟的补偿。","options":["正确","错误"],"answer":"√","expl":"**西方经济学对货币的时间价值的解释是：就现在消费与未来消费来说，人们更加偏好现在消费，如果货币的所有者要将其持有的货币进行投资或借予他人进行投资，他就必须牺牲现在消费，对此，他会要求对其现在消费的推迟给予一定的补偿，补偿金额的多少与现在消费推迟的时间成同向变动。\n\n因此，货币的时间价值来源于对现在消费推迟的时间补偿。\n\n**提示：**本题涉及的考点是货币的时间价值。考生要注意对货币的时间价值这个概念的把握。货币的时间价值这个概念内涵非常丰富，涉及到消费通货膨胀、投资率投资回报率等概念，考生需要深入理解。\n\n本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":4,"type":"tf","stem":"货币政策紧缩给股票市场造成的风险是系统性风险。","options":["正确","错误"],"answer":"√","expl":"**系统性风险是通过资产组合无法分散降低的风险，主要包括宏观经济形势的变化、国家的政策等。\n\n**提示：**本题涉及的考点是系统性风险。考生要注意对系统性风险和非系统性风险的辨析。这考点考查的频率非常高，但是难度不大。本题涉及的题型有选择题、判断题。","score":1},{"no":5,"type":"tf","stem":"威廉·夏普的资产组合定价理论被认为是现代资本市场理论诞生的标志。","options":["正确","错误"],"answer":"×","expl":"**马科维获于1952年发表的博士论文一一《资产选择》。以此为基础，现代资产组合理论开始发展起来。马科维茨的资产组合理论被认为是现代资本市场理论诞生的标志。\n\n**提示：**本题涉及的考点是现代资本市场理论诞生的标志。复习该部分内容时，考生需要掌握现代资本市场理论发展的脉络，牢记每个理论提出的顺序、理论的提出者和理论提出的意义。本考点涉及的题型有选择题、判断题。","score":1},{"no":6,"type":"tf","stem":"A商业银行向B商业银行进行票据贴现称为再贴现。","options":["正确","错误"],"answer":"×","expl":"**在被贴现了的银行承兑汇票到期前若贴现银行也出现了融资需求，则贴现银行可以将这张银行承兑汇票向其他金融机构进行转让。转让给其他商业银行，叫转贴现；转让给中央银行，叫再贴现。\n\n题中应是转贴现。\n\n**提示：**本题涉及的考点是再贴现的内涵。","score":1},{"no":7,"type":"tf","stem":"CD 存款工具的出现是为了规避利率风险。","options":["正确","错误"],"answer":"×","expl":"**大额可转让定期存单（CDs）市场首创于美国。1961年2月，为了规避\"Q条例\"对银行存款利率的限制，抑制银行活期存款数量因通货膨胀的发生而持续下降的局面，花旗银行开始向大公司和其他客户发行大额可转让定期存单。它是商业银行改善负债结构的融资工具，其流动性为它的发行和流通提供了有力的保证。\n\n**提示：**本题涉及的考点是CD存款工具的功能。考生需要掌握每种货币工具的作用才能正确回答类似题目。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":8,"type":"tf","stem":"中央银行支付清算系统由定时开放的大额清算系统和实时运行的小额支付系统组成。","options":["正确","错误"],"answer":"×","expl":"**中央银行的支付清算系统主要有两类：大额实时全额支付系统和小额定时批量支付系统。\n\n**提示：**本题涉及的考点是中央银行的支付清算系统。在复习该部分内容时，考生要注意区分大额清算系统和小额清算系统之间的区别，主要包括两方面：定时还是实时，全额还是批量。本考点涉及的题型有选择题、判断题。","score":1},{"no":9,"type":"tf","stem":"政府财政赤字弥补，无论是向央行透支还是发行国债，都会扩张货币供给。","options":["正确","错误"],"answer":"√","expl":"**向中央银行透支就是增发货币，必然引起货币扩张；国债是一国中央政府为弥补财政赤字或筹措建设资金而发行的债券，通过发行国债可回笼货币，减少货币供给。\n\n**提示：**本题涉及的考点是中央银行的货币供给。考生要深入理解中央银行货币供给的具体机理，方能正确回答本题。影响货币供给的因素主要有两个一是基础货币，二是货币乘数。分析货币供给是扩张还是收缩的时候就要仔细考虑该政策是怎样影响基础货币和货币乘数的。本考点涉及的题型有判断题、简答题。","score":1},{"no":10,"type":"tf","stem":"上市公司市值与重置成本比值被称为托宾的Q。","options":["正确","错误"],"answer":"√","expl":"** Q 比率 = 公司市场价值 /资产重置成本。若 Q>1，公司将愿意扩大投资;若 Q<1，公司不会继续投资。\n\n**提示：**本题考查的知识点是托宾 Q 的内涵。托宾 Q 这是一个非常重要的金融学词汇，虽然课本上没有重点提及，曾经在很多高校的金融学考研中考察。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":11,"type":"tf","stem":"国际收支是系统的货币记录，但它不是以货币收支为基础，而是以国际经济交易为基础。","options":["正确","错误"],"answer":"√","expl":"**国际收支是系统的货币记录。国际收支反映的内容以交易为基础，而不是像其字面所表现的那样以货币收支为基础。这些交易既包括涉及货币收支的对外往来，也包括未涉及货币收支的对外往来，未涉及货币收支的往来须折算成货币加以记录。\n\n**提示：**本题涉及的考点是国际收支的内涵。考生要注意对国际收支和国际收支流量表侈义的理解。国际收支是存量还是流量，国际收支是以什么为基础的等等要点都需掌握。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":12,"type":"tf","stem":"经常项目余额也称为基本余额。","options":["正确","错误"],"answer":"×","expl":"**经常项目余额指一定时期内一国商品、服务、收入和经常转移的贷方与借方总额之差。经常项目差额反映了一国对外债权债务变动。经常项目顺差意味着海外资产额增加，逆差意味着该国的海外资产减少。\n\n基本余额是经常项目差额和长期资本与金融项目净额之和所形成的差额。基本余额一般可以反映一国国际收支状况的长期趋势，也是是否需要采取调节政策的重要依据。\n\n**提示：**本题型涉及的考点是项目经常余额和基本余额。国际金融金融书中类似的概念非常多。考生需要把握每个概念之间的细微差别。本考点涉及的题型有选择题、判断题。","score":1},{"no":14,"type":"tf","stem":"期限相同且每年付款金额相同时，先付年金的终值小于后付年金终值。","options":["正确","错误"],"answer":"×","expl":"**若年金的第一次支付发生在第一期之后，则这样的年金称为后付年金。若年金的第一次支付发生在当期或是第 0 期，则这样的年金被称为先付年金。先付年金的终值 = 后付年金的终值 x〈1+r) ，所以先付年金的终值更大。\n\n**提示：**本题的考点是现金流现值和终值的计算。现金流分为先付年金，后付年金。考生需要把握不同类型现金流之间的计算关系。由于货币具有时间价值，因此，先付年金的价值大于后付年金的价值。\n\n本考点涉及的题型有判断题、计算题。\n\n1S.在投资组合理论的框架下，有效投资组合与市场组合之间的相关系数等于 1。 ( Y )\n\n**解析：**有效投资组合是市场组合与无风险资产构成的投资组合，位于 SML 上，其与市场组合的相关系数为 1。\n\n**提示：**本题涉及的考点是投资组合理论。考生需要掌握投资组合理论相关的公式计算,基本原理和 CML 线的方程式和图像。注意理解市场组合和有效投资组合的概念。本考点涉及的题型有选择题、判断题。","score":1},{"no":16,"type":"tf","stem":"根据《中华人民共和国合伙企业法》，具有民事行为能力的自然人可成为普通合伙人。","options":["正确","错误"],"answer":"√","expl":"**普通合伙企业由普通合伙人组成，合伙人对合伙企业债务承担无限连带责任。根据《中华人民共和国合伙企业法》第十四条规定，合伙人为自然人的，应当具有完全民事行为能力。\n\n**提示：**本题涉及的考点是企业的组织形式。该部分内容经常以法律的形式考查，因此复习该部分内容时要着重记忆相关的法律规定。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":17,"type":"tf","stem":"优先股除了可以在分红方面享受优先权之外，还享有购买新发行股票的优先权。","options":["正确","错误"],"answer":"×","expl":"**优先股的“优先”只体现在公司在有熏利,要先分配给优先股股东后,才能分配给普通股股东;而普通股股东享有优先认股权。\n\n**提示：**本题涉及的考点是优先股的权利。复习该考点时，要注意把握优先股股东的权利和义务，注意区分优先股和普通股之间的区别，注意辨析优先股的优先性体现在什么地方。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":18,"type":"tf","stem":"可转换债券转换为普通股时会导致稀释效应，认股权证的行权也会导致稀释效应。","options":["正确","错误"],"answer":"√","expl":"**可转换债券兼有债券和股票的特征，它可以转换为债券发行公司的股票，其转换比率一般会在发行时确定:若转换，则公司的股价会下跌，产生稀释效应。\n\n认股权证是一种约定该证券的持有人可以在规定的某段期间内，有权利〈而非义务 ) 按约定价格向发行人购买〈或出售 ) 标的债券的权利凭证。若行权，公司的股票也会产生稀释效应。\n\n**提示：**本题涉及的知识点是可转债与认股权证的特点。考生需要深入理解优先股，可转债有何作用和相互之间的对比。加强对稀释作用这个概念的把握。本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":19,"type":"tf","stem":"在进行资本预算的过程中，计算项目的期间营运现金流量时，如果项目的部分资金来源于债务，那么需要在现金流中扣除利息费用，并按照WACC作为贴现率评估项目价值。","options":["正确","错误"],"answer":"×","expl":"**用加权平均资本成本评佑项目价值是，不扣除利息和还本的现金流。\n\n**提示：**本题涉及的考点是用加权平均资本成本法评估项目价值。评估项目价值有三种方法: APV 法，WACC 法和 FTE 法。用 WACC 法计算项目价值和公司价值时都无需扣除付息和还本得现金流，但是用 WACC 法和了 FTE 法则都需要扣除相关的现金流，考生要注意区分这三种方法的区别。本考点涉及的题型有选择题、判断题、简答题、计算题。","score":1},{"no":20,"type":"tf","stem":"在有公司所得税的MM定理中，负债公司股东所要求回报率随着资本结构中负债的增加而上升，但公司的加权平均资本成本保持不变。","options":["正确","错误"],"answer":"×","expl":"**根据有公司所得税的 MM 定理，负债公司的资本成本为: 及 = 玖 + 全 xd 如 )x(Ru 一 )\n\n一般情况下 Ro > Bo，随着公司负债的增加，股东认为公司破产的可能性增大，因此负债公司的股东要求的必要报酬率也随之增加;但是加权平均资本成本随财务杠杆的增大而降低。\n\n**提示：**本题涉及的考点是 MM 定理。MM 定理在公司财务课本中的地位至高无上。考生需要熟记 MM 定理的四个公式。熟练掌握权益资本成本和加权平均资本成本是怎样随着负债的改变而改变的。本考点涉及的题型有选择题、判断题、简答题、计算题。","score":1}],"sub":[{"no":1,"type":"calc","stem":"Z公司提供了如下财务数据：\n（1）目标资本结构是50%负债和50%股东权益；\n（2）税后债务成本为8%；\n（3）保留盈余的成本估计为13.5%\n（4）股权融资成本估计为20%，如果公司发行新股票。\n（5）净收入为2500。\n公司现有五个可供选择的项目，项目情况如下表。如果公司执行剩余红利政策，其支付比率是多少？\n项目项目规模 IRR A\n12.00% B\n11.50% 【待核：低置信度】C\n11.0% D\n10.5% E\n10.0%","score":10,"body":"Re -2 _xRxG 昌 + PE+ R4， RB Rec Rw4cc 心选择 A、B、C 项目留存收益用于再投资 (1000+1200+1200) x50%=1700 发放股利: 2500-1700=800 股利发放率: 一 -一三 32%0 己 XRys 三 50%X8% 十 50X13.5%=10.759% 万十天","poi 诱的经济状态。(2) 特点:当利率极低时，有价证券的价格会达到很高，人们为了避免因有价证券价格跌落而遭受损失，几乎每个人都宁愿持有现金而不愿持有有价证券，这意味着货币需求会变得完全有弹性，人们对货币的需求量趋于无限大，表现为流动性偏好曲线或货币需求曲线的右端会变成水平线。(3) 现状:在此情况下，货币供给的增加不会使利率下降，从而也就不会增加投资引诱和有效需求，但在实际上，以经验为根据的论据从未证实过流动性陷阱的存在，而且流动性陷阱也未能被精确地说明是如何形成的。","points":["定义:流动性陷阱〈liquidity trap),又称凯恩斯陷阱或灵活陷阱，是指当利率水平极低时，人们对货币需求无限大，货币当局即使增加货币供给也不能降低利率，从而不能增加投资引诱的经济状态。","特点:当利率极低时，有价证券的价格会达到很高，人们为了避免因有价证券价格跌落而遭受损失，几乎每个人都宁愿持有现金而不愿持有有价证券，这意味着货币需求会变得完全有弹性，人们对货币的需求量趋于无限大，表现为流动性偏好曲线或货币需求曲线的右端会变成水平线。","现状:在此情况下，货币供给的增加不会使利率下降，从而也就不会增加投资引诱和有效需求，但在实际上，以经验为根据的论据从未证实过流动性陷阱的存在，而且流动性陷阱也未能被精确地说明是如何形成的。"]},{"no":2,"type":"term","stem":"回购协议","score":4,"body":"(1) 定义:回购协议 (re-purchase agreemenb)，也称再购回协议，指证券持有人在卖出一种证券时，约定于未来某一时间以约定价格再购回该证券的交易协议。根据该协议所进行的交易称回购交易。(2) 特点:回购交易是中央银行调节全社会流动性的手段之一。当中央银行购入商业银行或证券经纪商持有的证券时，全社会的流动性便增加了;反之，当商业银行或证券经纪商再购回该证券时，全社会的流动性将恢复到其原先水平。中央银行证券回购交易的期限一般较短，通常在 15 天内。(3) 用途:回购交易是中央银行对全社会的流动性进行短期调节的手段。回购交易也可能发生在金融机构之间、金融机构和非金融机构之间、以及非金融机构之间。这时的回购交易是各经济单位之间融通资金的手段之一。回购协议所涉及的证券主要是国债，尤以短期国库券为主。","points":["定义:回购协议 (re-purchase agreemenb)，也称再购回协议，指证券持有人在卖出一种证券时，约定于未来某一时间以约定价格再购回该证券的交易协议。根据该协议所进行的交易称回购交易。","特点:回购交易是中央银行调节全社会流动性的手段之一。当中央银行购入商业银行或证券经纪商持有的证券时，全社会的流动性便增加了;反之，当商业银行或证券经纪商再购回该证券时，全社会的流动性将恢复到其原先水平。中央银行证券回购交易的期限一般较短，通常在 15 天内。","用途:回购交易是中央银行对全社会的流动性进行短期调节的手段。回购交易也可能发生在金融机构之间、金融机构和非金融机构之间、以及非金融机构之间。这时的回购交易是各经济单位之间融通资金的手段之一。回购协议所涉及的证券主要是国债，尤以短期国库券为主。"]},{"no":3,"type":"term","stem":"特别提款权","score":4,"body":"(1) 定义;特别提款权 (Special Drawing Rights) ，是国际货币基金组织为了解决国际储备不足的问题，经过长期的谈判后，于 1969 年在基金组织第 24 届年会上创设的新的国际储备资产，实质上是用于补充原有储备资产的一种国际流通手段。(2) 用途:它是国际货币基金组织对成员国按其份额分配的、可用于归还国际货币基金组织贷款和成员国政府间清偿债权债务的账面资产。一国分配得到的尚未使用完的特别提款权构成其国际储备资产。(3) 特征:价值稳定和仅限于政府间使用。(4) 功能:特别提款是一种靠国际纪律而创造出来的储备资产，它的分配是无偿的。它具有价值矿度、支付手段、贮藏手段的职能，但没有流通手段的职能，不能被私人直接用于国际商品的流通。因此，它还不是一种完全的世界货币。","points":["定义;特别提款权 (Special Drawing Rights) ，是国际货币基金组织为了解决国际储备不足的问题，经过长期的谈判后，于 1969 年在基金组织第 24 届年会上创设的新的国际储备资产，实质上是用于补充原有储备资产的一种国际流通手段。","用途:它是国际货币基金组织对成员国按其份额分配的、可用于归还国际货币基金组织贷款和成员国政府间清偿债权债务的账面资产。一国分配得到的尚未使用完的特别提款权构成其国际储备资产。；特征:价值稳定和仅限于政府间使用。","功能:特别提款是一种靠国际纪律而创造出来的储备资产，它的分配是无偿的。它具有价值矿度、支付手段、贮藏手段的职能，但没有流通手段的职能，不能被私人直接用于国际商品的流通。因此，它还不是一种完全的世界货币。"]},{"no":4,"type":"term","stem":"IPO折价","score":4,"body":"(1) 概念:一只股票在首次公开发行后，上市交易首日的收盘价通常都会明显高于发行价，形成 \" 首日收益 \"”，这一现象被称为卫 O 折价。(2) 特点:由于缺乏判断股票发行价格高低的绝对标准，因此金融学采用与市场价格比较的指标来判断，例如，新股上市的首日收益率。首日收益率是指新股上市首日的收盘价超过其发行价的百分比。折价的幅度通常用首日收益率度量。(3) 现象:新股的折价是一个国际、国内股票市场普遍存在的问题。","points":["概念:一只股票在首次公开发行后，上市交易首日的收盘价通常都会明显高于发行价，形成 \" 首日收益 \"”，这一现象被称为卫 O 折价。","特点:由于缺乏判断股票发行价格高低的绝对标准，因此金融学采用与市场价格比较的指标来判断，例如，新股上市的首日收益率。首日收益率是指新股上市首日的收盘价超过其发行价的百分比。折价的幅度通常用首日收益率度量。","现象:新股的折价是一个国际、国内股票市场普遍存在的问题。"]},{"no":5,"type":"term","stem":"净现值","score":4,"body":"(1) 概念:净现值 (net present valueNPV) 是指投资项目投入使用后的净现金流量。(2) 计算:按资本成本或企业要求达到的报酬率即适当贴现率折算为现值，减去初始投资以后的余额《如果投资期超过一年，则应是减去初始投资的现值以后的余额 ) 。(3) 公式:其计算公式为: NPV = y DC C 各 G+ 其中 NCFt 为第 t 期净现金流，r 为贴现率，C 为初始投资额。","points":["概念:净现值 (net present valueNPV) 是指投资项目投入使用后的净现金流量。","计算:按资本成本或企业要求达到的报酬率即适当贴现率折算为现值，减去初始投资以后的余额《如果投资期超过一年，则应是减去初始投资的现值以后的余额 ) 。","公式:其计算公式为: NPV = y DC C 各 G+ 其中 NCFt 为第 t 期净现金流，r 为贴现率，C 为初始投资额。"]},{"no":1,"type":"short","stem":"简述货币需求理论发展的脉络及其规律。","score":8,"body":"(1) 货币需求理论发展的脉络: 包马克思的货币需求理论马克思的货币必要量公式; PQ M = 一 V 该模型强调的是商品流通决定货币流通的基本原理。认为在一定时期内执行流通手段职能的货币必要量主要取决于商品价格总额和货币流通速度。@ 古典学派的货币需求理论两个著名的方程式 a.交易方程式费雪方程式，MV=PT 又可以写成 PT 1 V Y M = PT 此公式表明，决定一定时期名义货币需求数量的因素主要是这一时期全社会一定价格水平下的总交易量与同期的货币流通速度。b.剑桥方程式剑桥方程式，Md=kPY 马歇尔和庇古认为，人们的财富与收入有三种用途: a.投资以取得利润或利姑; b.消费以取得享受; c.持有货币以便利交易和预防意外，形成的现金余额即是对货币的需求。@@ 岂有因斯学派的货币需求理论凯恩斯的货币需求理论研究从人们持有货币的动机入手。他认为，人们之所以需要持有货币，是因为存在着流动性偏好这种普遍的心理倾向，而人们偏好货币的流动性是出于交易动机、预防动机和投机动机。由弗里德曼的货币需求理论弗里德曼认为，对人们货币需求问题的分析可借助于消费者选择理论来进行。一般消费者在对诺多商品进行选择时，必然要考虑以下三个因素: @ 效用;，@@ 收入或财富水平，加机会成本。弗里德曼认为，与消费者对商品的选择一样，人们对货币的需求同样受这三类因素的影响，进而对影响货币需求的这三类因素进行了详细的分析。(2) 发展规律:费雪从货币供应量以及货币流通速度的角度总结归纳了宏观的货币需求理论 MV=PT，从马克思的货币需求理论发展到古典学派的货币需求理论，再到近现代凯恩斯学派的货币需求理论，最后到弗里德曼的货币需求理论，属于微观的货币需求理论。","points":["货币需求理论发展的脉络: 包马克思的货币需求理论马克思的货币必要量公式; PQ M = 一 V 该模型强调的是商品流通决定货币流通的基本原理。认为在一定时期内执行流通手段职能的货币必要量主要取决于商品价格总额和货币流通速度。@ 古典学派的货币需求理论两个著名的方程式 a 格发现。衍生工具交易价格是对合约标的物未来价格的事先确定，如果市场竞争是充分的和有效的，衍生工具价格就是对标的物未来价格的事先发现。图投机套利。只要商品或资产存在价格的波动就有投机与套利的空间。衍生工具交易采用现金清算，而不强制实行实物交割，这就使衍生工具成了事实上的一类投资品。衍生工具将大宗商品细化为标准化的可交易合约，使交易双方买卖更加便利。衍生工具都是跨期交易，存在一个期限，相同期限的不同衍生品，同一衍生品的不同期限之间往往存在套利的可能。"]},{"no":3,"type":"short","stem":"外汇储备持续增加对经济的不利影响。","score":8,"body":"(1) 外汇储备的定义:外汇储备指一国政府持有的、被各国普遍接受的、可自由兑换的外国货币及其表示的短期金融资产〈主要是银行存款和国库券》，是当今国际储备的主体。充当国际储备资产的货币必须具备下列条件: 中能自由兑换成其他储备货币; 包在国际货币体系中占据重要地位; @@ 其购买力必须具有稳定性。(2) 外汇储备持续增加对经济的不利影响主要体现在: 中在固定汇率制度下，外汇储备的持续增加导致货币供应量的急剧增长，货币供应量的急剧增长又会影响国内的利率水平和物价水平，最终影响国内经济。因此，外汇储备增长给中央银行制定和执行货币政策带来了新的问题。包外汇储备的成本。外汇储备实际上是对国外资源的持有，外汇储备的成本是用于国内生产性投资所产生的收益与外汇储备本身利益收益之间的差额。外汇储备增速越快，外汇储备越多，外汇储备的成本就越大。@ 外汇储备的持续增加使本币有升值压力，特别是在国外政治因素影响下，形成本币升值的强大预期。","points":["外汇储备的定义:外汇储备指一国政府持有的、被各国普遍接受的、可自由兑换的外国货币及其表示的短期金融资产〈主要是银行存款和国库券》，是当今国际储备的主体。充当国际储备资产的货币必须具备下列条件: 中能自由兑换成其他储备货币; 包在国际货币体系中占据重要地位; @@ 其购买力必须具有稳定性。","外汇储备持续增加对经济的不利影响主要体现在: 中在固定汇率制度下，外汇储备的持续增加导致货币供应量的急剧增长，货币供应量的急剧增长又会影响国内的利率水平和物价水平，最终影响国内经济。因此，外汇储备增长给中央银行制定和执行货币政策带来了新的问题。包外汇储备的成本。外汇储备实际上是对国外资源的持有，外汇储备的成本是用于国内生产性投资所产生的收益与外汇储备本身利益收益之间的差额。外汇储备增速越快，外汇储备越多，外汇储备的成本就越大。@ 外汇储备的持续增加使本币有升值压力，特别是在国外政治因素影响下，形成本币升值的强大预期。"]},{"no":4,"type":"short","stem":"国内外的实证研究都表明，增发公告会带来显著为负的价格效应，请用三种理论对这种市场现象进行解释。","score":8,"body":"公开增发新股是上市公司再融资的方式之一，上市公司再融资是指上市公司首次公开发行股票之后，再次在证券市场上募集资金的行为。增发的公告效应，是指上市公司增发新股引起的二级市场股价的变化。国内外的实证研究都表明，增发公告会带来显著为负的价值效应，下面分别用最优资本结构假说、不对称信息假说和新优序融资假说三种理论对这种市场现象进行解释。(1) 最优资本结构假说现代的资本结构理论研究始于 Modigliani 和 Miller1958 提出的 MM 定理。该定理在一系列严格的假设下指导出资本结构和企业价值无关的结论。后来，人们在修正的 MM 定理中引入了税盾的作用，推出企业价值随债务的增加而上升，直至企业百分之百地采取债务融资为止。之后的学者又考虑到债务的增加也会带来企业经营的风险，所以又引入了破产成本理论，得出企业的最优资本结构应根据债务带来的企业价值增加与债务引起的破产成本增加权衡而定。以 MM 理论为基础的最优资本结构假说指出，债券和股票的发行是公司在税收屏蔽好处与财务困境成本之间，股权与债权代理成本之间，并考虑到债务对公司竞争战略的影响后的权衡。税眉理论认为新股发行引起了财务杠杆的下降，减少了税收屏蔽的好处，从而导致股价的下跌，且跌幅与发行规模直接相关。(2) 不对称信息假说 Ross (1977) 率先将信息不对称问题引入资本结构的研究中，他认为“管理者本身是内幕者，也可以看作是内幕信息的处理者 \"。内幕人通过适当的企业行为向市场传递有关信号，外部投资者理性地接受和分析内幕人的这种行为。这样一来，管理者会根据情况选择不同的“行为 \"。Ross 指出:“任何公司债务和权益的运用都是与公司动机一一筹资结构所传递的信息相对应的”。如负债的增加向金融市场传递企业财务结构变动的信号，投资者接收到这个信号并认为企业有意图增加自身价值，因而增加了投资者对企业的信息，是企业价值随之增加。(3) 新优序融资假说新优序融资理论由 Myers (1984) 在信息不对称模型基础上提出的，他认为，既然发行新股筹资会因信息不对称而使公司陷入放弃投资项目或股价下跌的窘境，那么公司应该利用内部资金投资新的项目，而不是股权融资，这样也就不存在信息不对称问题了，因此所有净现值为正的项目都会被公司所采纳。当内部资金不足时，公司会优先考虑低风险的证券如债券，最后才会考虑股权融资。Myers 的新优序融资理论的中心思想是:公司厌恶发行新股票，偏好使用内部留存收益，外部筹资中债券筹资是首选，最后才是增发股票。一般来说，企业债务资本水平的变化向市场传递了一个关于企业价值变化的信号，当企业权益资本随着债务资本增加而减少时，企业的再融资能力增强，企业的价值也随之增加。反之亦然。当公司管理者得知财务困境的可能性已经加大的内部信息时，则更愿意通过发行新股而不是债务来筹集资本。如果市场推断出公司的负债能力下降，股票格将随着发行新股的公告而下降。来自论文《上市公司增发新股公告效应及影响因素分析》。","points":["公开增发新股是上市公司再融资的方式之一，上市公司再融资是指上市公司首次公开发行股票之后，再次在证券市场上募集资金的行为。增发的公告效应，是指上市公司增发新股引起的二级市场股价的变化。国内外的实证研究都表明，增发公告会带来显著为负的价值效应，下面分别用最优资本结构假说、不对称信息假说和新优序融资假说三种理论对这种市场现象进行解释。","最优资本结构假说现代的资本结构理论研究始于 Modigliani 和 Miller1958 提出的 MM 定理。该定理在一系列严格的假设下指导出资本结构和企业价值无关的结论。后来，人们在修正的 MM 定理中引入了税盾的作用，推出企业价值随债务的增加而上升，直至企业百分之百地采取债务融资为止。之后的学者又考虑到债务的增加也会带来企业经营的风险，所以又引入了破产成本理论，得出企业的最优资本结构应根据债务带来的企业价值增加与债务引起的破产成本增加权衡而定。以 MM 理论为基础的最优资本结构假说指出，债券和股票的发行是公司在税收屏蔽好处与财务困境成本之间，股权与债权代理成本之间，并考虑到债务对公司竞争战略的影响后的权衡。税眉理论认为新股发行引起了财务杠杆的下降，减少了税收屏蔽的好处，从而导致股价的下跌，且跌幅与发行规模直接相关。；不对称信息假说 Ross (19","率先将信息不对称问题引入资本结构的研究中，他认为“管理者本身是内幕者，也可以看作是内幕信息的处理者 \"。内幕人通过适当的企业行为向市场传递有关信号，外部投资者理性地接受和分析内幕人的这种行为。这样一来，管理者会根据情况选择不同的“行为 \"。Ross 指出:“任何公司债务和权益的运用都是与公司动机一一筹资结构所传递的信息相对应的”。如负债的增加向金融市场传递企业财务结构变动的信号，投资者接收到这个信号并认为企业有意图增加自身价值，因而增加了投资者对企业的信息，是企业价值随之增加。","新优序融资假说新优序融资理论由 Myers (19","在信息不对称模型基础上提出的，他认为，既然发行新股筹资会因信息不对称而使公司陷入放弃投资项目或股价下跌的窘境，那么公司应该利用内部资金投资新的项目，而不是股权融资，这样也就不存在信息不对称问题了，因此所有净现值为正的项目都会被公司所采纳。当内部资金不足时，公司会优先考虑低风险的证券如债券，最后才会考虑股权融资。Myers 的新优序融资理论的中心思想是:公司厌恶发行新股票，偏好使用内部留存收益，外部筹资中债券筹资是首选，最后才是增发股票。一般来说，企业债务资本水平的变化向市场传递了一个关于企业价值变化的信号，当企业权益资本随着债务资本增加而减少时，企业的再融资能力增强，企业的价值也随之增加。反之亦然。当公司管理者得知财务困境的可能性已经加大的内部信息时，则更愿意通过发行新股而不是债务来筹集资本。如果市场推断出公司的负债能力下降，股票格将随着发行新股的公告而下降。来自论文《上市公司增发新股公告效应及影响因素分析》。"]},{"no":1,"type":"essay","stem":"运用相关理论并联系实际，分析中国利率市场化改革的目标，进程和利率市场化可能给银行业带来的冲击，提出应对冲击的策略。","score":14,"body":"(1) 利率市场化改革的目标政府放松乃至解除对利率的严格管制，从总体上提高利率弹性，是利率充分反映金融市场资金供求，引导资金流动合理化、效益化，并以此完善宏观调控手段，实现金融市场化。利率市场化改革的总体思路是先放开货币市场利率和债券市场利率，在逐步推进存、贷款利率的市场化。而存、贷款利率市场化则按照“先外币、后本币，先贷款、后存款;先长期、大额，后短期、小额”的顺序进行。(2) 中国利率市场化改革的进程 @@ 银行间同业拆借市场利率先行放开:如 1996 年人民银行明在《关于取消同业拆借利率上限管理的通知》中明确指出，银行间同业拆借市场利率根据市场资金供求自主决定。@@ 放开债券市场利率:如 1997 年人民银行下发了《关于银行间债券回购业务有关问题的通知》，决定借鉴拆借利率市场化的经验，同步放开债券回购利率和现券交易价格。图存贷款利率的市场化:又分为境内外币利率市场化和人民币贷款利率市场化。(3) 利率市场化给银行业带来的冲击人利率市场化将直接冲击银行传统业务，减少利差收入; @ 考验银行中间业务的拓展能力。在我国，商业银行非利差中间业务收入所占的比率偏低，为应对冲击，必须将注意力投向非利益收入业务。@@ 考验银行风险管理能力。利率市场化将增加影响利率水平的因素，利率波动频率和幅度会显著提高，利率期限结构也更为复杂。《4) 银行业应对冲击的策略引拓展多元化经营，提高非利息收入的比重包建立有效的产品定价机制，对不同地方和区域实行差别定价，名提高利率风险的管理能力，通过资产负债管理创新，引进缺口管理，规避利率风险。","points":["利率市场化改革的目标政府放松乃至解除对利率的严格管制，从总体上提高利率弹性，是利率充分反映金融市场资金供求，引导资金流动合理化、效益化，并以此完善宏观调控手段，实现金融市场化。利率市场化改革的总体思路是先放开货币市场利率和债券市场利率，在逐步推进存、贷款利率的市场化。而存、贷款利率市场化则按照“先外币、后本币，先贷款、后存款;先长期、大额，后短期、小额”的顺序进行。","中国利率市场化改革的进程 @@ 银行间同业拆借市场利率先行放开:如 1996 年人民银行明在《关于取消同业拆借利率上限管理的通知》中明确指出，银行间同业拆借市场利率根据市场资金供求自主决定。@@ 放开债券市场利率:如 1997 年人民银行下发了《关于银行间债券回购业务有关问题的通知》，决定借鉴拆借利率市场化的经验，同步放开债券回购利率和现券交易价格。图存贷款利率的市场化:又分为境内外币利率市场化和人民币贷款利率市场化。","利率市场化给银行业带来的冲击人利率市场化将直接冲击银行传统业务，减少利差收入; @ 考验银行中间业务的拓展能力。在我国，商业银行非利差中间业务收入所占的比率偏低，为应对冲击，必须将注意力投向非利益收入业务。@@ 考验银行风险管理能力。利率市场化将增加影响利率水平的因素，利率波动频率和幅度会显著提高，利率期限结构也更为复杂。","银行业应对冲击的策略引拓展多元化经营，提高非利息收入的比重包建立有效的产品定价机制，对不同地方和区域实行差别定价，名提高利率风险的管理能力，通过资产负债管理创新，引进缺口管理，规避利率风险。"]},{"no":2,"type":"essay","stem":"在开放经济条件下，宏观经济政策配合的主要内容是什么？如何看待近年来我国政策配合的效果？","score":14,"body":"(1) 宏观经济政策配合的主要内容: 在开放的经济环境中，宏观经济政策不仅要实现内部均衡〈即稳定通货 ) ，还要实现外部均衡《即保持国际收支平衡 ) ，并且伴随着稳定通货和平衡国际收支，实现经济的适度增长和充分就业。为实现内外均衡目标，在市场经济条件下，可供选择的政策工具，除了财政政策和货币政策，还有汇率政策。粗略地说，以财政政策、货币政策实现内部均衡，以汇率政策实现外部均衡。包米德认为，在固定汇率制度下,在国内失业与贸易逆差以及国内通胀和贸易顺差这两种情况下，无法通过财政政策与货币政策的配合实现内外部的均衡。但是，在二十世纪六十年代，蒙代尔挑战了这个理论，指出只要适当地搭配使用财政政策和货币政策，就可以同时实现内外部均衡。蒙代尔认为，财政政策与货币政策对国际收支与名义收入有着相对不同的影响。因此，在固定汇率制度下，一国也存在两种独立的政策工具来实现内外两方面的经济目标。比如，紧缩性财政政策趋于降低利率，而紧缩性货币政策会提高利率。在其他条件不变的情况下，本国利率提高会改善资本账户收支，而本国利率下降则会恶化资本账户收支。由此可见，财政政策与货币政策的取向都是紧缩，对国际收支也会分别有不同的作用。所以，只要对财政政策与货币政策合理搭配使用，就有可能同时实现内外均衡。所以开放背景下，固定汇率制下，宏观经济政策的配合主要内容可以表现为下表: 表 1 不同失衡状态下的最佳政策配合经济失衡状态和上通货膨胀失业国际收支盘余国际收支盘余 | 国际收支庆字国际收支赤字最全牙策呈 | 紧缩性财政政策 | 扩张性财政政策紧缩性财政政策扩张性财政政策 | 扩张性货币政策扩张性货币政策 | 紧缩性货币政策 | 紧缩性货币政策，此外，宏观经济政策的搭配还应包括开放背景下金融政策的选择与搭配; 货币政策的独立性汇率稳定资本自由流动图为死鲁格曼三角形克鲁格曼的不可能三角对于发展中国家经济由封闭到开放时汇率制度的选择、货币制度的选择以及是否允许资本自由流动具有很大的意义。《2) 近年来我国政策配合的效果: 在全球一体化的开放宏观经济环境下，中国在宏观经济政策搭配方面的目标一直是在实现内部均衡的同时保持外部平衡。在实现内部经济货币政策目标即经济增长和物价稳定的前提下，中国近年来一些实行相对稳健的货币政策，为应对失业率升高实行扩张性的财政政策。近年来中国一直在进行汇率制度的改革，提出建立有管理的浮动汇率制度，并且一直在实行放松资本管制，放开资本账户。与此同时，结合中国根据国内的经济状况，搭配财政政策与货币政策。中国在国际收支方面保持常年的顺差。","points":["宏观经济政策配合的主要内容: 在开放的经济环境中，宏观经济政策不仅要实现内部均衡〈即稳定通货 ) ，还要实现外部均衡《即保持国际收支平衡 ) ，并且伴随着稳定通货和平衡国际收支，实现经济的适度增长和充分就业。为实现内外均衡目标，在市场经济条件下，可供选择的政策工具，除了财政政策和货币政策，还有汇率政策。粗略地说，以财政政策、货币政策实现内部均衡，以汇率政策实现外部均衡。包米德认为，在固定汇率制度下,在国内失业与贸易逆差以及国内通胀和贸易顺差这两种情况下，无法通过财政政策与货币政策的配合实现内外部的均衡。但是，在二十世纪六十年代，蒙代尔挑战了这个理论，指出只要适当地搭配使用财政政策和货币政策，就可以同时实现内外部均衡。蒙代尔认为，财政政策与货币政策对国际收支与名义收入有着相对不同的影响。因此，在固定汇率制度下，一国也存在两种独立的政策工具来实现内外两方面的经济目标。比如，紧缩性财政政策趋于降低利率，而紧缩性货币政策会提高利率。在其他条件不变的情况下，本国利率提高会改善资本账户收支，而本国利率下降则会恶化资本账户收支。由此可见，财政政策与货币政策的取向都是紧缩，对国际收支也会分别有不同的作用。所以，只要对财政政策与货币政策合理搭配使用，就有可能同时实现内外均衡。所以开放背景下，固定汇率制下，宏观经济政策的配合主要内容可以表现为下表: 表 1 不同失衡状态下的最佳政策配合经济失衡状态和上通货膨胀失业国际收支盘余国际收支盘余 | 国际收支庆字国际收支赤字最全牙策呈 | 紧缩性财政政策 | 扩张性财政政策紧缩性财政政策扩张性财政政策 | 扩张性货币政策扩张性货币政策 | 紧缩性货币政策 | 紧缩性货币政策，此外，宏观经济政策的搭配还应包括开放背景下金融政策的选择与搭配; 货币政策的独立性汇率稳定资本自由流动图为死鲁格曼三角形克鲁格曼的不可能三角对于发展中国家经济由封闭到开放时汇率制度的选择、货币制度的选择以及是否允许资本自由流动具有很大的意义。","近年来我国政策配合的效果: 在全球一体化的开放宏观经济环境下，中国在宏观经济政策搭配方面的目标一直是在实现内部均衡的同时保持外部平衡。在实现内部经济货币政策目标即经济增长和物价稳定的前提下，中国近年来一些实行相对稳健的货币政策，为应对失业率升高实行扩张性的财政政策。近年来中国一直在进行汇率制度的改革，提出建立有管理的浮动汇率制度，并且一直在实行放松资本管制，放开资本账户。与此同时，结合中国根据国内的经济状况，搭配财政政策与货币政策。中国在国际收支方面保持常年的顺差。"]}]},{"year":2014,"included":36,"excluded":3,"questions":[{"no":1,"type":"single","stem":"金币的职能按照先后次序排列为","options":["价值尺度、流通手段、贮藏手段、支付手段和世界货币","价值尺度、流通手段、支付手段、贮藏手段和世界货币","价值尺度、支付手段、流通手段、贮藏手段和世界货币","价值尺度、流通手段、世界货币、支付手段和贮藏手段"],"answer":"A","expl":"**马克思从历史迁辑统一的角度，对典型的货币一一金币的职能按照先后顺序排列为价值斥度、流通手段、贮藏手段、支付手段和世界货币五个。**提示：**本题涉及的货币的职能是金融学综合的常考考点。该知识点比较基础，需要百分之百的掌握。考生需要掌握货币的职能包含哪些，特别是要分清楚货币的流通手段以及支付手段之间的区别。本考点可能涉及的题型有选择题、判断题、简答题。","score":1},{"no":2,"type":"single","stem":"下列信用形式中不属于国家信用的是","options":["中央政府债券","地方政府债券","政府担保债券","中央银行票据"],"answer":"D","expl":"**国家信用，是指政府作为一方的借贷活动，即政府作为债权人或者债务人的信用活动。在现代社会，政府信用主要包括中央政府债券、地方政府债券和政府担保债券等三种形式。**提示：**本题关联的信用与信用体系这一章节重要性不是十分的高。但是通常会在小题里出一定数量的题目，知识点往往比较偏个，所以正确率不是很高。但是由于分值不是特别大，所以考生也不用过分的担饥。这一章节中商业信用与银行信用的区别这一知识点相对而言比较重要，请考生务必掌握。本考点可能涉及的题型有选择题、判断题。","score":1},{"no":3,"type":"single","stem":"认为利率变化取决于投资流量与储革流量均衡的理论是","options":["流动性偏好理论","实际利率理论","可贷资金理论","IS-LM 模型利率理论"],"answer":"B","expl":"**在凯恩斯主义出现以前，传统经济学中的利率理论，现在人们称之为实际利率理论。这个理论强调非货币的实际因素在利率决定中的作用，它们所注意的实际因素是生产率和节约。生产率用边际投资倾向表示，节约用边际储蓄倾向表示。**提示：**本题所涉及的利率决定理论是金融学课本中最重要的模块之一。考生一定要认真把握该考点可能涉及的题型，包括选择题、判断题、简答题以及论述题。考生需要掌握利率决定理论的发展历史以及每个理论的提出者和主要内容，并且掌握这几者之间的区别以及联系。本考点可能涉及的题型有选择题、判断题、简答题、论述题。","score":1},{"no":4,"type":"single","stem":"中国人民银行决定放开贷款利率下限的时间是","options":["2012 年 6 月","2012 年 7 月","2013 年 7 月","还未确定放开时间"],"answer":"C","expl":"** 2013 年 7 月 19 日，央行决定从 7 月 20 日开始取消金融机构贷款利率 0.7 倍的下限，由金融机构自主确定贷款利率水平，但个人住房贷款利率浮动区间暂不调整。**提示：**本题所涉及的知识点比较偏馆，得分率也相对较低。这个知识点是在书本的知识链接中的，这就提示考生在看书的时候多多留意知识链接小贴士的部分。近年来，小贴士和知识链接部分的出题频率还是非常高的。本考点可能涉及的题型有选择题、判断题。","score":1},{"no":5,"type":"single","stem":"假设一国流通中的现金为 50000 亿元，存款额为 700000 亿元，银行系统准备金为 20000 亿元，那么，该国货币乘数的理论值应该为","options":["4","3","2.8","10"],"answer":"B","expl":"**根据货币乘数理论，货币乘数的理论值 m= (1+k) / (ktr) ，其中提现率 k=50000*+700000=0.07，存款准备金率天 200000*700000=0.29，代入数值解得 m= (1+0.07) 二《0.07+0.29) =3。**提示：**本题是一道计算题。本题所考查的货币乘数是一个比较重要的概念。金融学课本里涉及的公式比较少，公式相对而言比较简单，所以考生务必把这些公式都牢记在心，用以应付选择题中出现的小型计算题。本考点可能涉及的题型有选择题、判断题、计算题。","score":1},{"no":6,"type":"single","stem":"资本市场有效性假说是由经济学家〈，) 提出的","options":["罗伯特 ' 软顿","尤金.法玛","迈伦.斯科尔斯","欧文 ` 费雪"],"answer":"B","expl":"**资本市场有效性假说是 20 世纪 60 年代被正式提出的，尤金法玛 1965 年针对美国股市的研究表明，股票价格基本遵循随机游走的规律，基于历史股价的技术分析策略不能获得超额利润。**提示：**选择题中常出现这些考人名的题目，这就提示考生在掌握理论模型的同时要画记这些理论提出者的名字。本考点可能涉及的题型有选择题、判断题。","score":1},{"no":7,"type":"single","stem":"银行采用风险敞口对利率敏感性分析结果进行管理的理论是 4","options":["资产管理理论","银行压力测试理论","负债管理理论","资产负债综合管理理论"],"answer":"D","expl":"**资产负债综合管理理论的基本思想是将资产和负债两个方面加以对照并作对应分析，通过调整资产和负债双方达到合理搭配。利率敏感性分析中的风险敞口是指一定时期内利率敏感性资产与利率敏感性负债的差额。银行通过对敏感性资产和敏感性负债的管理来控制管理风险。**提示：**本题所涉及的 "stem":"假设相对 PPP 在长期内成立，如果一篮子可交易商品的价格在美国为 20 美元，在墨西哥为 100 比索，汇率为 7 比索 /美元，以下的变化哪个可能在未来发生","options":["在美国的价格会上升","在墨西哥的价格会下降","比索的名义水平升值","比索的名义水平贬值"],"answer":"C","expl":"**由相对购买力平价理论可知，el/e0=Pb/Pa，其中 el 是未来汇率，e0 是即期汇率，Pb，是墨西哥的商品价格，Pa 是美国的商品价格，代入数值解得 el-5 比索 /美元，由此可知未来比索的名义水平逢值**提示：**;本题涉及到的购买力平价理论相当重要。2017 年的考研也以选择题的形式考查了考生对购买力平价理论的理解。考生不仅要牢记购买力平价的定义和公式，而且要会理解并运用它。本题涉及到的考试题型有选择题、判断题、简答题。","score":1},{"no":14,"type":"single","stem":"在我国，除息日的股票价格与股权登记日的股票价格相比","options":["较低","较高","一样","不一定"],"answer":"A","expl":"**我国上市公司的除息日通常是在登记日的下一个交易日。由于在除息日之前的股票价格中包含了本次派发的股利，而自除息日起的股票价格中则不包含本次派发的股利，所以除息日的股票价格与股权登记日的股票价格相比较低。**提示：**本题涉及的考点是股票的除息价格，考生要掌握股票除息四个日期的顺序。特别是股权登记日和除息日的关系，也要掌握股票除息价格的相关计算。本考点涉及的题型有选择题、判断题。","score":1},{"no":15,"type":"single","stem":"公司发行面值为 100 元的优先股，股利率为 8%，发行价格为 120 元，发行成本为发行价格的 10%，则该优先股的融资成本为","options":["0.34%p 了","7.41% (CC.8.37%6","9.3296"],"answer":"B","expl":"**该优先股的发行成本是 120x10%=12〈元 ) ，优先股的股利 D=100x8%=8《〈元 ) ，所以优先股的融资成本 R=D/P=8- 〈120-12) =7.419%。**提示：**本题涉及到的融资成本的计算是公司理财中最基础的计算之一。考生需要熟练学握现金流贴现模型、债券定价股票定价以及优先股的定价模型。本题涉及到的考试题型有选择题、判断题、计工题。","score":1},{"no":16,"type":"single","stem":"下列关于权益性融资与债务性融资表述正确的是","options":["作为外源融资，权益性融资与债务性融资都不需要对外支付融资成本","债务性融资的成本一般高于权益性融资，但融资风险却低于权益性融资 C 权益性融资没有固定偿还日期","债务性融资成本是不断变化的"],"answer":"C","expl":"**债务性融资有固定的偿还日期，而权益性融资没有固定的偿还日期。公司进行债务融资有可能造成公司的财务失败，而权益资本融资则不会增加财务失败的可能。**提示：**本题考查了权益性融资以及债务性融资的区别。考生需要掌握权益融资、债务融资各自的特点。建议考生可以通过列表格的形式来整理每一种融资方式的相同点以及不同点。本考点涉及到的考试题类型有选择题、判断题、简答题。","score":1},{"no":17,"type":"single","stem":"降低经营杠杆系数，从而降低企业经营风险的途径是","options":["节约可变成本","节约固定成本","提高资产负债率","降低资产负债率"],"answer":"B","expl":"**营业杠杆定义为妃税前收益的相对变动与销售额相对变动之比，也就是息税前收益对销售额的弹性，一般用营业杠杆系数 DOL 衡量，用公式表示如下: DOL= 上税前收益变化率 /销售收入变化率 = (P-V) xQ/ 人 [ (P-V) xQ-F]，其中了为销售价格，Q 为销售量，V 为变动成本，F 为固定成本。所以降低固定成本会使经营杆杠系数降低，从而降低企业经营风险。**提示：**本题涉及到的考点是经营杠杆系数是公司理财中非常重要的概念。考生需要掌握经营杠杆系数的定义，公式以及简单的计算。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":18,"type":"single","stem":"一台旧设备账面价值为 30000 元，变现价值为 32000 元，企业打算继续使用该设备，但由于物价上涨，估计需要增加经营性流动资产 000 元，增加经营性流动负债 2000 元，即垫支营运资本 3000 元。假定所得税税率为 23%，则继续使用该设备初始的现金流出量为","options":["2200","33800","34300","33500"],"answer":"C","expl":"**增加的经营性流动资产扣除税盾的影响 000-2000x25%=4500，所以初始现金流量为 30000+4300=34500。**提示：**本题涉及到的现金流量的计算是公司理财中非常重要的考点，经常以大题的形式来考查。考生需要认真阅读课本第六章并掌握课本中每一道例题和课后练习题的计算，计算相对而言比较繁琐，考生需要勤加练习。本考点可能涉及的题型有选择题、判断题、计算题。","score":1},{"no":20,"type":"single","stem":"F 公司是一家无负债公司，其每年税息前收益是 10000 元，股东要求的权益回报率为 16%。M 公司所得税率为 33%，但没有个人所得税，设所有交易是在完善资本市场中进行。如果公司借入面值为无负债公司价值一半的利率为 10% 的债务并用于赎回股票，其他情况不变，问 M 公司的价值为《 ) 元","options":["47734 了","40023","35428","32300"],"answer":"A","expl":"** M 公司的价值 = 〈息税前收益一税额 ) /资本成本 = 〈10000-10000x35%) *16%=40625《〈元 ) ，M 公司的负债 D=40625*2=20312.5〈元 ) ，根据有税条件下的 MM 定理: M 公司的价值 =F 公司价值 + 利息税盾 =40625+20312.5Sx35%=47734〈元 ) 。**提示：**本题所涉及的考点 MM 理论是公司财务书上最重要的理论之一，几乎每年都会以大题的方式进行考查，并且得分率很低。MM 理论涉及到的公式比较多，考生要深刻理解每个公式背后的含义，并且熟练运用它们。本题所涉及的考试题型有选择、判断题、计算题。","score":1},{"no":1,"type":"tf","stem":"面纱论与理性预期学派都认为货币是中性的。","options":["正确","错误"],"answer":"√","expl":"**面纱论认为，货币对于实际经济过程来说，它的变动除了对价格产生影响外，并不会引起诸如储蓄、投资、经济增长等实际经济部门的变动，即货币是中性的。理性预期学派认为，要保持经济稳定，就应该听任市场经济的自动调节，反对任何形式的国家干预，货币供给量的变化只影响一般价格水平，不影响实际产出水平，因而货币是中性的。\n\n**提示：**本题考查了考生对货币中性这个概念的记忆。考生要掌握货币中性的含义以及每一个货币学派分别是货币中性观点还是货币非中性观点。本考点可能涉及的题型有选择题、判断题。","score":1},{"no":2,"type":"tf","stem":"在我国，政策性金融债券属于准主权信用债。","options":["正确","错误"],"answer":"√","expl":"**政策性金融债券是我国政策性银行〈国家开发银行、中国农业发展银行、中国进出口银行 ) 为筹集信贷资金，经国务院批准由中国人民银行用计划派购的方式，向邮政储汇局、国有商业银行、区域性商业银行、城市商业银行〈城市合作银行 ) 、农村信用社等金融机构发行的金融债券。\n\n**提示：**本题所考查的知识点相对生僻，考试频率也较低。但这是与我们国家政策息息相关的内容，课本中与我们国家相关的内容要更着重注意。本题所涉及的题型有选择题，判断题。","score":1},{"no":3,"type":"tf","stem":"利息转化为收益的一般形态是因为利率能够事先确定。","options":["正确","错误"],"answer":"×","expl":"**本来以借贷为前提，源于产业利润的利息，逐渐被人们从借贷和生产活动中抽象出来，被赋子了与借贷、生产活动无关的特性，而是将利息直接与资本的所有权联系起来，认为利息是资本所有权的必然产物，人们也就可以凭借资本所有权而获得收益，这样，利息就成为收益的一般形态。\n\n**提示：**本题考查的考点收益资本化是一个非常重要的概念。考生要深刻理解收益资本化的含义。本考点所涉及到的考试题型有选择题、判断题、名词解释。","score":1},{"no":4,"type":"tf","stem":"利率变化通过预期机制作用于金融资产价格，使资产价格出现同向变化趋势。","options":["正确","错误"],"answer":"×","expl":"**由于资产价格等于该资产未来现金流或收益的贴现，在未来现金流或收益既定的情况下，用来代表贴现率的利率水平越低，该资产的价格也就越高，贴现率或者利率水平越高，资产价格也就越低。\n\n即利率变化与资产价格出现反向变化趋势。\n\n**提示：**本题涉及的考点是现金流贴现模型。考生只需理解现金流贴现模型即可正确回答本题，本考点可能涉及的题型有选择题、判断题、计算题。\n\nS.股票的 BETA 系数是衡量非系统性风险的重要指标。〈 x )\n\n**解析：**股票的 BETA 系数是衡量系统风险的重要指标。每一资产对风险充分分散的资产组合的总风险《系统风险 ) 的贡献，可以用它的 BETA 系数来衡量。\n\n**提示：**本题所涉及的考点是贝塔系数。考生需要把握贝塔系数的计算公式以及贝塔系数的作用。本考点所涉及的题型有选择题、判断题、计算题。","score":1},{"no":6,"type":"tf","stem":"二又树定价法解决了欧式看跌期权的定价问题。","options":["正确","错误"],"answer":"√","expl":"**二又树定价既可解决欧式期权定价，又可解决美式期权定价。B-S 公式只适用于欧式期权定价。\n\n**提示：**本题所涉及的二又树定价方法是金融工程里面的内容。考生需要掌握简单的计算，理解它的定价原理。本题所涉及的题型有选择题、判断题、计算题。","score":1},{"no":7,"type":"tf","stem":"政策性银行属于存款性货币银行。","options":["正确","错误"],"answer":"√","expl":"**存款类金融机构，也称存款性货币银行，可以分为管理性、商业性和政策性三类。政策性存款类金融机构主要指政策性银行。政策性银行是指由政府发起或出资建立，按照国家宏观政策要求，在限定的业务领域从事银行业务的政策性金融机构。\n\n**提示：**本题所涉及的政策性银行也是一个相对而言比较生售的知识点。考生需要把握中国金融体系的框架，掌握存款类货币银行和非存款类货币银行的区别以及分类。本题所涉及的题型有选择题、判断题。","score":1},{"no":8,"type":"tf","stem":"美国的硬币发行记入美联储资产负债表中的负债方。","options":["正确","错误"],"answer":"×","expl":"**美国的硬币发行记入美联储资产负债表中的资产方。因为美联储是美国中央银行，其资产负债表的科目含义与一般企业有所不同。核心区别是，央行用货币购买资产〈比如国债 ) ，实质效果是发行基础货币，而基础货币是货币发行机构的负债。\n\n**提示：**本题所考查的中央银行的资产负债表。考生需要掌握资产负债表里面的资产项目和负债项目分别包含了怎样的内容。该考点涉及的题型有选择题、判断题。","score":1},{"no":9,"type":"tf","stem":"2013 年 6 月中旬同业拆借市场利率大幅度上升是由于货币政策不当导致的。","options":["正确","错误"],"answer":"×","expl":"** 2013 年 6 月 SHIBOR 利率大幅上扬主要原因在于前期银行大量发行理财产品，导致资金在银行体系 \"空转 >*，没有实现资金对实体经济的“输血”功能。大量银行理财产品在 6 月集中兑付，银行流动性紧张，同时央行为了加以惩戒，并未向市场注入流动性，导致 SHIBOR 大幅上扬。\n\n**提示：**本题所涉及到的知识点出现在课本的知识链接中，得分率相对较低。本题重复考查的概率不大，可能涉及的题型有选择题、判断题。","score":1},{"no":10,"type":"tf","stem":"美国的金融监管体系属于“双峰 \"监管模式。","options":["正确","错误"],"answer":"×","expl":"**美国的金融监管体系属于“伞式 \"监管模式。该模式指对特定金融机构，由一家监管机构负责综合监管,其他监管机构按企业经营业务的种类开展具体监管。它是美国 1999 年《金融服务现代化法案》\n\n颁布后，在改进原有分业监管体制的基础上形成的监管模式。\n\n**提示：**本题所涉及的考点是金融监管体系的监管模式。考生要初步学握中国和美国各自的监管模式，掌握每一种典型的监管模式中有哪些国家，尤其跟中国和美国有关的监管模式要更加注意把握，本是涉及的考试题型有选择题、判断题、名词解释。","score":1},{"no":11,"type":"tf","stem":"购买力平价的理论前提为一价定律，它是货币主义汇率理论的基石。","options":["正确","错误"],"answer":"√","expl":"**汇率取决于两国货币购买力的相对关系，这是购买力平价理论的基本思想。该理论隐含了三个重要的前提条件，完全竞争、不存在生产率差异以及国内外购买篮子相同〈各国计算价格指数包含的商品种类一致;，最后一个前提条件即为一价定律。购买力平价理论被广泛运用于对汇率水平的分析和政策研究，是货币主义汇率理论的基石。\n\n**提示：**本题所涉及的考点是购买力平价理论和一价定律之间的关系。这个知识点重复在选择题，判断题中考查，因此相对而言比较重要。本题涉及的题型有选择、判断、简答题。","score":1},{"no":12,"type":"tf","stem":"克鲁格曼提出的第一代货币危机的标准模型所针对的对象是采取浮动汇率制的小国。","options":["正确","错误"],"answer":"×","expl":"**保罗.克鲁格曼的第一代货币危机的标准模型认为，一个国家的金融政策有三个基本目标:中本国货币政策的独立性，@@ 汇率的稳定性;图资本自由流动。而这三个目标是不可能同时实现的。这一模型针对的对象是采取固定汇率制的国家。\n\n**提示：**本题所涉及的是国际金融中或金融危机里的内容。考生需要掌握每一代货币危机理论的大致的含义来应对可能的考查，本题的出题概率不大。本考点涉及的题型有选择题、判断题。","score":1},{"no":13,"type":"tf","stem":"根据资产分析法，国内货币需求与本国利率呈负相关关系，与外国利率呈正相关关系。","options":["正确","错误"],"answer":"×","expl":"**当外国利率上升，经济主体偏向于持有以外币标价的资产，国内货币需求下降。\n\n**提示：**本题所涉及的考点是汇率决定理论中的资产分析法，资产分析法是考试的一个难点，但不是考试的重点。由于近年来国际金融的占分比例减小，所以考查的概率不大，考生只需掌握资产分析法所揭示的各变量之间的关系以及资产分析法和货币分析法的异同即可。本考点涉及的题型有选择题、判断题。","score":1},{"no":14,"type":"tf","stem":"在不考虑税收、交易成本和财务危机成本的情况下，适度的借债不会显著影响公司陷入财务危机或破产的可能性。因此，适度的借债不会提高股东所要求的回报率。","options":["正确","错误"],"answer":"×","expl":"**根据无税条件下的 MM 定理，不管债务和权益的组合如何变化,公司的加权平均成本是不变的。\n\n增加借债会使债权人要求的回报率增加，即债务融资成本增加。由于总成本不变，所以权益成本会减少，即股东要求的回报率减少。\n\n**提示：**本题考查的是 MM 理论的运用。考生需要画练掌握并理解 MM 理论才能应对类似的问题。本考点涉及的题型有选择题、判断题、计算题。\n\n1.折旧不是现金流出，所以在计算投资项目现金流时，不需要考虑折旧。《〈 x )\n\n**解析：**固定资产在购入时作为投资活动流出的现金，反映在现金流量表的投资活动流出的现金项目下。\n\n每月计提折旧，不减少和增加现金流量。在计算投资项目现金流时，不需要直接考虑折旧，但是应考虑折旧带来的税收抵扣。\n\n**提示：**本题考查考生对折旧概念的理解。折旧在现金流量的计算中充当一个比较特殊的作用，曾多次在选择题，判断题中考查，在计算题中也需要注意折旧对相关计算的影响，本考点涉及到的题型有选择题、判断题、计算题。","score":1},{"no":17,"type":"tf","stem":"某股票的市场价格为 60 元，其 B 系数为 0，预计该股票 1 年后支付 2 元的红利，期末除权价格为 62 元，如果 CAPM 成立，市场上无风险利率为 S%，市场风险溢价为 5%，则该股票目前的价格被高估。","options":["正确","错误"],"answer":"×","expl":"**根据 CAPM 模型可知，该股票的期望报酬率王无风险利率 +Bx 风险溢价 =5%，所以该股票的当前价格应为 P= (D+P1) / (1+r) = (2+62) = 〈]1+%) =60.95〈元 ) ，而市场价格为 60 元，所以该股票被低估了。\n\n**提示：**本题涉及的 CAPM 模型是公司金融中比较重要的理论模型,考生要下练掌握 CAPM 公式以及相关计算。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":18,"type":"tf","stem":"可转换债券转换为普通股时会导致稀释效应，认股权证的行权也会导致稀释效应。","options":["正确","错误"],"answer":"√","expl":"**由于可转换债券持有者可以通过转换使自己成为普通股股东，认股权证持有者可以按预定的价格购买普通股，其行为的选择有可能造成公司普通股增加，使得每股收益变小。通常将这种现象称为股权的稀释效应。\n\n**提示：**本考点涉及的考点是可转换债券融资以及认股权证融资。考生需要掌握两种融资方式各自的特点，两者的区别和相同点。本题涉及到的题型有选择题、判断题、简答题。","score":1},{"no":19,"type":"tf","stem":"在投资组合理论的框架下，有效投资组合与市场组合之间的相关系数等于 1。","options":["正确","错误"],"answer":"√","expl":"**有效投资组合集合是指在同样风险条件下具有最高的期望收益，或在同样期望收益条件下具有最低风险程度的资产组合。市场组合是有效前沿和资本市场线的切点，即市场组合一定是落在有效前沿上，所以市场组合与有效投资组合之间的相关系数为 1。\n\n**提示：**本题涉及的考点是投资组合理论。考生需要掌握投资组合理论的提出者，理论具体包含的内容，以及图像的绘制，理解投资组合理论和资本资产定价模型之间的关系。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":20,"type":"tf","stem":"在无税收的 M 定理中，如果公司负债，那么由于股东仅享有剩余索取权，其收益的波动性要大于无负债公司，所以负债公司的股东所要求回报率更高。","options":["正确","错误"],"answer":"√","expl":"**根据无税条件下的 MM 定理，负债公司权益资本成本 = 无负债公司权益资本成本 + 风险溢价，随着负债增加，风险增加，风险溢价随之增加，因此负债公司权益资本成本更高。\n\n**提示：**本题涉及的 MM 理论是公司财务课本中的重中之重，已多次在本试卷中出现。考生一定要非常认真对待本部分的学习。本考点涉及的题型有选择题、判断题、计算题。","score":1}],"sub":[{"no":1,"type":"calc","stem":"某股票股权登记日的收盘价为 20.35 元，每 10 股派发现金红利 4.00 元，送 1 股,配 2 股，配股价为\n5.50 元 / 股，求其除权参考价。","score":10,"body":"在现金红利、送股、配股同时存在时，股票的除权参考价的计算公式为; 当日除权价 =《〈前一日收盘价一股息红利 + 配股价 x 配股率 ) /〈1+ 配股率 + 送股率 )\n\n每股现金红利 =4*10=0.4《〈元 )\n\n配股率 =2=10=0.2 送股率 =1+10=0.1 将数值代入公式计算可得: 除权价 = 〈20.35-0.4+5.Sx0.2) = 上《1+0.1+0.2) =16.19《〈元 )","points":["在现金红利、送股、配股同时存在时，股票的除权参考价的计算公式为; 当日除权价 =《〈前一日收盘价一股息红利 + 配股价 x 配股率 ) /〈1+ 配股率 + 送股率 ) 每股现金红利 =4*10=0.4《〈元 ) 配股率 =2=10=0.2 送股率 =1+10=0.1 将数值代入公式计算可得: 除权价 = 〈20.35-0.4+5.Sx0.；= 上《1+0.1+0.；=16.19《〈元 )"]},{"no":2,"type":"calc","stem":"C 公司债务利恩为 200000 元,债务的税前成本为 8%,股权成本为 12%,税息前收益 (EBIT ) 为 1200000 元，公司所得税率为 40%。求公司的总价值。","score":10,"body":"D = 200000/8% = 2500000 元净利润 = (1200000-200000) x0.6=600000 元，权益价值 =600000/0.12=5000000 元公司价值 =7500000 元","points":["D = 200000/8% = 2500000 元净利润 = (1200000-200000) x0.6=600000 元，权益价值 =600000/0.12=5000000 元公司价值 =7500000 元"]},{"no":3,"type":"calc","stem":"如果有一台设备还可以用两年，该机器每年的运营成本是 12000 元。现在考虑将该设备更新，需要花费 25000 元。新机器运行效率较高，每年的运营成本只需 8000 元，可以使用 5 年。贴现率为 6%。\n那么，是否现在应该更新设备? 利率为 6% 的复利现值系数表和年金现值系数表一一一一一一一一六 -\n- T 的的光和 ] 工 1 沪 ] 3 生 3 0\n| _ 二三 | | 和 | 二\n_ 243_ 条件下，投资者的套利行为使得国际金融市场上以不同货币计价的相似资产的收益率趋于一致，也就是说，套利资本的跨国流动保证了“一价定律” 适用于国际金融市场。","points":["定义:无抛补利率平价〈《Uncovered Interest Rate Parity) ，它的含义是本国利率高于〈低于 ) 外国利率的差额等于本国货币的预期贬值〈升值 ) 幅度。","作用:无抛补利率平价资本具有充分国际流动性的条件下，投资者的套利行为使得国际金融市场上以不同货币计价的相似资产的收益率趋于一致，也就是说，套利资本的跨国流动保证了“一价定律” 适用于国际金融市场。"]},{"no":4,"type":"term","stem":"扩张期权 .融资租赁","score":4,"body":"(1) 定义;扩张期权〈Expansion option) ，也称后续投资期权，是指取得后续投资机会的权利。(2) 特点;当一期项目本身的净现值 + 后续扩张选择权的价值大于 0 时，该期项目可行。一旦接受净现值为负的项目，公司往往就会提到“战略”价值。(3) 意义;对项目损益的仔细考察发现，项目除了自身立即产生的现金流，还会带来基于后续项目的看涨期权。如果现在投资就会失去未来的选择权。","points":["定义;扩张期权〈Expansion option) ，也称后续投资期权，是指取得后续投资机会的权利。","特点;当一期项目本身的净现值 + 后续扩张选择权的价值大于 0 时，该期项目可行。一旦接受净现值为负的项目，公司往往就会提到“战略”价值。","意义;对项目损益的仔细考察发现，项目除了自身立即产生的现金流，还会带来基于后续项目的看涨期权。如果现在投资就会失去未来的选择权。"]},{"no":1,"type":"short","stem":"简述货币在经济中的积极作用。","score":8,"body":"从货币职能的角度看，货币在经济中的积极作用有以下几点: (1) 克服了物物交换的困难，降低了商品交换的信息搜寻成本，提高了交换效率，促进了商品流通与市场的扩大。(2) 克服了价值衡量与交换比率确定等交易困难，为顺利实现商品交换提供了便利。(3) 可以通过支付冲抵部分交易金额，进而节约流通费用，还可以通过非现金结算加速资金周转。(4) 提供了最具流动性的价值贮藏和资产保存形式,在财富日益增长的过程中丰富了人们的贮藏手段和投资形式。(5) 通过在发挥支付手段时形成的活期存款和发挥资产职能所形成的定期存款等，可以促进社会资金的集中，使得金融体系能够有效利用社会资金，这是现代社会化大生产顺利进行最重要的前提条件。货币具有集结各种生产要素从而启动社会生产的能力。马克思就曾用“货币第一推动力 \"来概括货币在资本周转和社会再生产运动中对经济发展的推动作用。","points":["从货币职能的角度看，货币在经济中的积极作用有以下几点:","克服了物物交换的困难，降低了商品交换的信息搜寻成本，提高了交换效率，促进了商品流通与市场的扩大。","克服了价值衡量与交换比率确定等交易困难，为顺利实现商品交换提供了便利。","可以通过支付冲抵部分交易金额，进而节约流通费用，还可以通过非现金结算加速资金周转。","提供了最具流动性的价值贮藏和资产保存形式,在财富日益增长的过程中丰富了人们的贮藏手段和投资形式。","通过在发挥支付手段时形成的活期存款和发挥资产职能所形成的定期存款等，可以促进社会资金的集中，使得金融体系能够有效利用社会资金，这是现代社会化大生产顺利进行最重要的前提条件。货币具有集结各种生产要素从而启动社会生产的能力。马克思就曾用“货币第一推动力 \"来概括货币在资本周转和社会再生产运动中对经济发展的推动作用。"]},{"no":2,"type":"short","stem":"简述金融市场的一般功能。","score":8,"body":"金融市场最基本的功能是满足社会再生产过程中的投融资需求，促进资本的集中与转换等。有具体来看，主要有以下四个方面的功能: (1) 资源配置与转化功能。金融市场通过收益率的差异和上下波动以及对有价证券价格的影响，能够引导资金流向最需要的地方，从而有利于提高投资效益，实现资金的合理流动，完成社会资源的优化配置。(2) 价格发现功能。金融市场金融产品的价格是所有参与市场交易的经济主体对这些产品未来收益的期望的体现。《3) 风险分散和规避功能。金融市场上有多种融资形式可供选择，各种金融工具的自由买卖和灵活多样的金融交易活动，能有效地规避和分散风险。《4) 宏观调控传导功能。现代金融市场是中央银行实施宏观金融调控的场所。","points":["金融市场最基本的功能是满足社会再生产过程中的投融资需求，促进资本的集中与转换等。有具体来看，主要有以下四个方面的功能:","资源配置与转化功能。金融市场通过收益率的差异和上下波动以及对有价证券价格的影响，能够引导资金流向最需要的地方，从而有利于提高投资效益，实现资金的合理流动，完成社会资源的优化配置。","价格发现功能。金融市场金融产品的价格是所有参与市场交易的经济主体对这些产品未来收益的期望的体现。","风险分散和规避功能。金融市场上有多种融资形式可供选择，各种金融工具的自由买卖和灵活多样的金融交易活动，能有效地规避和分散风险。","宏观调控传导功能。现代金融市场是中央银行实施宏观金融调控的场所。"]},{"no":3,"type":"short","stem":"用特里芬悖论简述布雷顿森林体系自身的缺陷。","score":8,"body":"《1) 特里芬迟论是指在布雷顿森林体系下，由于当时美元与黄金挂钩，其他货币与美元挂钩，美元取得了国际核心货币地位，但各国为发展国际贸易，须用美元作为结算与储备货币，导致其在海外不断沉深，美国发生长期贸易逆差，而作为国际核心货币应该保持币值稳定，这要求美国须是长期贸易顺差国。这两个要求互相矛盾成为一个悖论。《2) 体系自身的缺陷:布雷顿森林体系以美元作为最主要的国际储备货币，实行“双挂钧”的国际货币体系，即美元与黄金直接挂钩，其他国家的货币与美元挂钩;实行固定汇率制。各国货币对美元的汇率一般只能在平价上下 1% 的幅度内浮动,各国政府有义务在外汇市场上进行干预，以维持外汇行市的稳定。布雷森林体系自身具有不可克服的缺陷，又被称为“特里芬难题”。由于各国货币与美元挂钩，美元作为国际结算的结算和储备货币，会导致美国长期的国际收支逆差，而美元作为国际货币要保持币值稳定，因此有必要成为一个贸易顺差国，美元在海外不断的沉淀，美元与黄金挂钩，需要维持币值稳定，美元的国际供给不足，因此形成特里芬难题。《3) 因此在布雷顿森林体系下，以美元为中心的国际货币制度中，美元若要满足国际储备的需求就会造成美国国际收支逆差，必然影响美元信用，引起美元危机，若要保持美国的国际收支平衡，稳定美元，则又会断绝国际储备的来源，引起国际清偿能力的不足。","points":["特里芬迟论是指在布雷顿森林体系下，由于当时美元与黄金挂钩，其他货币与美元挂钩，美元取得了国际核心货币地位，但各国为发展国际贸易，须用美元作为结算与储备货币，导致其在海外不断沉深，美国发生长期贸易逆差，而作为国际核心货币应该保持币值稳定，这要求美国须是长期贸易顺差国。这两个要求互相矛盾成为一个悖论。","体系自身的缺陷:布雷顿森林体系以美元作为最主要的国际储备货币，实行“双挂钧”的国际货币体系，即美元与黄金直接挂钩，其他国家的货币与美元挂钩;实行固定汇率制。各国货币对美元的汇率一般只能在平价上下 1% 的幅度内浮动,各国政府有义务在外汇市场上进行干预，以维持外汇行市的稳定。布雷森林体系自身具有不可克服的缺陷，又被称为“特里芬难题”。由于各国货币与美元挂钩，美元作为国际结算的结算和储备货币，会导致美国长期的国际收支逆差，而美元作为国际货币要保持币值稳定，因此有必要成为一个贸易顺差国，美元在海外不断的沉淀，美元与黄金挂钩，需要维持币值稳定，美元的国际供给不足，因此形成特里芬难题。","因此在布雷顿森林体系下，以美元为中心的国际货币制度中，美元若要满足国际储备的需求就会造成美国国际收支逆差，必然影响美元信用，引起美元危机，若要保持美国的国际收支平衡，稳定美元，则又会断绝国际储备的来源，引起国际清偿能力的不足。"]},{"no":4,"type":"short","stem":"比较用于企业价值评估的 WACC 方法和 APV 方法。","score":8,"body":"《1) 加权平均资本成本 (WACC) :这是公司各种形式的个别资本〈或称资本的各组成部分 ) 的成本与该类资本在企业资本总额中所占的权重的乘积之和。在 WACC 方法中，分子是全权益融资下的税后现金流量 UCF，分母是权益资本成本和负债资本成本的加权平均，债务的影响没有体现在分子中，而是体现在分母上，分母中的债务资本成本是税后的，反映了负债的节税效应。《2) APV 即“调整现值法”:这是一种绝对值估值方法，其原理为将未来的现金流进行折现。在 APV 方法中，分子为全权益融资下的税后现金流量 UCF，分母为全权益情况下的折现率，在此基础上，加上负债连带效应的净现值。负债连带效应包括节税效应、发行成本、财务困境成本和利息补贴等。(3) WACC 方法和 APV 方法的比较:分子都采了税后现金流量 UCF。但是 APV 方法采用了全权益资本成本折现得到无枉杆项目的价值，然后加上负债的节税现值，得到杠杆情况下的项目价值。WACC 将 UCF 按照加权平均资本成本来贴现，而加权平均资本成本低于无负债情况下的权益资本成本。两者只有在满足资产负债率可变或资产负债率恒定时才能等同。在用于企业价值评估时的比较:忆当从时间范围来看，债务水平可以预测时，适用于 APV 法，包财务杠杆是不稳定的时候用 APYV 法较好，当负债率是固定的时候，用 WACC 法较好。","points":["加权平均资本成本 (WACC) :这是公司各种形式的个别资本〈或称资本的各组成部分 ) 的成本与该类资本在企业资本总额中所占的权重的乘积之和。在 WACC 方法中，分子是全权益融资下的税后现金流量 UCF，分母是权益资本成本和负债资本成本的加权平均，债务的影响没有体现在分子中，而是体现在分母上，分母中的债务资本成本是税后的，反映了负债的节税效应。","APV 即“调整现值法”:这是一种绝对值估值方法，其原理为将未来的现金流进行折现。在 APV 方法中，分子为全权益融资下的税后现金流量 UCF，分母为全权益情况下的折现率，在此基础上，加上负债连带效应的净现值。负债连带效应包括节税效应、发行成本、财务困境成本和利息补贴等。","WACC 方法和 APV 方法的比较:分子都采了税后现金流量 UCF。但是 APV 方法采用了全权益资本成本折现得到无枉杆项目的价值，然后加上负债的节税现值，得到杠杆情况下的项目价值。WACC 将 UCF 按照加权平均资本成本来贴现，而加权平均资本成本低于无负债情况下的权益资本成本。两者只有在满足资产负债率可变或资产负债率恒定时才能等同。在用于企业价值评估时的比较:忆当从时间范围来看，债务水平可以预测时，适用于 APV 法，包财务杠杆是不稳定的时候用 APYV 法较好，当负债率是固定的时候，用 WACC 法较好。"]},{"no":1,"type":"essay","stem":"论述货币政策与财政政策进行协调配合的必要性及协调配合模式，并阐述现阶段我国货币政策与财政政策进行协调配合的方式选择。","score":14,"body":"(1) 货币政策与财政政策进行协调配合的必要性这两项政策在宏观经济运行中都有较强的调节能力，但由于它们本身固有的特点，二者都有一定的局限性。无论是货币政策调节还是财政政策调节，仅靠某一项政策很难全面实现宏观经济的调控目标，没有双方的配合，单个政策的实施效果将会大大减弱，这就要求二者相互协调、密切配合，充分发挥它们的综合优势。(2) 协调配合模式各国政府同时利用两大政策干预经济时，就会形成“松紧搭配 \"，即松或紧的两大政策进行匹配运用。松紧搭配一般可以作四种组合;第一,，“紧”货币、“松”财政，第二，“紧 \"财政、“松”货币;第三，财政、货币“双紧”，第四，财政、货币“双松”。“一松一紧”\" 主要是解决结构问题;单独使用 \" 双松?或“双紧 \" 主要为解决总量问题，在总量平衡的情况下，调整经济结构和政府与公众间的投资比例，一般采取货币政策和财政政策“一松一紧”的办法。例如:“紧”财政，使政府的支出和投资直接减少;“松”货币，使公众能够以较低的成本获得较多的资金，并使因增税而导致的收入减少得到补偿。其结果是调整了政府与私人企业的投资结构。(3) 现阶段我国政策配合的方式选择我国现阶段实行的是积极的财政政策和适度宽松的货币政策。因为现阶段我国的国内生产总值增长较快，居民消费价格总水平不断提高，国民收支状况持续改善，为了加快调整经济结构，提高就业，继续采取积极的财政政策，比如扩大政府的支出和投资。为了保持合理的社会融资规模，提高货币政策的有效性，更好地满足多样化投融资需求，我国实行适度宽松的货币政策，使公众能够以较低的成本获得较多的资金，并使因增税而导致的收入减少得到补偿。","points":["货币政策与财政政策进行协调配合的必要性这两项政策在宏观经济运行中都有较强的调节能力，但由于它们本身固有的特点，二者都有一定的局限性。无论是货币政策调节还是财政政策调节，仅靠某一项政策很难全面实现宏观经济的调控目标，没有双方的配合，单个政策的实施效果将会大大减弱，这就要求二者相互协调、密切配合，充分发挥它们的综合优势。","协调配合模式各国政府同时利用两大政策干预经济时，就会形成“松紧搭配 \"，即松或紧的两大政策进行匹配运用。松紧搭配一般可以作四种组合;第一,，“紧”货币、“松”财政，第二，“紧 \"财政、“松”货币;第三，财政、货币“双紧”，第四，财政、货币“双松”。“一松一紧”\" 主要是解决结构问题;单独使用 \" 双松?或“双紧 \" 主要为解决总量问题，在总量平衡的情况下，调整经济结构和政府与公众间的投资比例，一般采取货币政策和财政政策“一松一紧”的办法。例如:“紧”财政，使政府的支出和投资直接减少;“松”货币，使公众能够以较低的成本获得较多的资金，并使因增税而导致的收入减少得到补偿。其结果是调整了政府与私人企业的投资结构。","现阶段我国政策配合的方式选择我国现阶段实行的是积极的财政政策和适度宽松的货币政策。因为现阶段我国的国内生产总值增长较快，居民消费价格总水平不断提高，国民收支状况持续改善，为了加快调整经济结构，提高就业，继续采取积极的财政政策，比如扩大政府的支出和投资。为了保持合理的社会融资规模，提高货币政策的有效性，更好地满足多样化投融资需求，我国实行适度宽松的货币政策，使公众能够以较低的成本获得较多的资金，并使因增税而导致的收入减少得到补偿。"]},{"no":2,"type":"essay","stem":"试评价现行国际本位货币体系的缺陷及其改革方案。","score":14,"body":"(1) 现行国际本位货币体系的缺陷;在布雷顿森林体系彻底瓦解后，取而代之的是牙买加体系，即现行的国际货币体系。但牙买加体系并非是理想的国际货币制度，它仍然存在着一些缺陷，其中较为突出的有三点: @ 以国家主权货币作为国际储备货币，发行国可以享受“铸币税”等多种好处，但却不承担稳定国际储备货币及其所致风险的责任。@@ 以浮动汇率制为主体，汇率经常出现大起大落，变化不定，加大了外汇风险，在一定程度上抑制了国际贸易活动，但极易导致国际金融投机的猩儿，对发展中国家而言，这种负面影响更为突出。图目前的国际收支调节机制并不健全。各种调节渠道都有各自的局限性，全球性的国际收支失衡问题并没有得到根本的改善。因此，国际货币制度仍有待于进一步改革和完善。(2) 改革方案:国际货币体系改革的理想目标是创造一种与主权国家脱钧、并能保持币值长期稳定的国际储备货币，从而避免主权信用货币作为储备货币的内在缺陷。SDR 具有超主权储备货币的特征和潜力。同时它的扩大发行有利于基金组织克服在经费、话语权和代表权改革方面所面临的困难。SDR 的适用范围需要拓宽，从而能真正满足各国对储备货币的要求。中建立起 SDR 与其他货币之间的清算关系。改变当前 SDR 只能用于政府或国际组织之间国际结算的现状，使其能成为国际贸易和金融交易公认的支付手段。他积极推动在国际贸易、大宗商品定价、投资和企业记账中使用 SDR 计价。不仅有利于加强 SDR 的作用，也能有效减少因使用主权储备货币计价而造成的资产价格波动和相关风险。图积极推动创立 SDR 计值的资产，增强其吸引力。基金组织正在研究 SDR 计值的有价证券，如果推行将是一个好的开端。由进一步完善 SDR 的定值和发行方式。SDR 定值的篮子货币范围应扩大到世界主要经济大国，也可将 GDP 作为权重考虑因素之一。此外，为进一步提升市场对其币值的信心，SDR 的发行也可从人为计算币值向有以实际资产支持的方式转变，可以考虑吸收各国现有的储备货币以作为其发行准备。此外，基金组织集中管理成员国储备，也将是推动 SDR 作为储备货币发挥更大作用的有力手段。基金组织可考虑按市场化模式形成开放式基金，将成员国以现有储备货币积累的储备集中管理，设定以 SDR 计值的基金单位，允许各投资者使用现有储备货币自由认购，需要时再赎回所需的储备货币，既推动了 SDR 计值资产的发展，也部分实现了对现有储备货币全球流动性的调控，甚至可以作为增加 SDR 发行、逐步蔡换现有储备货币的基础。《参考资料，周小川《关于改革国际货币体系的思考》 )","points":["现行国际本位货币体系的缺陷;在布雷顿森林体系彻底瓦解后，取而代之的是牙买加体系，即现行的国际货币体系。但牙买加体系并非是理想的国际货币制度，它仍然存在着一些缺陷，其中较为突出的有三点: @ 以国家主权货币作为国际储备货币，发行国可以享受“铸币税”等多种好处，但却不承担稳定国际储备货币及其所致风险的责任。@@ 以浮动汇率制为主体，汇率经常出现大起大落，变化不定，加大了外汇风险，在一定程度上抑制了国际贸易活动，但极易导致国际金融投机的猩儿，对发展中国家而言，这种负面影响更为突出。图目前的国际收支调节机制并不健全。各种调节渠道都有各自的局限性，全球性的国际收支失衡问题并没有得到根本的改善。因此，国际货币制度仍有待于进一步改革和完善。","改革方案:国际货币体系改革的理想目标是创造一种与主权国家脱钧、并能保持币值长期稳定的国际储备货币，从而避免主权信用货币作为储备货币的内在缺陷。SDR 具有超主权储备货币的特征和潜力。同时它的扩大发行有利于基金组织克服在经费、话语权和代表权改革方面所面临的困难。SDR 的适用范围需要拓宽，从而能真正满足各国对储备货币的要求。中建立起 SDR 与其他货币之间的清算关系。改变当前 SDR 只能用于政府或国际组织之间国际结算的现状，使其能成为国际贸易和金融交易公认的支付手段。他积极推动在国际贸易、大宗商品定价、投资和企业记账中使用 SDR ","机会成本","新项目对旧项目的替代效应"],"answer":"A","expl":"**沉没成本是指已经使用掉且无法收回的成本。根据增量现金流原则，沉没成本不影响项目的现金流，因此不影响项目的投资决策。\n\n**提示：**本题涉及的考点是项目预算分析中的现金流分析。考生在复习本考点内容的时候要注意掌握项目现金流的具体分类，影响项目现金流的因素。这部分内容不仅会考理解记忆的题目也会考计算类型的题目，所以相当重要。该考点涉及的题型有选择题、判断题、简答题、计算题。","score":1},{"no":19,"type":"single","stem":"以下不属于资产运用能力指标的是","options":["存货周转率","应收账款周转期","利息保障倍数","资产周转率"],"answer":"C","expl":"**资产运用能力是指企业对各项资产的运用效率，常用的反映资产运用能力的财务指标有以下几个: @ 存货周转率与存货周转天数，@@ 应收账款周转率和应收账款周转天数，轿资产周转率。C 项利息保障倍数是指企业生产经营所获得的息税前利润与利息费用的比率，它是长期偿债能力指标。\n\n**提示：**本题涉及的考点是财务指标。公司财务中的财务指标数量繁多，记忆相对而言比较繁珊，考生需要把各类财务指标进行一个分类，然后加深对每一种财务指标的理解。但是该部分往往以小题的方式进行考查，占分比例不高。本考点涉及的题型有选择题、判断题。","score":1},{"no":20,"type":"single","stem":"债券筹资的优点不包括","options":["债券的成本介于普通股和优先股之间","债权人不直接参与公司经营管理","债券利息在税前列支，可以带来税收屏蔽的好处","债券可以附加多种选择权，增强其吸引力"],"answer":"A","expl":"**债券筹资的优点包括债券筹资的成本远低于股权筹资，包括普通股和优先股。\n\n**提示：**本题涉及的考点是债务融资的优缺点。考生在复习本部分内容的时候，要注意把债务筹资和股权筹资进行简单的对比，理解每一种融资方式各自的优缺点。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":1,"type":"tf","stem":"劣币驱逐良币规律产生于信用货币制度的不可竟换性。","options":["正确","错误"],"answer":"×","expl":"**“劣币驱逐良币”的现象，即两种实际价值不同而法定价格相同的货币同时流通时，市场价格偏高的货币〈良币 ) 就会被市场价格偏低的币〈劣币 ) 所排斥，在价值规律的作用下，恨币退出流通进入贮藏，而劣币充斥市场。\n\n**提示：**本题涉及到的考点是发币驱逐良币效应即格雷欣法则，这个概念相当重要。考生要深刻把握这个概念的内涵、产生的背景以及原因。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":2,"type":"tf","stem":"商业票据的背书人对票据负有连带责任。","options":["正确","错误"],"answer":"√","expl":"**所有背书人都要对该商业票据承担连带责任，而任何一位背书人因受到追索而偿还了债务，他也同时拥有了回其前面的任一背书人进行追索的权利。\n\n**提示：**本题涉及的考点是商业票据的背书。考生要深刻理解背书的内涵。本题考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":3,"type":"tf","stem":"通常情况下，如果资本边际效率大于官定利率，可诱使广商增加投资，反之则减少投资。","options":["正确","错误"],"answer":"√","expl":"**当资本边际效率大于官定利率时，投资者的边际收益大于零，投资者会增加投资，反之相反。\n\n**提示：**本题涉及到的知识点是对利率的理解。问题看似比较陌生，涉及到了一个生僻的概念官定利率，但是仔细想来，只要理解利率的本质就能够正确回答本题。当投资回报大于融资成本的时候，增加投资，反之则减少投资。本考点涉及的题型有选择题、判断题。","score":1},{"no":4,"type":"tf","stem":"信托业务由于能够使商业银行获利，所以是资产业务。","options":["正确","错误"],"answer":"×","expl":"**中间业务是商业银行最古老的服务性业务。早期主要集中于货币的鉴定、兑换、保管、汇竞等种类，现代发展为结算、人代理、信托、理财、信息咨询等业务。\n\n**提示：**本题涉及的考点是商业银行的业务。考生要熟记商业银行资产负债表的基本框架。要明确哪些业务属于资产业务，哪些业务属于负债业务，资产业务和负债业务的区别是什么。本考点的题型有选择题、判断题。","score":1},{"no":5,"type":"tf","stem":"基础货币等于流通中现金与商业银行的存款准备金之和。","options":["正确","错误"],"answer":"√","expl":"**基础货币又称强力货币或高能货币，是指处于流通中由社会公众所持有的现金及银行体系准备金《包括法定存款准备金和超额准备金 ) 的总和。\n\n**提示：**本题涉及到的考点是基础货币。考生要注意对基础货币内涵的理解，要注意把握基础货币的基本公式，同时也要注意把握货币乘数和货币供给模型相关的公式。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":6,"type":"tf","stem":"在凯恩斯看来，投机性货币需求增减的关键在于微观主体对现存利率水平的估价。","options":["正确","错误"],"answer":"√","expl":"**凯恩斯认为，人们持有货币除了满足交易需求和应付意外支出外，还有一个重要动机，即是为了保存价值或财富。凯恩斯把用于保存财富的资产分为货币和债券两大类，而人们对现存利率水平的估价就成为人们在货币和债券两种资产之间进行选择的关键。\n\n**提示：**本题涉及到的考点是凯思斯货币需求函数。货币需求函数理论的框架的重要性不言而喻，考生要注意掌握货币需求函数理论在每个时期的发展，每一种货币需求理论的内涵和提出者以及各理论之间的区别与联系。该考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":7,"type":"tf","stem":"公开市场业务是通过增减商业银行借款成本来调控基础货币的。","options":["正确","错误"],"answer":"×","expl":"**公开市场业务是指中央银行在金融市场上公开买卖有价证券，以此来调节金融机构的准备金和基础货币，进而影响市场利率和货币量的政策行为。再贴现率是通过增减商业银行借款成本来调控基础货币的。\n\n**提示：**本题涉及的考点是公开市场业务。中央银行的货币政策这块内容非常重要，考生要注意把握中央银行货币政策的三大法室。三大法宝的定义内涵、相互之间的区别、各自的优缺点等等。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":8,"type":"tf","stem":"经济体系中到底需要多少货币从根本上说取决于有多少实际资源需要货币实现其流转并完成再生产过程。","options":["正确","错误"],"answer":"√","expl":"**货币供应需求要符合经济体实际资源流转再生产的需要。\n\n**提示：**本题涉及的考点是货币供求均衡。《人金融学》p444。货币均衡这一章节中有一个四角均衡，其中 AS 决定货币需求表达的正是这和句话的意思。考生需要注意掌握好四角均衡的关系。本考点涉及的题型是选择题、判断题。","score":1},{"no":9,"type":"tf","stem":"在一般性货币政策工具中，再贴现政策对中央银行而言具有较强的主动性。","options":["正确","错误"],"answer":"×","expl":"**再贴现政策存在一定的局限性:主动权并非只在中央银行，甚至市场的变化可能违背中央银行的政策意愿。因为商业银行是否申请再贴现或再贴现多少，取决于商业银行的行为，由商业银行自主判断和选择。\n\n**提示：**本题涉及的考点是中央银行的再贴现政策。再贴现政策是中央银行货币政策三大法宝的其中一种。正如上面所提到的一样，考生要非常重视对中央银行三大法宝的理解和掌握，该部分内容非常重要。该考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":10,"type":"tf","stem":"中央银行对利率的控制能力强于对超额准备的控制。","options":["正确","错误"],"answer":"×","expl":"**影响利率的因素有很多，由货币的供求决定。虽然中央银行可以通过货币政策工具影响货币供给，但很难影响货币需求，利率不易控制。超额准备金一般包括借入准备金和非借入准备金。借入准备金是商业银行由于准备金不足向拥有超额准备金的银行借入的货币资金。超额准备金中扣除借入准备金，即为非借入准备金，又称自有准备金。央行可以通过调整再贴现率、银行资本充足率控制超额准备金。\n\n**提示：**本题涉及的考点是中央银行的货币政策，不属于中央银行的三大法宝而属于其他类型的货币政策，重要性虽次于中央银行三大法宝，但仍值得考生重视。考生要注意把握这些货币政策的内涵和优缺点。本考点涉及的题型有选择题、判断题。\n\n1 人民币特种股票 B 股属于广义外汇。( Y )\n\n**解析：**广义外汇泛指以外币标价的金融资产，而 B 股是以人民币标明面值，以外币认购和买卖，在中国境内《〈“上海.深圳 ) 证券交易所上市交易的外资股。广义外汇包含外币、外币有价证券、外币支付凭证等可以用于国际结算的债权。B 股属于广义外汇。\n\n**提示：**本题涉及的考点是考生对也股定义的记忆。该考点比较生僻。在公司财务书中分别介绍了人 A 股、B 股、五股的定义，考生只需简单背诵记忆即可，占分比例较少。本考点涉及的题型有选择题、判断题。","score":1},{"no":12,"type":"tf","stem":"一国对外负债的增加应该记录在国际收支金融账户的借方。","options":["正确","错误"],"answer":"×","expl":"**金融项目主要包括直接投资、证券投资和其他投资。本国在国外的直接投资、证券投资和其他投资的增加记入借方项目，外国在本国的直接投资、证券投资和其他投资的增加则应记入贷方项目。\n\n**提示：**本题涉及的考点是国际收支平衡表。考生要注意对国际收支平衡表大致框架的记忆。国际收支平衡表的借方和贷方分别包含了哪些项目。其中，借方是现金流出的项目，贷方是现金流入的项目。\n\n这个知识点特别容易混消，考生需要找到适合自己的方法对该部分进行强化记忆。该考点涉及的题型有选择题、判断题。","score":1},{"no":13,"type":"tf","stem":"在固定汇率制度下，一国国际收支顺差过大会引起国内物价上涨。","options":["正确","错误"],"answer":"√","expl":"**顺差给本币带来升值压力，导致央行以外汇占款的形式被动投放基础货币，带来国内货币供应增长过快和通货膨胀的压力，对货币调控的自主性和有效性形成一定的制约。\n\n**提示：**本题涉及的考点是国际收支带来的影响。考生需要注意掌握国际收支失衡的原因以及国际收支不平衡带来的多方面影响。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":14,"type":"tf","stem":"在不考虑税收、交易成本和财务危机成本的情况下，如果公司通过发行股票的方式来赎回其债务，那么之后的股票价格会上升，因为此时股东的风险下降了。","options":["正确","错误"],"answer":"√","expl":"**解答此题结合 MM 定理，债权融资和股权融资对公司融资成本的影响。\n\n**提示：**该题涉及的知识点是 MM 理论，MM 理论是公司财务学中最为重要的理论之一。考生要注意把担对 MM 理论的理解。负债是怎样影响股东价值的，负债是怎样改变公司的融资资本成本的，负债是怎样影响股东权益的资本成本的等等问题都需要考生去好好把握。该题涉及到的题型有选择题、判断题、计算题。\n\n1S.在计算公司 WACC 时，权重应基于公司的目标资本结构。 ( \\ )\n\n**解析：**在讨论加权平均资本成本时，总是假定企业已确定了目标资本结构，并且保持本结构的稳定。\n\n**提示：**该题涉及到的考点是计算公司价值的方法之一 WACC 法。WACC 法是计算公司价值的三大方法中的最为重要的一种方法。考生要注意掌握加权平均资本成本的计算公式，掌握如何用 WACC 法来计算公司价值。该考点涉及的题型有选择题、判断题、计工题。","score":1},{"no":17,"type":"tf","stem":"2012 年投资者 A 的收益率为 19%，投资者 B 的收益率为 13%，A 的投资组合 B 值为 1.5，B 的投资组合 B 值为 1。如无风险利率为 9%，同期市场收益率 3%，则 A 在选股方面更出色。","options":["正确","错误"],"answer":"√","expl":"** A 的入森指数为 1.9%- 〈9%0+1. X〈15%-9%) ) =196; B 的入森指数为 13%- 〈9%+1X (1%-9%) ) =0，因此，A 在选股方面更加出色。\n\n**提示：**本题涉及到的考点是 CAPM 模型，CAPM 模型也是公司财务中最为重要的几个计算公式之一，考生要注意对 CAPM 模型的理解以及运用。基本上每年都会出相关的计算题，因此重要性不言而喻。\n\n本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":18,"type":"tf","stem":"利用耻 R 对互斥项目进行评估时，假设现金流的再投资收益率为项目资本成本。","options":["正确","错误"],"answe 要部分，又称“一级资本”。(2) 分类:根据《巴塞尔协议》的规定，核心资本由两部分构成:中实收资本，即已发行并完全缴足的普通股和永久性非累积的优先股; @ 公开储备，即通过保留盘余或其他盘余形成的储备，例如，股票发行溢价、保留利润、普通储备金和法定储备金的增值所创造和增加的储备等。(3) 内容:我国国有商业银行的核心资本包括:中实收资本，即股本和财政拨入资金。后者为银行创办时财政拨入的创业资金和以后财政每年增拨的信贷资金，包资本公积，即资本价余，指股票发行的溢价部分，@@ 和盈余公积，又称“营业鼻余”即每年从营业利润中积累起来的部分，电未分配利润，即当年利润缴税.并扣除股息以后的多余部分。","points":["4GL) 定义;商业银行的核心资本〈Core capital) ，是指权益资本和公开储备，是商业银行资本构成的主要部分，又称“一级资本”。","分类:根据《巴塞尔协议》的规定，核心资本由两部分构成:中实收资本，即已发行并完全缴足的普通股和永久性非累积的优先股; @ 公开储备，即通过保留盘余或其他盘余形成的储备，例如，股票发行溢价、保留利润、普通储备金和法定储备金的增值所创造和增加的储备等。","内容:我国国有商业银行的核心资本包括:中实收资本，即股本和财政拨入资金。后者为银行创办时财政拨入的创业资金和以后财政每年增拨的信贷资金，包资本公积，即资本价余，指股票发行的溢价部分，@@ 和盈余公积，又称“营业鼻余”即每年从营业利润中积累起来的部分，电未分配利润，即当年利润缴税.并扣除股息以后的多余部分。"]},{"no":3,"type":"term","stem":"购买力平价","score":4,"body":"(1) 概念，购买力平价 (Purchasing power parity) ，是一种研究和比较各国不同货币之间购买力关系的理论。(2) 特点:它认为货币如果在各国间具有相等的购买力，那么这时的汇率就是均衡汇率。如果 2 美元和 1 英镑在各自的国内可以购买等量的货物，则 2 美元兑换 1 英镑便存在购买力平价。购买力乎价理论的思想基础是，如果一国的货物相对便宜，那么人们就会购买该国货币并在那里购买商品，购买力平价成立的前提是不同地区商品同质同价，自由交易，无交易成本，价格完全弹性，无贸易壁盆等。(3) 条件:购买力平价成立还需要一些其他的条件:四经济的变动来自货币方面;四价格水平与货币供给成正比，轩国内相对价格结构比较稳定;四经济中如技术.消费倾向等实际因素不变，也不对经济结构产生实质影响。购买力平价存在两种形式:四绝对购买力平价，即两区货币的兑换比率等于两国价格水平的比率，@ 相对购买力平价，指两国货币兑换比率的变动，等于两国价格水平变动的比率。","points":["概念，购买力平价 (Purchasing power parity) ，是一种研究和比较各国不同货币之间购买力关系的理论。","特点:它认为货币如果在各国间具有相等的购买力，那么这时的汇率就是均衡汇率。如果 2 美元和 1 英镑在各自的国内可以购买等量的货物，则 2 美元兑换 1 英镑便存在购买力平价。购买力乎价理论的思想基础是，如果一国的货物相对便宜，那么人们就会购买该国货币并在那里购买商品，购买力平价成立的前提是不同地区商品同质同价，自由交易，无交易成本，价格完全弹性，无贸易壁盆等。","条件:购买力平价成立还需要一些其他的条件:四经济的变动来自货币方面;四价格水平与货币供给成正比，轩国内相对价格结构比较稳定;四经济中如技术.消费倾向等实际因素不变，也不对经济结构产生实质影响。购买力平价存在两种形式:四绝对购买力平价，即两区货币的兑换比率等于两国价格水平的比率，@ 相对购买力平价，指两国货币兑换比率的变动，等于两国价格水平变动的比率。"]},{"no":4,"type":"term","stem":"永续年金","score":4,"body":"(1) 定义:永续年金 (perpetuities) ，是指无限期的收入或支出相等金额的年金，也叫永久年金。(2) 特点:它是普通年金的一种特殊形式，永续年金期限趋于无限，没有终止时间，也没有终止值，只有现值。(3) 条件:永续年金是指无限期支付的年金，即一系列没有到期日的现金流，如果满足以下条件:中每次支付金额相同且皆为 A，@ 支付周期 + 每次支付的时间间隔相同〈如:年.季.月等 ) ;名每段支付间隔的利率相同且值为 i，根据周期不同，可以为年利率，月利率等。","points":["定义:永续年金 (perpetuities) ，是指无限期的收入或支出相等金额的年金，也叫永久年金。","特点:它是普通年金的一种特殊形式，永续年金期限趋于无限，没有终止时间，也没有终止值，只有现值。","条件:永续年金是指无限期支付的年金，即一系列没有到期日的现金流，如果满足以下条件:中每次支付金额相同且皆为 A，@ 支付周期 + 每次支付的时间间隔相同〈如:年.季.月等 ) ;名每段支付间隔的利率相同且值为 i，根据周期不同，可以为年利率，月利率等。"]},{"no":5,"type":"term","stem":"修正的内部收益率 (MIRR )","score":4,"body":"《1) 定义:修正的内部收益率 (MIRR) 是为了使内部收益率指标能更好地用于投资决策，而引入修正的《或调整的 ) 内部收益率指标。《2) 特点:与普通内部收益率〈IRR) 相比，修正的内部收益率假设所有的投资收益均按照投资所要求的贴现率进行再投资，从而使其关于再投资收益率的假设变得更加合理，同时，MIRR 也解决了有多个及 R 同时存在的问题。(3) 不足:经过修正后的这一指标，仍然没有办法解决因为投资规模不同而产生的与 NPV 指标相矛盾的问题。","points":["定义:修正的内部收益率 (MIRR) 是为了使内部收益率指标能更好地用于投资决策，而引入修正的《或调整的 ) 内部收益率指标。","特点:与普通内部收益率〈IRR) 相比，修正的内部收益率假设所有的投资收益均按照投资所要求的贴现率进行再投资，从而使其关于再投资收益率的假设变得更加合理，同时，MIRR 也解决了有多个及 R 同时存在的问题。","不足:经过修正后的这一指标，仍然没有办法解决因为投资规模不同而产生的与 NPV 指标相矛盾的问题。"]},{"no":1,"type":"short","stem":"简述利率发挥作用的基础性条件。","score":8,"body":"利率发挥作用的基础性条件包括:《1) 独立决策的市场主体。利率要想发挥应有的作用，首先需要各个微观行为主体是能够独立决策、独立承担责任的市场行为主体，即所谓的理性经济人。《2) 市场化的利率决定机制。市场化的利率体系与利率决定机制，意味着资金供求状况能够对利率水平产生影响，利率变动也会反过来调节资金供求。此时，利率高低能够真实地反映资金的稀缺程度及其机会成本。《3) 有灵活的利率联动机制。即在利率体系中，一种利率发生变动的同时，其他利率也联结发生变动，即引起利率体系的变动。《4) 合理的利率弹性。所谓利率弹性，就是其他经济变量对利率变化的敏感程度，通常用单位百分比的利率变化所导致的其他经济变量变化的百分比来表示。该比率越大，亦即某经济变量对利率越富有弹性，该经济变量就会对利率的变化越敏感，通过利率变动引导其朝着预期目标变化的意图也就更容易实现。反之，如果经济变动对利率缺乏弹性，对利率变动不敏感，利率变动对经济变量的影响就极其微弱，通过利率变动就很难达到预期的目标。《5) 合理的利率结构，包括期限结构、行业结构以及地区结构等，以体现经济发展的时期、区域、产业及风险差别。","points":["利率发挥作用的基础性条件包括:","独立决策的市场主体。利率要想发挥应有的作用，首先需要各个微观行为主体是能够独立决策、独立承担责任的市场行为主体，即所谓的理性经济人。","市场化的利率决定机制。市场化的利率体系与利率决定机制，意味着资金供求状况能够对利率水平产生影响，利率变动也会反过来调节资金供求。此时，利率高低能够真实地反映资金的稀缺程度及其机会成本。","有灵活的利率联动机制。即在利率体系中，一种利率发生变动的同时，其他利率也联结发生变动，即引起利率体系的变动。","合理的利率弹性。所谓利率弹性，就是其他经济变量对利率变化的敏感程度，通常用单位百分比的利率变化所导致的其他经济变量变化的百分比来表示。该比率越大，亦即某经济变量对利率越富有弹性，该经济变量就会对利率的变化越敏感，通过利率变动引导其朝着预期目标变化的意图也就更容易实现。反之，如果经济变动对利率缺乏弹性，对利率变动不敏感，利率变动对经济变量的影响就极其微弱，通过利率变动就很难达到预期的目标。","合理的利率结构，包括期限结构、行业结构以及地区结构等，以体现经济发展的时期、区域、产业及风险差别。"]},{"no":2,"type":"short","stem":"简述互换交易的基本功能。","score":8,"body":"互换是交易双方通过签订合约形式在规定的时间调换货币或利率，或者货币与利率同时交换，达到规避管制、降低融资成本的目的。互换交易，主要指对相同货币的债务和不同货币的债务通过金融中介进行调换的行为，其主要的功能包括: (1) 保值功能，体现在应对汇率与利率风险方面，由于国际性企业的资产和负债以多种货币计价，货币互换可使与计价货币相关的汇率风险最小化。在防范利率风险方面，对于一种货币来说，无论是回定利率还是浮动利率债权债务的持有者，都面临着利率变化的风险，利率互换可以实现降低利率风险的目标。(2) 降低融资成本功能，有些投资者或融资者，由于其信用等级比较低，难以获得低利率成本的融资，通过货币互换和利率互换可以得到比直接融资成本更低的资金，节约了费用。(3) 财务结构调整功能，互换交易可以使国际性公司的资产与负债货币实现匹配，减少货币暴露，降低汇率波动造成的资产与负债不对称风险。(4) 规避管制功能，许多国家都实行外汇管制，在外汇管制比较严格的国家获得贷款、发行债券融资是比较困难的。资金汇出汇入成本比较高。通过货币互换，可以避开部分外汇管制，降低交易成本。","points":["互换是交易双方通过签订合约形式在规定的时间调换货币或利率，或者货币与利率同时交换，达到规避管制、降低融资成本的目的。互换交易，主要指对相同货币的债务和不同货币的债务通过金融中介进行调换的行为，其主要的功能包括:","保值功能，体现在应对汇率与利率风险方面，由于国际性企业的资产和负债以多种货币计价，货币互换可使与计价货币相关的汇率风险最小化。在防范利率风险方面，对于一种货币来说，无论是回定利率还是浮动利率债权债务的持有者，都面临着利率变化的风险，利率互换可以实现降低利率风险的目标。","降低融资成本功能，有些投资者或融资者，由于其信用等级比较低，难以获得低利率成本的融资，通过货币互换和利率互换可以得到比直接融资成本更低的资金，节约了费用。","财务结构调整功能，互换交易可以使国际性公司的资产与负债货币实现匹配，减少货币暴露，降低汇率波动造成的资产与负债不对称风险。","规避管制功能，许多国家都实行外汇管制，在外汇管制比较严格的国家获得贷款、发行债券融资是比较困难的。资金汇出汇入成本比较高。通过货币互换，可以避开部分外汇管制，降低交易成本。"]},{"no":3,"type":"short","stem":"简述国际货币制度的主要内容。","score":8,"body":"国际货币制度亦称国际货币体系，是指支配各国货币关系的规则以及各国间进行各种交易支付所依据的一套安排和惯例。国际货币制度通常是由参与的各国政府磋商而定，一旦商定，各参与国都应自觉遵守。国际货币制度一般包括三个方面的内容: (1) 确定国际储备资产，即使用何种货币作为国际支付货币，哪些资产可用作国际储备资产。(2) 安排汇率制度，即采用何种汇率制度，是固定汇率制还是浮动汇率制。(3) 选择国际收支的调节方式，即出现国际收支不平衡时，各国政府应采取什么方法进行弥补，各国之间的政策措施如何协调等。，理想的国际货币制度应该能够促进国际贸易和国际经济活动的发展，主要体现在国际货币秩序的稳定、能够提供足够的国际清偿能力并保持国际储备资产的信心、保证国际收支的失衡能够得到有效的调节。记今为止，国际货币制度经历了从国际金本位制到布雷顿森林体系再到牙买加体系的演变过程。","points":["国际货币制度亦称国际货币体系，是指支配各国货币关系的规则以及各国间进行各种交易支付所依据的一套安排和惯例。国际货币制度通常是由参与的各国政府磋商而定，一旦商定，各参与国都应自觉遵守。国际货币制度一般包括三个方面的内容:","确定国际储备资产，即使用何种货币作为国际支付货币，哪些资产可用作国际储备资产。","安排汇率制度，即采用何种汇率制度，是固定汇率制还是浮动汇率制。","选择国际收支的调节方式，即出现国际收支不平衡时，各国政府应采取什么方法进行弥补，各国之间的政策措施如何协调等。，理想的国际货币制度应该能够促进国际贸易和国际经济活动的发展，主要体现在国际货币秩序的稳定、能够提供足够的国际清偿能力并保持国际储备资产的信心、保证国际收支的失衡能够得到有效的调节。记今为止，国际货币制度经历了从国际金本位制到布雷顿森林体系再到牙买加体系的演变过程。"]},{"no":4,"type":"short","stem":"可转换债券作为筹资工具有哪些优缺点。","score":8,"body":"可转换债券是指由股份公司发行的，可以按一定条件转换为一定数量的公司普通股的债券，可转换债券的可转股性实质上是内骨于债券或优先股的认股权证。(1) 可转换债券作为筹资工具有以下优点: @ 可转债具有低票面利率，从而可以在可转债的存续期内节约可观的利息支出，@ 利用可转债的可转换性进行推迟的股权融资，一般来讲，可转债发行者发行可转债的真正目的不是发行公司债券，而是要发行公司股票，但是由于种种原因，在公司需要资金的时候恰恰不宜进行股票筹资，@ 对于外部投资者而言，一方面可转债的债券性质使投资者避免了直接进行股权投资的高风险，得到了比股东更可靠的保护，另一方面，可转债的可转股性质使得投资者在公司取得成功时可与股东一起分享收益，具有股权投资获取高额剩余收益的潜力。(2) 可转换债券作为筹资工具有以下缺点: @ 与普通债券相比，虽然可转债的利上成本较低，但是发行人为此付出了代价，给予了投资者认股权证; @@) 与直接发行股票相比，虽然可转债的转股价格高于发行时的股价，但是发行人给予了投资者转股的选择权，相当于给投资者的投资提供了保险。","points":["可转换债券是指由股份公司发行的，可以按一定条件转换为一定数量的公司普通股的债券，可转换债券的可转股性实质上是内骨于债券或优先股的认股权证。","可转换债券作为筹资工具有以下优点: @ 可转债具有低票面利率，从而可以在可转债的存续期内节约可观的利息支出，@ 利用可转债的可转换性进行推迟的股权融资，一般来讲，可转债发行者发行可转债的真正目的不是发行公司债券，而是要发行公司股票，但是由于种种原因，在公司需要资金的时候恰恰不宜进行股票筹资，@ 对于外部投资者而言，一方面可转债的债券性质使投资者避免了直接进行股权投资的高风险，得到了比股东更可靠的保护，另一方面，可转债的可转股性质使得投资者在公司取得成功时可与股东一起分享收益，具有股权投资获取高额剩余收益的潜力。","可转换债券作为筹资工具有以下缺点: @ 与普通债券相比，虽然可转债的利上成本较低，但是发行人为此付出了代价，给予了投资者认股权证; @@) 与直接发行股票相比，虽然可转债的转股价格高于发行时的股价，但是发行人给予了投资者转股的选择权，相当于给投资者的投资提供了保险。"]},{"no":1,"type":"essay","stem":"近年来，中国人民银行采用有别于传统货币政策工具的策略，创设了几种货币政策新工具，请结合中国经济运行的现实背景，分析这些政策工具与传统货币政策工具的功能与预期效果有何不同?","score":14,"body":"《1) 传统货币政策工具:主要包括法定存款准备金政策、再贴现政策和公开市场业务，这三大传统的政策工具有时也被称为“三大法宝”\"，主要用于调节货币总量。@ 法定存款准备金政策通常被认为是货币政策最猛烈的工具之一，因为法定存款准备金率是通过决定或改变货币乘数来影响货币供给，即使法定存款准备金率调整的幅度很小，也会引起货币供应量的巨大波动。其优点主要在于作用力大，主动性强，见效快。凶再贴现政策是指中央银行对商业银行向中央银行申请再贴现所作的政策性规定。一般包括两方面的内容: a.再贴现率的确定与调整，b.申请再贴现资格的规定与调整。中央银行对再贴现资格条件的规定“包括对贴现票据的规定和对申请机构的规定 ) 与调整，能够改变或引导资金流向，可以发挥抑制或扶持作用，主要着眼于长期的结构调整。再贴现政策还是中央银行扮演“最后贷款人”角色的途径，在保持金融稳定方面发挥着重要的作用。但是，再贴现政策也存在一定的局限性: a.主动权并非只在中央银行; b.再贴现率的调节作用是有限度的;c.与法定存款准备金率比较而言，再贴现率易于调整，但由于它是中央银行利率，随时调整会引起市场利率的大幅波动，加大利率风险,干扰市场机制; d.中央银行通过再贴现充当最后贷款人，有可能加大金融机构的道德风险。仿公开市场业务是指中央银行在金融市场上公开买卖有价证券，以此来调节金融机构的准备金和基础货币，进而影响市场利率和货币量的政策行为。同前两种货币政策工具相比，公开市场业务有明显的优越性: a.主动性强;b.灵活性强，c.调控效果和缓，震动性小，d.告示效应强，影响范围广。《2) 货币政策新工具:中国人民银行所使用的货币政策新工具主要包括公开市场短期流动性调节工具 CSLO) 、常设借贷便利〈SLF) 、中期借贷便利 (MLF ) 以及抵押补充贷款 (PSL) 等。GSLO 是央行公开市场常规操作的补充，以 7 天期内短期回购为主。CSLF 是金融机构根据自身流动性需求提出申请，主要由央行以抵押贷款方式发放，期限为 1-3 个月。由于 SLF 特有的“按需配给”的原则，意味着其利率将成为短期资金利率上限，通过配合央行公开市场逆回购及 SLO 等操作利率，共同构成了货币市场利率的运行“走序”。GOMLEF 类似于 SLF，期限为 3 个月，但临近到期可能会重新约定利率并展期。商业银行可通过质押利率债和信用债获取借贷便利工具的投放。GOPSL 则可被视为是有抵押的再贷款，是一个既能够大量投放基础货币，又能更好地调配基础货币数量和流问，从而影响中期资金价格的政策工具。《3) 中国经济运行的现实背景:从金融市场情况看，近期信用紧缩情况依然突出，实体经济的融资需求仍然偏弱。从以上现实背景来看，新工具与传统工具预期效果的不同之处: 中功能的不同之处:在此背景下，货币政策新工具的使用可看作是用定向“松信用”的方式，将中央政府的财务杠杆放大化。凶预期效果的不同之处:但是这些货币政策新工具的使用可能未能达到推动信贷扩张、引导利率 (特别是中长期无风险利率 ) 下行的政策目的。原因可能在于，当贷款从央行投放到其他金融机构，贷款利率虽然实际上低于市场利率，但贷款与资金流动领域的其他部分投向划分较为明确，难以作用于整个资金市场。同时，抵押品价值下降、企业缺乏现金流等因素，也导致银行信贷扩张意愿受限。因此，尽管上述货币政策新工具的投放规模还将扩张，但在短期内，宏观经济面临的下行风险和企业的融资难压力仍不易得到根本解决。","points":["传统货币政策工具:主要包括法定存款准备金政策、再贴现政策和公开市场业务，这三大传统的政策工具有时也被称为“三大法宝”\"，主要用于调节货币总量。@ 法定存款准备金政策通常被认为是货币政策最猛烈的工具之一，因为法定存款准备金率是通过决定或改变货币乘数来影响货币供给，即使法定存款准备金率调整的幅度很小，也会引起货币供应量的巨大波动。其优点主要在于作用力大，主动性强，见效快。凶再贴现政策是指中央银行对商业银行向中央银行申请再贴现所作的政策性规定。一般包括两方面的内容: a.再贴现率的确定与调整，b.申请再贴现资格的规定与调整。中央银行对再贴现资格条件的规定“包括对贴现票据的规定和对申请机构的规定 ) 与调整，能够改变或引导资金流向，可以发挥抑制或扶持作用，主要着眼于长期的结构调整。再贴现政策还是中央银行扮演“最后贷款人”角色的途径，在保持金融稳定方面发挥着重要的作用。但是，再贴现政策也存在一定的局限性: a.主动权并非只在中央银行; b.再贴现率的调节作用是有限度的;c.与法定存款准备金率比较而言，再贴现率易于调整，但由于它是中央银行利率，随时调整会引起市场利率的大幅波动，加大利率风险,干扰市场机制; d.中央银行通过再贴现充当最后贷款人，有可能加大金融机构的道德风险。仿公开市场业务是指中央银行在金融市场上公开买卖有价证券，以此来调节金融机构的准备金和基础货币，进而影响市场利率和货币量的政策行为。同前两种货币政策工具相比，公开市场业务有明显的优越性: a.主动性强;b.灵活性强，c.调控效果和缓，震动性小，d.告示效应强，影响范围广。","货币政策新工具:中国人民银行所使用的货币政策新工具主要包括公开市场短期流动性调节工具 CSLO) 、常设借贷便利〈SLF) 、中期借贷便利 (MLF ) 以及抵押补充贷款 (PSL) 等。GSLO 是央行公开市场常规操作的补充，以 7 天期内短期回购为主。CSLF 是金融机构根据自身流动性需求提出申请，主要由央行以抵押贷款方式发放，期限为 1-3 个月。由于 SLF 特有的“按需配给”的原则，意味着其利率将成为短期资金利率上限，通过配合央行公开市场逆回购及 SLO 等操作利率，共同构成了货币市场利率的运行“走序”。GOMLEF 类似于 SLF，期限为 3 个月，但临近到期可能会重新约定利率并展期。商业银行可通过质押利率债和信用债获取借贷便利工具的投放。GOPSL 则可被视为是有抵押的再贷款，是一个既能够大量投放基础货币，又能更好地调配基础货币数量和流问，从而影响中期资金价格的政策工具。","中国经济运行的现实背景:从金融市场情况看，近期信用紧缩情况依然突出，实体经济的融资需求仍然偏弱。从以上现实背景来看，新工具与传统工具预期效果的不同之处: 中功能的不同之处:在此背景下，货币政策新工具的使用可看作是用定向“松信用”的方式，将中央政府的财务杠杆放大化。凶预期效果的不同之处:但是这些货币政策新工具的使用可能未能达到推动信贷扩张、引导利率 (特别是中长期无风险利率 ) 下行的政策目的。原因可能在于，当贷款从央行投放到其他金融机构，贷款利率虽然实际上低于市场利率，但贷款与资金流动领域的其他部分投向划分较为明确，难以作用于整个资金市场。同时，抵押品价值下降、企业缺乏现金流等因素，也导致银行信贷扩张意愿受限。因此，尽管上述货币政策新工具的投放规模还将扩张，但在短期内，宏观经济面临的下行风险和企业的融资难压力仍不易得到根本解决。"]},{"no":2,"type":"essay","stem":"简述影响汇率的因素和汇率对经济的影响，并结合我国的汇率制度和人民币国际化谈谈对我国经济的影响。","score":14,"body":"(1) 影响汇率的因素:汇率作为联系经济体内部和外部的重要变量，具有双重性质。一方面它是用一种货币表示的另一种货币的价格，属于货币层面的一个变量，因此必然要受到各种货层面因素的影响; 另一方面，汇率又取决于实体经济的状况，要对实体经济层面因素的变化做出反应。因此影响汇率变动的因素包括; @ 供求关系。汇率变动由外汇供给与需求的对比变动所引起，而外汇供求状况又取决于由国际贸易往来和资本流动所引起的债权债务关系。@@ 购买力水平。人们之所以需要外国货币，是因为外币在其发行国具有购买力，相应地人们需要本币也是因为本币在本国具有购买力，因此两国货币汇率的决定基础应是两国货币所代表的购买力之比。图交易者心理预期。外汇市场上交易者的心理预期对汇率变化有显著影啊。图市场中的套利行为。套利性的短期资本流动会驱使高利率国家的货币在远期外汇市场上贴水，而低利率国家货币将在远期外汇市场上升水，并且升贴水率等于两国间的利率差。(2) 汇率对经济的影响:汇率是重要的价格指标，影响经济主体的行为，影响本国〈及贸易伙伴 ) 的国际竞争力水平，影响进出口、资本流出入和国际收支状况，影响一国的产出和就业，进而对整体的宏观经济状况都产生重要影响。@ 本币贬值，意味着可以提高本国商品的国际竞争力，能起到促进出口、抑制进口的作用;，知本币升值，则有利于进口，不利于出口。@ 真实汇率体现了物价变动对汇率的影响。反过来，汇率也会影响一国的物价水平。汇率的变动导致物价总水平的波动，其后果就不仅限于进出口，而是将影响整体经济。轩由于长期资本的流动主要以利润和风险为转移，汇率的变动对长期资本流动的影响较小。短期资本流动则常常受到汇率的较大影响。四汇率变动对金融资产的选择有重要影响。由于汇率的变动影响本外币资产的收益率，因此本币汇率升值，将促使投资者更加倾向于持有本币资产，相反，外币汇率的升值，则会导致投资者将本币资产转换为外币资产。(3) 结合汇率制度和人民币国际化谈谈对我国经济的影响; 我国实行有管理的浮动汇率制，近年来汇率变化的原因主要可以归纳为以下方面: a.我国国民经济的飞速发展，国际地位的逐步提高。在经济的快速增长情况下,我国的经济实力和竞争力发生了巨大的变化，汇率作为经济发展的反映，必将根据中国经济在国际上地位，以及国内经济自身发展周期作出适当调整。b.对外贸易高速增长，热钱流入，使得人民币需求增加，也会给人民币升值增加压力。同时，汇率与国际收支有着密切的联系，国际收支理论表明，当一国有较大的国际收支道差时，对外汇的需求大于外汇的供给，本币对外贬值，反之则会造成本币升值，我国的巨额贸易顺差作用于人民币汇率，使之遵循国际收支理论产生上升趋势现象。.我国持有的巨额外汇储备。根据“国际收支决定论”认为，一国的国际收支状况是影响汇率最直接的因素之一。当一国有较大的国际收支逆差时，对外汇的需求大于外汇的供给，本币贬值，反之则会造成本币升值。而我国目前经常项目和资本项目双顺差的状况，使国内的外汇储备节节上升，因此人民币面临着潜在的升值压力。近年来，随着人民币进程的加快，人民币在国际上的地位越来越重要，人们对人民币的需求也进一步增加，使得人民币近年来一直呈现上升趋势。人民币升值的汇率变化和人民币国际化进程的加快对于我国经济的影响主要有以下几个方面。@ 本币汇率升值的积极影响包括; a.改善产业结构。人民币升值会导致劳动力和资源成本增加，从而使得中国原本依靠廉价劳动力和资源获取利润的低端产业规模减小，使得这些资源从低端产业中流出，流向高端产业。在市场竞争机制下，高端产业产品通过购买先进设备，采用先进技术，提高产品档次，有利于我国产业结构从劳动密集型向资本密集型发展，改善我国在国际分工中的地位。b.促进国内资源节约。当人民币升值时，如果出口产品定价能够相应提高，国外原材料价格就会相对便宜，我国企业会在价格机制作用下，购买更多国外原材料。那么我国出口同量资源能够换回更多的国外资源，节约了我国原本紧张的资源，有利于国内资源的可持续发展。同时，本币升值所带来的产业结构的转变也会在技术上降低对资源的浪费，从而国内资源消耗减少。c.可减少与外国的贸易摩擦。当前美国政府极力促进人民币升值,人民币升值虽然不能解决中美贸易巨大的差额问题，但也会间接起到缓解与美国、日本等主要贸易伙伴国在低价反倾销上的贸易摩擦的作用，而对于一个国家而言,“强币”是经济实力的重要体现，人民币升值必将会大大增强人民币在国际社会中的接受度。d.有利于提高人民币购买力。人民币的汇率提升，使得同样数量的人民币能够换得更多外汇，意味着人民的财富增加。同时，人民币升值使得进口商品价格下降，人们能够花同样多的钱购买更多的进口商品。同时，人民出国深造、旅游、购物等费用也会下降，增加了人们出国的机会，提高了人们的生活质量水平。对企业而定，人民币升值降低了进口原材料的费用，节约企业成本，增强了企业竞争力。e.有利于抑制通货膨胀。国家的潜在 GDP 能力由自然资源、人力资源、资本、技术水平决定。当需求强劲，使国家的经济达到潜在 GDP 能力时，再有增量的需求就只能带动物价的上涨而不能再促进实际 GDP 的增长，因此，当总需求过于旺盛时，政府就应采取必要的措施给经济降温，从而降低通货膨胀的压力。因为 GDP=C+I+G+X。如果人民币升值，则国内产品的国际竞争力将下降，从而净出口将减少，实际 GDP 将回到潜在 GDP 能力以下，国内通货膨胀的压力也将降低。@@ 本币汇率变化的消极影响包括: a.抑制出口，增加进口。我国经济的发展依赖于出口的不断上涨，而人民币升值必然会增加出口企业的生产成本和劳动力成本，降低出口产品在国际上的竞争力，势必导致出口行业的不景气，从而影响国内经济。同时，进口产品增多，不仅会使得贸易顺差转为逆差，还会给国内企业带来强大的竞争力。b.外汇储备面临缩水。充足的外汇储备是我国综合实力的重要标志,有利于我国开展多种国际贸易活动。然而，人民币的升值必将会使得大量储备的美元大幅缩水，国家也将会遭受巨大的外汇损失。c.失业率上升。人民币升值将导致中国产品出口价格大幅提高，中国产品将失去价格竞争力，对出口行业和外商投资造成影响，最终将是我国失业率上升。d.助长经济中的泡沫和投机行为,加大金融风险。出于资本逐利的本能,在人民币升值预期的作用下，国际游资大量流入，短期套利动机非常明显，将导致投机不可避免地盛行，扰乱了金融市场秩序。我国金融监管体系还不健全，有可能导致金融风险。同时我国居民在人民币升值的呼声下，也将资金大量投资于股市和房地产等行业进行投机活动，这助长了经济中的泡沫。","points":["影响汇率的因素:汇率作为联系经济体内部和外部的重要变量，具有双重性质。一方面它是用一种货币表示的另一种货币的价格，属于货币层面的一个变量，因此必然要受到各种货层面因素的影响; 另一方面，汇率又取决于实体经济的状况，要对实体经济层面因素的变化做出反应。因此影响汇率变动的因素包括; @ 供求关系。汇率变动由外汇供给与需求的对比变动所引起，而外汇供求状况又取决于由国际贸易往来和资本流动所引起的债权债务关系。@@ 购买力水平。人们之所以需要外国货币，是因为外币在其发行国具有购买力，相应地人们需要本币也是因为本币在本国具有购买力，因此两国货币汇率的决定基础应是两国货币所代表的购买力之比。图交易者心理预期。外汇市场上交易者的心理预期对汇率变化有显著影啊。图市场中的套利行为。套利性的短期资本流动会驱使高利率国家的货币在远期外汇市场上贴水，而低利率国家货币将在远期外汇市场上升水，并且升贴水率等于两国间的利率差。","汇率对经济的影响:汇率是重要的价格指标，影响经济主体的行为，影响本国〈及贸易伙伴 ) 的国际竞争力水平，影响进出口、资本流出入和国际收支状况，影响一国的产出和就业，进而对整体的宏观经济状况都产生重要影响。@ 本币贬值，意味着可以提高本国商品的国际竞争力，能起到促进出口、抑制进口的作用;，知本币升值，则有利于进口，不利于出口。@ 真实汇率体现了物价变动对汇率的影响。反过来，汇率也会影响一国的物价水平。汇率的变动导致物价总水平的波动，其后果就不仅限于进出口，而是将影响整体经济。轩由于长期资本的流动主要以利润和风险为转移，汇率的变动对长期资本流动的影响较小。短期资本流动则常常受到汇率的较大影响。四汇率变动对金融资产的选择有重要影响。由于汇率的变动影响本外币资产的收益率，因此本币汇率升值，将促使投资者更加倾向于持有本币资产，相反，外币汇率的升值，则会导致投资者将本币资产转换为外币资产。","结合汇率制度和人民币国际化谈谈对我国经济的影响; 我国实行有管理的浮动汇率制，近年来汇率变化的原因主要可以归纳为以下方面: a.我国国民经济的飞速发展，国际地位的逐步提高。在经济的快速增长情况下,我国的经济实力和竞争力发生了巨大的变化，汇率作为经济发展的反映，必将根据中国经济在国际上地位，以及国内经济自身发展周期作出适当调整。b.对外贸易高速增长，热钱流入，使得人民币需求增加，也会给人民币升值增加压力。同时，汇率与国际收支有着密切的联系，国际收支理论表明，当一国有较大的国际收支道差时，对外汇的需求大于外汇的供给，本币对外贬值，反之则会造成本币升值，我国的巨额贸易顺差作用于人民币汇率，使之遵循国际收支理论产生上升趋势现象。.我国持有的巨额外汇储备。根据“国际收支决定论”认为，一国的国际收支状况是影响汇率最直接的因素之一。当一国有较大的国际收支逆差时，对外汇的需求大于外汇的供给，本币贬值，反之则会造成本币升值。而我国目前经常项目和资本项目双顺差的状况，使国内的外汇储备节节上升，因此人民币面临着潜在的升值压力。近年来，随着人民币进程的加快，人民币在国际上的地位越来越重要，人们对人民币的需求也进一步增加，使得人民币近年来一直呈现上升趋势。人民币升值的汇率变化和人民币国际化进程的加快对于我国经济的影响主要有以下几个方面。@ 本币汇率升值的积极影响包括; a.改善产业结构。人民币升值会导致劳动力和资源成本增加，从而使得中国原本依靠廉价劳动力和资源获取利润的低端产业规模减小，使得这些资源从低端产业中流出，流向高端产业。在市场竞争机制下，高端产业
