的货币政策会推高股票价格，导致企业的Q上升，企业家会增加投资从而推动总需求和产量增长。\n\n（3）从具体影响来看。第一，对央行的影响。SFISF等工具是央行在支持资本市场发展方面的新探索。过去央行单纯倚赖银行间市场进行货币投放，且如MLF、再贷款工具对全市场流动性影响的传导相对较为间接。目前针对直接融资市场的股债流动性投放和回收工具，央行的交易对手从过去的商业银行扩展到证券、基金等各类金融机构，增强了对市场特别是流动性投放的话语权。第二，对资本市场的影响。在当前复杂多变的经济环境下，资本市场的稳定对于经济的健康发展至关重要。通过SFISF，证券、基金、保险公司等金融机构可以将其持有的债券、股票、股票ETF等低流动性资产换为国债、央行票据等高流动性资产，并可在1年的互换期内在债券市场通过国债、央行票据卖断或回购交易获取流动性资金用于股票、股票ETF的投资和做市，有利于活跃市场，提高股票资产的流动性，促进市场回暖，进而维护资本市场稳定运行。第三，对金融机构的影响。目前许多证券、基金、保险公司手中持有大量的资产，但在当前市场环境下，这些资产的流动性较差。SFISF 的推出，使得这些机构可以将手中的低流动性资产抵押给央行，换取高等级流动性资产，从而提升其资金获取能力和股票增持能力，有助于增强这些机构在资本市场的投资能力，从而引导更多资金流向实体经济，推动经济高质量发展。武玄宇老师热点26：支持资本市场的货币政策工具创新另：武老师12月17日在学员内部QQ群里专门提示了货币政策对资产价格的影响，并做了单独分析","points":["结合货币政策对资产价格的影响和货币政策传导机制，分析新型货币政策工具的影响。 近年来央行不断创新货币政策工具体系，比如今年7月央行开展国债借入操作，国债买卖逐步被纳入货币政策工具箱，维护债券市场平稳运行。整体而言，目前对于外汇、债券市场的管理工具已经逐步完善，但相对缺乏对股票市场的管理工具，SFISF、股票回购增持专项再贷款的推出，弥补了这一方面的空白。影响分析如下： （1）货币政策的调整会影响资产价格。首先，当增加货币供应量时，一方面市场资金增多，另一方面通货膨胀也使人们为了保值而购买资产，从而推动资产价格上扬。其次，利率的调整通过决定投资的机会成本和影响上市公司的业绩来影响资产价格。最后，中央银行在公开市场上买进证券时，对资产的有效需求增加，促进价格上涨。 （2）从货币政策传导机制角度来看。货币政策的传导机制通常包括利率传导机制、托宾Q传导机制、财富效应传导机制、汇率传导机制、信贷传导机制等。过去，我国央行比较重视利率、汇率、信贷等机制传导，对资产价格在传导中的作用重视程度不足，中国经济由过去的投资驱动向消费驱动转型，SFISF、股票回购增持专项再贷款的推出，进一步完善了货币政策传导机制，资产价格的上涨，居民消费旺盛，企业盈利能力改善，从而带动实体经济。","根据财富效应传导机制，经济学家莫迪利亚尼的消费生命周期假说认为，家庭会均衡地分配一生的消费，当前消费主要取决于家庭一生的财富数量，而不是当前的收入。在家庭的财富中，金融财富是重要的组成部分，股票价格变化会影响家庭持有的金融资产的价值，从而影响消 费 支 出 。 传 导 渠 道 如 下 ： M↑→Ps↑→ 财 富 ↑→C↑→AD ↑→Y↑ ， 即 在 扩 张 性 的 货 币 政 策下，股票价格上升，从而家庭的财富增值，进而提振消费，推动总需求和产出上升。","根据托宾Q传导机制，Q为企业的市场价值与资本的重置成本之比。当Q>1时，企业家增加 1单位资金的投资形成的新资本，在证券市场上可以Q的价格出售，获得正收益，企业家就有激励扩大投资。因此，Q与投资之间存在正向的联系。基于这一原理，货币政策通过改变资产价格，可以通过影响 Q来实现总需求管理，传导渠道如下：M↑→P↑→Q↑→I↑→AD↑→Y↑，即扩张性的货币政策会推高股票价格，导致企业的Q上升，企业家会增加投资从而推动总需求和产量增长。 （3）从具体影响来看。第一，对央行的影响。SFISF等工具是央行在支持资本市场发展方面的新探索。过去央行单纯倚赖银行间市场进行货币投放，且如MLF、再贷款工具对全市场流动性影响的传导相对较为间接。目前针对直接融资市场的股债流动性投放和回收工具，央行的交易对手从过去的商业银行扩展到证券、基金等各类金融机构，增强了对市场特别是流动性投放的话语权。第二，对资本市场的影响。在当前复杂多变的经济环境下，资本市场的稳定对于经济的健康发展至关重要。通过SFISF，证券、基金、保险公司等金融机构可以将其持有的债券、股票、股票ETF等低流动性资产换为国债、央行票据等高流动性资产，并可在1年的互换期内在债券市场通过国债、央行票据卖断或回购交易获取流动性资金用于股票、股票ETF的投资和做市，有利于活跃市场，提高股票资产的流动性，促进市场回暖，进而维护资本市场稳定运行。第三，对金融机构的影响。目前许多证券、基金、保险公司手中持有大量的资产，但在当前市场环境下，这些资产的流动性较差。SFISF 的推出，使得这些机构可以将手中的低流动性资产抵押给央行，换取高等级流动性资产，从而提升其资金获取能力和股票增持能力，有助于增强这些机构在资本市场的投资能力，从而引导更多资金流向实体经济，推动经济高质量发展。武玄宇老师热点26：支持资本市场的货币政策工具创新另：武老师12月17日在学员内部QQ群里专门提示了货币政策对资产价格的影响，并做了单独分析"]}]},{"year":2026,"included":35,"excluded":0,"questions":[{"no":1,"type":"single","stem":"使用货币结清债权债务关系，这体现了货币的什么职能","options":["交换媒介","计价职能","支付手段","资产职能"],"answer":"C","expl":"货币的支付手段职能是指货币作为价值单方面转移用于清偿债务、支付赋税、租金、工资等，结清债权债务属于典型的支付手段场景。A 选项交换媒介是指货币在商品交换中充当媒介，是一手交钱一手交货的即时交易；B 选项计价职能是指货币作为衡量商品价值的尺度；D 选项资产职能是指货币作为财富贮藏的手段。","score":1},{"no":2,"type":"single","stem":"特里芬难题所描述的是哪一种国际货币制度的内在缺陷","options":["国际金本位制","布雷顿森林体系","牙买加体系","联系汇率制"],"answer":"B","expl":"特里芬难题是布雷顿森林体系的内在缺陷，该体系下美元与黄金挂钩，其他货币与美元挂钩，导致美元既要保持币值稳定（信心），又要满足全球清偿力需求（供给），二者不可兼得。A 选项国际金本位制下黄金是核心储备，不存在该矛盾；C 选项牙买加体系实行多元化储备，规避了特里芬难题；D 选项联系汇率制是香港的汇率制度，与该难题无关。","score":1},{"no":3,"type":"single","stem":"一价定律是以下哪个理论的逻辑出发点和重要前提假设","options":["购买力平价理论","利率平价理论","汇兑心理说","国际借贷说"],"answer":"A","expl":"购买力平价理论的核心前提是一价定律，即相同商品在不同国家的价格经汇率调整后应一致，以此推导汇率由两国物价水平决定。B 选项利率平价理论研究的是利率与远期汇率的关系；C 选项汇兑心理说强调主观预期对汇率的影响；D 选项国际借贷说认为国际收支是汇率决定的核心。","score":1},{"no":4,"type":"single","stem":"以下不属于政府信用形式的是","options":["国库券","市政债券","中央银行票据","政府担保债券"],"answer":"C","expl":"政府信用形式包括国库券（财政部发行）、市政债券（地方政府发行）、政府担保债券（政府担保的企业债）等，而中央银行票据是央行发行的负债，属于央行信用，并非政府信用。","score":1},{"no":5,"type":"single","stem":"收益率曲线向下倾斜，一般说明什么情况","options":["短期利率处于高位","短期利率处于低位","市场利率正在不断下降","以上都不对"],"answer":"A","expl":"收益率曲线向下倾斜意味着长期利率低于短期利率，通常反映市场预期未来短期利率将下降，或当前短期利率处于高位。B 选项短期利率低位时收益率曲线多向上倾斜；C 选项 “市场利率不断下降” 是预期结果，并非当前状态；D 选项不符合实际情况。","score":1},{"no":6,"type":"single","stem":"假设有一种每年年末付息10元的永续债券，年初市场价格为250元，此时该债券的到期收益率是多少","options":["3.85%","4%","4.16%","6.2%"],"answer":"B","expl":"永续债券的到期收益率等于年票息除以市场价格，即 <span class=\"formula\">y=<span class=\"frac\"><span class=\"fnum\">C<\/span><span class=\"fden\">P<\/span><\/span><\/span>。代入数据得 <span class=\"formula\">y=<span class=\"frac\"><span class=\"fnum\">10<\/span><span class=\"fden\">250<\/span><\/span>=4%<\/span>。","score":1},{"no":7,"type":"single","stem":"俗话说“不要把鸡蛋放在同一个篮子里”，指的是规避下列哪类风险","options":["宏观政策风险","利率风险","系统风险","非系统风险"],"answer":"D","expl":"“不要把鸡蛋放在同一个篮子里” 是分散投资策略，核心是规避非系统风险（可通过分散投资消除的风险）。A、B 选项宏观政策风险、利率风险属于系统风险，无法通过分散投资消除；C 选项系统风险是整个市场面临的风险，不可分散。","score":1},{"no":8,"type":"single","stem":"技术分析在以下哪一类市场能够帮助投资者获得超额收益","options":["弱有效市场","半强式市场","强式市场","以上都不对"],"answer":"D","expl":"根据有效市场假说，弱有效市场价格已反映历史交易信息，技术分析（依赖历史信息）无法获得超额收益；半强式市场和强式市场中，技术分析和基本面分析均无效。因此，技术分析能获得超额收益的市场是弱有效以下的无效市场，选项中无此答案，故选 “以上都不对”。","score":1},{"no":9,"type":"single","stem":"欧洲货币市场的特点不包括下面哪一项","options":["位于欧洲","超越国界","充分竞争","不受任何国家管制"],"answer":"A","expl":"欧洲货币市场是指在货币发行国境外经营该货币的市场，如亚洲美元市场，并非必须位于欧洲。其核心特点包括超越国界、充分竞争、不受货币发行国管制等，因此 A 选项错误。","score":1},{"no":10,"type":"single","stem":"以下关于股票流通市场的说法不正确的是","options":["流通市场又称为二级市场","场内交易又称为柜台交易","流通市场参与人包括投资者和中介人","场内交易和场外交易都有证券商参与"],"answer":"B","expl":"场内交易是指在证券交易所进行的交易，柜台交易（OTC）属于场外交易，二者并非同一概念。A 选项流通市场即二级市场，正确；C 选项流通市场参与人包括投资者和中介机构，正确；D 选项场内和场外交易均有证券商参与，正确。","score":1},{"no":11,"type":"single","stem":"一家以苹果为原材料来生产果汁的企业，在苹果期货市场上大量做空，这一行为属于","options":["投机","规避管制","套期保值","既是投机又是套期保值"],"answer":"C","expl":"果汁企业做空苹果期货，是为了锁定未来采购苹果的成本，规避价格上涨风险，属于套期保值行为。A 选项投机是无现货头寸下的获利行为；B 选项规避管制与题干无关；D 选项该行为有明确的现货对冲需求，并非投机。","score":1},{"no":12,"type":"single","stem":"以下哪一家银行的主要资金来源与其他三家不一样","options":["中国建设银行","中国银行","中国农业发展银行","中国工商银行"],"answer":"C","expl":"中国农业发展银行是政策性银行，资金来源主要为财政拨款和发行金融债券；而中国建设银行、中国银行、中国工商银行是商业银行，核心资金来源为吸收公众存款，因此 C 选项与其他三家不同。","score":1},{"no":13,"type":"single","stem":"下面不属于商业银行资产业务的是","options":["准备金存款","购买国债","票据贴现","发行定期存单"],"answer":"D","expl":"商业银行资产业务包括现金资产（准备金存款）、证券投资（购买国债）、贷款业务（票据贴现）等；发行定期存单属于负债业务（吸收存款），因此 D 选项不属于资产业务。","score":1},{"no":14,"type":"single","stem":"信托公司的经营特点不包括以下哪项","options":["服务特征明显","与资本市场关系非常密切","为特定范围的对象提供服务","在经营中不需要提取准备金"],"answer":"D","expl":"信托公司经营中需要提取风险准备金，以应对潜在风险。其特点包括服务特征明显（受人之托、代人理财）、与资本市场关系密切、服务特定合格投资者等，因此 D 选项错误。","score":1},{"no":15,"type":"single","stem":"以下哪家机构的性质与其他三家不一样","options":["中国银行","日本银行","英格兰银行","美联储"],"answer":"A","expl":"中国银行是商业银行，而日本银行、英格兰银行、美联储均为中央银行，负责制定和执行货币政策、维护金融稳定，因此 A 选项性质与其他三家不同。","score":1},{"no":16,"type":"single","stem":"以下货币需求理论中将利率引入货币需求函数的是","options":["马克思的货币需求理论","凯恩斯的货币需求理论","交易方程式","剑桥方程式"],"answer":"B","expl":"凯恩斯的货币需求理论将货币需求分为交易动机、预防动机和投机动机，其中投机动机与利率直接相关，首次将利率引入货币需求函数。A、C、D 选项的理论均未明确引入利率变量。","score":1},{"no":17,"type":"single","stem":"“源与流”的双层货币供给机制中的“源”指的是","options":["存款货币","基础货币","广义货币","狭义货币"],"answer":"B","expl":"“源与流” 双层货币供给机制中，“源” 指基础货币（由央行发行），“流” 指存款货币（由商业银行通过信用创造派生），因此 B 选项正确。","score":1},{"no":18,"type":"single","stem":"在某经济体系中，货币供应量包括流通中的现金(M0)和总存款(D)。假设在某时点，M0为300亿，基础货币(B)为1000亿，法定准备金率为5%，商业银行的超额准备金率为2%，则货币乘数是","options":["10","10.3","14","14.3"],"answer":"B","expl":"货币乘数公式为 <span class=\"formula\">m=<span class=\"frac\"><span class=\"fnum\">C+D<\/span><span class=\"fden\">C+R<\/span><\/span><\/span>，其中 C=300 亿，基础货币 B=1000 亿，故准备金 R=B-C=700 亿。总准备金率 <span class=\"formula\">=5%+2%=7%<\/span>，存款 <span class=\"formula\">D=<span class=\"frac\"><span class=\"fnum\">R<\/span><span class=\"fden\">7%<\/span><\/span>=10000<\/span> 亿。代入得 <span class=\"formula\">m=<span class=\"frac\"><span class=\"fnum\">300+10000<\/span><span class=\"fden\">300+700<\/span><\/span>=10.3<\/span>。","score":1},{"no":19,"type":"single","stem":"以下指数不能用来度量通货膨胀的是","options":["CPI指数","WPI指数","PMI指数","PPI指数"],"answer":"C","expl":"PMI（采购经理人指数）是反映经济景气程度的指标，并非度量通货膨胀的指数；CPI、WPI、PPI 均为常用的通胀度量指标，因此 C 选项正确。","score":1},{"no":20,"type":"single","stem":"关于宏观审慎监管，以下说法错误的是","options":["根本目的是防范系统性风险","既有时间维度也有空间维度","在时间维度上采取顺周期的实施方式","在空间维度上限制金融体系内部之间的传染风险"],"answer":"C","expl":"宏观审慎监管在时间维度上采取逆周期实施方式，以平滑金融周期波动，而非顺周期。A、B、D 选项均为宏观审慎监管的正确表述。","score":1},{"no":21,"type":"single","stem":"以下哪项不是独资企业的特点","options":["设立成本低","经营方式灵活","不需要支付公司所得税","投资者承担有限责任"],"answer":"D","expl":"独资企业的投资者承担无限责任，而非有限责任。其特点包括设立成本低、经营方式灵活、无需缴纳公司所得税（缴纳个人所得税）等，因此 D 选项错误。","score":1},{"no":22,"type":"single","stem":"某企业决定进行设备更新，旧设备当前账面价值为1200万元，市场价值为1000万元，假定所得税税率为30%，则与处置旧设备相关的现金流量为( )万元","options":["1200","1000","1060","940"],"answer":"C","expl":"处置旧设备的现金流量 = 市场价值 + （账面价值 - 市场价值）× 所得税税率 = 1000+(1200−1000)×30%=1060 万元，其中亏损抵税增加了现金流入。","score":1},{"no":23,"type":"single","stem":"在进行资本预算时，项目的期末现金流量不包括","options":["回收的净营运资本","资产处置所得","资产处置相关税收","贷款本金偿还"],"answer":"D","expl":"项目期末现金流量包括回收的净营运资本、资产处置所得及相关税收等，贷款本金偿还属于融资活动现金流量，并非项目自身的期末现金流量，因此 D 选项正确。","score":1},{"no":24,"type":"single","stem":"公司2024年初总资产为1000万元，年初净资产为500万元，当年实现净利润50万元，当年分红20万元，假设公司财务政策保持稳定，则公司的内部增长率为","options":["3%","3.1%","6%","6.38%"],"answer":"B","expl":"内部增长率公式为 <span class=\"formula\">g=<span class=\"frac\"><span class=\"fnum\">ROA× b<\/span><span class=\"fden\">1-ROA× b<\/span><\/span><\/span>，其中留存收益率 <span class=\"formula\">b=<span class=\"frac\"><span class=\"fnum\">50-20<\/span><span class=\"fden\">50<\/span><\/span>=60%<\/span>。代入得 <span class=\"formula\">g=<span class=\"frac\"><span class=\"fnum\">5%×60%<\/span><span class=\"fden\">1-5%×60%<\/span><\/span>≈3.1%<\/span>。","score":1},{"no":25,"type":"single","stem":"公司股票的贝塔为0.5，如果市场组合的期望收益率为12%，无风险利率为5%，如果CAPM成立，则公司股票的期望收益率为","options":["7.5%","8%","8.5%","9%"],"answer":"C","expl":"根据 CAPM 模型，<span class=\"formula\">E(R<sub>i<\/sub>)=R<sub>f<\/sub>+β<sub>i<\/sub>(E(R<sub>m<\/sub>)-R<sub>f<\/sub>)=5%+0.5×(12%-5%)=8.5%<\/span>。","score":1},{"no":26,"type":"single","stem":"一位20岁的年轻人往养老账户中存入1000元钱，该账户的年回报率为8%，到65岁时连本带利取出，按单利计息，这笔投资终值是","options":["2600元","3600元","4600元","5600元"],"answer":"C","expl":"单利终值公式为 <span class=\"formula\">FV=PV×(1+r× n)<\/span>，其中 n=65-20=45 年，代入得 <span class=\"formula\">FV=1000×(1+8%×45)=4600<\/span> 元。","score":1},{"no":27,"type":"single","stem":"某企业某年的财务杠杆系数是1.5，息税前利润的计划增长率是6%，其他因素不变，则该年普通股每股收益的增长率为","options":["6%","7%","8%","9%"],"answer":"D","expl":"财务杠杆系数 ，因此每股收益增长率 = 1.5×6%=9%。","score":1},{"no":28,"type":"single","stem":"在信息不对称和逆向选择的情况下，根据优序融资理论，企业选择融资方式的先后顺序是","options":["普通股，优先股，公司债券","普通股，公司债券，优先股","公司债券，优先股，普通股","优先股，公司债券，普通股"],"answer":"C","expl":"优序融资理论认为，企业融资应优先选择内部融资，其次是债务融资（公司债券），再次是优先股融资，最后是普通股融资，以降低信息不对称带来的成本，因此顺序为公司债券、优先股、普通股。","score":1},{"no":29,"type":"single","stem":"公司今年每股现金分红为2元，假设市场上股票投资者的现金红利税率为20%，资本利得税率为10%，如果股权登记日当天的股票价格为每股12元，那么股票在除息日当天的参考除息价应该是","options":["9.75元","10.22元","10.40元","12元"],"answer":"B","expl":"红利税与资本利得税不相等时，除息价不能简单用“登记日股价减现金股利”计算，而应按税后等价关系确定。投资者持有至除息日取得股利，税后所得为 D(1-T<sub>d<\/sub>)；若改在除息前卖出，价差收益按资本利得课税，故价格下跌幅度 <span class=\"formula\">Δ P<\/span> 须满足 <span class=\"formula\">Δ P(1-T<sub>g<\/sub>)=D(1-T<sub>d<\/sub>)<\/span>，即 <span class=\"formula\">P<sub>ex<\/sub>=P<sub>cum<\/sub>-D·<span class=\"frac\"><span class=\"fnum\">1-T<sub>d<\/sub><\/span><span class=\"fden\">1-T<sub>g<\/sub><\/span><\/span><\/span>。代入 P_{cum}=12、D=2、<span class=\"formula\">T<sub>d<\/sub>=20%<\/span>、<span class=\"formula\">T<sub>g<\/sub>=10%<\/span>，得 <span class=\"formula\">P<sub>ex<\/sub>=12-2×<span class=\"frac\"><span class=\"fnum\">1-20%<\/span><span class=\"fden\">1-10%<\/span><\/span>=12-2×<span class=\"frac\"><span class=\"fnum\">0.8<\/span><span class=\"fden\">0.9<\/span><\/span>=12-1.7778≈10.22<\/span> 元，故选 B。**易错点：**若忽略资本利得税，直接用 <span class=\"formula\">12-2×(1-20%)=10.40<\/span> 元，会误选 C——股利的税后价值须换算成税前价格口径才能与股价相减，分母的 (1-T<sub>g<\/sub>) 不能省略。","score":1},{"no":30,"type":"single","stem":"在如下公司股利分配政策中，现金分红最不稳定的是","options":["固定股利政策","固定股利支付率政策","低正常股利加额外股利政策","剩余股利政策"],"answer":"D","expl":"剩余股利政策下，现金分红取决于投资需求和利润留存，分红最不稳定；固定股利政策分红最稳定，固定股利支付率政策随利润波动，低正常股利加额外股利政策有稳定的基础分红。","score":1},{"no":31,"type":"multi","stem":"中央银行可以在以下哪些市场进行公开市场操作","options":["同业拆借市场","回购协议市场","国库券市场","中央银行票据市场","股票流通市场"],"answer":"BCD","expl":"中央银行公开市场操作主要在债券类市场进行，包括回购协议市场（正 / 逆回购）、国库券市场（买卖国债）、中央银行票据市场（发行 / 买卖央行票据）。A 选项同业拆借市场是金融机构之间的资金拆借，央行不直接参与；E 选项股票流通市场并非央行常规公开市场操作场所。","score":2},{"no":32,"type":"multi","stem":"关于资本资产定价模型(CAPM)，以下正确的包括","options":["CAPM模型认为，资产的预期收益率由无风险利率和风险溢价组成","CAPM模型可以被认为是一种广义的套利定价理论","CAPM模型中的β系数反映资产的非系统性风险大小","CAPM模型中的证券风险溢价与股票市场价格有关","CAPM模型的前提假设包括理性的投资者与完全有效的资本市场"],"answer":"AE","expl":"A 选项 CAPM 模型中，资产预期收益率 = 无风险利率 + 风险溢价，正确；B 选项 CAPM 是单因素模型，套利定价理论（APT）是多因素模型，二者并非包含关系，错误；C 选项 β 系数反映系统性风险，而非非系统性风险，错误；D 选项证券风险溢价 = β×(市场组合溢价)，与股票价格无关，错误；E 选项 CAPM 前提假设包括理性投资者、完全有效市场等，正确。","score":2},{"no":33,"type":"multi","stem":"可作为货币政策操作指标的金融变量包括","options":["准备金","基础货币","货币供应量","汇率","社会融资规模"],"answer":"AB","expl":"货币政策操作指标需具备可控性、可测性和相关性，准备金和基础货币符合要求；货币供应量、汇率、社会融资规模属于中介指标或监测指标，因此 AB 选项正确。","score":2},{"no":34,"type":"multi","stem":"在公司治理中，根据冲突关系，代理矛盾主要表现在哪些方面","options":["股东与经理人之间的代理问题","经理人与员工之间的代理问题","股东与债权人之间的代理问题","不同类型的债权人之间的代理问题","不同类型的股东之间的代理问题"],"answer":"ACE","expl":"公司治理中的代理矛盾主要包括：股东与经理人之间的委托 - 代理问题、股东与债权人之间的利益冲突、大股东与小股东之间的代理问题。B 选项经理人与员工之间并非核心代理关系；D 选项不同类型债权人之间的矛盾并非公司治理的主要代理矛盾。","score":2},{"no":35,"type":"multi","stem":"优先股筹资优点包括","options":["优先股融资成本低于普通债券","优先股也属于公司的负债，具有放大财务杠杆的能力","优先股没有固定到期日，不用偿还本金","优先股股东不参与公司经营决策，避免股权稀释","优先股的优先次序次于普通股，能够对股东提供保障"],"answer":"CD","expl":"C 选项优先股无固定到期日，无需偿还本金，减轻了企业偿债压力；D 选项优先股股东不参与经营决策，避免了股权稀释。A 选项优先股融资成本高于普通债券（股息税后支付，债券利息税前扣除）；B 选项优先股属于权益工具，并非负债，不放大财务杠杆；E 选项优先股优先次序高于普通股，因此 CD 选项正确。","score":2}],"sub":[{"no":36,"type":"calc","stem":"公司目前发行在外有1亿股普通股，当前股价为每股12元。公司准备采用配股方式筹集25000万元的资金，制定的配股方案为四配一，即每持有四股原有股票，可以参与一股新股的配售，配股价格为每股10元。假设市场有效，也不存在税收。\n(1)配股之后的股票价格\n(2)原先的1股股票中包含的配股权价值","score":10,"body":"（1）配股数量 = 1亿 × 1/4 = 2500万股\n\n配股后总市值 = 1亿 × 12 + 2500万 × 10 = 14.5亿元\n\n配股后股价 = 14.5亿 ÷ 1.25亿 = 11.6元\n\n（2）配股权价值 = 11.6 - 10 = 1.6元/每股配股权\n\n（或每股原股票含有的配股权价值 = 12 - 11.6 = 0.4元）","points":["配股数量 = 1亿 × 1/4 = 2500万股 配股后总市值 = 1亿 × 12 + 2500万 × 10 = 14.5亿元 配股后股价 = 14.5亿 ÷ 1.25亿 = 11.6元","配股权价值 = 11.6 - 10 = 1.6元/每股配股权 （或每股原股票含有的配股权价值 = 12 - 11.6 = 0.4元）"],"steps":[{"label":"配股数量","formula":"原股数 × 配股比例","value":2500,"unit":"万股"},{"label":"配股后总市值","formula":"原市值 + 配股募资","value":14.5,"unit":"亿元"},{"label":"配股后股价","formula":"配股后总市值 ÷ 配股后总股数","value":11.6,"unit":"元"},{"label":"配股权价值","formula":"配股后股价 − 配股价格","value":1.6,"unit":"元"}],"distractors":["P = DIV1 / (Rs − g)","VU = EBIT(1−T)/r₀","PV = C / r（永续年金）"],"note":"配股：先算配股数与配股后总市值，再摊薄股价，最后拆配股权价值。"},{"no":37,"type":"calc","stem":"公司的债务为永续债，每年的债务利息为200000元，债务的税前成本为8%，股权成本为12%。公司每年息税前收益(EBIT)为1200000元，公司所得税税率为40%。公司税后利润全部作为股利分配。求公司的总价值。","score":10,"body":"债务价值 D = 年利息 ÷ 债务成本 = 200000 ÷ 0.08 = 250万元\n\n股权收益 = (1200000 - 200000) × (1 - 40%) = 60万元\n\n股权价值 E = 60万 ÷ 0.12 = 500万元\n\n公司总价值 V = D + E = 250 + 500 = 750万元","points":["债务价值 D = 年利息 ÷ 债务成本 = 200000 ÷ 0.08 = 250万元 股权收益 = (1200000 - 200000) × (1 - 40%) = 60万元 股权价值 E = 60万 ÷ 0.12 = 500万元 公司总价值 V = D + E = 250 + 500 = 750万元"],"steps":[{"label":"债务价值 D","formula":"年利息 ÷ 债务成本","value":250,"unit":"万元"},{"label":"股权收益","formula":"(EBIT − 利息) × (1 − T)","value":60,"unit":"万元"},{"label":"股权价值 E","formula":"股权收益 ÷ 股权成本","value":500,"unit":"万元"},{"label":"公司总价值 V","formula":"D + E","value":750,"unit":"万元"}],"distractors":["g = ROE × b","PI = (NPV + 初始投资) ÷ 初始投资","DFL = EBIT/(EBIT − I)"],"note":"永续债 + 永续股利：分别用永续年金公式折现，再相加。"},{"no":38,"type":"calc","stem":"某企业现有A、B、C、D四个投资项目备选，有关资料如下：\n| 项目 | 初始投资（万元） | 净现值（万元） |\n| --- | --- | --- |\n| A | 1500 | 450 |\n| B | 1000 | 350 |\n| C | 500 | 140 |\n| D | 500 | 225 |\n(1) 计算各投资项目的现值指数\n(2) 若该公司的投资总额为 2500 万元，那么该公司最优的投资组合是什么？","score":10,"body":"（1）现值指数 PI = (初始投资 + NPV) ÷ 初始投资\n\nA：1950/1500 = 1.30 B：1350/1000 = 1.35\n\nC：640/500 = 1.28 D：725/500 = 1.45\n\n（2）按PI排序：D＞B＞A＞C\n\n限额2500万最优组合：D + B + A（500 + 1000 + 1000）\n\n总投资2500万，总净现值最大。","points":["现值指数 PI = (初始投资 + NPV) ÷ 初始投资 A：1950/1500 = 1.30 B：1350/1000 = 1.35 C：640/500 = 1.28 D：725/500 = 1.45","按PI排序：D＞B＞A＞C 限额2500万最优组合：D + B + A（500 + 1000 + 10；总投资2500万，总净现值最大。"],"steps":[{"label":"A 的现值指数","formula":"(初始投资 + 净现值) ÷ 初始投资","value":1.3,"unit":""},{"label":"B 的现值指数","formula":"(初始投资 + 净现值) ÷ 初始投资","value":1.35,"unit":""},{"label":"C 的现值指数","formula":"(初始投资 + 净现值) ÷ 初始投资","value":1.28,"unit":""},{"label":"D 的现值指数","formula":"(初始投资 + 净现值) ÷ 初始投资","value":1.45,"unit":""}],"distractors":["g = ROE × b","PV = C / r（永续年金）","Rs = Rf + β(Rm − Rf)"],"note":"现值指数排序 + 资本限量下的组合选择（原答案组合与限额矛盾，仅批改现值指数）。"},{"no":39,"type":"term","stem":"有效边界","score":4,"body":"在风险资产组合中，满足“相同风险下期望收益最高、相同收益下风险最低”的所有组合构成的曲线，是理性投资者进行组合选择的有效区间。","points":["在风险资产组合中，满足“相同风险下期望收益最高、相同收益下风险最低”的所有组合构成的曲线","是理性投资者进行组合选择的有效区间"]},{"no":40,"type":"term","stem":"票据贴现","score":4,"body":"持票人将未到期的商业票据转让给银行，银行按票面金额扣除贴现利息后，将剩余资金支付给持票人的一种融资行为，也是银行的一项重要资产业务。","points":["持票人将未到期的商业票据转让给银行，银行按票面金额扣除贴现利息后","将剩余资金支付给持票人的一种融资行为，也是银行的一项重要资产业务"]},{"no":41,"type":"term","stem":"期权","score":4,"body":"一种标准化合约，赋予买方在约定日期或之前，以约定价格买入或卖出标的资产的权利而非义务，分为看涨期权和看跌期权。","points":["一种标准化合约，赋予买方在约定日期或之前，以约定价格买入或卖出标的资产的权利而非义务，分为看涨期权和看跌期权"]},{"no":42,"type":"term","stem":"可转换债券","score":4,"body":"由公司发行，在约定期限内可按约定条件转换为公司普通股的债券，兼具债权、股权和期权三重属性，融资成本通常低于普通债券。","points":["由公司发行，在约定期限内可按约定条件转换为公司普通股的债券","兼具债权、股权和期权三重属性，融资成本通常低于普通债券"]},{"no":43,"type":"term","stem":"内部收益率","score":4,"body":"使投资项目净现值为零的折现率，反映项目自身的内在回报率，是衡量项目盈利能力、判断项目可行性的核心指标之一。","points":["使投资项目净现值为零的折现率，反映项目自身的内在回报率","是衡量项目盈利能力、判断项目可行性的核心指标之一"]},{"no":44,"type":"short","stem":"请简述资本市场的主要功能","score":8,"body":"① 资金融通：连接资金盈余方与短缺方，提供直接融资渠道；\n② 价格发现：通过供求竞争形成合理的资产价格；\n③ 资源配置：引导资金流向效率高、前景好的行业与企业；\n④ 产权流转：支持企业并购重组、股权流转与公司治理；\n⑤ 风险分散：为投资者提供分散、转移风险的工具与市场。","points":["资金融通：连接资金盈余方与短缺方，提供直接融资渠道；","价格发现：通过供求竞争形成合理的资产价格；","资源配置：引导资金流向效率高、前景好的行业与企业；","产权流转：支持企业并购重组、股权流转与公司治理；","风险分散：为投资者提供分散、转移风险的工具与市场。"]},{"no":45,"type":"short","stem":"请简述三大一般性货币政策工具及其各优缺点","score":8,"body":"三大一般性货币政策工具及优缺点\n\n① 法定存款准备金率\n\n优点：作用直接、力度强、影响范围广；\n\n缺点：过于猛烈，不易微调，对不同银行冲击不均。\n\n② 再贴现率\n\n优点：具有告示效应，可调节商行资金成本；\n\n缺点：央行处于被动地位，调节弹性较弱。\n\n③ 公开市场操作\n\n优点：灵活、精准、可逆，央行主动可控；\n\n缺点：需要发达的金融市场作为基础。","points":["三大一般性货币政策工具及优缺点","法定存款准备金率 优点：作用直接、力度强、影响范围广； 缺点：过于猛烈，不易微调，对不同银行冲击不均。","再贴现率 优点：具有告示效应，可调节商行资金成本； 缺点：央行处于被动地位，调节弹性较弱。","公开市场操作 优点：灵活、精准、可逆，央行主动可控； 缺点：需要发达的金融市场作为基础。"]},{"no":46,"type":"short","stem":"请简述证券公司的主要业务","score":8,"body":"证券经纪业务、证券承销与保荐业务、证券自营业务、证券资产管理业务、证券投资咨询、财务顾问及另类投资等相关业务。","points":["证券经纪业务、证券承销与保荐业务、证券自营业务、证券资产管理业务、证券投资咨询、财务顾问及另类投资等相关业务"]},{"no":47,"type":"short","stem":"简述股利政策理论中税差理论的主要内容及其对公司股利分配政策的建议","score":8,"body":"核心：股利收益的税率通常高于资本利得税率，投资者更偏好资本利得。\n建议：公司应减少现金股利发放，提高利润留存比例，用于再投资以提升股价，增加股东资本利得。","points":["核心：股利收益的税率通常高于资本利得税率，投资者更偏好资本利得","建议：公司应减少现金股利发放，提高利润留存比例，用于再投资以提升股价，增加股东资本利得"]},{"no":48,"type":"essay","stem":"2025年2月，前日本银行行长黑田东彦在东京的一次会议中表示，根据其判断，日本已经结束了通货紧缩状态，央行结束超宽松政策并开始实施正常化政策是\"非常自然的事情\"。自1991年泡沫经济破灭以来，日本经历了\"失落的30年\"，长期通缩环境使其经济增长持续停滞，GDP年增长率不足1%，这也迫使日本银行成为非常规货币政策的先驱。\n请结合上述背景材料，从以下几个方面谈谈你的认识：通货紧缩的典型特征与负面影响、通缩的治理，以及相应的非常规货币政策。","score":14,"body":"（1）通缩典型特征：物价持续普遍下跌、货币流通速度放缓、有效需求不足、经济增长低迷、失业率上升、企业盈利恶化。\n（2）负面影响：企业投资意愿下降、居民消费推迟、实际债务负担加重、形成“通缩—衰退”恶性循环。\n（3）治理思路：实行扩张性货币政策+积极财政政策+结构性改革，扩大总需求、修复预期。\n（4）非常规货币政策：量化宽松（QE）、负利率政策、收益率曲线控制、前瞻指引、长期再融资操作等，用以压低利率、投放流动性、提振通胀预期。","points":["通缩典型特征：物价持续普遍下跌、货币流通速度放缓、有效需求不足、经济增长低迷、失业率上升、企业盈利恶化。","负面影响：企业投资意愿下降、居民消费推迟、实际债务负担加重、形成“通缩—衰退”恶性循环。","治理思路：实行扩张性货币政策+积极财政政策+结构性改革，扩大总需求、修复预期。","非常规货币政策：量化宽松（QE）、负利率政策、收益率曲线控制、前瞻指引、长期再融资操作等，用以压低利率、投放流动性、提振通胀预期。"]},{"no":49,"type":"essay","stem":"2025年10月中旬，美国几家区域性银行披露其信贷组合中出现大额坏账，并因贷款欺诈案件计提大额准备金。这些消息导致银行股价大幅下跌，引发了市场对商业银行过往经营现状的担忧。请结合上述背景材料，试论商业银行在业务经营中应遵循的主要原则及其面临的主要风险类型。","score":14,"body":"（1）经营三原则：安全性、流动性、盈利性，三者统筹平衡，安全是前提，流动是保障，盈利是目标。\n（2）主要风险类型：\n① 信用风险（信贷违约、坏账）；\n② 市场风险（利率、汇率、价格波动）；\n③ 操作风险（内部欺诈、流程失误）；\n④ 流动性风险（资金周转困难）；\n⑤ 声誉风险、合规风险等。\n银行需建立全面风险管理体系，强化内控、授信审查与资本缓冲，应对各类风险冲击。\n---\n> [!warning] 转换说明（1 处需人工确认）\n> 本文由 docx 经 pandoc 转换后清洗。题面与答案文字未作改写，仅补全公式与排版。\n>\n> 1. 第 38 题 (2) 的组合与限额矛盾。原文答案为“D + B + A（500 + 1000 + 1000）”，但 A 的初始投资为 1500 万元，三者合计 3000 万元，超出 2500 万元限额。保留原文，未作改动。\n> 2. 公式已全部补全。第 6、18、24、25、26 题按数学关系重建；第 29 题按税差模型补入完整推导（红利税 20% 高于资本利得税 10%，<span class=\"formula\">P<sub>ex<\/sub>=P<sub>cum<\/sub>-D<span class=\"frac\"><span class=\"fnum\">1-T<sub>d<\/sub><\/span><span class=\"fden\">1-T<sub>g<\/sub><\/span><\/span><\/span>，得 10.22 元，选 B）；第 36—38 题计算过程由伪公式块展开为可读文本。","points":["（1）经营三原则：安全性、流动性、盈利性，三者统筹平衡，安全是前提，流动是保障，盈利是目标。 （2）主要风险类型：；信用风险（信贷违约、坏账）；；市场风险（利率、汇率、价格波动）；；操作风险（内部欺诈、流程失误）；；流动性风险（资金周转困难）；","声誉风险、合规风险等。 银行需建立全面风险管理体系，强化内控、授信审查与资本缓冲，应对各类风险冲击。 --- > [!warning] 转换说明（1 处需人工确认） > 本文由 d 'use strict';
var BANK = JSON.parse(document.getElementById('bank').textContent);
var TYPE = {single:'单项选择', multi:'多项选择', tf:'判断', calc:'计算', term:'名词解释', short:'简答', essay:'论述'};
var ORDER = {single:0, multi:1, tf:2, calc:3, term:4, short:5, essay:6};
var KEYS = 'ABCDE';
var KEY = 'cufe431.quiz.v1';

var ALL = [];
BANK.years.forEach(function(y){
  y.questions.forEach(function(q){
    ALL.push(Object.assign({}, q, {year:y.year, uid:y.year + '-' + q.type + '-' + q.no, kind:'obj'}));
  });
  (y.sub || []).forEach(function(q){
    ALL.push(Object.assign({}, q, {year:y.year, uid:y.year + '-' + q.type + '-' + q.no, kind:'sub'}));
  });
});
ALL.sort(function(a,b){ return b.year - a.year || ORDER[a.type] - ORDER[b.type] || a.no - b.no; });

var S = load() || {answers:{}, year:'all', type:'all', wrong:false, idx:0};
if(!S.answers) S.answers = {};
if(S.year === undefined) S.year = 'all';
if(S.type === undefined) S.type = 'all';
if(typeof S.idx !== 'number') S.idx = 0;

var VIEW = [];
var pending = [];
var paper = document.getElementById('paper');

function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function fmt(s){
  var t = esc(s);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*/g, '');
  return t;
}
function correctKeys(q){
  if(q.type === 'tf') return [q.answer === '√' ? 'A' : 'B'];
  return (q.answer || '').split('');
}
function ansText(q){
  if(q.type === 'tf') return q.answer === '√' ? '正确' : '错误';
  return (q.answer || '').split('').join('、');
}
function queue(){
  return ALL.filter(function(q){
    if(S.year !== 'all' && q.year !== Number(S.year)) return false;
    if(S.type !== 'all' && q.type !== S.type) return false;
    if(S.wrong){ var r = S.answers[q.uid]; if(!r || r.ok) return false; if(q.kind === 'sub' && !r.graded) return false; }
    return true;
  });
}

/* ---------------- 筛选条 ---------------- */
function renderChips(){
  var yr = ['<span class="flabel">年份</span><button class="chip" data-y="all">全部</button>'];
  BANK.years.slice().sort(function(a,b){ return b.year - a.year; }).forEach(function(y){
    yr.push('<button class="chip" data-y="' + y.year + '">' + y.year + '</button>');
  });
  var yrow = document.getElementById('year-row');
  yrow.innerHTML = yr.join('');
  yrow.querySelectorAll('[data-y]').forEach(function(b){
    b.setAttribute('aria-pressed', String(S.year === (b.dataset.y === 'all' ? 'all' : Number(b.dataset.y))));
    b.onclick = function(){ S.year = b.dataset.y === 'all' ? 'all' : Number(b.dataset.y); S.idx = 0; pending = []; save(); applyFilter(); renderAll(); };
  });

  var tr = ['<span class="flabel">题型</span><button class="chip" data-t="all">全部</button>'];
  [['single','单选'],['multi','多选'],['tf','判断'],['calc','计算'],['term','名解'],['short','简答'],['essay','论述']].forEach(function(t){
    tr.push('<button class="chip" data-t="' + t[0] + '">' + t[1] + '</button>');
  });
  tr.push('<button class="chip wrong" id="wrongChip">只看错题</button>');
  var trow = document.getElementById('type-row');
  trow.innerHTML = tr.join('');
  trow.querySelectorAll('[data-t]').forEach(function(b){
    b.setAttribute('aria-pressed', String(S.type === b.dataset.t));
    b.onclick = function(){ S.type = b.dataset.t; S.idx = 0; pending = []; save(); applyFilter(); renderAll(); };
  });
  var wc = document.getElementById('wrongChip');
  wc.setAttribute('aria-pressed', String(!!S.wrong));
  wc.onclick = function(){ S.wrong = !S.wrong; S.idx = 0; pending = []; save(); applyFilter(); renderAll(); };
}

/* ---------------- 题目 ---------------- */
function renderPaper(){
  var q = VIEW[S.idx];
  if(!VIEW.length){
    paper.innerHTML = '<div class="empty"><b>这一组没有题目</b>'
      + '<p>' + (S.wrong ? '还没有做错的题。答错的题会自动收进这里。' : '换一个年份或题型试试。') + '</p>'
      + '<button class="btn" id="widen">看全部题目</button></div>';
    document.getElementById('widen').onclick = function(){ S.year='all'; S.type='all'; S.wrong=false; S.idx=0; save(); applyFilter(); renderAll(); };
    return;
  }
  if(!q){ renderSummary(); return; }
  if(q.kind === 'sub'){ renderSub(q); return; }

  var rec = S.answers[q.uid];
  var stamp, vclass, vtitle, vans = '';
  if(rec){
    stamp = rec.ok ? '正' : '误';
    vclass = rec.ok ? 'good' : 'bad';
    vtitle = rec.ok ? '回答正确' : '回答错误';
    vans = '正确答案 <b>' + esc(ansText(q)) + '</b>';
    if(q.type === 'multi' && !rec.ok) vans += '　你选了 ' + esc(rec.pick.split('').join('、'));
  }

  var opts = q.options.map(function(t, i){
    var k = KEYS[i], cls = 'opt', mark = '';
    if(rec){
      var isRight = correctKeys(q).indexOf(k) >= 0;
      var picked = (rec.pick || '').indexOf(k) >= 0;
      if(isRight){ cls += ' correct'; mark = '<span class="m">✓</span>'; }
      else if(picked){ cls += ' wrong'; mark = '<span class="m">✗</span>'; }
      else { cls += ' muted'; }
    } else if(pending.indexOf(k) >= 0){ cls += ' sel'; }
    return '<button class="' + cls + '" data-k="' + k + '"' + (rec ? ' disabled' : '') + '>'
      + '<span class="k">' + k + '</span><span class="t">' + fmt(t) + '</span>' + mark + '</button>';
  }).join('');

  var tools = '';
  if(!rec && q.type === 'multi'){
    tools = '<button class="btn solid" id="confirm"' + (pending.length ? '' : ' disabled') + '>确认答案</button>'
      + '<span class="hint">多选题，选好后确认</span>';
  } else if(rec){
    tools = '<button class="btn ghost" id="redo">重做本题</button>';
  }

  var verdict = '';
  if(rec){
    verdict = '<div class="verdict show" id="verdict">'
      + '<div class="stamp ' + vclass + '">' + stamp + '</div>'
      + '<div class="vbody">'
      + '<div class="vtitle ' + vclass + '">' + vtitle + '</div>'
      + '<div class="vans">' + vans + '</div>'
      + (q.expl ? '<div class="explain"><span class="lab">解析</span>' + fmt(q.expl) + '</div>' : '')
      + '</div></div>';
  }

  paper.innerHTML =
    '<div class="qmeta"><span class="num">第 ' + q.no + ' 题</span>'
    + '<span class="tag">' + TYPE[q.type] + '</span>'
    + '<span class="yr">' + q.year + ' 年</span></div>'
    + '<h1 class="stem">' + fmt(q.stem) + '</h1>'
    + '<div class="opts" role="group" aria-label="选项">' + opts + '</div>'
    + (tools ? '<div class="toolbar">' + tools + '</div>' : '')
    + verdict;

  paper.querySelectorAll('.opt').forEach(function(b){
    b.onclick = function(){ choose(b.dataset.k); };
  });
  var c = document.getElementById('confirm');
  if(c) c.onclick = function(){ commit(pending); };
  var r = document.getElementById('redo');
  if(r) r.onclick = function(){ delete S.answers[q.uid]; pending = []; save(); renderAll(); };

  typeset(paper);
}

function choose(k){
  var q = VIEW[S.idx];
  if(!q || S.answers[q.uid]) return;
  if(q.type === 'multi'){
    var i = pending.indexOf(k);
    if(i >= 0) pending.splice(i, 1); else pending.push(k);
    renderPaper();
  } else {
    commit([k]);
  }
}

function commit(picks){
  var q = VIEW[S.idx];
  if(!q || S.answers[q.uid] || !picks.length) return;
  var want = correctKeys(q).slice().sort().join('');
  var got = picks.slice().sort().join('');
  S.answers[q.uid] = {pick:got, ok:got === want, got:got === want ? q.score : 0};
  pending = [];
  save();
  renderAll();
  var v = document.getElementById('verdict');
  if(v && v.getBoundingClientRect().bottom > window.innerHeight) v.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function typeset(el){
  if(!window.MathJax || !MathJax.typesetPromise) return;
  if(!/\$[^$]/.test(el.textContent)) return;
  try { if(MathJax.typesetClear) MathJax.typesetClear([el]); } catch(e){}
  MathJax.typesetPromise([el]).catch(function(){});
}

/* ---------------- 汇总 ---------------- */
function renderSummary(){
  var done = VIEW.filter(function(q){ return answered(q); });
  var ok = done.filter(function(q){ return S.answers[q.uid].ok; });
  var score = done.reduce(function(a,q){ return a + gotOf(q); }, 0);
  var full = VIEW.reduce(function(a,q){ return a + q.score; }, 0);
  var acc = done.length ? Math.round(ok.length / done.length * 100) : 0;

  var byType = {};
  done.forEach(function(q){
    var t = byType[q.type] = byType[q.type] || {n:0, ok:0};
    t.n++; if(S.answers[q.uid].ok) t.ok++;
  });

  var rows = Object.keys(byType).map(function(t){
    return '<div><span>' + TYPE[t] + '</span><span>' + byType[t].ok + ' / ' + byType[t].n + ' 正确</span></div>';
  }).join('');

  paper.innerHTML =
    '<div class="summary">'
    + '<div class="qmeta"><span class="tag">本组小结</span><span class="yr">共 ' + VIEW.length + ' 题</span></div>'
    + '<h2>' + (done.length === VIEW.length ? '这一组做完了' : '暂时做到这里') + '</h2>'
    + '<div class="big"><b>' + score + '</b><span>分 / 满分 ' + full + ' 分</span></div>'
    + '<div class="sumrow">'
    + '<div><dt>已答</dt><dd>' + done.length + '</dd></div>'
    + '<div><dt>正确率</dt><dd>' + (done.length ? acc + '%' : '—') + '</dd></div>'
    + '<div><dt>错题</dt><dd>' + (done.length - ok.length) + '</dd></div>'
    + '</div>'
    + (rows ? '<div class="bytype">' + rows + '</div>' : '')
    + '<div class="toolbar" style="margin-top:24px">'
    + '<button class="btn" id="sumBack">回看题目</button>'
    + (done.length - ok.length ? '<button class="btn solid" id="sumWrong">只练这组错题</button>' : '')
    + '</div></div>';

  document.getElementById('sumBack').onclick = function(){ go(0); };
  var w = document.getElementById('sumWrong');
  if(w) w.onclick = function(){ S.wrong = true; S.idx = 0; save(); applyFilter(); renderAll(); };
}

/* ---------------- 答题卡 / 统计 ---------------- */
function renderSheet(){
  var h = '', last = null;
  VIEW.forEach(function(q, i){
    if(q.year !== last){
      h += '<div class="sheet-year">' + q.year + '</div>';
      last = q.year;
    }
    var r = S.answers[q.uid];
    var st = (r && (q.kind !== 'sub' || r.graded)) ? (r.ok ? ' ok' : ' bad') : '';
    var cls = 'cell' + st + (i === S.idx ? ' cur' : '');
    h += '<button class="' + cls + '" data-i="' + i + '" aria-label="第' + q.no + '题">' + q.no + '</button>';
  });
  var grid = document.getElementById('grid');
  grid.innerHTML = h;
  grid.querySelectorAll('[data-i]').forEach(function(b){
    b.onclick = function(){
      go(Number(b.dataset.i));
      if(window.innerWidth <= 1040) document.getElementById('sheet').classList.remove('open');
    };
  });
}

function renderStats(){
  var done = VIEW.filter(function(q){ return answered(q); });
  var ok = done.filter(function(q){ return S.answers[q.uid].ok; });
  var score = done.reduce(function(a,q){ return a + gotOf(q); }, 0);
  document.getElementById('stat-progress').textContent = done.length + '/' + VIEW.length;
  document.getElementById('stat-acc').textContent = done.length ? Math.round(ok.length / done.length * 100) + '%' : '—';
  document.getElementById('stat-score').textContent = score;
  document.getElementById('sheet-score').textContent = score;
  document.getElementById('sheet-sub').textContent = '本组共 ' + VIEW.length + ' 题 · 已答 ' + done.length;
  document.getElementById('prog').textContent = (S.idx < VIEW.length ? (S.idx + 1) + ' / ' + VIEW.length : '完成');
  document.getElementById('prev').disabled = S.idx <= 0;
  document.getElementById('next').disabled = S.idx >= VIEW.length;
}

function renderAbout(){
  var objN = ALL.filter(function(q){ return q.kind !== 'sub'; }).length;
  var subN = ALL.length - objN;
  var stepN = ALL.filter(function(q){ return q.steps && q.steps.length; }).length;
  var rows = BANK.years.slice().sort(function(a,b){ return b.year - a.year; }).map(function(y){
    var s = (y.sub || []).length;
    return '<tr><td>' + y.year + '</td><td>' + y.included + ' 题</td><td>' + (s ? s + ' 题' : '—') + '</td>'
      + '<td>' + (y.excluded ? '缺 ' + y.excluded : '') + '</td></tr>';
  }).join('');
  document.getElementById('about-body').innerHTML =
    '<p>题目与答案转录自库内笔记《中央财经大学 431 真题与答案》2011—2026 各年，共 ' + objN
    + ' 道客观题、' + subN + ' 道主观题。</p>'
    + '<p>主观题按要点覆盖自动批改，判得不准可以点逻辑链手动改。计算题里参考答案算式完整的 '
    + stepN + ' 道做成了公式拖选 + 数值填空，其余按要点批改。</p>'
    + '<p>2011—2022 各卷来自扫描件 OCR 转写，个别文字有识别误差，以原笔记末页的原卷图为准。</p>'
    + '<p>作答记录保存在本机浏览器里，换浏览器或清除数据会丢失。</p>'
    + '<table><tr><td>年份</td><td>客观题</td><td>主观题</td><td></td></tr>' + rows + '</table>';
}

/* ---------------- 主流程 ---------------- */
function applyFilter(){
  VIEW = queue();
  if(S.idx > VIEW.length) S.idx = VIEW.length;
  if(S.idx < 0) S.idx = 0;
}

function renderAll(){
  renderChips();
  renderPaper();
  renderSheet();
  renderStats();
  save();
}

function go(n){
  S.idx = Math.max(0, Math.min(VIEW.length, n));
  pending = [];
  save();
  renderAll();
  window.scrollTo(0, 0);
}

document.getElementById('prev').onclick = function(){ go(S.idx - 1); };
document.getElementById('next').onclick = function(){ go(S.idx + 1); };
document.getElementById('openSheet').onclick = function(){ document.getElementById('sheet').classList.toggle('open'); };
document.getElementById('closeSheet').onclick = function(){ document.getElementById('sheet').classList.remove('open'); };

document.getElementById('resetQueue').onclick = function(){
  if(!VIEW.length) return;
  if(!confirm('重做本组的 ' + VIEW.length + ' 题？已有的作答记录会清空。')) return;
  VIEW.forEach(function(q){ delete S.answers[q.uid]; });
  S.idx = 0; pending = []; save(); applyFilter(); renderAll(); window.scrollTo(0,0);
};

document.getElementById('clearWrong').onclick = function(){
  var n = ALL.filter(function(q){ return S.answers[q.uid] && !S.answers[q.uid].ok; }).length;
  if(!n) return alert('目前没有错题记录。');
  if(!confirm('清空全部 ' + n + ' 条错题记录？（会一并清掉这些题的作答痕迹）')) return;
  ALL.forEach(function(q){ var r = S.answers[q.uid]; if(r && !r.ok) delete S.answers[q.uid]; });
  save(); applyFilter(); renderAll();
};

document.addEventListener('keydown', function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var q = VIEW[S.idx];
  if(!q) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;

  if(e.key === 'ArrowRight'){ e.preventDefault(); go(S.idx + 1); return; }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); go(S.idx - 1); return; }
  if(q.kind === 'sub') return;
  if(e.key === 'Enter'){
    e.preventDefault();
    if(!S.answers[q.uid] && q.type === 'multi' && pending.length){ commit(pending); return; }
    if(S.answers[q.uid]){ go(S.idx + 1); }
    return;
  }
  var k = e.key.toUpperCase();
  var idx = KEYS.indexOf(k);
  if(idx < 0 && /^[1-5]$/.test(e.key)) idx = Number(e.key) - 1;
  if(idx >= 0 && idx < q.options.length && !S.answers[q.uid]){
    e.preventDefault();
    choose(KEYS[idx]);
  }
});

/* ================= 主观题（计算 / 名解 / 简答 / 论述） ================= */
var SUBTYPES = {calc:1, term:1, short:1, essay:1};

function isSub(q){ return !!(q && q.kind === 'sub'); }

function answered(q){
  var r = S.answers[q.uid];
  if(!r) return false;
  if(q.kind === 'sub') return !!r.graded;
  return true;
}

function gotOf(q){
  var r = S.answers[q.uid];
  if(!r) return 0;
  if(typeof r.got === 'number') return r.got;
  return r.ok ? q.score : 0;
}

function normalize(s){
  return String(s || '').toLowerCase()
    .replace(/[\s`*_>#|]/g, '')
    .replace(/[^一-龥a-z0-9%.]/g, '');
}
function normF(s){ return String(s || '').replace(/[\s（）()［］\[\],，。；;、:：=＝+\-−×÷*/.]/g, ''); }

function bigrams(s){
  var m = Object.create(null);
  for(var i = 0; i < s.length - 1; i++){
    var g = s.substr(i, 2);
    m[g] = (m[g] || 0) + 1;
  }
  return m;
}
function coverage(userNorm, pointNorm){
  var p = bigrams(pointNorm), u = bigrams(userNorm), total = 0, hit = 0;
  for(var k in p){ total += p[k]; hit += Math.min(p[k], u[k] || 0); }
  return total ? hit / total : 0;
}
function pointState(point, userNorm){
  var key = String(point).split(/[：:，,；;。（(]/)[0].replace(/\s/g, '').slice(0, 8);
  if(key.length >= 3 && userNorm.indexOf(normalize(key)) >= 0) return 2;
  var cov = coverage(userNorm, normalize(point));
  if(cov >= 0.38) return 2;
  if(cov >= 0.16) return 1;
  return 0;
}
function calcPointState(point, userNorm){
  var nums = (String(point).match(/-?\d+(?:\.\d+)?/g) || []).filter(function(n){
    return n.replace(/\D/g, '').length >= 2;
  });
  if(nums.length){
    var hit = nums.filter(function(n){ return userNorm.indexOf(n) >= 0; }).length;
    if(hit / nums.length >= 0.5) return 2;
    if(hit > 0) return 1;
  }
  return pointState(point, userNorm);
}

function numClose(user, exp){
  var v = parseFloat(String(user == null ? '' : user).replace(/[^\d.\-]/g, ''));
  if(!isFinite(v)) return false;
  var tol = Math.max(Math.abs(exp) * 0.005, 0.0005);
  return Math.abs(v - exp) <= tol;
}
function hashSeed(str){
  var h = 2166136261;
  for(var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h;
}
function seedShuffle(arr, seed){
  var a = arr.slice(), s = seed || 1;
  for(var i = a.length - 1; i > 0; i--){
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    var j = s % (i + 1), t = a[i];
    a[i] = a[j]; a[j] = t;
  }
  return a;
}
function trimNum(v){
  var n = Number(v);
  if(!isFinite(n)) return String(v);
  return String(Math.round(n * 1000) / 1000);
}

function ensureRec(q){
  var r = S.answers[q.uid];
  if(!r || r.kind !== 'sub'){
    r = S.answers[q.uid] = {kind:'sub', text:'', picks:{}, nums:{}, flags:[], points:[], graded:false, got:0, ok:false};
  }
  if(!r.picks) r.picks = {};
  if(!r.nums) r.nums = {};
  return r;
}

function gradeSub(q, rec){
  if(q.steps && q.steps.length){
    rec.flags = q.steps.map(function(s, i){
      var pick = rec.picks[i] || '';
      return {
        f: normF(pick) === normF(s.formula) ? 1 : 0,
        n: numClose(rec.nums[i], s.value) ? 1 : 0
      };
    });
  } else {
    var un = normalize(rec.text || '');
    var fn = q.type === 'calc' ? calcPointState : pointState;
    rec.points = (q.points || []).map(function(p){ return un ? fn(p, un) : 0; });
    rec.flags = [];
  }
  rec.graded = true;
  rec.got = computeGot(q, rec);
  rec.ok = rec.got >= q.score * 0.6;
  save();
  renderAll();
}

function computeGot(q, rec){
  var w, s = 0;
  if(q.steps && q.steps.length){
    w = q.score / q.steps.length;
    (rec.flags || []).forEach(function(f){ s += ((f.f ? 0.5 : 0) + (f.n ? 0.5 : 0)) * w; });
  } else {
    var n = (q.points && q.points.length) || 1;
    w = q.score / n;
    (rec.points || []).forEach(function(st){ s += (st === 2 ? 1 : st === 1 ? 0.5 : 0) * w; });
  }
  return Math.round(s * 2) / 2;
}

/* ---------------- 渲染 ---------------- */
function tableHTML(rows){
  var cells = rows.map(function(r){
    return r.replace(/^\s*\||\|\s*$/g, '').split('|').map(function(c){ return c.trim(); });
  }).filter(function(r){ return !r.every(function(c){ return /^:?-{2,}:?$/.test(c) || c === ''; }); });
  if(!cells.length) return '';
  var head = cells[0], body = cells.slice(1);
  var h = '<table class="stemtable"><thead><tr>' + head.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
  body.forEach(function(r){
    h += '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
  });
  return h + '</tbody></table>';
}

function stemHTML(s){
  var lines = String(s || '').split('\n');
  var out = [], tbl = [];
  function flush(){
    if(tbl.length){ out.push(tableHTML(tbl)); tbl = []; }
  }
  lines.forEach(function(l){
    if(/^\s*\|/.test(l)) tbl.push(l);
    else {
      flush();
      var t = l.trim();
      if(t) out.push('<p>' + fmt(t) + '</p>');
    }
  });
  flush();
  return out.join('') || '<p>' + fmt(s) + '</p>';
}

function shelfHTML(q, rec, graded){
  var items = q.steps.map(function(s){ return s.formula; }).concat(q.distractors || []);
  items = seedShuffle(items, hashSeed(q.uid));
  var used = {};
  if(rec && rec.picks){
    for(var k in rec.picks){ if(rec.picks[k]) used[rec.picks[k]] = (used[rec.picks[k]] || 0) + 1; }
  }
  return items.map(function(t){
    var taken = false;
    if(used[t]){ used[t]--; taken = true; }
    return '<button class="fchip' + (taken ? ' used' : '') + '" data-f="' + esc(t) + '"'
      + (graded ? ' disabled' : ' draggable="true"') + '>' + esc(t) + '</button>';
  }).join('');
}

function stepsHTML(q, rec, graded){
  var num = ['①','②','③','④','⑤','⑥','⑦','⑧'];
  return q.steps.map(function(s, i){
    var pick = (rec && rec.picks && rec.picks[i]) || '';
    var val = (rec && rec.nums && rec.nums[i]) || '';
    var fl = computedFlag(q, rec, i, graded, pick, val);
    var cls = graded ? (fl.f && fl.n ? ' good' : (fl.f || fl.n ? ' part' : ' bad')) : '';
    var mark = graded ? (fl.f && fl.n ? '✓' : (fl.f || fl.n ? '◐' : '✗')) : '';
    return '<div class="step' + cls + '" data-i="' + i + '">'
      + '<span class="stno">' + (num[i] || (i + 1) + '.') + '</span>'
      + '<div class="stmain"><div class="stlabel">' + esc(s.label) + '</div>'
      + '<button class="slot' + (pick ? ' filled' : '') + '" data-slot="' + i + '"' + (graded ? ' disabled' : '') + '>'
      + (pick ? esc(pick) : '拖入公式') + '</button></div>'
      + '<span class="eq">=</span>'
      + '<input class="num" data-num="' + i + '" inputmode="decimal" value="' + esc(val) + '"'
      + (graded ? ' readonly' : '') + ' placeholder="数值">'
      + '<span class="unit">' + esc(s.unit || '') + '</span>'
      + '<span class="mark">' + mark + '</span>'
      + '</div>';
  }).join('');
}

function computedFlag(q, rec, i, graded, pick, val){
  if(graded && rec && rec.flags && rec.flags[i]) return rec.flags[i];
  return {f: normF(pick) === normF(q.steps[i].formula) ? 1 : 0, n: numClose(val, q.steps[i].value) ? 1 : 0};
}

function chainHTML(q, rec){
  var nodes = [];
  if(q.steps && q.steps.length){
    q.steps.forEach(function(s, i){
      var fl = (rec.flags && rec.flags[i]) || {f:0, n:0};
      var st = fl.f && fl.n ? 2 : (fl.f || fl.n ? 1 : 0);
      nodes.push({st:st, label:s.label,
        body:s.formula + ' = ' + trimNum(s.value) + (s.unit || ''), lock:true});
    });
  } else {
    (q.points || []).forEach(function(p, i){
      nodes.push({st:(rec.points || [])[i] || 0, label:'要点 ' + (i + 1), body:p, lock:false, i:i});
    });
  }
  if(!nodes.length) return '';
  var h = '<div class="chainhead">逻辑链</div><div class="chain">';
  nodes.forEach(function(n){
    h += '<div class="node s' + n.st + '"' + (n.lock ? '' : ' data-p="' + n.i + '"') + '>'
      + '<span class="dot">' + (n.st === 2 ? '✓' : n.st === 1 ? '◐' : '') + '</span>'
      + '<div class="nbody"><b>' + esc(n.label) + '</b><p>' + fmt(n.body) + '</p></div></div>';
  });
  return h + '</div>';
}

function refHTML(q){
  var body = (q.body || '').trim();
  if(!body) body = '原资料未给解析，可回原笔记或对照教材。';
  return '<details class="ref"' + (q.steps ? '' : '') + '><summary>参考答案</summary>'
    + '<div class="refbody">' + fmt(body) + '</div></details>';
}

function resultHTML(q, rec){
  var ok = rec.ok;
  return '<div class="verdict show">'
    + '<div class="stamp ' + (ok ? 'good' : 'bad') + '">' + (ok ? '正' : '误') + '</div>'
    + '<div class="vbody"><div class="vtitle ' + (ok ? 'good' : 'bad') + '">'
    + (ok ? '达到要求' : '还没到位') + '</div>'
    + '<div class="vans">得分 <b>' + rec.got + '</b> / ' + q.score + ' 分'
    + (q.steps ? '　公式与数值各占一半' : '　按要点覆盖估算') + '</div></div></div>'
    + chainHTML(q, rec)
    + refHTML(q)
    + '<div class="gradenote">自动批改是按要点覆盖算的，判得不准就点逻辑链上的节点手动改；改完得分会跟着变。</div>';
}

function renderSub(q){
  var rec = S.answers[q.uid];
  var graded = !!(rec && rec.graded);
  var text = (rec && rec.text) || '';
  var steps = (q.steps && q.steps.length) ? q.steps : null;

  var h = '<div class="qmeta"><span class="num">第 ' + q.no + ' 题</span>'
    + '<span class="tag">' + TYPE[q.type] + '</span>'
    + '<span class="tag2">' + q.score + ' 分</span>'
    + '<span class="yr">' + q.year + ' 年</span></div>'
    + '<h1 class="stem">' + stemHTML(q.stem) + '</h1>';

  if(steps){
    h += '<div class="calchint">把公式拖到对应步骤（手机可先点公式再点空槽），再填数值；拿不准的步骤留空也行。</div>'
      + '<div class="shelf" id="shelf">' + shelfHTML(q, rec, graded) + '</div>'
      + '<div class="steps">' + stepsHTML(q, rec, graded) + '</div>';
  }

  h += '<div class="subarea"><div class="slabel">你的作答' + (steps ? '（可选，写推理过程）' : '') + '</div>'
    + '<textarea id="answerBox" rows="' + (steps ? 4 : 7) + '" placeholder="'
    + (q.type === 'term' ? '先写定义，再补特点、作用。' : '分点写，写完再对照参考答案。') + '"'
    + (graded ? ' readonly' : '') + '>' + esc(text) + '</textarea>'
    + '<div class="submeta"><span id="wc">' + text.replace(/\s/g, '').length + ' 字</span><span>作答自动保存</span></div></div>';

  h += '<div class="toolbar">'
    + (graded ? '<button class="btn ghost" id="again">重新作答</button>'
              : '<button class="btn solid" id="grade">提交批改</button>')
    + (graded ? '' : '<button class="btn ghost" id="peek">参考答案</button>') + '</div>';

  h += '<div id="subresult">' + (graded ? resultHTML(q, rec) : '') + '</div>';
  if(!graded) h += '<div id="peekBox" style="display:none">' + refHTML(q) + '</div>';

  paper.innerHTML = h;
  bindSub(q, rec, graded);
  typeset(paper);
}

function bindSub(q, rec, graded){
  var box = document.getElementById('answerBox');
  var wc = document.getElementById('wc');
  var timer = null;

  if(box && !graded){
    box.addEventListener('input', function(){
      var r = ensureRec(q);
      r.text = box.value;
      if(wc) wc.textContent = box.value.replace(/\s/g, '').length + ' 字';
      clearTimeout(timer);
      timer = setTimeout(save, 400);
    });
  }

  var activeChip = null;
  var shelf = document.getElementById('shelf');
  if(shelf){
    shelf.addEventListener('click', function(e){
      var c = e.target.closest('.fchip');
      if(!c || c.disabled || c.classList.contains('used')) return;
      var all = shelf.querySelectorAll('.fchip');
      for(var i = 0; i < all.length; i++) all[i].classList.remove('sel');
      if(activeChip === c){ activeChip = null; return; }
      activeChip = c;
      c.classList.add('sel');
    });
    shelf.addEventListener('dragstart', function(e){
      var c = e.target.closest('.fchip');
      if(!c || c.disabled) return;
      try { e.dataTransfer.setData('text/plain', c.dataset.f); } catch(err){}
      e.dataTransfer.effectAllowed = 'copy';
    });
  }

  paper.querySelectorAll('[data-slot]').forEach(function(slot){
    slot.addEventListener('click', function(){
      if(!activeChip || slot.disabled) return;
      var r = ensureRec(q);
      r.picks[Number(slot.dataset.slot)] = activeChip.dataset.f;
      save();
      renderPaper();
      renderStats();
    });
    slot.addEventListener('dragover', function(e){ e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', function(){ slot.classList.remove('over'); });
    slot.addEventListener('drop', function(e){
      e.preventDefault();
      slot.classList.remove('over');
      var txt = '';
      try { txt = e.dataTransfer.getData('text/plain'); } catch(err){}
      if(!txt) return;
      var r = ensureRec(q);
      r.picks[Number(slot.dataset.slot)] = txt;
      save();
      renderPaper();
      renderStats();
    });
  });

  paper.querySelectorAll('[data-num]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var r = ensureRec(q);
      r.nums[Number(inp.dataset.num)] = inp.value;
      clearTimeout(timer);
      timer = setTimeout(save, 400);
    });
  });

  var g = document.getElementById('grade');
  if(g) g.onclick = function(){
    var r = ensureRec(q);
    if(!r.text.trim() && !Object.keys(r.picks || {}).length){
      alert('先写点内容，或者把公式拉到步骤里再提交。');
      return;
    }
    gradeSub(q, r);
  };

  var again = document.getElementById('again');
  if(again) again.onclick = function(){
    delete S.answers[q.uid];
    save();
    renderAll();
  };

  var peek = document.getElementById('peek');
  if(peek) peek.onclick = function(){
    var pb = document.getElementById('peekBox');
    if(!pb) return;
    var open = pb.style.display !== 'none';
    pb.style.display = open ? 'none' : 'block';
    var d = pb.querySelector('details');
    if(d && !open) d.open = true;
  };

  paper.querySelectorAll('[data-p]').forEach(function(node){
    node.addEventListener('click', function(){
      var r = S.answers[q.uid];
      if(!r || !r.graded) return;
      var i = Number(node.dataset.p);
      r.points[i] = ((r.points[i] || 0) + 1) % 3;
      r.got = computeGot(q, r);
      r.ok = r.got >= q.score * 0.6;
      save();
      renderAll();
    });
  });
}

/* ---------------- 启动 ---------------- */
renderAbout();
applyFilter();
renderAll();
/* 公式已在生成时静态排版，不再加载 MathJax */

window.addEventListener('resize', function(){ if(window.innerWidth > 1040) document.getElementById('sheet').classList.remove('open'); });
})();

</script>
