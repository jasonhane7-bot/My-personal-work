，不论其是否借贷出去，是否参与生产活动并创造利润，都可以计算该笔资本应得的利息，即所产生的收益。反过来看，各种能够产生收益的事物，不论它是否是一笔贷放出去的货币资金，甚至也不论它是否为一笔资本，我们都可以通过收益与市场利率的对比，倒算出它相当于多大的一笔资本金额。这便是收益的资本化。","作用:利息转化为收益的一般形态导致了收益的资本化，各种有收益的事物都可以通过收益与利率的对比进行资本定价。"]},{"no":4,"type":"term","stem":"柜台交易市场","score":4,"body":"(1) 定义:柜台交易市场 (Counter market)，是通过各家证券商所设的专门柜台进行证券买卖的市场，故又称店头市场 (OTC) 。\n\n《2) 特征:柜台交易市场属于场外交易市场，交易的证券主要是不具备在交易所上市条件的证券，或不愿意上市交易的证券。该市场没有固定的交易场所和固定的交易时间，也没有限制交易对象。柜台交易在各证券公司分散进行，是一种松散的、无组织的市场。与交易所的单一价格不同，柜台交易采用买入价、卖出价的双价形式，并由交易双方协商议定价格。\n\nS.回售条款 【参考答案】《1) 定义:回售条款〈Sell-back clause) ，规定:当公司股票价格表现不佳时，投资者有权按照既定价格将可转债出售给债券发行者。\n\n《2) 特征:对可转债投资者的一种保护。\n\n(3) 内容:回售条款包括回售时间、回售价格等内容。\n\n6.股票回购 【参考答案】《1) 定义:股票回购〈Stock repurchase) 是指上市公司用现金从股东手中买回发行在外的股票的行为。\n\n《2) 特点:股票回购是除现金股利分配外，上市公司的另一种主要分配方式。股票回购可以在二级市场公开进行，也可以与特定投资者协商后从他们手中直接购回。\n\n《3) 作用:当公司偶然有一笔多余的现金需要分配，但又不希望改变现金股利分配政策时，可采用股票回购的方式向股东分发这笔现金。这时股票回购的作用类似于一笔额外现金股利。通过股票回购，公司可以减少流通中的股票数量，能够在不增加现金需求的情况下提高未来的每股收益。","points":["定义:柜台交易市场 (Counter market)，是通过各家证券商所设的专门柜台进行证券买卖的市场，故又称店头市场 (OTC) 。","特征:柜台交易市场属于场外交易市场，交易的证券主要是不具备在交易所上市条件的证券，或不愿意上市交易的证券。该市场没有固定的交易场所和固定的交易时间，也没有限制交易对象。柜台交易在各证券公司分散进行，是一种松散的、无组织的市场。与交易所的单一价格不同，柜台交易采用买入价、卖出价的双价形式，并由交易双方协商议定价格。 S.回售条款 【参考答案】","定义:回售条款〈Sell-back clause) ，规定:当公司股票价格表现不佳时，投资者有权按照既定价格将可转债出售给债券发行者。；特征:对可转债投资者的一种保护。","内容:回售条款包括回售时间、回售价格等内容。 6.股票回购 【参考答案】","定义:股票回购〈Stock repurchase) 是指上市公司用现金从股东手中买回发行在外的股票的行为。","特点:股票回购是除现金股利分配外，上市公司的另一种主要分配方式。股票回购可以在二级市场公开进行，也可以与特定投资者协商后从他们手中直接购回。；作用:当公司偶然有一笔多余的现金需要分配，但又不希望改变现金股利分配政策时，可采用股票回购的方式向股东分发这笔现金。这时股票回购的作用类似于一笔额外现金股利。通过股票回购，公司可以减少流通中的股票数量，能够在不增加现金需求的情况下提高未来的每股收益。"]},{"no":1,"type":"short","stem":"简述利率发挥作用的条件。","score":8,"body":"(1) 利率发挥作用的基础性市场条件: 中独立决策的市场主体:利率发挥作用首先需要各个微观经济主体是能够独立决策、独立承担责任的市场行为主体，当他们面临两种以上的选择时，总是会选择对自己更有利的方案，实现自己效用的最大化，微观主体是所谓的理性经济人。\n\n凶市场化的利率决定机制:市场化的利率体系与利率决定机制，意味着资金供求能够对利率水平产生影响，利率变动也会反过来调节资金供求。此时利率高低能够真实地反映资金的稀缺程度及其机会成本。\n\n@@ 合理的利率弹性:所谓利率弹性是指其他经济变量对利率变化的敏感程度，通常用单位百分比的利率变化导致的其他经济变量变化的百分比来表示。该比率越大，即某经济变量对利率变化有弹性，该经济变量通过利率变动引导其朝着预期目标变化的意图也就更容易实现，反之，经济变量对利率缺乏弹性，利率变动对经济变量的影响就极其微弱，通过利率变动就很难达到预期的目标。\n\n(2) 利率发挥作用的经济制度和经济环境条件: 全市场化改革的作用:市场化改革之后才有独立决策、独立承担责任的市场行为主体，他们才会对利率及其变化做出反应。\n\n凶市场投资机会与资金的可得性:在西方发达国家，市场充分竞争导致的投资机会减少和和利空间收窗，使得利息成本成为制约企业投资及其利润状况的重要影响因素，利率的升降也就会直接影响企业的投资决策。发展中国家相对较高的投资收益率和较严格的利率管制导致的低利率，资金的可得性对项目投资决策来说是一个更具实质性的约束。\n\n仿产权制度与利率作用的发挥:产权制度的改革，在规范和发展非公有产权制度的同时，还通过诸多制度设计明显强化了共有产权制度背景下的激励和约束，微观行为主体的逐利动机明显增强，其对利率变化的敏感性也随之提高。","points":["利率发挥作用的基础性市场条件: 中独立决策的市场主体:利率发挥作用首先需要各个微观经济主体是能够独立决策、独立承担责任的市场行为主体，当他们面临两种以上的选择时，总是会选择对自己更有利的方案，实现自己效用的最大化，微观主体是所谓的理性经济人。 凶市场化的利率决定机制:市场化的利率体系与利率决定机制，意味着资金供求能够对利率水平产生影响，利率变动也会反过来调节资金供求。此时利率高低能够真实地反映资金的稀缺程度及其机会成本。 @@ 合理的利率弹性:所谓利率弹性是指其他经济变量对利率变化的敏感程度，通常用单位百分比的利率变化导致的其他经济变量变化的百分比来表示。该比率越大，即某经济变量对利率变化有弹性，该经济变量通过利率变动引导其朝着预期目标变化的意图也就更容易实现，反之，经济变量对利率缺乏弹性，利率变动对经济变量的影响就极其微弱，通过利率变动就很难达到预期的目标。","利率发挥作用的经济制度和经济环境条件: 全市场化改革的作用:市场化改革之后才有独立决策、独立承担责任的市场行为主体，他们才会对利率及其变化做出反应。 凶市场投资机会与资金的可得性:在西方发达国家，市场充分竞争导致的投资机会减少和和利空间收窗，使得利息成本成为制约企业投资及其利润状况的重要影响因素，利率的升降也就会直接影响企业的投资决策。发展中国家相对较高的投资收益率和较严格的利率管制导致的低利率，资金的可得性对项目投资决策来说是一个更具实质性的约束。 仿产权制度与利率作用的发挥:产权制度的改革，在规范和发展非公有产权制度的同时，还通过诸多制度设计明显强化了共有产权制度背景下的激励和约束，微观行为主体的逐利动机明显增强，其对利率变化的敏感性也随之提高。"]},{"no":2,"type":"short","stem":"从功能的角度来看商业银行与资本市场的异同。","score":8,"body":"(1) 不同之处中在融资方面不同。商业银行充当间接融资的信用中介，实现对全社会的资源配置，通过负债业务把社会上的闲散资金集中起来，再通过资产业务投向需要资金的部门，充当供求者的中介人，实现资金融通，而资本市场上企业通过直接融资筹集中长期投资性资金，股份有限公司可以在资本市场上发行股票或债券筹集中长期资金。\n\n思平台优势不同。商业银行可以利用其特有的专业优势，通过创造和选择各种金融工具和融资方式，为自身和其他各部门转移与管理风险，资本市场多许个人依据自己的风险承受能力调整自己的资产组合，资本市场上证券投资的平均回报率一般高于存款利率，为投资者、投机者提供了资产组合、投机、套利的平台。\n\n加发挥功能不同。商业银行可以充当支付中介，加速了资金周转的效率，降低了经济运行中的交易成本。可以创造信用与存款货币，另外，商业银行提供各种服务便利，满足经济发展的各种金融服务需求。资本市场可以促进并购与重组，企业通过资本市场实现企业改制和产权结构调整，不同的投资人共同持股形成多层次的约束机制，利用各投资主体对企业利益的关联性协助提高公司的经营效率和发展能力。这是资本市场独有的功能。\n\n(2) 相同之处都可以优化企业融资，推动企业发展。商业银行能通过间接融资来为企业融资为提供资金，推动社会经济的发展。资本市场可以通过直接融资促进产业结构优化升级，能筛选出效率较高的企业，并激励上市公司更有效地改善经营管理，高成长性的企业通过在资本市场上直接融资，得到迅速发展，实现并推动其他产业升级换代。","points":["不同之处中在融资方面不同。商业银行充当间接融资的信用中介，实现对全社会的资源配置，通过负债业务把社会上的闲散资金集中起来，再通过资产业务投向需要资金的部门，充当供求者的中介人，实现资金融通，而资本市场上企业通过直接融资筹集中长期投资性资金，股份有限公司可以在资本市场上发行股票或债券筹集中长期资金。 思平台优势不同。商业银行可以利用其特有的专业优势，通过创造和选择各种金融工具和融资方式，为自身和其他各部门转移与管理风险，资本市场多许个人依据自己的风险承受能力调整自己的资产组合，资本市场上证券投资的平均回报率一般高于存款利率，为投资者、投机者提供了资产组合、投机、套利的平台。 加发挥功能不同。商业银行可以充当支付中介，加速了资金周转的效率，降低了经济运行中的交易成本。可以创造信用与存款货币，另外，商业银行提供各种服务便利，满足经济发展的各种金融服务需求。资本市场可以促进并购与重组，企业通过资本市场实现企业改制和产权结构调整，不同的投资人共同持股形成多层次的约束机制，利用各投资主体对企业利益的关联性协助提高公司的经营效率和发展能力。这是资本市场独有的功能。","相同之处都可以优化企业融资，推动企业发展。商业银行能通过间接融资来为企业融资为提供资金，推动社会经济的发展。资本市场可以通过直接融资促进产业结构优化升级，能筛选出效率较高的企业，并激励上市公司更有效地改善经营管理，高成长性的企业通过在资本市场上直接融资，得到迅速发展，实现并推动其他产业升级换代。"]},{"no":3,"type":"short","stem":"附加认股权债券和可转换债券区别。","score":8,"body":"可转换公司债与认股权证有许多相似之处，如它们都代表了一种股票买权，都是附着于债券〈或优先股 ) 发行的，等等。但是，它们也有一些明显的差异，主要表现为:\n\n(1) 认股权证虽然多数是与公司债或优先股捆绑发行的，但一旦发行之后，认股权证可以脱离公司债或优先股单独交易，而可转债不具备这一能力。\n\n(2) 认股权证在执行时是用现金购买股票，而可转债在转股时是债券交换公司普通股票，并不需要向公司投入额外的现金。因此，认股权证的执行和可转债的转换对公司现金流量和资本结构产生的影响有所不同。\n\n(3) 有时认股权证可以单独发行。比如，一些企业给予其高级管理人员的认股权，虽然名为股票期权或其他名称，实际上是认股权证。这种认股权证就是脱离公司债券或优先股单独发行的。\n\n(4) 另外，认股权证与可转债的发行和转换在税收等方面可能也会有所差异。","points":["可转换公司债与认股权证有许多相似之处，如它们都代表了一种股票买权，都是附着于债券〈或优先股 ) 发行的，等等。但是，它们也有一些明显的差异，主要表现为:","认股权证虽然多数是与公司债或优先股捆绑发行的，但一旦发行之后，认股权证可以脱离公司债或优先股单独交易，而可转债不具备这一能力。","认股权证在执行时是用现金购买股票，而可转债在转股时是债券交换公司普通股票，并不需要向公司投入额外的现金。因此，认股权证的执行和可转债的转换对公司现金流量和资本结构产生的影响有所不同。","有时认股权证可以单独发行。比如，一些企业给予其高级管理人员的认股权，虽然名为股票期权或其他名称，实际上是认股权证。这种认股权证就是脱离公司债券或优先股单独发行的。","另外，认股权证与可转债的发行和转换在税收等方面可能也会有所差异。"]},{"no":4,"type":"short","stem":"合理的资产结构权衡理论的主要理念。","score":8,"body":"(1) 债务资本利浆并存。公司使用债务资本带来的收益是其税盾价值,成本则体现为财务危机的成本。\n\n公司在选择资本结构时，通过权衡债务融资的收益与成本，最大化公司价值。这就是资本结构的权衡理论。当公司资本中债务资本达到某一数额时，债务资本的边际收益正好等于其边际成本，这时公司价值最大，相应的公司资本结构称为最优资本结构。\n\n(2) 权衡理论可用下图加以说明: 了 = 实际公司价值儿 = 无负债公司价值\n\n(3) 由图看到，当企业的债务资本较少时，财务危机成本很小，此时债务的税盾效应起主导作用，因此公司价值随着债务资本的增加而增大。但是，随着债务资本的不断增加，财务危机成本上升的速度越来越快，因此公司价值上升的速度越来越慢。当企业的债务资本上升到高于 M 点的债务水平后，债务增加带来的边际成本超过了边际收益，故公司价值随债务资本的增加而降低。在 M 点处，债务的边际成本恰好等于其边际收益，公司价值达到最大值，所以，M 点代表最优资本结构。","points":["债务资本利浆并存。公司使用债务资本带来的收益是其税盾价值,成本则体现为财务危机的成本。 公司在选择资本结构时，通过权衡债务融资的收益与成本，最大化公司价值。这就是资本结构的权衡理论。当公司资本中债务资本达到某一数额时，债务资本的边际收益正好等于其边际成本，这时公司价值最大，相应的公司资本结构称为最优资本结构。","权衡理论可用下图加以说明: 了 = 实际公司价值儿 = 无负债公司价值","由图看到，当企业的债务资本较少时，财务危机成本很小，此时债务的税盾效应起主导作用，因此公司价值随着债务资本的增加而增大。但是，随着债务资本的不断增加，财务危机成本上升的速度越来越快，因此公司价值上升的速度越来越慢。当企业的债务资本上升到高于 M 点的债务水平后，债务增加带来的边际成本超过了边际收益，故公司价值随债务资本的增加而降低。在 M 点处，债务的边际成本恰好等于其边际收益，公司价值达到最大值，所以，M 点代表最优资本结构。"]},{"no":1,"type":"essay","stem":"健全我国货币政策框架的重点和条件，结合货币政策执行报告回答。","score":14,"body":"货币政策框架包括目标体系、工具体系和传导机制三部分。对应的，现代货币政策框架包括优化的货币政策目标、创新的货币政策工具和畅通的货币政策传导机制。\n\n《1) 优化的货币政策目标坚守币值稳定的最终目标。根据《中国人民银行法》的规定，货币政策最终目标为“保持货币币值的稳定，并以此促进经济增长”。\n\n保持货币供应量和社会融资规模增速同名义经济增速基本匹配，从而清晰明确地界定了货币政策框架的锚。这一中介目标锚定方式，有利于搞好跨周期政策设计，在长期稳住货币总量，有利于根据宏观经济形势变化，使 M2 和社融增速向反映潜在产出的名义经济增速靠拢，同时内驱了稳定宏观杠杆率的机制，有利于实现稳增长和防风险的长期均衡。\n\n《2) 畅通的货币政策传导机制近年来，人民银行深化利率市场化改革，推动完善贷款市场报价利率 (LPR) 形成机制，货币政策传导效率明显提升。LPR 基于政策利率报价形成 (LPR=MLF+BP) ，坚持市场化方向，人民银行通过完善以公开市场操作利率为短期政策利率和以中期借贷便利利率为中期政策利率的政策利率体系，健全从政策利率到 LPR 再到实际贷款利率的市场化利率形成和传导机制，以此调节资金供求和资源配置，实现货币政策目标。\n\n(3) 创新的货币政策工具总量方面，完善中央银行调节银行货币创造的流动性、资本和利率约束的长效机制。抓准作为货币创造直接主体的银行，综合运用多种货币政策工具，保持流动性合理充裕，以永续债为突破口，促进银行多渠道补充资本;推动 LTPR 改革，打破利率隐性下限，引导贷款利率下行，缓解银行货币创造面临的流动性、资本和利率约束。\n\n结构方面，构建金融有效支持实体经济的体制机制。持续健全结构性货币政策工具体系，通过设计激励相容机制，将流动的量价与银行贷款创造存款行为联系起来。根据经济发展不同时期的需要动态调整支持重点，引导金融资源流向科技创新、小微企业、绿色发展等国民经济重点领域和薄弱环节。\n\n总的来看，这一框架更为公开、透明，提升了央行与公众的沟通效率，降低了沟通成本，提高了货币政策传导的有效性，有利于为经济高质量发展提供适宜的货币金融环境。","points":["货币政策框架包括目标体系、工具体系和传导机制三部分。对应的，现代货币政策框架包括优化的货币政策目标、创新的货币政策工具和畅通的货币政策传导机制。","优化的货币政策目标坚守币值稳定的最终目标。根据《中国人民银行法》的规定，货币政策最终目标为“保持货币币值的稳定，并以此促进经济增长”。 保持货币供应量和社会融资规模增速同名义经济增速基本匹配，从而清晰明确地界定了货币政策框架的锚。这一中介目标锚定方式，有利于搞好跨周期政策设计，在长期稳住货币总量，有利于根据宏观经济形势变化，使 M2 和社融增速向反映潜在产出的名义经济增速靠拢，同时内驱了稳定宏观杠杆率的机制，有利于实现稳增长和防风险的长期均衡。","畅通的货币政策传导机制近年来，人民银行深化利率市场化改革，推动完善贷款市场报价利率 (LPR) 形成机制，货币政策传导效率明显提升。LPR 基于政策利率报价形成 (LPR=MLF+BP) ，坚持市场化方向，人民银行通过完善以公开市场操作利率为短期政策利率和以中期借贷便利利率为中期政策利率的政策利率体系，健全从政策利率到 LPR 再到实际贷款利率的市场化利率形成和传导机制，以此调节资金供求和资源配置，实现货币政策目标。","创新的货币政策工具总量方面，完善中央银行调节银行货币创造的流动性、资本和利率约束的长效机制。抓准作为货币创造直接主体的银行，综合运用多种货币政策工具，保持流动性合理充裕，以永续债为突破口，促进银行多渠道补充资本;推动 LTPR 改革，打破利率隐性下限，引导贷款利率下行，缓解银行货币创造面临的流动性、资本和利率约束。 结构方面，构建金融有效支持实体经济的体制机制。持续健全结构性货币政策工具体系，通过设计激励相容机制，将流动的量价与银行贷款创造存款行为联系起来。根据经济发展不同时期的需要动态调整支持重点，引导金融资源流向科技创新、小微企业、绿色发展等国民经济重点领域和薄弱环节。 总的来看，这一框架更为公开、透明，提升了央行与公众的沟通效率，降低了沟通成本，提高了货币政策传导的有效性，有利于为经济高质量发展提供适宜的货币金融环境。"]},{"no":2,"type":"essay","stem":"根据今年的金融发展理念和政策分析金融发展和经济发展的关系。","score":14,"body":"金融与经济发展的关系可表达为:二者紧密联系、互相作用。经济发展对金融起决定作用，人金融中央财经大学金融硕士 「2022 年 」 直题解打 279 则居从属地位，不能凌驾于经济发展之上;人金融在为经济发展服务的同时，对经济发展有巨大的推动作用，但也可能出现一些不良影响和副作用。上有具体来看:《1) 经济发展决定金融发展〈可结合我国当前强调金融扎根于实体的发展理念 )\n\n中金融产生于经济活动并随之发展。商品经济越发展，交换关系越复杂，人金融就越发达。脱离了商品经济，金融就成了无源之水，无本之木。现代金融已是社会经济活动中居民、企业、政府和国外经济部门等各经济主体实现融资、投资、风险管理等金融目标的必要渠道。在满足经济活动对金融需求的同时，金融自身也获得了充分发展。\n\n包经济发展水平决定金融规模、层次和结构。经济发展水平决定了金融规模。随着人类经济发展水平的提高，金融规模的不断增大。一方面从货币角度来看，货币供给的规模依据于社会货币需求量，而货币需求内生于经济活动与经济发展水平密切相关。另一方面，从金融资产角度来看，一国金融资产规模是该国居民企业政府等各经济主体所持有的金融资产总额，直接取决于该国的国民收入水平，取决于经济发展水平，此外，一国金融机构的数量以及从业人员的数量等一般也都与该国的经济规模直接相关。\n\n(2) 金融推动经济发展〈可结合我国当前的商业银行体系、资本市场体系的改革 )\n\n中金融活动为经济发展提供基础条件。现代经济是高度发达的货币信用经济，一切经济活动都离不开货币信用因素。商品和劳务交易要以货币计价并通过货币来实现，各部门的资金余缺调剂要通过银行或金融市场，各种对经济活动实施调节的经济政策也都与货币信用相关。现代金融为现代经济活动提供正常的交易媒介，提供信用支持，提供转账支付与汇竞等金融服务等等。因此，金融为现代经济发展提供必要的基础条件。\n\n@ 人金融促进社会储荤，并促进储蓄转化为投资金融具有储蓄功能，将社会上的闲置资金集中起来，并将资金提供给需要者有偿使用，实现储蓄向投资的转化。金融是促进社会储蓄并实现向投资转化的理想渠道，一方面金融机构能提供存款、贷款、债券、股票等多样化的产品，满足资金闲置者的储蓄需求和资金不足者的融资需求，既激励资金闲置者让渡资金使用权，又激励资金不足者选择适当的金融产品和合理的成本来实现融资，促进储蓄与投资的扩大。另一方面，金融体系具有风险识别与资源配置功能，通过金融机构、金融市场的信息生产、收集和管理，能实现良好的风险识别，提高资源配置效率。\n\n图金融活动节约社会交易成本，促进社会交易的发展。金融机构的业务活动和金融市场的交易活动，极大地促进了社会资金流动，节省了社会交易成本，并最终实现社会资源的良好配置，提高经济发展的效率。\n\n(3) 金融活动又可能对经济发展产生不良影响〈可结合我国影子银行、金控公司 )\n\n个因人金融总量失控出现通货膨胀、信用膨胀，导致社会总供求失衡，危害经济发展。信用货币的供给完全由人为因素确定的状态下，一旦人们的认识发生偏差或操作失当，就可能造成货币供给大于货币需求严重失衡状态，导臻通货膨胀。同样，由于信用关系渗透到经济生活的各个方面，信用形式日益丰富，发展信用不仅能解决有盘余和短缺部门的调剂问题，还可以创造或抑制需求。\n\n@ 因金融业经营问题形成系统性金融风险，进而引发金融危机。人金融业是经营信用的产业，是一个高风险的行业，在经营过程中始终伴随着利率风险、流动性风险、信用风险、汇率风险、操作风险、国际风险等诸多的系统性风险和非系统性风险。这些风险的存在直接威胁着金融业的安全，一旦风险失控，就会出现债务危机、流动性危机。而少数金融机构出现支付困难、清偿力不足，就会失去公众信任，动摇信用基础，引发挤提存款、抛售有价证券、抢购保值品等金融恐慌现象，造成社会支付体系的中断和货币信用关系的混乱，形成多米诺骨牌效应，使大批金融机构破产倒闭，整个国家可能陷入金融危机之中。","points":["金融与经济发展的关系可表达为:二者紧密联系、互相作用。经济发展对金融起决定作用，人金融中央财经大学金融硕士 「2022 年 」 直题解打 279 则居从属地位，不能凌驾于经济发展之上;人金融在为经济发展服务的同时，对经济发展有巨大的推动作用，但也可能出现一些不良影响和副作用。上有具体来看:","经济发展决 core":1},{"no":3,"type":"single","stem":"一年期即期利率和两年期即期利率分别为 5%和 6%，第二年的远期利率为","options":["4%","5%","6%","7%"],"answer":"D","expl":"****\n\n根据远期利率计算公式，（1＋5%）(1＋i)=（1＋6%）^2,解得 i=7%。","score":1},{"no":4,"type":"single","stem":"关于利率期限结构理论，说法正确的是","options":["预期理论认为完全不同期限债券完全可替代","市场分割理论可以解释不同期限的债券，利率随时间变化一起波动","期限选择和流动性升水理论认为投资者是风险中性的","市场分割理论假设不同期限的债券之间存在不完全的替代性"],"answer":"A","expl":"****\n\nB 选项错误，市场分割理论假设不同期限的债券根本不可替代，长、短期债券处于相互不受影响的分割状态，无法解释长、短期债券收益率会相互影响。C 选项错误，流动性升水理论认为投资者是厌恶风险的，人们偏好期限较短、利率风险较小的证券。D 选项错误，市场分割理论假设不同期限的债券之间完全不可替代。","score":1},{"no":5,"type":"single","stem":"我国货币市场基准利率是","options":["同业拆借利率","国债利率","再贴现利率","银行贷款利率"],"answer":"A","expl":"****\n\n当前我国货币市场的基准利率是上海银行间同业拆放利率（Shibor）。","score":1},{"no":6,"type":"single","stem":"某企业将价值 100 万的证券以 99 万的价格卖给银行，双方约定在 6 个月后，企业以 102 万的价格赎回证券，求回购协议的利率","options":["2.02%","3.03%","4.04%","6.06%"],"answer":"D","expl":"****\n\n教材 215 页，根据回购利率= = 102−99 99 360 × 180 = 6.06%。回购价格−售出价格售出价格 × 360 距离到期日的天数，回购利率","score":1},{"no":7,"type":"single","stem":"下列关于衍生品的说法正确的是","options":["权证的持有者只有权利，没有义务","远期合约在交易所内进行交易","期权属于收益—风险对称型衍生工具","互换是证券型衍生工具"],"answer":"A","expl":"****\n\nB 选项错误，远期合约实行场外交易。C 选项错误，风险—收益不对称型衍生工具带给合约双方的收益和损失不对称。期权、权证类工具等属于此类衍生工具。期权的签发人一般要承受比较大的风险，而持有人只承受损失期权费的风险。风险—收益对称型衍生工具是“零和游戏”，不考虑交易手续费成本，交易双方一方的收益等于另一方的损失。远期、期货、互换等属于此类衍生工具。D 选项错误，教材 296 页，证券型衍生工具以证券的形式存在，如权证、可转换债券、以抵押贷款为基础发行的债券等。远期、期货、期权、互换都属于契约型衍生工具。","score":1},{"no":8,"type":"single","stem":"以下关于证券投资基金的说法，错误的是","options":["我国由基金管理公司发行的证券投资基金，均为契约型基金","封闭式基金的规模不受二级交易的影响","基金公司负责基金的投资和资金保管","开放式基金需要保留一定的现金资产"],"answer":"C","expl":"****\n\n基金的运作中，由基金管理人负责基金的操作和投资，即下达买卖指令管理和运用资金。由基金托管人（通常是银行、信托公司等金融机构）保管资金。","score":1},{"no":9,"type":"single","stem":"下列不属于中央银行公开市场操作的是","options":["买卖中央银行票据","买卖国债","回购交易","调整再贴现率"],"answer":"D","expl":"****\n\n中央银行三大法宝为存款准备金率、再贴现政策、公开市场操作，公开市场操作是中央银行吞吐基础货币，调节市场流动性的主要货币政策工具，通过中央银行与指定交易商进行有价证券和外汇交易，实现货币政策调控目标。D 选项调整再贴现率为再贴现政策。","score":1},{"no":10,"type":"single","stem":"关于货币政策理论，以下说法正确的是","options":["相机抉择是顺周期调节的货币政策","单一规则提出稳定利率的增长率","泰勒规则是调节货币供给为政策工具","麦卡勒姆是名义 GDP 增长率为目标，对基础货币进行调整"],"answer":"D","expl":"****\n\nA 选项错误，相机抉择指中央银行根据对当前的宏观经济形势的判断，制定与执行权衡性的货币政策措施，是逆周期调节的货币政策。B 选项错误，单一规则认为货币供应量应遵循一个相对固定的增长率。C 选项错误，泰勒规则以名义利率为政策工具，提出当发生通胀或产量上升时，央行应提高利率。","score":1},{"no":11,"type":"single","stem":"关于功能监管和机构监管的说法，错误的是","options":["功能监管比机构监管更容易解决重复监管的问题","机构监管比功能监管更容易避免监管真空","监管模式的演进趋势是由机构监管逐渐发展为功能监管","功能监管对监管当局的监管实施门槛要求较高"],"answer":"B","expl":"****\n\nB 选项错误，功能监管按照经营业务的性质来划分监管对象，可以避免出现的监管真空和重复监管现象，为金融机构创造公平竞争的市场环境。","score":1},{"no":12,"type":"single","stem":"以下关于巴塞尔协议的监管的说法，不正确的是","options":["《巴塞尔协议Ⅱ》构建了宏观审慎监管框架","宏观审慎监管比微观审慎监管更加关注风险的传染","宏观审慎监管以系统性风险为主要目标","《巴塞尔协议Ⅲ》采取逆周期操作方式调节"],"answer":"A","expl":"****\n\nA 选项错误，《巴塞尔协议Ⅱ》的内容为三大支柱，即最低资本充足率要求、监管当局的监管、信息披露，《巴塞尔协议Ⅲ》构建了宏观审慎监管框架。","score":1},{"no":13,"type":"single","stem":"（ ）认为某国货币汇率一定时期内的变动由该国与外国在此期间的通货膨胀率差异决定。","options":["绝对购买力平价理论","相对购买力平价理论","利率平价理论","货币分析法"],"answer":"B","expl":"****\n\n相对购买力平价理论认为某国货币汇率一定时期内的变动由该国与外国在此期间的通货膨胀率差异决定。绝对购买力平价认为在某一时点上两国货币之间的兑换比例就取决于两国物价总水平之比。","score":1},{"no":14,"type":"single","stem":"以下关于汇率变化带来的影响的说法，正确的是","options":["本币升值一般会促进本国出口","本币升值会提高进口商品的国内价格","本币升值预期在短期内会促进资本的跨境流出","本币升值会促进投资者更倾向于本币资产"],"answer":"D","expl":"****\n\nA 选项错误，本币升值促进进口，抑制出口。B 选项错误，本币升值时,以本币表示的国内进口商品价格会下降,进而带动国内同类商品价格下降。C 选项错误，本币升值预期在短期内会促进资本的跨境流入。","score":1},{"no":15,"type":"single","stem":"下列关于票据的说法，正确的是","options":["我国的票据市场包括商业汇票的承兑市场、贴现市场和再贴现市场","发行央行票据的目的是筹集短期资金","转贴现是持有人将未到期的银行承兑汇票向银行所作的汇票转让","贴现率越高，获得的贴现金额也越高"],"answer":"A","expl":"****\n\nB 选项错误，发行中央银行票据不是为了筹集资金，而是减少商业银行可以贷放的资金量，进而调控市场中的货币量，是中央银行进行货币政策操作的一项重要手段。C 选项错误，转贴现指贴现银行将未到期的银行承兑汇票再向其他银行的票据转让行为。D 选项错误，贴现率越高，贴现利息越高，获得的贴现金额越低。","score":1},{"no":16,"type":"single","stem":"以下关于证券发行的说法不正确的是","options":["按发行对象的不同分为公募与私募发行","代销与包销相比，承销商获得的承销费更高","配股是上市公司改善财务结构的手段","主板市场发行条件通常比二板市场严格"],"answer":"B","expl":"****\n\nB 选项错误，代理发行机构不垫付资金，只负责按发行人的条件推销，发行风险（如滞销或减价）由发行人自行承担，手续费一般较低。","score":1},{"no":17,"type":"single","stem":"以下属于商业银行表外业务的是","options":["发放贷款","提供支付结算","发行债券","吸收存款"],"answer":"B","expl":"****\n\nA 选项错误，发放贷款属于商业银行资产业务，C、D 选项错误，发行债券和吸收存款都属于商业银行负债业务。","score":1},{"no":18,"type":"single","stem":"在半强式有效市场中","options":["基本面分析和技术分析都无效","基本面分析无效，技术分析可能有效","技术分析无效，基本面分析可能有效","基本面分析和技术分析都有效"],"answer":"C","expl":"****\n\n在半强式有效市场中，证券价格包含了所有的历史信息和当前的公开信息，技术分析无效，基本面分析可能有效，只有获取到一些没有反映在股价里的未公开的公司内部信息，才能使得基本面分析有效。","score":1},{"no":19,"type":"single","stem":"下列可以作为普通合伙人的是","options":["国有独资企业","医院","具有民事行为能力的自然人","上市公司"],"answer":"C","expl":"****\n\n根据《中华人民共和国合伙企业法》，国有独资公司、国有企业、上市公司以及公益性的事业单位、社会团体不得成为普通合伙人。","score":1},{"no":20,"type":"single","stem":"若名义年利率为 7.64%，按季度付款，则实际利率为","options":["8.75%","9.82%","7.86%","8.24%"],"answer":"C","expl":"****\n\nAPR m 根据 EAR = 1 + m − 1，实际利率= 1 +","score":1},{"no":21,"type":"single","stem":"公司在外发行 900 万股股票，每股 12 元，配股 3000 万，每三股配一股，配股价 10 元，则配股权价值为","options":["0.5 元","0.8 元","1.2 元","1.5 元"],"answer":"A","expl":"****\n\n配股后股票的价格=（12＋1/3×10）/(1＋1/3)=11.5，配股权价值=配股前股价-配股后股价=12-11.5=0.5 元。","score":1},{"no":22,"type":"single","stem":"2021 年末净利润 240 万，总资产 2000 万，负债权益比为 1，利润留存率为 40% ，求内部增长率","options":["4.25%","4.55%","4.80%","5.04%"],"answer":"D","expl":"****\n\n企业完全依靠内部融资，不进行任何形式的外部筹资时所能达到的资产的最大增长率，称为内部增长率。ROA = 净利润/总资产= 12%，b=40%，采用期末权益数 ROA×b 据时，内部增长率 = 1−ROA×b = 5.04%。","score":1},{"no":23,"type":"single","stem":"证券市场线上风险溢价是","options":["风险溢价收益率×资产波动率","风险溢价收益率×贝塔系数","风险收益率×贝塔系数","风险收益率×资产波动率"],"answer":"C","expl":"****\n\n根据证券市场线表达式，证券市场线的方程R = Rf + β(Rm − Rf )。其中，β(Rm − Rf )通常称为“风险溢价”，即风险收益率与贝塔系数的乘积。","score":1},{"no":24,"type":"single","stem":"标准普尔的垃圾债标准是","options":["BBB 及以下","BB 及以下","CCC 及以下","CC 及以下"],"answer":"B","expl":"****\n\n刘力公司财务 272 页，债券的等级标准划分。","score":1},{"no":25,"type":"single","stem":"下列关于权证和股票买权的说法不正确的是","options":["权证没有有效期限制，始终有效","权证常附带在债券和优先股上","权证和股票买权的价值不同","认股权证行权会增加在外流通股票数量"],"answer":"A","expl":"****\n\nA 选项错误，认股权证上须载明认股权证的有效期限，超过有效期限后，认股权证自动失效。C 选项正确，普通股票买权行权时，行权方交付的股票是已经在市场上流通的股票，不存在股票价格的稀释效应；认股权证的持有者在行权时，公司向其交付的股票是新发行的股票。因此，认股权证行权将增加公司流通在外的股票数量。由于认股权证的行权价格总是低于股票的市场价格（否则不会行权），因此行权必然对股票的市场价格产生稀释作用，而这反过来又会影响认股权证本身的价值。","score":1},{"no":26,"type":"single","stem":"（ ）是衡量债券收益最常用的指标。","options":["到期收益率","当期收益率","持有期收益率","资本利得率"],"answer":"A","expl":"****\n\n到期收益率是衡量债券投资收益最常用的指标，是在投资者购买债券并持有到期的前提下，未来各期利息收入、到期本金收入的现值之和等于债券购买价格的贴现值。","score":1},{"no":27,"type":"single","stem":"会使得盈亏平衡点降低的是","options":["固定成本增加","折旧减少","可变成本增加","商品价格下降"],"answer":"B","expl":"****\n\n盈亏平衡点=固定成本/(单位产品售价-单位产品变动成本)，A.选项错误，固定成本增加时，盈亏平衡点增加。C 选项错误，变动成本增加时，盈亏平衡点增加。D 选项错误，商品价格下降，盈亏平衡点增加。B 选项正确，折旧属于固定成本，折旧减少，固定成本减少，盈亏平衡点降低。","score":1},{"no":28,"type":"single","stem":"资本预算中应当采用的成本是","options":["项目融资实际采用的融资工具的成本","当前可以采用的成本最低的融资工具的成本","根据企业目标资本结构确定的 WACC","权益资本成本"],"answer":"C","expl":"****\n\n目标资金结构是指符合信托公司理财目标的资金结构,即能使公司价值最大的资金结构，资本预算中应当采用的成本是根据企业目标资本结构确定的 WACC。","score":1},{"no":29,"type":"single","stem":"下列说法中，不属于静态投资回收期缺陷的是","options":["没有考虑时间价值","没有考虑回收期以后的现金流量","决策依据主观臆断","无法直接利用净现金流量信息"],"answer":"D","expl":"****\n\nD 选项错误，静态投资回收期指使投资项目预期现金流量的累加值等于其初始现金流出量所需要的时期，可以直接利用净现金流量信息。","score":1},{"no":30,"type":"single","stem":"下列关于股利分配理论的说法中，不正确的有","options":["税差理论认为，当股票资本利得税与股票交易成本之和大于股利收益税时，应采用高现金股利支付率政策","客户效应理论认为，对于高收入阶层和风险偏好投资者，应采用高现金股利支付率政策","“一鸟在手”理论认为，由于股东偏好当期股利收益胜过未来预期资本利得，应采用高现金股利支付率政策","代理理论认为，为解决控股股东和中小股东之间的代理冲突，应采用高现金股利支付率政策"],"answer":"B","expl":"****\n\n选项 B 错误，客户效应理论认为，收入高的投资者因其边际税率较高表现出偏好低股利支付率的股票，希望少分现金股利或不分现金股利，以更多的留存收益进行再投资，从而提高所持有的股票价格。","score":1},{"no":1,"type":"multi","stem":"关于货币需求理论，下列说法正确的是","options":["马克思认为商品流通决定货币流通","弗里德曼认为是永久性收入而不是暂时性收入决定货币需求","凯恩斯认为收入会影响货币的投机性需求","现金余额说认为货币需求是由权衡财富与收入的不同用途而决定","费雪方程式从微观角度分析货币需求"],"answer":"C","expl":"****\n\nBD C 选项错误，凯恩斯认为投机性货币需求最主要的影响因素是利率，而收入主要影响交易性和预防性货币需求。E 选项错误，费雪的交易方程式仅从货币的交易媒介功能考查，全社会一定时期一定价格水平下的总交易量与所需要的名义货币量的比例关系，没有考虑微观主体动机对货币需求的影响。D 选项正确，人们的财富与收入有三种用途：投资以取得利润或利息、消费以取得享受、持有货币以便利交易和预防意外，形成的现金余额即是对货币的需求。这三种用途互相排斥，人们究竟在三者之间保持一个什么样的比例，必须权衡其利弊而决定。","score":2},{"no":2,"type":"multi","stem":"关于固定汇率制与浮动汇率制的优缺点，说法正确的是","options":["固定汇率更易于内部协调","固定汇率制需要持有更多的外汇储备应对国际游资冲击","浮动汇率制有利于国际贸易和投资的发展","浮动汇率制可能诱发通货膨胀","浮动汇率制可能引发货币之间的竞相贬值"],"answer":"A","expl":"****\n\nDE A 选项错误，浮动汇率制内外平衡易于协调，浮动汇率制下的汇率自动调节可以避免资本流动对政策效能的不利影响，从而实现对外均衡。C 选项错误，浮动汇率制不利于国际贸易和投资的发展，汇率波动的难以预测使得国际贸易的成本、收益不易准确核算，阻碍其发展趋势。","score":2},{"no":3,"type":"multi","stem":"关于利率决定理论，下列说法正确的是","options":["可贷资金理论认为利率变化取决于投资流量与储蓄流量均衡","流动性偏好理论认为利率水平由货币供给与货币需求均衡点决定","流动性偏好理论侧重于分析短期利率走势的变化","IS-LM 是综合考虑货币因素和实际因素后的一般均衡","根据 IS-LM 模型，扩张性财政政策会导致利率升高"],"answer":"A","expl":"****\n\nCDE A 选项错误，实际利率理论认为利率变化取决于投资流量与储蓄流量均衡。C 选项正确，由于货币供求受短期因素扰动较大，流动性偏好理论在分析短期利率走势的变化时更具说服力。E 选项正确，扩张性财政政策使得 IS 曲线向右上方移动，均衡利率上升。","score":2},{"no":4,"type":"multi","stem":"下列股利政策会导致现金股利政策与净利润脱节的是","options":["剩余股利政策","固定股利率政策","固定股利额政策","低股利加额外股利政策","保持稳定增长的股利额"],"answer":"C","expl":"****\n\nE C 选项，固定股利额政策是将每年发放的股利固定在某一相对稳定的水平上并在较长的时期内不变，此政策的缺点在于股利的支付与盈余相脱节。E 选项，保持稳定增长的股利额，现金股利在稳定增长率下逐年增长，与净利润无关。","score":2}],"sub":[{"no":1,"type":"calc","stem":"如果不考虑市场不完美因素和税收的影响，当股票除息时，我们将预期价格下跌所派发股票的金额。然而，一旦我们考虑税收的影响，这就不一定时正确的。若�� 是股票除息前的价格；�� 是除息价格；���是每股股利；�� 是相关的个人边际税率；�� 是资本利的的有效边际税率。（1）如果TP = TG = 0,当股票除息时，价格将下跌多少？（2）如果TP = 28%, TG = 0，价格将下跌多少？（3）如果TP = 35%, TG = 28%，价格将下跌多少？","score":10,"body":"P −P 1−T 根据 0DIV x = 1−TP G\n\n（1）如果TP = TG = 0,下跌 DIV\n\n（2）如果TP = 28%, TG = 0，P0 − Px = DIV×(1-28%)==0.72DIV\n\n（3）如果TP = 35%, TG = 28%，P0 − Px = DIV×(1-35%)/(1-28%)=0.903DIV 本题为刘力公司财务 13 章课后题原题，相应知识点也在 2016 年真题中考察过。","points":["P −P 1−T 根据 0DIV x = 1−TP G","如果TP = TG = 0,下跌 DIV","如果TP = 28%, TG = 0，P0 − Px = DIV×(1-28%)==0.72DIV","如果TP = 35%, TG = 28%，P0 − Px = DIV×(1-35%)/(1-28%)=0.903DIV 本题为刘力公司财务 13 章课后题原题，相应知识点也在 2016 年真题中考察过。"]},{"no":2,"type":"calc","stem":"有一笔本金为 1000 万的 5 年期贷款，采用等额本息的方式按年还款，利率为 8%，下表为利率为 8%时的复利现值系数表和年金现值系数，求第三年归还的本金数额。<!-- PDF 文字层的表格单元格逐行保留于下列 HTML 注释；可见表格见本页末。T 1 2 3 4 5 6 7 8 复利现值系数 0.9259 0.8573 0.7938 0.7350 0.6806 0.6302 0.5835 0.5403 年金现值系数 0.9259 1.7833 2.5771 3.3121 3.9927 4.6229 5.2064 5.7466 --> ##### 本页原表（8% 利率现值系数）| T | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | | --- | --- | --- | --- | --- | --- | --- | --- | --- | | 复利现值系数 | 0.9259 | 0.8 T×D，D 代表公司负债。通过转化，V1=EBIT（1-T）/r0+T×D，EBIT 代表息税前利润，T 代表公司税率；D 代表公司负债，r0 是无杠杆公司的权益报酬。1700000= EBIT（1-40%）/20%+40%×500000 所以 EBIT=500000（元）再根据 EBIT=净利润+所得税+利息，可得净利润= EBIT－所得税－利息=（500000-500000×10%）（1-40%）=270000（元）","根据无负债条件下得 MM 理论，VU= EBIT（1-T）/ r0=500000（1-40%）/20%=1500000（元）所以，公司的价值 V=1500000（元）"],"steps":[{"label":"息税前利润 EBIT","formula":"V = EBIT(1−T)/r₀ + T×D 反解","value":50,"unit":"万元"},{"label":"利息","formula":"负债 × 债务利率","value":5,"unit":"万元"},{"label":"净利润","formula":"(EBIT − 利息) × (1 − T)","value":27,"unit":"万元"},{"label":"无杠杆公司价值 VU","formula":"EBIT(1−T) / r₀","value":150,"unit":"万元"}],"distractors":["P = DIV1 / (Rs − g)","WACC = D/(D+E)×Rd×(1−T) + E/(D+E)×Re","DFL = EBIT/(EBIT − I)"],"note":"有税 MM 理论：由公司价值反推 EBIT，再算净利润与无杠杆价值。"},{"no":1,"type":"term","stem":"远期利率协议","score":4,"body":"①定义：远期利率协议是一种远期合约，买卖双方商定在未来某一特定的时期内按协议利率借贷一笔数额确定、以具体货币表示的名义本金的协议。\n②交易双方：远期利率协议的买方是名义借款人，其订立远期利率协议的目的主要是为了规避利率上升的风险；远期利率协议的卖方则是名义贷款人，其订立远期利率协议的目的主要是为了规避利率下降的风险。\n③特点：借贷双方不必交换本金，只是在结算日根据协议利率和参考利率之间的差额以及名义本金额，由交易一方付给另一方结算。\n④作用：远期利率协议使商业银行实现了在不扩大资产负债表的情况下来避免利率风险，免除了因风险管理而带给资产负债表的进一步负担。","points":["定义：远期利率协议是一种远期合约，买卖双方商定在未来某一特定的时期内按协议利率借贷一笔数额确定、以具体货币表示的名义本金的协议。","交易双方：远期利率协议的买方是名义借款人，其订立远期利率协议的目的主要是为了规避利率上升的风险；远期利率协议的卖方则是名义贷款人，其订立远期利率协议的目的主要是为了规避利率下降的风险。","特点：借贷双方不必交换本金，只是在结算日根据协议利率和参考利率之间的差额以及名义本金额，由交易一方付给另一方结算。","作用：远期利率协议使商业银行实现了在不扩大资产负债表的情况下来避免利率风险，免除了因风险管理而带给资产负债表的进一步负担。"]},{"no":2,"type":"term","stem":"格雷欣法则","score":4,"body":"①定义：格雷欣法则也称劣币驱逐良币法则，指在实行金银复本位制条件下，金银有一定的兑换比率，当金银的市场比价与法定比价不一致时，市场比价比法定比价高的金属货币（良币）将逐渐减少，而市场比价比法定比价低的金属货币（劣币）将逐渐增加，形成良币退藏，劣币充斥的现象。\n②举例:金币银币的法定比价为 1: 15,而金块和银块的市场比价为 1: 16,人们就会将手中的金币溶化成金块,然后按照 1: 16 的比价把金块兑换成银块,铸造成银币,然后在流通中按 1 : 15 的比价换成金币。如此循环,就可以得到 1 份白银的利润。这样就会出现金币作为良币被融化、银币作为劣币充斥市场。","points":["定义：格雷欣法则也称劣币驱逐良币法则，指在实行金银复本位制条件下，金银有一定的兑换比率，当金银的市场比价与法定比价不一致时，市场比价比法定比价高的金属货币（良币）将逐渐减少，而市场比价比法定比价低的金属货币（劣币）将逐渐增加，形成良币退藏，劣币充斥的现象。","举例:金币银币的法定比价为 1: 15,而金块和银块的市场比价为 1: 16,人们就会将手中的金币溶化成金块,然后按照 1: 16 的比价把金块兑换成银块,铸造成银币,然后在流通中按 1 : 15 的比价换成金币。如此循环,就可以得到 1 份白银的利润。这样就会出现金币作为良币被融化、银币作为劣币充斥市场。"]},{"no":3,"type":"term","stem":"质押式回购","score":4,"body":"①定义：资金融入方（正回购方）在将证券出质给资金融出方（逆回购方）融入资金的同时，双方约定在未来某一日期由正回购方按约定回购利率计算的资金额向逆回购方返还资金，逆回购方向正回购方返还原出质证券的融资行为。\n②特点：质押式回购的逆回购方在回购期内不拥有证券的所有权，不能动用证券。与之相对的是买断式回购，买断式回购中，证券从正回购方账户过户至逆回购方账户，逆回购方在回购期内拥有相应证券的所有权和使用权。","points":["定义：资金融入方（正回购方）在将证券出质给资金融出方（逆回购方）融入资金的同时，双方约定在未来某一日期由正回购方按约定回购利率计算的资金额向逆回购方返还资金，逆回购方向正回购方返还原出质证券的融资行为。","特点：质押式回购的逆回购方在回购期内不拥有证券的所有权，不能动用证券。与之相对的是买断式回购，买断式回购中，证券从正回购方账户过户至逆回购方账户，逆回购方在回购期内拥有相应证券的所有权和使用权。"]},{"no":4,"type":"term","stem":"增量现金流","score":4,"body":"①定义：增量现金流是一个项目导致的企业现金流的改变量，或者，相对于放弃项目，企业接受项目条件下的现金流增量。\n②原因：在增量的基础上估计现金流是投资决策分析中非常重要的原则。在绝大多数情况下，一个投资项目不会是孤立发生的，它会对公司的其他业务及未来的市场份额产生影响。\n③特点：在估计增量现金流时，需要考虑协同效应和侵蚀效应。","points":["定义：增量现金流是一个项目导致的企业现金流的改变量，或者，相对于放弃项目，企业接受项目条件下的现金流增量。","原因：在增量的基础上估计现金流是投资决策分析中非常重要的原则。在绝大多数情况下，一个投资项目不会是孤立发生的，它会对公司的其他业务及未来的市场份额产生影响。","特点：在估计增量现金流时，需要考虑协同效应和侵蚀效应。"]},{"no":5,"type":"term","stem":"实物期权","score":4,"body":"①定义：标的资产为实物资产的期权被称为实物期权。\n②分类：A.增长期权（一个子项目的价值不仅包括其自身产生的现金流的价值，而且包括下一个子项目的选择权价值）、B.灵活性期权（灵活性带来选择的机会。在项目的资本预算中，应该考虑灵活性的价值）、C.等待期权（推迟投资不会导致失去进入市场的机会，投资者可以等待一段时间后再决定是否进行投资。从期权的角度看，这相当于投资者拥有一个尚未到期的买权，这时买权还具有时间价值。）\n③特点：实物期权可能会给项目带来较大的价值，忽略它会造成投资决策的失误；实物期权的期限越长，其价值越高；项目的风险越大，实物期权的价值越高。","points":["定义：标的资产为实物资产的期权被称为实物期权。","分类：A.增长期权（一个子项目的价值不仅包括其自身产生的现金流的价值，而且包括下一个子项目的选择权价值）、B.灵活性期权（灵活性带来选择的机会。在项目的资本预算中，应该考虑灵活性的价值）、C.等待期权（推迟投资不会导致失去进入市场的机会，投资者可以等待一段时间后再决定是否进行投资。从期权的角度看，这相当于投资者拥有一个尚未到期的买权，这时买权还具有时间价值。）","特点：实物期权可能会给项目带来较大的价值，忽略它会造成投资决策的失误；实物期权的期限越长，其价值越高；项目的风险越大，实物期权的价值越高。"]},{"no":1,"type":"short","stem":"简述内部收益率（IRR）指标存在的问题， MIRR 相较于 IRR 有何改进？","score":8,"body":"简述内部收益率（IRR）指标存在的问题， MIRR 相较于 IRR 有何改进？\n\n（1）IRR 存在的问题：\n\n①在项目的寿命周期内其现金流量会多次改变符号在此情况下，有可能出现多个内部收益率共存的现象，而且，即使是独立决策，用内部收益率指标也可能得出错误的结论。\n\n②初始投资额不等由于内部收益率指标完全忽视了投资规模，它会偏向于选择投资规模小的项目。\n\n③现金流发生的时间不同虽然内部收益率与净现值都对现金流贴现，但是它们采用的贴现率不同。净现值指标采用资本成本贴现；而内部收益率指标采用内部收益率贴现。当内部收益率大于资本成本时，远期的现金流受贴现的影响偏大。由于内部收益率指标的决策原则是选择内部收益率大于资本成本的项目，因此，内部收益率指标偏向于低估期限长的项目和现金流分布靠后的项目，进而选择期限短的项目和现金流分布靠前的项目。\n\n④在某些特殊情况下，方程没有实数解\n\n⑤没有区分借方和贷方\n\n（2）MIRR 相较于 IRR 有何改进：内部收益率假设各期现金流按照项目的内部收益率进行再投资。该假设不合理，原因包括两个方面：第一，未来投资项目的收益可能达不到当前项目的内部收益率水平，但只要未来项目的收益水平大于资本成本，那些项目仍然应该投资；第二，如果未来项目的收益水平相当于甚至高于当前项目的内部收益率，那么这种高收益项目按照资本成本去衡量，理所当然会被接受，因而没有必要、也不应该将未来项目的价值计入到当前的项目之中。为了解决内部收益率存在诸多缺陷的问题，使之能更好地用于投资决策，引入了 MIRR 指标。MIRR 为“投资成本的现值=投资收益终值的现值”时等式右侧所用的贴现率。MIRR 假设收益按照资本成本再投资，消除了一个项目多个内含报酬率的情况，但仍无法解决投资规模不同的情况。","points":["简述内部收益率（IRR）指标存在的问题， MIRR 相较于 IRR 有何改进？ （1）IRR 存在的问题：","在项目的寿命周期内其现金流量会多次改变符号在此情况下，有可能出现多个内部收益率共存的现象，而且，即使是独立决策，用内部收益率指标也可能得出错误的结论。","初始投资额不等由于内部收益率指标完全忽视了投资规模，它会偏向于选择投资规模小的项目。","现金流发生的时间不同虽然内部收益率与净现值都对现金流贴现，但是它们采用的贴现率不同。净现值指标采用资本成本贴现；而内部收益率指标采用内部收益率贴现。当内部收益率大于资本成本时，远期的现金流受贴现的影响偏大。由于内部收益率指标的决策原则是选择内部收益率大于资本成本的项目，因此，内部收益率指标偏向于低估期限长的项目和现金流分布靠后的项目，进而选择期限短的项目和现金流分布靠前的项目。；在某些特殊情况下，方程没有实数解","没有区分借方和贷方 （2）MIRR 相较于 IRR 有何改进：内部收益率假设各期现金流按照项目的内部收益率进行再投资。该假设不合理，原因包括两个方面：第一，未来投资项目的收益可能达不到当前项目的内部收益率水平，但只要未来项目的收益水平大于资本成本，那些项目仍然应该投资；第二，如果未来项目的收益水平相当于甚至高于当前项目的内部收益率，那么这种高收益项目按照资本成本去衡量，理所当然会被接受，因而没有必要、也不应该将未来项目的价值计入到当前的项目之中。为了解决内部收益率存在诸多缺陷的问题，使之能更好地用于投资决策，引入了 MIRR 指标。MIRR 为“投资成本的现值=投资收益终值的现值”时等式右侧所用的贴现率。MIRR 假设收益按照资本成本再投资，消除了一个项目多个内含报酬率的情况，但仍无法解决投资规模不同的情况。"]},{"no":2,"type":"short","stem":"简述中央银行的基本职能。","score":8,"body":"简述中央银行的基本职能。\n\n（1）发行的银行是指中央银行通过国家授权，集中垄断货币发行，向社会提供经济活动所需要的货币，并保证货币流通的正常运行，维护币值稳定。\n\n（2）银行的银行\n\n①集中存款准备金：商业银行及其他存款性公司从社会吸收来的存款不能全部用来发放贷款和进行其他投资，必须保留一部分现金以备客户提取。但金融机构追逐利润的经营目标，使其往往只保留极少的存款准备金，一旦遇到客户集中提取，许多金融机构会产生破产的风险，为了防止危机的发生，各国以法律形式规定存款准备金的提取率，并交存中央银行。同时，金融机构为了用于清算，还要在中央银行保留超额准备金存款。\n\n②充当最后贷款人：如果商业银行资金周转不灵，而其他同业也头寸过紧无法提供帮助时，商业银行可求助于中央银行，以其持有的票据要求中央银行予以再贴现，或向中央银行申请信用贷款。\n\n③组织、参与和管理全国清算业务：商业银行间因为业务关系，每天发生大量的资金来往，必须及时清算。与集中存款准备金制度相联系，各家银行都在中央银行开有存款账户，各银行间的票据交换和资金清算业务可以通过这些账户转账和划拨，整个过程经济且简便。\n\n④监督管理金融业：监督管理金融业既是中央银行\"银行的银行\"职能的延伸，是中央银行对金融业服务与管理的统一，又是中央银行作为\"政府的银行\"的基本职能。\n\n（3）政府的银行代理国库、代理发行政府债券、由政府融通资金，提供特定信贷支持、管理、经营国际储备、代表政府参加国际金融组织和各种国际金融活动、制定和执行货币政策、实施金融监管，维护金融稳定、提供经济信息服务。","points":["简述中央银行的基本职能。 （1）发行的银行是指中央银行通过国家授权，集中垄断货币发行，向社会提供经济活动所需要的货币，并保证货币流通的正常运行，维护币值稳定。 （2）银行的银行","集中存款准备金：商业银行及其他存款性公司从社会吸收来的存款不能全部用来发放贷款和进行其他投资，必须保留一部分现金以备客户提取。但金融机构追逐利润的经营目标，使其往往只保留极少的存款准备金，一旦遇到客户集中提取，许多金融机构会产生破产的风险，为了防止危机的发生，各国以法律形式规定存款准备金的提取率，并交存中央银行。同时，金融机构为了用于清算，还要在中央银行保留超额准备金存款。","充当最后贷款人：如果商业银行资金周转不灵，而其他同业也头寸过紧无法提供帮助时，商业银行可求助于中央银行，以其持有的票据要求中央银行予以再贴现，或向中央银行申请信用贷款。","组织、参与和管理全国清算业务：商业银行间因为业务关系，每天发生大量的资金来往，必须及时清算。与集中存款准备金制度相联系，各家银行都在中央银行开有存款账户，各银行间的票据交换和资金清算业务可以通过这些账户转账和划拨，整个过程经济且简便。","监督管理金融业：监督管理金融业既是中央银行\"银行的银行\"职能的延伸，是中央银行对金融业服务与管理的统一，又是中央银行作为\"政府的银行\"的基本职能。 （3）政府的银行代理国库、代理发行政府债券、由政府融通资金，提供特定信贷支持、管理、经营国际储备、代表政府参加国际金融组织和各种国际金融活动、制定和执行货币政策、实施金融监管，维护金融稳定、提供经济信息服务。"]},{"no":3,"type":"short","stem":"简述货币乘数的影响因素。","score":8,"body":"简述货币乘数的影响因素。\n\n（1）决定货币乘数的因素主要有两个：通货－存款比率和准备－存款比率。\n\n①通货－存款比率（C/D）通货－存款比率越低，货币乘数越大。由于通货－存款比率的高低受经济的货币化程度、居民货币收入、储蓄倾向、社会的支付习惯、持有现金的机会成本以及对通货膨胀或通货紧缩的心理预期等多种因素影响，因此中央银行难以有效控制这个比率。\n\n②准备－存款比率（R/D）中央银行直接控制法定准备金率，超额准备金率由商业银行根据自身经营情况自行决定。准备－存款比率越高，意味着更多的货币没有参加银行体系对存款货币的多倍创造过程，货币乘数就越小，反之，货币乘数就越大。\n\n（2）具体来看，不同经济主体的行为对货币乘数的影响如下：","points":["简述货币乘数的影响因素。 （1）决定货币乘数的因素主要有两个：通货－存款比率和准备－存款比率。","通货－存款比率（C/D）通货－存款比率越低，货币乘数越大。由于通货－存款比率的高低受经济的货币化程度、居民货币收入、储蓄倾向、社会的支付习惯、持有现金的机会成本以及对通货膨胀或通货紧缩的心理预期等多种因素影响，因此中央银行难以有效控制这个比率。","准备－存款比率（R/D）中央银行直接控制法定准备金率，超额准备金率由商业银行根据自身经营情况自行决定。准备－存款比率越高，意味着更多的货币没有参加银行体系对存款货币的多倍创造过程，货币乘数就越小，反之，货币乘数就越大。 （2）具体来看，不同经济主体的行为对货币乘数的影响如下："]},{"no":4,"type":"short","stem":"简述通货膨胀的成因及治理方式。","score":8,"body":"简述通货膨胀的成因及治理方式。\n\n（1）需求拉动型\n\n①成因：经济体系对产品和服务的总需求过度增加，超过了社会潜在产出水平之后引起的价格水平连续上涨\n\n②治理：紧缩性货币政策和紧缩性财政政策；增加有效供给，即通过减税来刺激投资和产出的增长\n\n（2）成本推进型——工资推进型\n\n①成因：存在强大的工会组织；存在不完全竞争的劳动力市场。“工资-价格螺旋”\n\n②治理：以物价指导线来确定控制各部门工资增长率，管制或冻结工资\n\n（3）成本推进型——利润推进型\n\n①成因：由于生产投入品或要素的价格因市场垄断力量的存在而提高。存在前提为商品和劳务销售的不完全竞争市场。\n\n②治理：制定反托拉斯法以限制垄断高价\n\n（4）供求混合型\n\n①成因：综合需求拉动型和成本推进型的双重成因\n\n②治理：双管齐下\n\n（5）结构失调型\n\n①成因：A.劳动生产率增长速度的差异：劳动生产率增长较慢的部门工人往往会要求向劳动生产率较快部门的工资上涨率看齐，使该部门的生产成本上升，进而造成物价整体水平上升。B.瓶颈制约：由于缺乏有效的资源配置机制，有些行业严重滞后，形成经济发展瓶颈。当这些瓶颈部门的价格因供不应求而上涨时，便引起了其他部门甚至是生产过剩部门的连锁反应。C.需求转移：社会对产品和服务的需求会不断地从一个部门向另一个部门转移，而劳动力及其他生产要素的转移则需要时日。由于价格和工资刚性的存在，需求减少的行业未必会发生价格和工资的下降，而需求增加的部门价格和工资上涨，结果导致物价总体水平上升。\n\n②治理：对于结构型通货膨胀，应推进经济结构调整，改善资源配置。","points":["简述通货膨胀的成因及治理方式。 （1）需求拉动型","成因：经济体系对产品和服务的总需求过度增加，超过了社会潜在产出水平之后引起的价格水平连续上涨","治理：紧缩性货币政策和紧缩性财政政策；增加有效供给，即通过减税来刺激投资和产出的增长 （2）成本推进型——工资推进型","成因：存在强大的工会组织；存在不完全竞争的劳动力市场。“工资-价格螺旋”","治理：以物价指导线来确定控制各部门工资增长率，管制或冻结工资 （3）成本推进型——利润推进型","成因：由于生产投入品或要素的价格因市场垄断力量的存在而提高。存在前提为商品和劳务销售的不完全竞争市场。；治理：制定反托拉斯法以限制垄断高价 （4）供求混合型；成因：综合需求拉动型和成本推进型的双重成因；治理：双管齐下 （5）结构失调型；成因：A.劳动生产率增长速度的差异：劳动生产率增长较慢的部门工人往往会要求向劳动生产率较快部门的工资上涨率看齐，使该部门的生产成本上升，进而造成物价整体水平上升。B.瓶颈制约：由于缺乏有效的资源配置机制，有些行业严重滞后，形成经济发展瓶颈。当这些瓶颈部门的价格因供不应求而上涨时，便引起了其他部门甚至是生产过剩部门的连锁反应。C.需求转移：社会对产品和服务的需求会不断地从一个部门向另一个部门转移，而劳动力及其他生产要素的转移则需要时日。由于价格和工资刚性的存在，需求减少的行业未必会发生价格和工资的下降，而需求增加的部门价格和工资上涨，结果导致物价总体水平上升。；治理：对于结构型通货膨胀，应推进经济结构调整，改善资源配置。"]},{"no":1,"type":"essay","stem":"根据我国货币政策的实施，简述结构性货币政策工具的特点、功能以及优势。本题在暑期框架与专题课中专门补充，也在最后一次模拟题中以名词解释的形式涉及。","score":14,"body":"根据我国货币政策的实施，简述结构性货币政策工具的特点、功能以及优势。\n\n结构性货币政策是中央银行在制定和出台时便带有结构性调整意图，具有特定的实施对象、引导资金流向特定行业或领域等的各类货币政策工具的总和。2013 年以来，中国人民银行推出了一系列结构性货币政策工具。这些新的工具和传统货币政策工具一起，构成了品种丰富的货币政策工具箱。流动性借贷便利（SLO）、公开市场操作(OMO)、常备借贷便利（SLF）、中期借贷便利（MLF）、定向中期借贷便利（TMLF）和抵押补充贷款（PSL）等工具的期限由短到长，紧密衔接，可以引导不同期限的市场利率水平，调节不同期限资金的宽裕程度。SLF、MLF、MLF、TMLF、PSL、央行票据互换（CBS）发挥了定向精准滴灌的作用，分别将资金引流至科技创新、小微企业、绿色发展、“三农”、棚户区改造和商业银行永续债等领域。2020 年 6 月，人民银行又推出两项直达实体经济的货币政策工具——普惠小微企业贷款延期支持工具和普惠小微企业信用贷款支持计划，有效地缓解了中小微企业融资困境，稳定了经济增长。\n\n（1）特点：通过建立对金融机构的正向激励机制直接影响金融机构的资产负债表，促进信贷资源流向更有活力的重点领域和薄弱环节，不仅能够促进信贷结构的优化，也有助于实现更好的总量调控效果。\n\n（2）功能：结构性货币政策是相对于总量货币政策而言的，从政策目标来看，结构性货币政策主要着眼于引导资金流向国民经济薄弱环节及国家政策重点支持领域，解决经济发展中的结构性问题。从实施效果来看，相较于总量工具，结构性工具具有更加精准、定向、直达等特点。\n\n（3）优势：\n\n①通过银行等金融机构以市场化方式投放资金，使用效率高。\n\n②资金使用透明，监督、可核查、可回收，可以有效防范道德风险。\n\n③精准滴灌，有利于提高央行货币政策传导效果。\n\n④结构性货币政策实施及退出非常灵活，可以根据市场形势及投融资主体情况动态调整。\n\n⑤相比于总量政策，结构性货币政策指向性更强，便于央行进行预期管理。","points":["根据我国货币政策的实施，简述结构性货币政策工具的特点、功能以及优势。 结构性货币政策是中央银行在制定和出台时便带有结构性调整意图，具有特定的实施对象、引导资金流向特定行业或领域等的各类货币政策工具的总和。2013 年以来，中国人民银行推出了一系列结构性货币政策工具。这些新的工具和传统货币政策工具一起，构成了品种丰富的货币政策工具箱。流动性借贷便利（SLO）、公开市场操作(OMO)、常备借贷便利（SLF）、中期借贷便利（MLF）、定向中期借贷便利（TMLF）和抵押补充贷款（PSL）等工具的期限由短到长，紧密衔接，可以引导不同期限的市场利率水平，调节不同期限资金的宽裕程度。SLF、MLF、MLF、TMLF、PSL、央行票据互换（CBS）发挥了定向精准滴灌的作用，分别将资金引流至科技创新、小微企业、绿色发展、“三农”、棚户区改造和商业银行永续债等领域。2020 年 6 月，人民银行又推出两项直达实体经济的货币政策工具——普惠小微企业贷款延期支持工具和普惠小微企业信用贷款支持计划，有效地缓解了中小微企业融资困境，稳定了经济增长。 （1）特点：通过建立对金融机构的正向激励机制直接影响金融机构的资产负债表，促进信贷资源流向更有活力的重点领域和薄弱环节，不仅能够促进信贷结构的优化，也有助于实现更好的总量调控效果。 （2）功能：结构性货币政策是相对于总量货币政策而言的，从政策目标来看，结构性货币政策主要着眼于引导资金流向国民经济薄弱环节及国家政策重点支持领域，解决经济发展中的结构性问题。从实施效果来看，相较于总量工具，结构性工具具有更加精准、定向、直达等特点。 （3）优势：","通过银行等金融机构以市场化方式投放资金，使用效率高。","资金使用透明，监督、可核查、可回收，可以有效防范道德风险。","精准滴灌，有利于提高央行货币政策传导效果。","结构性货币政策实施及退出非常灵活，可以根据市场形势及投融资主体情况动态调整。","相比于总量政策，结构性货币政策指向性更强，便于央行进行预期管理。"]},{"no":2,"type":"essay","stem":"论述美联储持续加息对我国金融体系运行的影响。","score":14,"body":"论述美联储持续加息对我国金融体系运行的影响。\n\n自 2020 年疫情以来，美国由于疫情遭受经济重创，为刺激经济发展，美联储采用量化宽松政策。在经济有所好转的情况下，宽松货币政策导致美国通胀创 40 年历史新高。紧随其后，美联储开始使用 taper、加息等紧缩性的货币政策来控制通胀，刺激经济发展。对我国的影响如下：\n\n（1）货币政策方面：美联储货币政策加快紧缩，会使我国货币政策宽松的时间窗口收窄，加大了货币政策兼顾稳增长与防风险的调控难度。\n\n（2）跨境资本流动方面：美联储加息引发资本回流，将在一定程度上影响我国资本流入，但资本流入可能放缓而不会出现反转。一方面，我国经济在疫情中展现出了韧性，人民币资产成为了很多境外资金的“避风港”。另一方面，由于我国的经济周期与政策周期都与欧美市场相关性较低，因此在资产组合中配置人民币资产，能够有效地分散风险，体现人民币资产的独特配置价值。\n\n（3）人民币汇率方面：美联储持续加息，推动美元指数上涨，一度创下了 20 年来新高，受此影响，欧元、日元、英镑等非美元货币不断贬值至低位。9 月 22 日，离岸人民币兑美元盘中跌破 7.10，创历来新低。汇率增加，人民币贬值，资本流出中国，中美利差增大。人民币的贬值会增加国内企业进口原材料的成本，如果人民币汇率持续贬值，进口原材料成本上升，导致国内物价上升，将进一步推高国内物价水平。\n\n（4）股市和债市方面：美联储加息政策调整具有显著负面外溢效应。在通胀加剧，本币贬值等压力下，其他国家不得不紧跟美联储步伐上调利率，资金的不断外流，流向社会的钱变少，股市下跌成为一种必然。债市方面，接连加息之下，美债收益率持续攀升，吸引力增强。整体来看，虽然今年中国经济上行压力有所增加，但中国经济韧性较强，自新冠疫情在全球蔓延以来，仍然实现了强劲增长，经济发展前景良好，预计仍能维持增长的势头。在我国稳健实施“以我为主”的货币政策，流动性保持合理充裕、国际收支结构更趋稳健的背景下，人民币汇率双向波动是常态，不会出现“单边市”，依旧能给全球贸易和投资提供一个“避风港”。我国应继续坚持“以我为主”的货币政策，同时进一步加强前瞻性操作；加息引发的资本外流压力虽然存在，但整体可控，须防范化解潜在的大规模流出风险。此外，加息对人民币汇率的直接影响有限，但其通过施压出口造成的间接影响值得关注。本题为今年超重要热点话题，在冲刺课和最后一次模拟题中均涉及。","points":["论述美联储持续加息对我国金融体系运行的影响。 自 2020 年疫情以来，美国由于疫情遭受经济重创，为刺激经济发展，美联储采用量化宽松政策。在经济有所好转的情况下，宽松货币政策导致美国通胀创 40 年历史新高。紧随其后，美联储开始使用 taper、加息等紧缩性的货币政策来控制通胀，刺激经济发展。对我国的影响如下：","货币政策方面：美联储货币政策加快紧缩，会使我国货币政策宽松的时间窗口收窄，加大了货币政策兼顾稳增长与防风险的调控难度。","跨境资本流动方面：美联储加息引发资本回流，将在一定程度上影响我国资本流入，但资本流入可能放缓而不会出现反转。一方面，我国经济在疫情中展现出了韧性，人民币资产成为了很多境外资金的“避风港”。另一方面，由于我国的经济周期与政策周期都与欧美市场相关性较低，因此在资产组合中配置人民币资产，能够有效地分散风险，体现人民币资产的独特配置价值。","人民币汇率方面：美联储持续加息，推动美元指数上涨，一度创下了 20 年来新高，受此影响，欧元、日元、英镑等非美元货币不断贬值至低位。9 月 22 日，离岸人民币兑美元盘中跌破 7.10，创历来新低。汇率增加，人民币贬值，资本流出中国，中美利差增大。人民币的贬值会增加国内企业进口原材料的成本，如果人民币汇率持续贬值，进口原材料成本上升，导致国内物价上升，将进一步推高国内物价水平。","股市和债市方面：美联储加息政策调整具有显著负面外溢效应。在通胀加剧，本币贬值等压力下，其他国家不得不紧跟美联储步伐上调利率，资金的不断外流，流向社会的钱变少，股市下跌成为一种必然。债市方面，接连加息之下，美债收益率持续攀升，吸引力增强。整体来看，虽然今年中国经济上行压力有所增加，但中国经济韧性较强，自新冠疫情在全球蔓延以来，仍然实现了强劲增长，经济发展前景良好，预计仍能维持增长的势头。在我国稳健实施“以我为主”的货币政策，流动性保持合理充裕、国际收支结构更趋稳健的背景下，人民币汇率双向波动是常态，不会出现“单边市”，依旧能给全球贸易和投资提供一个“避风港”。我国应继续坚持“以我为主”的货币政策，同时进一步加强前瞻性操作；加息引发的资本外流压力虽然存在，但整体可控，须防范化解潜在的大规模流出风险。此外，加息对人民币汇率的直接影响有限，但其通过施压出口造成的间接影响值得关注。本题为今年超重要热点话题，在冲刺课和最后一次模拟题中均涉及。"]}]},{"year":2024,"included":25,"excluded":4,"questions":[{"no":1,"type":"single","stem":"下列关于货币职能，说法错误的是( )。","options":["货币的职能主要是交换媒介和资产职能","交换媒介职能可以降低成本，提高效率","支付手段职能通过—手交钱—手交货作为商品流通的媒介","在资产职能中，货币可以作为保存财富和资产增值的手段"],"answer":"C","expl":"****\n\nC 选项错误，交换手段职能是指货币通过一手交钱一手交货作为商品流通的媒介。支付手段职能是指货币作为延期支付的手段来结清债权债务关系，货币不再简单地作为交换手段完成等值的商品和货币交换，而是作为跨期交换行为的一个结清环节，或作为交换价值的绝对存在进行单方面转移，成为在信用交易中补足交换过程的独立环节。","score":1},{"no":2,"type":"single","stem":"企业将 10 万元现金以活期存款形式存入商业银行，会造成什么影响( )。","options":["M1 增加,M2 不变","M1 增加,M2 增加","M1 不变,M2 不变","M1 不变,M2 增加"],"answer":"C","expl":"****\n\n企业现金和活期存款均属于 M1，将 10 万元现金以活期存款形式存入银行，M1 不变，M2 不变。","score":1},{"no":4,"type":"single","stem":"下列不属于债券类金融资产的是( )。","options":["票据","定期存单","债券","优先股"],"answer":"D","expl":"****\n\n债券类金融资产以票据、债券等契约型投资工具为主。股权类金融资产以股票为主。","score":1},{"no":5,"type":"single","stem":"下列关于可贷资金理论，说法错误的是( )。","options":["分析实际因素对利率决定的影响","认为完全忽视货币因素是不对的","考虑了商品市场的均衡","利用可贷资金流量供求对比分析利率"],"answer":"A","expl":"****\n\nA 选项错误，古典学派的“实际利率理论”分析非货币的实际因素对利率决定的影响。可贷资金利率理论在实际利率理论中纳入货币供求变动的因素，同时考虑货币因素与实际因素的影响，认为利率取决于可贷资金的供求状况。","score":1},{"no":6,"type":"single","stem":"组织签署《巴塞尔协议》的国际金融机构是( )。","options":["国际货币基金组织","世界银行","国际清算银行","亚洲开发银行"],"answer":"C","expl":"****\n\n组织签署《巴塞尔协议》的国际金融机构是国际清算银行。本题考查国际金融机构体系的构成，属于较为偏僻的知识点，考生需注意几个重要的点，比如国际清算银行被称作 “央行的央行”，亚洲基础设施投资银行是首个由中国倡议设立的多边金融机构，以金砖国家为创始国的金砖国家新开发银行。","score":1},{"no":7,"type":"single","stem":"属于我国同业拆借市场利率的是","options":["LIBOR","SHIBOR","FDR","LPR"],"answer":"B","expl":"","score":1},{"no":8,"type":"single","stem":"以下不属于存款性公司运作特征的是( )。","options":["服务性","风险性","独立性","信用性"],"answer":"C","expl":"****\n\n存款性公司运作特征包括信用性、风险性、服务性。","score":1},{"no":9,"type":"single","stem":"下列不属于其他金融性公司的是( )。","options":["证券公司","保险公司","证券投资基金公司","商业银行"],"answer":"D","expl":"****\n\n金融性公司包括存款性公司和其他金融性公司，其他金融性公司包括证券公司、投资银行、基金公司、保险公司、信托公司、金融租赁公司、金融资产管理公司、金融担保公司以及资信评估公司等。","score":1},{"no":10,"type":"single","stem":"商业银行的业务经营原则不包括( )。","options":["安全性","流动性","盈利性","信用性"],"answer":"D","expl":"****\n\n商业银行的业务经营的三性原则：安全性、流动性、盈利性。","score":1},{"no":11,"type":"single","stem":"下列不适于作为货币政策操作目标的是( )。","options":["国债收益率","央行可自行决定的利率","基础货币","准备金"],"answer":"A","expl":"****\n\n货币政策操作目标包括准备金、基础货币、央行自行决定的利率(再贴现利率、再贷款利率、准备金存款利率、央行票据利率)、货币市场利率(同业拆借利率、回购利率、票据市场贴现率)。","score":1},{"no":12,"type":"single","stem":"利率发挥作用的条件不包括( )。","options":["利率品种的多样性","市场化的利率决定机制","合理的利率弹性","独立决策的市场主体"],"answer":"A","expl":"****\n\n利率发挥作用的基础性市场条件：独立决策的市场主体、市场化的利率决定机制、合理的利率弹性。","score":1},{"no":13,"type":"single","stem":"下列不属于资本市场的功能","options":["筹资融资平台","促进企业并购重组","产业结构升级","商业银行进行流动性管理的场所"],"answer":"D","expl":"****\n\n资本市场的功能：筹资和融资的平台，资源有效配置的场所，促进企业并购重组，促进产业结构优化升级，选项 D 是货币市场的功能。","score":1},{"no":14,"type":"single","stem":"下列不属于中央银行负债业务的是( )。","options":["货币发行","存款业务","贴现及放款","中央银行债券"],"answer":"C","expl":"****\n\n中央银行负债业务包括货币发行、存款、发行中央银行债券与票据，C 选项为中央银行资产业务。","score":1},{"no":15,"type":"single","stem":"以下不属于我国一般性货币政策工具的是( )。","options":["法定存款准备金率","再贴现政策","公开市场操作","贷款利率"],"answer":"D","expl":"****\n\n一般性货币政策工具包括法定存款准备金率、再贴现政策、公开市场操作。","score":1},{"no":16,"type":"single","stem":"衍生品的基本特征不包括( )。","options":["杠杆效应","高风险","跨期交易","存续期长"],"answer":"D","expl":"****\n\n与股票、有价证券的期限不同，衍生工具的存续期限都是短期性的，一般不超过 1 年，因为预测未来是很困难的事情，预测长期更难。","score":1},{"no":17,"type":"single","stem":"一般地，不被人们用来度量通胀程度的价格指数是( ).","options":["居民消费价格指数(CPI)","生产者价格指数(PPI)","GDP 平减指数","采购经理指数(PMI)"],"answer":"D","expl":"****\n\n常见的通胀度量指标有 3 种：CPI(居民消费价格指数)、PPI(生产者价格指数)、GDP 平减指数。PMI 是宏观经济变化的晴雨表，对国家经济活动的监测、预测和预警具有重要作用。","score":1},{"no":21,"type":"single","stem":"当折现率发生变化时，下列哪个指标不受影响( )。","options":["净现值","内部收益率","调整的内部收益率","现值指数"],"answer":"B","expl":"****\n\n因为 IRR 法的贴现率为项目的内部报酬率，所以折现率不会影响 IRR 法的结果。","score":1},{"no":22,"type":"single","stem":"关于项目现金流描述错误的是","options":["可以有很多","机会成本不考虑","沉没成本不考虑","是税后的"],"answer":"B","expl":"","score":1},{"no":23,"type":"single","stem":"关于权衡理论，说法错误的是( )。","options":["认为公司存在最优的资本结构","认为规模大的公司杠杆率高","认为盈利能力强的公司杠杆率低","(缺失)"],"answer":"C","expl":"****\n\n权衡理论认为杠杆比例与其盈利能力正相关。公司的盈利能力越强，其破产概率和破产成本都越低，而且利息税盾的价值越高，杠杆比例越高。","score":1},{"no":24,"type":"single","stem":"关于无税 MM 定理，下列错误的是( )。","options":["认为企业价值与资本成本无关","认为加权平均资本成本与资本结构无关","认为权益资本成本与资本结构无关","资本结构决定价值在股东和债权人之间的分配比例"],"answer":"C","expl":"****\n\n根据无税 MM 定理，随着企业负债的增加，其权益资本成本也随之上升。","score":1},{"no":28,"type":"single","stem":"下列关于公司破产的说法正确的是( )。","options":["破产清算的管理费属于间接成本","债权人比股东更在意公司破产","破产时内部员工流失属于间接成本","破产清算时公司资产价值显得更高"],"answer":"C","expl":"","score":1},{"no":29,"type":"single","stem":"关于认股权证正确的是","options":["认股权证是不支付利息的","认股权证是没有股东权益","认股权证行权时，不会增加股票数量","(选项缺失)"],"answer":"B","expl":"","score":1},{"no":2,"type":"multi","stem":"关于费雪方程式，说法正确的是( )。","options":["关注货币需求量与物价水平变动的关系","费雪认为短期内货币流通速度可视为不变的常量","货币需求量×流通速度=物价×交易总量","从微观角度分析货币需求","基于现金余额说分析"],"answer":"D","expl":"****\n\nBC。D 选项错误，费雪方程式从宏观角度分析货币需求。E 选项错误，费雪方程式基于现金交易说。B 选项正确，货币流通速度 V 是由诸如银行及信用机构的组织结构、效率，工业集中程度，人们的货币支出习惯等制度因素决定的，这些因素变动缓慢，故 V 在短期内可视为不变的常量。","score":2},{"no":4,"type":"multi","stem":"内部收益率指标的局限性有( )。","options":["可能出现多个内部收益率共存的现象","投资规模不同时，可能与 NPV 的决策结果不同","投资期限不同时，可能与 NPV 的决策结果不同","假设各期现金流按照项目的内部收益率进行再投资","投资决策的主观性很大"],"answer":"E","expl":"****\n\nBCD。E 选项错误，内部收益率指标并不存在很强的主观性，内部收益率反映的是投资者的实际投资收益，运用这一指标进行投资决策的标准是：当一个投资项目的内部收益率大于资本成本时，则接受项目，否则，应拒绝项目。","score":2},{"no":5,"type":"multi","stem":"关于股票回购，说法正确的是( ).","options":["股票回购后，公司的每股收益提高","可以一次性使用多余现金","可以迅速改变公司的资本结构","与发放现金股利相比，会减少股东的税收支出","向市场传递了公司股票的价格被低估的信息"],"answer":"A","expl":"****\n\nBCDE。A 选项正确，股票回购会提升每股收益，每股收益二净利润/股数，回购是上市公司用现金等方式收回部分在外流通的股票，所以在净利润不变的情况下，流通中的股票数量减少，那么每股收益就会增加.B 选项正确，当公司偶然有一笔多余的现金需要分配，但又不希望改变现金股利分配政策时，可采用股票回购的方式向股东分发这笔现金。","score":2}],"sub":[{"no":1,"type":"term","stem":"货币的时间价值","score":4,"body":"①定义：是指同等金额的货币其现在的价值要大于其未来的价值。\n②体现：货币的时间价值体现为利息和利率。利息是在借贷关系中资金借入方支付给资金贷出方的报酬。利率是指借贷期满的利息总额与贷出本金总额的比例。\n③作用：时间价值揭示了资金在不同时点上价值量的大小，要正确进行决策，就需要在时间价值的基础上对不同时点的现金流进行价值判断。\n④意义：货币的时间价值作为评价公司理财活动的基本标准，对公司进行投资决策筹资决策和股利分配决策具有重要意义。","points":["定义：是指同等金额的货币其现在的价值要大于其未来的价值。","体现：货币的时间价值体现为利息和利率。利息是在借贷关系中资金借入方支付给资金贷出方的报酬。利率是指借贷期满的利息总额与贷出本金总额的比例。","作用：时间价值揭示了资金在不同时点上价值量的大小，要正确进行决策，就需要在时间价值的基础上对不同时点的现金流进行价值判断。","意义：货币的时间价值作为评价公司理财活动的基本标准，对公司进行投资决策筹资决策和股利分配决策具有重要意义。"]},{"no":2,"type":"term","stem":"超额准备金","score":4,"body":"①定义：由于法定准备金商业银行不能动用，为了满足运营中的现金提取、支付清算资产运用等需要，商业银行实际持有的准备金必须多于法定存款准备金。商业银行超过法定存款准备金而保留的准备金称为超额准备金。\n②形式：—是中央银行账户上超过法定存款准备金的存款；二是商业银行业务库中的库存现金。超额准备金占全部存款的比率就是超额准备金率。\n③对货币供给的影响：超额准备金与商业银行可贷资金量此消彼长。超额准备金越多，可贷资金就越少，存款派生能力就越小，货币供给量越小。\n④决定因素：超额准备金的多少取决于商业银行的经营特点与风险管理偏好，并非中央银行所能完全控制，具有某些内生性。","points":["定义：由于法定准备金商业银行不能动用，为了满足运营中的现金提取、支付清算资产运用等需要，商业银行实际持有的准备金必须多于法定存款准备金。商业银行超过法定存款准备金而保留的准备金称为超额准备金。","形式：—是中央银行账户上超过法定存款准备金的存款；二是商业银行业务库中的库存现金。超额准备金占全部存款的比率就是超额准备金率。","对货币供给的影响：超额准备金与商业银行可贷资金量此消彼长。超额准备金越多，可贷资金就越少，存款派生能力就越小，货币供给量越小。","决定因素：超额准备金的多少取决于商业银行的经营特点与风险管理偏好，并非中央银行所能完全控制，具有某些内生性。"]},{"no":3,"type":"term","stem":"商业信用","score":4,"body":"①定义：指在工商企业之间买卖商品时，卖方以商品形式向买方提供的信用。\n②典型形式：赊销。在典型商业信用中，实际上包含两种同时发生的经济行为，商品买卖与货币借贷。\n③积极作用：在企业之间建立稳定顺畅的联系，是商品生产正常进行的必然要求，也是经济发展的内在要求。\n④局限性：在规模、方向、期限、流通范围上具有局限性，银行信用的发展克服了商业信用的局限性，但不会排斥商业信用，相反，二者有着极为密切的联系。","points":["定义：指在工商企业之间买卖商品时，卖方以商品形式向买方提供的信用。","典型形式：赊销。在典型商业信用中，实际上包含两种同时发生的经济行为，商品买卖与货币借贷。","积极作用：在企业之间建立稳定顺畅的联系，是商品生产正常进行的必然要求，也是经济发展的内在要求。","局限性：在规模、方向、期限、流通范围上具有局限性，银行信用的发展克服了商业信用的局限性，但不会排斥商业信用，相反，二者有着极为密切的联系。"]},{"no":4,"type":"term","stem":"现值盈亏平衡点","score":4,"body":"①定义：也称财务盈亏平衡点，是考虑了资金的时间价值或机会成本后，项目达到盈亏平衡所要求的产量，现值盈亏平衡点将项目盈亏平衡状态定义为净现值等于零的状态。\n②公式：财务盈亏平衡点=，式中：EAC 为约当年均成本，通常是连本带利的年平均资金成本，是项目全部现金流出现值的年金价值；F 为固定成本；DEP 为折旧；T 为所得税税率.\n③与传统盈亏平衡的区别：传统盈亏平衡以盈利为零作为盈亏平衡点，没有考虑资金的时间价值，是一种静态分析，现值盈亏平衡点将资金的时间价值考虑在内，变静态分析为动态分析。\n④优点：不仅考虑资金时间价值，而且可以根据企业所要求的不同的基准收益率确定不同的盈亏平衡点，使企业的投资和经营决策更全面、准确，从而提高决策的科学性和可靠性。","points":["定义：也称财务盈亏平衡点，是考虑了资金的时间价值或机会成本后，项目达到盈亏平衡所要求的产量，现值盈亏平衡点将项目盈亏平衡状态定义为净现值等于零的状态。","公式：财务盈亏平衡点=，式中：EAC 为约当年均成本，通常是连本带利的年平均资金成本，是项目全部现金流出现值的年金价值；F 为固定成本；DEP 为折旧；T 为所得税税率.","与传统盈亏平衡的区别：传统盈亏平衡以盈利为零作为盈亏平衡点，没有考虑资金的时间价值，是一种静态分析，现值盈亏平衡点将资金的时间价值考虑在内，变静态分析为动态分析。","优点：不仅考虑资金时间价值，而且可以根据企业所要求的不同的基准收益率确定不同的盈亏平衡点，使企业的投资和经营决策更全面、准确，从而提高决策的科学性和可靠性。"]},{"no":5,"type":"term","stem":"财务风险","score":4,"body":"①定义：负债经营给股东收益带来的风险。\n②解释：如果资本全部由股东投入，股东只承受营业风险。如果引入债务资本，由于债权人在收益的分配上优先于公司股东，所以，对股东收益的税后利润而言，债权人的收益利息是固定的，从而增加了股东收益的不确定性。\n③衡量：负债经营导致的财务风险可用财务杠杆来反映,财务杠杆通常用财务杠杆系数 DFL 衡量, DFL  ΔEPS / EPS EBIT。 ΔEBIT / EBIT EBIT  I\n④影响因素：息税前利润、负债的利息率、资本结构等。","points":["定义：负债经营给股东收益带来的风险。","解释：如果资本全部由股东投入，股东只承受营业风险。如果引入债务资本，由于债权人在收益的分配上优先于公司股东，所以，对股东收益的税后利润而言，债权人的收益利息是固定的，从而增加了股东收益的不确定性。","衡量：负债经营导致的财务风险可用财务杠杆来反映,财务杠杆通常用财务杠杆系数 DFL 衡量, DFL  ΔEPS / EPS EBIT。 ΔEBIT / EBIT EBIT  I","影响因素：息税前利润、负债的利息率、资本结构等。"]},{"no":1,"type":"short","stem":"简述间接融资的优点及其局限性.","score":8,"body":"间接融资是指资金的盈余方和赤字方以金融机构为中介而进行的融资活动。金融机构首先需要与盈余方先建立债权债务关系，从盈余方融得资金，然后再与赤字方建立债权债务关系，向赤字方提供资金。","points":["间接融资是指资金的盈余方和赤字方以金融机构为中介而进行的融资活动","金融机构首先需要与盈余方先建立债权债务关系，从盈余方融得资金，然后再与赤字方建立债权债务关系，向赤字方提供资金"]},{"no":2,"type":"short","stem":"简述凯思斯货币需求理论的三大动机。","score":8,"body":"简述凯思斯货币需求理论的三大动机。\n\n凯恩斯货币需求理论从人们持有货币的动机入手。他认为，人们之所以需要持有货币，是因为存在流动性偏好这种普遍的心理倾向，而人们偏好货币的流动性是出于交易动机、预防动机和投机动机。\n\n(1)交易动机人们为了应付日常的商品交易而必然需要持有一定数量的货币，由此产生了持币的交易动机。基于交易动机而产生的货币需求称为货币的交易需求，与收入正相关。鲍莫尔的平方根定律，提出交易性货币需求也受利率变动的影响(相反关系)。\n\n(2)预防动机凯恩斯认为，生活中经常会出现一些未曾预料的、不确定的支出，为此，人们需要持有一定量的货币在手中，这类需求称为货币的预防需求，与收入正相关。惠伦、米勒等提出的立方根定律，认为预防性货币需求与利率之间也存在反向变动的关系。\n\n(3)投机动机投机动机是凯恩斯货币需求理论中最具创新的部分。凯恩斯认为，人们持有货币除了满足交易需求和应付意外支出外，还为了保存价值或财富。保存财富的资产分为货币和债券两类，如果人们确信现行利率水平高于正常值，预期利率水平将下降，债券价格将会上升，人们就会多持有债券；反之则倾向于多持有货币，因此投机动机引起的投机性货币需求与利率水平负相关。M  M1  M 2  L1 (Y)  L 2 (i)  L(Y,i) 其中，M1：交易动机和预防动机货币需求量，即交易性货币需求，M2：投机性货币需求量，Y：收入，i ：利率。M1 是 Y 的递增函数,.是 i 的递减函数。托宾的资产组合理论发展了凯恩斯的投机性货币需求，解释了凯恩斯理论没能解释的货币与债券资产同时被持有的现象，更符合经济现实。","points":["简述凯思斯货币需求理论的三大动机。 凯恩斯货币需求理论从人们持有货币的动机入手。他认为，人们之所以需要持有货币，是因为存在流动性偏好这种普遍的心理倾向，而人们偏好货币的流动性是出于交易动机、预防动机和投机动机。","交易动机人们为了应付日常的商品交易而必然需要持有一定数量的货币，由此产生了持币的交易动机。基于交易动机而产生的货币需求称为货币的交易需求，与收入正相关。鲍莫尔的平方根定律，提出交易性货币需求也受利率变动的影响(相反关系)。","预防动机凯恩斯认为，生活中经常会出现一些未曾预料的、不确定的支出，为此，人们需要持有一定量的货币在手中，这类需求称为货币的预防需求，与收入正相关。惠伦、米勒等提出的立方根定律，认为预防性货币需求与利率之间也存在反向变动的关系。","投机动机投机动机是凯恩斯货币需求理论中最具创新的部分。凯恩斯认为，人们持有货币除了满足交易需求和应付意外支出外，还为了保存价值或财富。保存财富的资产分为货币和债券两类，如果人们确信现行利率水平高于正常值，预期利率水平将下降，债券价格将会上升，人们就会多持有债券；反之则倾向于多持有货币，因此投机动机引起的投机性货币需求与利率水平负相关。M  M1  M 2  L1 (Y)  L 2 (i)  L(Y,i) 其中，M1：交易动机和预防动机货币需求量，即交易性货币需求，M2：投机性货币需求量，Y：收入，i ：利率。M1 是 Y 的递增函数,.是 i 的递减函数。托宾的资产组合理论发展了凯恩斯的投机性货币需求，解释了凯恩斯理论没能解释的货币与债券资产同时被持有的现象，更符合经济现实。"]},{"no":1,"type":"essay","stem":"2023 年美国十年期国债收益率持续低于两年期国债收益率，出现了利率倒挂现象，请结合利率期限结构和利率的影响因素解释利率倒挂的原因。","score":14,"body":"2023 年美国十年期国债收益率持续低于两年期国债收益率，出现了利率倒挂现象，请结\n\n利率曲线一种图形表示，它描绘了不同到期期限的债券的利率或收益率。在理想的情况下，利率曲线通常是向上倾斜的，也就是说，长期国债的收益率应该高于短期国债的收益率。这种现象，金融学上常用“利率期限结构理论”来解释。根据预期理论，长期债券的预期收益率取决于到期前人们对短期利率预期的几何平均值，若短期利率高，则远期利率下降的可能性高，从而长期债券的到期收益率低于短期债券的，收益率曲线倾向于向下倾斜，反之则相反。在预期理论的基础上，考虑期限选择和流动性升水因素后，投资者承担更长期的投资风险，期待获得更高的回报。因此，对于更长期的债券，投资者需要一个更高的收益率来补偿他们承担的额外风险，收益率曲线向下倾斜的概率会大大降低，向上倾斜的概率则会大为增加，收益率曲线通常会表现为向上倾斜。美债倒挂是指市场上短期国债的收益率高于长期国债的收益率，这种现象通常被视为经济衰退的信号。出现倒挂后，投资者会将资金转移到短期国债上，以保护资金安全并获取更高收益。美债倒挂可能会导致金融市场动荡，股市下跌，企业投资减少，消费者信心下降等问题.结合当前情况来看，倒挂的原因如下：\n\n(1)货币政策影响通常情况下，国债被认为是无信用风险的投资，因此在忽略期限溢价等因素的前提下，短期美国国债的收益率可以近似地视为无风险利率。由于短期债券受到流动性影响较大，美联储货币政策因此成为驱动美国国债短期收益率的主要力量。当下由于美联储 40 年来最激进的加息政策，短期债券利率快速抬升，而长期国债的收益率相对下降，从而导致美债倒挂。\n\n(2)经济前景预期根据利率期限结构理论，收益率曲线向下倾斜往往意味着人们预期未来利率将下行，经济下行，公众对未来经济的预期较为悲观。从现实情况来看，美联储加息抑制了总需求，带来了美国经济衰退以及通胀得以控制的预期，市场对美国经济前景存在着一定程度上的担忧和悲观情绪，经济增长放缓和衰退风险加剧，导致美国长期国债的收益率受到下行压力。\n\n(3)预期未来短期利率下降货币政策的目标通常是使实际利率接近或接近自然利率，以实现经济稳定和可持续增长，而自然利率又与潜在经济增速密切相关。从目前情况下，可以观察到美国市场仍认为未来 12 个月陷入衰退仍有较高的概率，这也意味着市场预期未来经济增速会受加息影响而不断下行，即预期未来的实际利率要比当下低得多，拖累了长期利率的上行。\n\n(4)国际经济环境根据期限选择和流动性升水理论，长期利率等于期限内预期短期利率平均值加上流动性溢价，如果其他国家的经济状况出现问题，这些国家发行的国债信用等级就会下降，一些长线资金就可能流入美国国债市场寻求长期投资机会，从而使美国中长期国债需求和价格上涨，长期收益率下降从而导致美债倒挂。此外，美联储在疫情期间量化宽松政策，大量买入中长期国债；人口老龄化加剧，长期投资者规模扩大等因素，也可能会造成流动性溢价下降，从而出现利率倒挂现象。","points":["2023 年美国十年期国债收益率持续低于两年期国债收益率，出现了利率倒挂现象，请结 利率曲线一种图形表示，它描绘了不同到期期限的债券的利率或收益率。在理想的情况下，利率曲线通常是向上倾斜的，也就是说，长期国债的收益率应该高于短期国债的收益率。这种现象，金融学上常用“利率期限结构理论”来解释。根据预期理论，长期债券的预期收益率取决于到期前人们对短期利率预期的几何平均值，若短期利率高，则远期利率下降的可能性高，从而长期债券的到期收益率低于短期债券的，收益率曲线倾向于向下倾斜，反之则相反。在预期理论的基础上，考虑期限选择和流动性升水因素后，投资者承担更长期的投资风险，期待获得更高的回报。因此，对于更长期的债券，投资者需要一个更高的收益率来补偿他们承担的额外风险，收益率曲线向下倾斜的概率会大大降低，向上倾斜的概率则会大为增加，收益率曲线通常会表现为向上倾斜。美债倒挂是指市场上短期国债的收益率高于长期国债的收益率，这种现象通常被视为经济衰退的信号。出现倒挂后，投资者会将资金转移到短期国债上，以保护资金安全并获取更高收益。美债倒挂可能会导致金融市场动荡，股市下跌，企业投资减少，消费者信心下降等问题.结合当前情况来看，倒挂的原因如下：","货币政策影响通常情况下，国债被认为是无信用风险的投资，因此在忽略期限溢价等因素的前提下，短期美国国债的收益率可以近似地视为无风险利率。由于短期债券受到流动性影响较大，美联储货币政策因此成为驱动美国国债短期收益率的主要力量。当下由于美联储 40 年来最激进的加息政策，短期债券利率快速抬升，而长期国债的收益率相对下降，从而导致美债倒挂。","经济前景预期根据利率期限结构理论，收益率曲线向下倾斜往往意味着人们预期未来利率将下行，经济下行，公众对未来经济的预期较为悲观。从现实情况来看，美联储加息抑制了总需求，带来了美国经济衰退以及通胀得以控制的预期，市场对美国经济前景存在着一定程度上的担忧和悲观情绪，经济增长放缓和衰退风险加剧，导致美国长期国债的收益率受到下行压力。","预期未来短期利率下降货币政策的目标通常是使实际利率接近或接近自然利率，以实现经济稳定和可持续增长，而自然利率又与潜在经济增速密切相关。从目前情况下，可以观察到美国市场仍认为未来 12 个月陷入衰退仍有较高的概率，这也意味着市场预期未来经济增速会受加息影响而不断下行，即预期未来的实际利率要比当下低得多，拖累了长期利率的上行。","国际经济环境根据期限选择和流动性升水理论，长期利率等于期限内预期短期利率平均值加上流动性溢价，如果其他国家的经济状况出现问题，这些国家发行的国债信用等级就会下降，一些长线资金就可能流入美国国债市场寻求长期投资机会，从而使美国中长期国债需求和价格上涨，长期收益率下降从而导致美债倒挂。此外，美联储在疫情期间量化宽松政策，大量买入中长期国债；人口老龄化加剧，长期投资者规模扩大等因素，也可能会造成流动性溢价下降，从而出现利率倒挂现象。"]},{"no":2,"type":"essay","stem":"结合功能监管和机构监管的优缺点，谈谈对建立国家金融监督管理总局的看法。","score":14,"body":"结合功能监管和机构监管的优缺点，谈谈对建立国家金融监督管理总局的看法。\n\n(1)功能监管功能监管又叫业务监管，是按照经营业务的性质来划分监管对象的.监管机构针对不同业务进行监管，而不管从事这些业务经营的机构性质如何。功能监管的优点如下：\n\n①根据金融业务进行监管，可以保证同类金融业务的监管力度一致。\n\n②功能监管可以避免机构监管中业务的监管力度致，可以缓解监管套利。\n\n③避免出现的监管真空和重复监管现象，为全融机构创造公平竞争的市场环境。功能监管的缺点如下：功能监管对监管当局的监管实施门槛要求较高，尤其在金融创新的推动下，功能监管的实施门槛会越来越高。\n\n(2)机构监管机构监管是指按不同机构的类别来划分监管对象。机构监管的优点如下：监管门槛相对较低，易于实施。监管当局不需要具体评判金融机构的各项业务，只需要依据该金融机构所从事的主要业务或者从事的主要领域，按该领域的法律法规进行监管即可。机构监管的缺点如下：容易形成监管真空和重复监管问题。促使金融机构进行监管套利，进而使得机构监管效率大大降低。\n\n(3)建立国家金融监督管理总局的意义在金融规模较小、金融业务较简单的时候，采用机构监管相对合理。由于每家机构采用的业务相对单一，机构监管由于实施门槛较低，对机构进行监管就可以很好地限制金融风险的产生.随着金融发展、金融业务日趋复杂，单家机构很少只从事某一单类金融业务.此外，金融创新的逐渐推进，金融机构与其他金融机构的合作日益紧密，机构监管很难适应这一趋势，功能监管的重要性越来越高。2023 年 3 月，《党和国家机构改革方案》开启了新一轮金融监管体制改革，设立国家金融监管总局取代原银保监会，监管机构改革之后，形成了“-委-行-局-会”格局，从根本上理顺了机构监管和功能监管的关系。\n\n①解决了原有监管体系职能分散与重复、监管能力不足的问题原有体系下，金融监管的整体职责分属于银保监会、证监会以及中国人民银行三家机构，监管职能相对分散，同时部分领域也存在重复监管问题、行政资源的浪费问题.并且银保监会、证监会作为国务院直属的事业单位，相较于行政单位存在执法能力欠缺等问题。而此次组建国家金融监督管理总局，将金融监管职责进行统一集中，对于防止监管职能缺失缺位，提升监管效能等具有重要意义。\n\n②宏观审慎监管框架更加牢固伴随着互联网和数字经济的兴起，传统银行业、保险业都开始拓展数字化业务，或产生完全数字化的在线金融机构，金融科技公司，混业化特征更加明显，金融风险交织地更为复杂。国家金融监督管理总局的建立，进一步扩大了除证券行业之外的金融监管范围，有效弥补了旧有机构监管模式下的监管空白，对防范化解重大金融风险，稳定金融大局具有重要意义。\n\n③微观审慎监管范围更加严密此次国家金融监管机构改革，在职能划分上更加科学，将消费者、投资者与金融集团等微观主体统一纳入总局管理范围，使得其能够更加集中和精准地进行微观监管，有利于完善功能监管主体；通过有效加强基层金融监管执法，有利于将穿透式监管运用到底；将金融消费者、投资者保护与金融集团监管落到实处，有利于进一步体现了行为监管的重要作用。所以说，此次机构改革也是我国在金融业微观审慎监管机制方面的重要整合与合理分配。此外，金融监管总局的建立，对于加强中央对于金融监管工作的统一领导，实现中央与地方对于金融工作的统筹协调，进一步精简机构，着力提升监管效能为，后疫情时代经济稳定复苏提供保障具有重要意义。","points":["结合功能监管和机构监管的优缺点，谈谈对建立国家金融监督管理总局的看法。 (1)功能监管功能监管又叫业务监管，是按照经营业务的性质来划分监管对象的.监管机构针对不同业务进行监管，而不管从事这些业务经营的机构性质如何。功能监管的优点如下：","根据金融业务进行监管，可以保证同类金融业务的监管力度一致。","功能监管可以避免机构监管中业务的监管力度致，可以缓解监管套利。","避免出现的监管真空和重复监管现象，为全融机构创造公平竞争的市场环境。功能监管的缺点如下：功能监管对监管当局的监管实施门槛要求较高，尤其在金融创新的推动下，功能监管的实施门槛会越来越高。 (2)机构监管机构监管是指按不同机构的类别来划分监管对象。机构监管的优点如下：监管门槛相对较低，易于实施。监管当局不需要具体评判金融机构的各项业务，只需要依据该金融机构所从事的主要业务或者从事的主要领域，按该领域的法律法规进行监管即可。机构监管的缺点如下：容易形成监管真空和重复监管问题。促使金融机构进行监管套利，进而使得机构监管效率大大降低。 (3)建立国家金融监督管理总局的意义在金融规模较小、金融业务较简单的时候，采用机构监管相对合理。由于每家机构采用的业务相对单一，机构监管由于实施门槛较低，对机构进行监管就可以很好地限制金融风险的产生.随着金融发展、金融业务日趋复杂，单家机构很少只从事某一单类金融业务.此外，金融创新的逐渐推进，金融机构与其他金融机构的合作日益紧密，机构监管很难适应这一趋势，功能监管的重要性越来越高。2023 年 3 月，《党和国家机构改革方案》开启了新一轮金融监管体制改革，设立国家金融监管总局取代原银保监会，监管机构改革之后，形成了“-委-行-局-会”格局，从根本上理顺了机构监管和功能监管的关系。","解决了原有监管体系职能分散与重复、监管能力不足的问题原有体系下，金融监管的整体职责分属于银保监会、证监会以及中国人民银行三家机构，监管职能相对分散，同时部分领域也存在重复监管问题、行政资源的浪费问题.并且银保监会、证监会作为国务院直属的事业单位，相较于行政单位存在执法能力欠缺等问题。 "支付结算类","投资银行类","代理类","银行卡类"],"answer":"B","expl":"****\n\n典型的创新的表外业务有投资银行类、担保类、承诺类、交易类，A、C、D 选项均属于传统的中间业务。","score":1},{"no":15,"type":"single","stem":"宏观审慎政策和货币政策之间的相互影响体现在（B","options":["物价与汇率","物价与杠杆率","物价与金融资产负债率","物价与收益率"],"answer":"B","expl":"****\n\n货币政策在影响物价方面有优势，宏观审慎政策在影响系统性金融风险方面有优势。根据蒙代尔有效市场分类原则可知，为了尽可能地实现物价稳定和金融稳定这两类目标，应该让货币政策针对物价稳定，而让宏观审慎政策针对金融稳定。","score":1},{"no":18,"type":"single","stem":"央行创设的SLF、MLF、TMLF、抵押补充贷款和一般性货币政策工具的区别。","options":["信用放款","质押放款","注册通过","审核通过"],"answer":"B","expl":"**答案：见解析**\n\n题 目 回 忆 有 问 题 , 按 照 回 忆 版 ， BC 均 正 确 。 A 错 误 ， 货 币 学 派 主 张 单 一 货 币 规则。D错误，理性预期学派认为货币是中性的，因为它最终只能导致价格水平的提高，而一切实际变量最终将保持不变，货币政策无效。凯恩斯的货币需求函数重视利率的主导作用。","score":1},{"no":20,"type":"single","stem":"在无税条件下，假设两个公司，二者EBIT 一致，均为 1500。已知有负债公司的债务为 500，利率为 8%。无负债公司的股东权益资本成本为 15%。根据无税 MM 理论，有负债公司的价值是多少。","options":["5000","10000","10400","15000"],"answer":"B","expl":"**答案：见解析**\n\n无负债公司的价值VU=EBIT/R0=1500/15%=10000，在无税条件下，有负债、无负债公司价值相等。","score":1},{"no":21,"type":"single","stem":"根据优序融资理论，公司优先选择的融资方式为（ B ）。","options":["一般优先股","债务融资","可转换优先股","普通股"],"answer":"B","expl":"****\n\n根据优序融资理论，公司在为投资项目筹集资金时，首先选内部融资，其次才考虑外部融资；如果需要进行外部筹资，公司将首先选高等级债务工具，然后选低等级债务工具，例如可转债和可转换优先股，最后才选普通股票。","score":1},{"no":22,"type":"single","stem":"资本预算中在估计项目现金流时不考虑的是（ A ）。","options":["利息支出","项目带来的负面影响","折旧","投资增加"],"answer":"A","expl":"****\n\n资本预算时，假定投资为全权益资本，不考虑投资资金的来源，即不论投资资金是来源于债务还是股权，估计利润和现金流时都不考虑利息支出，它是投资所带来的收益流，即它是债务类资金投入项目并给债权人带来的收益，与项目的获利性直接相关。","score":1},{"no":23,"type":"single","stem":"公司预计下一年的每股收益5元，分配股利3元，债务为500，利率8%，ROE是20%，资本成本是12%，求市盈率。","options":["5","10","15","20"],"answer":"C","expl":"**答案：见解析**\n\n市 盈 率 = 股 价 / 每 股 收 益 。 再 投 资 比 率 = （ 5-3 ） /5=40% ， 股 利 增 长 率 g=ROE×b=20%×40%=8% ， 股 价 P=DIV1/(Rs-g)=3/(12%-8%)=75 元 。 市 盈 率 =75/5=15。","score":1},{"no":1,"type":"multi","stem":"商业银行的经营原则包括（ BCD ）。","options":["收益性","流动性","安全性","盈利性","普惠性"],"answer":"BCD","expl":"****\n\n商业银行的经营原则安全性、流动性、盈利性。","score":2},{"no":2,"type":"multi","stem":"货币政策的最终目标包括（ ABCDE ）。","options":["经济增长","充分就业","物价稳定","国际收支平衡","金融稳定"],"answer":"ABCDE","expl":"****\n\n货币政策的最终目标包括币值稳定、充分就业、经济增长、国际收支平衡、金融稳定。","score":2},{"no":3,"type":"multi","stem":"凯恩斯认为货币需求的动机包括（ ABC ）。","options":["交易动机","预防动机","投机动机","利己动机"],"answer":"ABC","expl":"****\n\n凯恩斯认为货币需求的动机包括交易动机、预防动机和投机动机。","score":2},{"no":5,"type":"multi","stem":"关于贴现回收期，下列说法正确的是（ ABCDE ）。","options":["考虑了现金流量的时间价值","决策依据存在主观性","没有考虑回收期以后的现金流量","反映收回投资所需要的年限","反映初始投资收回速度的快慢"],"answer":"ABCDE","expl":"****\n\n静态投资回收期就是使项目的预期收入流的累加值等于初始现金流量所需要的时期。它反映收回投资所需要的年限。贴现回收期考虑了现金流量的时间价值，企业必须有一定的投资回收期接受标准，如果计算的投资回收期小于设定的接受标准，则该方案可以被接受，决策依据存在主观性，没有考虑回收期以后的现金流量，反映初始投资收回速度的快慢。","score":2}],"sub":[{"no":1,"type":"calc","stem":"某公司预计下一年EPS为5元，每股发放股利为3元，ROE为20%，无风险利率为6%，β 为1.2，市场组合的收益为11%，求此时公司的股票价格。","score":10,"body":"权益资本成本Rs=6%+1.2×（11%-6%）=12% 再投资比率=（5-3）/5=40% 股利增长率g=ROE×b=20%×40%=8% 股价P=DIV1/(Rs-g)=3/(12%-8%)=75元。","points":["权益资本成本Rs=6%+1.2×（11%-6%）=12% 再投资比率=（5-3）/5=40% 股利增长率g=ROE×b=20%×40%=8% 股价P=DIV1/(Rs-g)=3/(12%-8%)=75元"],"steps":[{"label":"权益资本成本 Rs","formula":"Rs = Rf + β(Rm − Rf)","value":12,"unit":"%"},{"label":"再投资比率 b","formula":"b = (EPS − 每股股利) / EPS","value":40,"unit":"%"},{"label":"股利增长率 g","formula":"g = ROE × b","value":8,"unit":"%"},{"label":"股价 P","formula":"P = DIV1 / (Rs − g)","value":75,"unit":"元"}],"distractors":["WACC = D/(D+E)×Rd×(1−T) + E/(D+E)×Re","PV = C / r（永续年金）","PI = (NPV + 初始投资) ÷ 初始投资"],"note":"CAPM 求权益成本，再走股利增长模型定价。"},{"no":2,"type":"calc","stem":"某公司投资一个项目，初始投资额为200万元，预计持续4年，有50%的概率成功，每年税 后 现 金 流 入 100 万 ， 有 50% 的 概 率 失 败 ， 每 年 税 后 现 金 流 入 20 万 ， 公 司 的 折 现 率 为 10%，对应4年期的年金现值系数为3.1699。（1）求该项目的NPV，判断能否投资该项目。（2）如果项目失败，公司在第一年末放弃该项目，收到现金流100万，此时NPV是多少，能否投资？","score":10,"body":"（1）NPV=（50%×100+50%×20）×3.1699 - 200 = -9.806万元，拒绝投资。\n\n（2）NPV=（50%×100×3.1699）+（20+100）/（1+10%）×50% - 200 = 13.04 万元，接受投资。","points":["NPV=（50%×100+50%×","×3.1699 - 200 = -9.806万元，拒绝投资。；NPV=（50%×100×3.16","/（1+10%）×50% - 200 = 13.04 万元，接受投资。"],"steps":[{"label":"情形一 NPV","formula":"期望年现金流 × 年金现值系数 − 初始投资","value":-9.806,"unit":"万元"},{"label":"情形二 NPV","formula":"成功情景现值 + 失败情景残值现值 − 初始投资","value":13.04,"unit":"万元"}],"distractors":["P = DIV1 / (Rs − g)","PL = (NPV + 初始投资) ÷ 初始投资","g = ROE × b"],"note":"两问都算 NPV，第一问不放弃、第二问可放弃。"},{"no":3,"type":"calc","stem":"某公司现有发行在外的普通股50万股，外面10万股股票，回购前每股收益为8元，股票在除息日后的价格为20元，问：（1）回购价格为多少?（2）回购数目为多少股?（3）回购之后的每股收益为多少？","score":10,"body":"（1）（2）设回购价格为P，回购股数为N，PN=500000 由①②得，P =25元，N=20000股\n\n（3）回购之后的每股收益=100000×8/（100000-20000）=10。","points":["（1）（2）设回购价格为P，回购股数为N，PN=500000 由","得，P =25元，N=20000股 （3）回购之后的每股收益=100000×8/（100000-20000）=10。"]},{"no":1,"type":"term","stem":"基础货币","score":4,"body":"①定义：又称强力货币或高能货币，是指处于流通中由社会公众所持有的现金及银行体系准备金的总和。\n②作用：基础货币是货币创造的基础，其数额大小对货币供给总量具有决定性的作用。\n③构成：流通中的现金、法定准备金、超额准备金（在中央银行账户上超过法定存款准备金的存款、商业银行业务库中的库存现金）。\n④影响因素：中央银行通过资产业务投放基础货币，主要包括公开市场操作、再贴现/贷款、买卖外汇等。通过负债业务调节基础货币，主要包括发行债券、中央银行票据、正回购等。","points":["定义：又称强力货币或高能货币，是指处于流通中由社会公众所持有的现金及银行体系准备金的总和。","作用：基础货币是货币创造的基础，其数额大小对货币供给总量具有决定性的作用。","构成：流通中的现金、法定准备金、超额准备金（在中央银行账户上超过法定存款准备金的存款、商业银行业务库中的库存现金）。","影响因素：中央银行通过资产业务投放基础货币，主要包括公开市场操作、再贴现/贷款、买卖外汇等。通过负债业务调节基础货币，主要包括发行债券、中央银行票据、正回购等。"]},{"no":2,"type":"term","stem":"菲利普斯曲线","score":4,"body":"①定义：是表示通胀与失业之间关系的曲线。通胀率高时，失业率低；通胀率低时，失业率高。\n②政策含义：通货膨胀与失业之间存在一种替代关系：要使失业率保持在较低的水平，就必须忍受较高的通货膨胀率。\n③质疑：弗里德曼的“自然失业率假说”认为，在长期内经济主体将不断调整其通货膨胀预期，使之与实际的通货膨胀率相一致，因此无论通货膨胀水平多高，与之相对应的都只是自然失业率。通过增发货币的方式来维持高就业水平不可取。\n④图形：","points":["定义：是表示通胀与失业之间关系的曲线。通胀率高时，失业率低；通胀率低时，失业率高。","政策含义：通货膨胀与失业之间存在一种替代关系：要使失业率保持在较低的水平，就必须忍受较高的通货膨胀率。","质疑：弗里德曼的“自然失业率假说”认为，在长期内经济主体将不断调整其通货膨胀预期，使之与实际的通货膨胀率相一致，因此无论通货膨胀水平多高，与之相对应的都只是自然失业率。通过增发货币的方式来维持高就业水平不可取。"]},{"no":3,"type":"term","stem":"基准利率","score":4,"body":"①定义：是在多种利率并存的条件下起决定作用的利率，该利率的变动具有牵一发而动全身的作用，其他利率会随其变动而发生相应变化。\n②特征：基准利率通常是无风险或低风险的利率品种，主要反映货币的时间价值，一般利率在基准利率的基础上再加上对应的风险溢价。\n③现实：我国的基准利率较多，货币市场基准利率是上海银行间同业拆放利率（SHIBOR）以及 存 款 类 金 融 机 构 以 利 率 债 为 质 押 的 7 天 回 购 利 率 （ DR007 ） ； 债 券 市 场 基 准 利 率 为 国 债 利率；存款市场基准利率为一年期定期存款利率。2022年，我国存款利率定价方式有所调整，存款基准利率的影响淡化，存款利率开始参考以10年期国债收益率为代表的债券市场利率和以1年期LPR为代表的贷款市场利率形成。美国的基准利率则是联邦基金利率。题目溯源：","points":["定义：是在多种利率并存的条件下起决定作用的利率，该利率的变动具有牵一发而动全身的作用，其他利率会随其变动而发生相应变化。","特征：基准利率通常是无风险或低风险的利率品种，主要反映货币的时间价值，一般利率在基准利率的基础上再加上对应的风险溢价。","现实：我国的基准利率较多，货币市场基准利率是上海银行间同业拆放利率（SHIBOR）以及 存 款 类 金 融 机 构 以 利 率 债 为 质 押 的 7 天 回 购 利 率 （ DR007 ） ； 债 券 市 场 基 准 利 率 为 国 债 利率；存款市场基准利率为一年期定期存款利率。2022年，我国存款利率定价方式有所调整，存款基准利率的影响淡化，存款利率开始参考以10年期国债收益率为代表的债券市场利率和以1年期LPR为代表的贷款市场利率形成。美国的基准利率则是联邦基金利率。题目溯源："]},{"no":4,"type":"term","stem":"首次公开发行","score":4,"body":"①定义：企业第一次将它的股份向社会公众出售的行为，简称IPO。通常通过承销商（证券公司）进行销售，首次公开上市完成后，公司就可以申请到证券交易所或报价系统挂牌交易。\n②基本程序：包括设立股份有限公司、改制运行、辅导及验收、制作正式申报材料、向社会公开发行股票并向交易所申请上市等阶段。\n③发行制度：核准制和注册制是两种不同的上市发行制度，核准制是一种由政府部门负责审核和批准企业上市发行申请的制度。注册制是一种由企业自主申报发行信息，并由证券交易所审核和注册发行文件的制度。我国目前实行的是注册制。\n④优缺点：公司上市得到批准是对公司经营状况和信誉的肯定，有助于提高公司在市场上的信誉水平，对公司进一步筹资和开展商业活动有很大的帮助。但公开发行股票会产生大量的直接成本、隐性成本。且为了对广大投资者负责，上市公司负有严格的信息披露义务；可能会稀释老股东的控制权。","points":["定义：企业第一次将它的股份向社会公众出售的行为，简称IPO。通常通过承销商（证券公司）进行销售，首次公开上市完成后，公司就可以申请到证券交易所或报价系统挂牌交易。","基本程序：包括设立股份有限公司、改制运行、辅导及验收、制作正式申报材料、向社会公开发行股票并向交易所申请上市等阶段。","发行制度：核准制和注册制是两种不同的上市发行制度，核准制是一种由政府部门负责审核和批准企业上市发行申请的制度。注册制是一种由企业自主申报发行信息，并由证券交易所审核和注册发行文件的制度。我国目前实行的是注册制。","优缺点：公司上市得到批准是对公司经营状况和信誉的肯定，有助于提高公司在市场上的信誉水平，对公司进一步筹资和开展商业活动有很大的帮助。但公开发行股票会产生大量的直接成本、隐性成本。且为了对广大投资者负责，上市公司负有严格的信息披露义务；可能会稀释老股东的控制权。"]},{"no":5,"type":"term","stem":"可转换优先股","score":4,"body":"①定义：可转换优先股的股东，有权根据优先股发行的规定，在将来一定时期内将优先股转换为普通股。\n②特征：如果普通股价格上升，优先股股东可行使转股的权利从中获利。如果普通股价格下跌，优先股股东便不行使转股的权利，继续享受优先股的股利。\n③对优先股股东的好处：可转换优先股使其股东处于有利地位：在公司经营不稳定时受到保护，在公司业绩良好时分享公司的经营成果。\n④对发行公司的好处：出售时价格较高，公司发行可转换优先股可筹到更多的资金，普通股股东不会因为公司发行这种金融工具遭到利益侵害。","points":["定义：可转换优先股的股东，有权根据优先股发行的规定，在将来一定时期内将优先股转换为普通股。","特征：如果普通股价格上升，优先股股东可行使转股的权利从中获利。如果普通股价格下跌，优先股股东便不行使转股的权利，继续享受优先股的股利。","对优先股股东的好处：可转换优先股使其股东处于有利地位：在公司经营不稳定时受到保护，在公司业绩良好时分享公司的经营成果。","对发行公司的好处：出售时价格较高，公司发行可转换优先股可筹到更多的资金，普通股股东不会因为公司发行这种金融工具遭到利益侵害。"]},{"no":1,"type":"short","stem":"简述凯恩斯流动性偏好理论和流动性陷阱。","score":8,"body":"简述凯恩斯流动性偏好理论和流动性陷阱。\n\n（1）角度：从货币因素分析利率的决定。\n\n（2）内容：利率取决于货币供求数量的对比，货币供给量由货币当局决定，而货币需求取决于人们的流动性偏好。在货币供给不变的情况下，人们的流动性偏好增强，意愿持有的货币数量（即货币需求）随之上升，利率也会随之走高；反之，人们的流动性偏好减弱，会导致意愿持有的货币数量下降，利率也会随之走低。\n\n（3）流动性陷阱：随着利率不断下降至非常低的位置，以至于不可能再下降时，人们就会产生利率将会上升、债券价格将会下跌的预期，人们对流动性的偏好就会趋于无穷，货币需求的利率弹性也会变得无限大，此时无论增加多少货币供给，都会被人们储存起来，这就是著名的流动性陷阱假说。流动性偏好曲线右方趋于平行的部分即为“流动性陷阱”，此时供给再多的货币也无法使利率进一步下降。\n\n（4）特征：由于货币供求受短期因素扰动较大，在分析短期利率走势变化时更具说服力。","points":["简述凯恩斯流动性偏好理论和流动性陷阱。；角度：从货币因素分析利率的决定。","内容：利率取决于货币供求数量的对比，货币供给量由货币当局决定，而货币需求取决于人们的流动性偏好。在货币供给不变的情况下，人们的流动性偏好增强，意愿持有的货币数量（即货币需求）随之上升，利率也会随之走高；反之，人们的流动性偏好减弱，会导致意愿持有的货币数量下降，利率也会随之走低。","流动性陷阱：随着利率不断下降至非常低的位置，以至于不可能再下降时，人们就会产生利率将会上升、债券价格将会下跌的预期，人们对流动性的偏好就会趋于无穷，货币需求的利率弹性也会变得无限大，此时无论增加多少货币供给，都会被人们储存起来，这就是著名的流动性陷阱假说。流动性偏好曲线右方趋于平行的部分即为“流动性陷阱”，此时供给再多的货币也无法使利率进一步下降。","特征：由于货币供求受短期因素扰动较大，在分析短期利率走势变化时更具说服力。"]},{"no":2,"type":"short","stem":"简述购买力平价理论。","score":8,"body":"简述购买力平价理论。\n\n（1）假设前提：一价定律，即当贸易开放且交易费用为零时，同样的货物无论在何地销售，用同一货币来表示的货物价格都相同。\n\n（2）内容：由瑞典学者卡塞尔提出，两国货币汇率的决定基础应当是两国货币所代表的购买力之比。货币购买力是以价格反映的，货币购买力是价格的倒数，价格越高，货币购买力越低，两者之间呈反向关系。\n\n①绝对购买力平价：在某一时点上，两国货币之间的兑换比例（汇率）取决于两国物价总水平之比。即：其中表示本国当期物价，表示外国当期物价，即为直接标价法下汇率。\n\n②相对购买力平价：汇率的变动由两国相对通货膨胀率决定，若本国的通货膨胀率持续地高于外国，则本币汇率趋于贬值。即：其中为符合绝对购买力平价的基期汇率。在固定汇率制下，一国的均衡汇率由本国与外国的相对价格来决定；在浮动汇率制下，汇率变动反映出本国与外国货币的购买力的相对变化。\n\n（3）优点：从货币具有购买力的角度分析货币的兑换问题，符合逻辑，易于理解；表达形式较其他汇率决定理论更为直观，被广泛运用于长期汇率决定。\n\n（4）缺陷：现实世界中购买力平价的基本前提条件往往不能得到充分满足，现实中观察到的、市场上挂牌交易的名义汇率与按照理论估算出的购买力平价之间往往存在偏离现象。","points":["简述购买力平价理论。 （1）假设前提：一价定律，即当贸易开放且交易费用为零时，同样的货物无论在何地销售，用同一货币来表示的货物价格都相同。 （2）内容：由瑞典学者卡塞尔提出，两国货币汇率的决定基础应当是两国货币所代表的购买力之比。货币购买力是以价格反映的，货币购买力是价格的倒数，价格越高，货币购买力越低，两者之间呈反向关系。","绝对购买力平价：在某一时点上，两国货币之间的兑换比例（汇率）取决于两国物价总水平之比。即：其中表示本国当期物价，表示外国当期物价，即为直接标价法下汇率。","相对购买力平价：汇率的变动由两国相对通货膨胀率决定，若本国的通货膨胀率持续地高于外国，则本币汇率趋于贬值。即：其中为符合绝对购买力平价的基期汇率。在固定汇率制下，一国的均衡汇率由本国与外国的相对价格来决定；在浮动汇率制下，汇率变动反映出本国与外国货币的购买力的相对变化。 （3）优点：从货币具有购买力的角度分析货币的兑换问题，符合逻辑，易于理解；表达形式较其他汇率决定理论更为直观，被广泛运用于长期汇率决定。 （4）缺陷：现实世界中购买力平价的基本前提条件往往不能得到充分满足，现实中观察到的、市场上挂牌交易的名义汇率与按照理论估算出的购买力平价之间往往存在偏离现象。"]},{"no":3,"type":"short","stem":"简述有效市场假说理论。","score":8,"body":"简述有效市场假说理论。\n\n（1）弱有效市场\n\n①含义：证券的价格反映了其历史价格包含的全部信息。在弱有效市场中，技术分析方法没有意义，因为它是通过研究证券价格的历史形态来推断其未来走势。\n\n②检验：如果把股票价格看作随机过程，常常用随机游走来形容弱有效市场中的股票价格。弱有效市场中因为随机误差的存在，股票价格不可预测。\n\n（2）半强有效市场\n\n①含义：半强有效市场的有效程度高于弱有效市场。在半强有效市场上，证券价格能够瞬间反映所有公开信息。各种信息一经公布，证券价格将迅速调整到其内在价值的水平上，以反映新信息带来的价值增量。任何利用公开信息预测的证券价格未来走势对投资者都没有意义，投资者无法通过分析公开信息来获取超额利润。\n\n②检验：主要方法为事件研究，它是一种实证研究方法：研究人员选择事件消息公布前后一段时间作为时间窗口，分析窗口期内股票收益率的异常情况。如果市场是半强有效市场，那么事件公告只影响公告当日的股票收益率。\n\n（3）强有效市场\n\n①含义：证券价格能够快速反映影响价格的所有信息，包括公开信息与内幕信息。强有效市场是对市场信息效率的最严格的假设。不仅普通投资者不能利用公开信息，而且知情人员不能通过内幕交易来稳定谋取超额收益。\n\n②检验：是否能够通过内幕交易获取超额收益。","points":["简述有效市场假说理论。 （1）弱有效市场","含义：证券的价格反映了其历史价格包含的全部信息。在弱有效市场中，技术分析方法没有意义，因为它是通过研究证券价格的历史形态来推断其未来走势。","检验：如果把股票价格看作随机过程，常常用随机游走来形容弱有效市场中的股票价格。弱有效市场中因为随机误差的存在，股票价格不可预测。 （2）半强有效市场","含义：半强有效市场的有效程度高于弱有效市场。在半强有效市场上，证券价格能够瞬间反映所有公开信息。各种信息一经公布，证券价格将迅速调整到其内在价值的水平上，以反映新信息带来的价值增量。任何利用公开信息预测的证券价格未来走势对投资者都没有意义，投资者无法通过分析公开信息来获取超额利润。","检验：主要方法为事件研究，它是一种实证研究方法：研究人员选择事件消息公布前后一段时间作为时间窗口，分析窗口期内股票收益率的异常情况。如果市场是半强有效市场，那么事件公告只影响公告当日的股票收益率。 （3）强有效市场","含义：证券价格能够快速反映影响价格的所有信息，包括公开信息与内幕信息。强有效市场是对市场信息效率的最严格的假设。不仅普通投资者不能利用公开信息，而且知情人员不能通过内幕交易来稳定谋取超额收益。；检验：是否能够通过内幕交易获取超额收益。"]},{"no":4,"type":"short","stem":"什么是财务危机成本？为什么财务危机成本会影响资本结构的选择？","score":8,"body":"什么是财务危机成本？为什么财务危机成本会影响资本结构的选择？\n\n（1）含义财务危机是指企业明显无力按时偿还到期的无争议的债务的困难与危机。财务危机成本是在财务管理出现技术上或者企业破产的情况下所形成的直接成本和间接成本。分类为直接成本和间接成本：\n\n①直接成本：为处理财务危机（如进行破产清算或重整）支出的各项费用，如律师费、清算费等，及因财务危机而造成的资产贬值损失。\n\n②间接成本：因发生财务危机而在经营管理方面遇到的种种困难和损失，包括为避免破产而付出的代价等成本的总和。\n\n（2）影响资本结构选择的原因：若不考虑财务危机成本，根据有税的MM定理，有债务资本公司的价值等于无债务资本公司的价值加上债务资本产生的税盾价值，公司价值随着负债的上升而上升。但考虑财务危机成本后，根据资本结构的权衡理论，负债公司的价值可写成：VL=VU+TD-财务危机成本，债务资本利弊并存，公司使用债务资本带来的收益是其税盾价值，成本则体现为财务危机的成本，公司在选资本结构时，通过权衡债务融资的收益与成本，最大化公司价值。因此，财务危机成本会影响资本结构的选择。","points":["什么是财务危机成本？为什么财务危机成本会影响资本结构的选择？ （1）含义财务危机是指企业明显无力按时偿还到期的无争议的债务的困难与危机。财务危机成本是在财务管理出现技术上或者企业破产的情况下所形成的直接成本和间接成本。分类为直接成本和间接成本：","直接成本：为处理财务危机（如进行破产清算或重整）支出的各项费用，如律师费、清算费等，及因财务危机而造成的资产贬值损失。","间接成本：因发生财务危机而在经营管理方面遇到的种种困难和损失，包括为避免破产而付出的代价等成本的总和。 （2）影响资本结构选择的原因：若不考虑财务危机成本，根据有税的MM定理，有债务资本公司的价值等于无债务资本公司的价值加上债务资本产生的税盾价值，公司价值随着负债的上升而上升。但考虑财务危机成本后，根据资本结构的权衡理论，负债公司的价值可写成：VL=VU+TD-财务危机成本，债务资本利弊并存，公司使用债务资本带来的收益是其税盾价值，成本则体现为财务危机的成本，公司在选资本结构时，通过权衡债务融资的收益与成本，最大化公司价值。因此，财务危机成本会影响资本结构的选择。"]},{"no":1,"type":"essay","stem":"结合人民币汇率形成机制和浮动汇率制的弊端角度，分析保持人民币汇率稳定的重要性。","score":14,"body":"结合人民币汇率形成机制和浮动汇率制的弊端角度，分析保持人民币汇率稳定的重要性。\n\n从人民币汇率形成机制来看：汇率是一国货币与外币的兑换比价。近年来，人民币汇率在动态变化中实现均衡和稳定，2015年“811汇改”及后续对中间价报价机制的完善构成起当前人民币汇率的形成机制。现行的人民币汇率中间价报价机制为“收盘价+参考一篮子货币汇率波动+逆周期调节因子”。汇率改革进程中，我国对人民币汇率政策进行的调整，适应国际化的要求和全球经济环境的变化，参考一篮子调节、逆周期调节因子的引入以及资本账户开放与汇率政策的协调，增强了人民币汇率的稳定性和影响力，推动人民币在全球货币体系中地位的提升。从浮动汇率制的弊端来看：\n\n①浮动汇率制下，汇率的趋势和波动难以预测，汇率风险在一定程度上阻碍了国际贸易和投资。在全球化背景下，中国经济与世界经济紧密相连，人民币汇率的稳定有助于保持中国对外贸易的平稳发展，维护中国经济的外部平衡。稳定的人民币汇率有助于降低企业的汇率风险，提高中国产品的国际竞争力，从而推动中国经济的持续稳定增长。此外，人民币汇率的稳定还有助于控制进口商品价格，减轻居民生活成本，提高我国人民生活水平。\n\n②浮动汇率制下，助长国际金融市场上的投机活动，汇率波动的频率和幅度加大，为外汇投机活动提供了机会，加剧国际金融市场动荡。金融市场的稳定是经济稳健发展的基础，而汇率的稳定则是金融市场稳定的重要保障。人民币汇率的稳定有助于减少市场波动，降低金融风险，为金融市场的健康发展提供有力支撑。\n\n③浮动汇率制下，一国可通过本币贬值的方法来改善国际收支，这会使其他国家的国际收支处于不利地位，因此其他国家货币也会贬值，引发竞相贬值。同时，在浮动汇率制下，由于国际收支可完全依赖汇率自由浮动而得到调节，缺乏货币纪律约束，货币当局可能偏好采取扩张性政策来刺激国内的经济增长。保证人民币汇率的稳定，符合国际金融机构、个人和企业投资者对人民币的需求，有利于稳定全球经济安全。此外，中国作为世界经济增长的重要稳定器和动力源，人民币汇率的稳定，能够为全球对华贸易与投资提供便利，促进各经济体共享中国经济发展的红利，为世界经济复苏增添动力。从当前经济形势来看：目前在我国经济结构重心转向加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局的背景下，我国经济面临房地产市场低迷、内需不足等多重挑战，经济恢复基础不牢固，内部经济需要进一步提振，虽然国内稳增长政策预计会积极发力，但仍有一些困难需要解决。外部不确定因素也可能加大，例如若特朗普关税政策落地，可能会对我国经济修复构成一定扰动，而同时美国通胀压力或上升，美债利率不排除进一步上行，美元指数也可能居高不下。在当前情形下，需要人民币汇率保持稳定，为中国的金融市场、吸引外资、贸易、经济恢复起到“防火墙”作用。综上，面对复杂多变的国际环境，保持人民币汇率稳定是中国经济稳健发展的重要保障，我国将继续坚持以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度，发挥市场在汇率形成中的决定性作用，综合施策、稳定预期，坚决对顺周期行为予以纠偏，防止形成单边一致性预期并自我强化，坚决防范汇率超调风险，保持人民币汇率在合理均衡水平上基本稳定。武玄宇金融热点32、33 汇率市场化改革、人民币汇率波动","points":["结合人民币汇率形成机制和浮动汇率制的弊端角度，分析保持人民币汇率稳定的重要性。 从人民币汇率形成机制来看：汇率是一国货币与外币的兑换比价。近年来，人民币汇率在动态变化中实现均衡和稳定，2015年“811汇改”及后续对中间价报价机制的完善构成起当前人民币汇率的形成机制。现行的人民币汇率中间价报价机制为“收盘价+参考一篮子货币汇率波动+逆周期调节因子”。汇率改革进程中，我国对人民币汇率政策进行的调整，适应国际化的要求和全球经济环境的变化，参考一篮子调节、逆周期调节因子的引入以及资本账户开放与汇率政策的协调，增强了人民币汇率的稳定性和影响力，推动人民币在全球货币体系中地位的提升。从浮动汇率制的弊端来看：","浮动汇率制下，汇率的趋势和波动难以预测，汇率风险在一定程度上阻碍了国际贸易和投资。在全球化背景下，中国经济与世界经济紧密相连，人民币汇率的稳定有助于保持中国对外贸易的平稳发展，维护中国经济的外部平衡。稳定的人民币汇率有助于降低企业的汇率风险，提高中国产品的国际竞争力，从而推动中国经
