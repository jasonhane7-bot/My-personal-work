在风险维度配置资产","在时间和风险两个维度配置资产"],"answer":"D","expl":"**时间维度和风险维度是投资者在配置资产时需要考虑的两个因素。\n\n**提示：**可在《金融学》P152 查看本知识点。本题涉及的考点是资产投资管理理论。资产投资管理理论是一个大的理论体系，里面包含了很多分支理论。考生要注意掌握每个分支理论出现的顺序，每个分支理论的基本内涵:包括马克维英的投资组合理论，威廉夏普的 CAPM 模型，单指数模型，套利定价模型等。本考点涉及选择题、判断题、名词解释。\n\n.创业板市场可以促进高新技术创业和中小企业的发展，这是体现资本市场的 （**C**）\n\nA.资源配置与转化功能 B.价格发现功能 C .宏观调控传导功能 D.风险分散与规避功能\n\n**解析：**考察了金融市场的功能。配置是指自动引导资金的合理配置，进而实现资源合理配置和有效利用，创业板市场定向支持高新技术创业和中小企业的发展，体现了配置的作用。转化是指储蓄向投资的转化，也符合题意。A 应该是更好的答案，但在中财指定的参考书中，这道题的文本来源提示答案为 C。如果是中财的同学再遇到相同的题目，建议还是按照教材原文来解答这道题。创新板市场的建立体现了顶层设计中对于高新技术创业和中小企业的关注与政策倾斜，一定程度上也体现了宏观调控传导功能。\n\n**提示：**可在《金融学》P152 查看本知识点。考生要熟悉资本市场的基本功能，每个功能的大致含义，建议考生不要死记硬背而是理解记忆。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":6,"type":"single","stem":"利率互换的目的是","options":["降低融资成本","管理流动性","获得目标货币债务","规避利率风险"],"answer":"A","expl":"**利率互换利用比较优势，使得互换双方降低了借款成本。\n\n**提示：**本题涉及的考点利率互换是金融衍生品中的一种。各金融衍生品的目的和基本原理考生都得掌握，利率互换和货币互换的区别也需要注意掌握。该考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":7,"type":"single","stem":"下列属于存款类金融机构的是","options":["金融租赁公司","财务公司","资产管理公司","小额贷款公司"],"answer":"B","expl":"**存款金融机构由中央银行、商业银行、政策性银行、专业银行、信用合作社、财务公司构成。\n\n**提示：**本题涉及的考点是存款类金融机构。考生要注意掌握书本上列举的存款类金融机构，分清楚哪些金融机构属于存款类金融机构，哪些属于非存款类金融机构，把握存款的金融机构和非存款类金融机构之间的区别。本考点涉及的题型有选择题、判断题。可看《金融学》P278。","score":1},{"no":8,"type":"single","stem":"下列实行准中央银行制度的国家是","options":["马尔代夫","美国 C 法国","印度"],"answer":"A","expl":"**准中央银行制的国家有新加坡和我国香港，还有斐济、马尔代夫、莱索托、利比里亚等。\n\n**提示：**本题涉及的考点是中央银行制度的代表国家。中央银行制度的组织结构是金融学综合考试中的常考考点，考生要注意掌握每一种中央银行制度组织结构中的代表国家。本考点涉及的题型有判断题、选择题、判断题。","score":1},{"no":9,"type":"single","stem":"以下体现中央银行“银行的银行 \"职能的是","options":["集中存款准备金和充当最后贷亚人","充当最后贷款人和制定货币政策","监督管理金融业和芍断货币发行","组织管理清算业务和为政府提供融资"],"answer":"A","expl":"**银行的银行主要体现在集中存款准备金、充当最后贷款人人，组织、参与和管理全国清算业务，监督管理金融业上。\n\n**提示：**本题涉及的考点中央银行的职能包括三种，包括银行的银行、发行的银行、政府的银行，特别是银行的银行这一职能里边包含的内涵最为丰富，考生需要理解、记忆、吉练掌握。该考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":10,"type":"single","stem":"国际收支出现大量顺差时会引起的经济现象是","options":["本币汇率上浮，出口增加","本币汇率上浮，出口减少","本币汇率下浮，出口增加","本币汇率下浮，出口减少"],"answer":"B","expl":"**顺差导致本币需求增加，推动本币汇率上升，本币升值导致出口减少。\n\n**提示：**本题涉及的考点是国际收支顺差带来的影响。国际收支平衡是国际金融中的重点也是难点。考生在复习时，尤其要注意掌握国际收支失衡对本国汇率的影响，对本国商品价格的影响等。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":11,"type":"single","stem":"以下不属于现代货币供给条件的是","options":["信用货币流通","部分存款准备金制度","非现金结算","现金结算"],"answer":"D","expl":"**《金融学》P422。ABC 都属于三个基本条件。\n\n**提示：**本题涉及的考点是现代银行货币供给的三个基本条件，这是一个非常重要的知识点。货币供给整个章节的内容都非常的重要，现代银行货币供给的三个基本条件当然也不例外。考生需要把这三个条件背诵下来。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":12,"type":"single","stem":"中央银行选择性货币政策工具是","options":["消费者信用控制","公开市场操作","道义劝告","信用配额"],"answer":"A","expl":"**选择性货币政策工具有消费信用控制、证券市场信用控制、不动产信用控制、优惠率、预交进口保证金。\n\n**提示：**中央银行的选择性货币政策工具，选择性货币政策工具里面包含的项目非常多，但是他们都有一个共同的特性，都是针对特殊领域制定的货币政策。考生需要把选择性货币政策工具和一般货币政策工具.其他货币政策工具区分开来。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":13,"type":"single","stem":"属于我国证监会监管的金融机构是","options":["信托投资公司","金融租赁公司","期货公司","融资担保公司"],"answer":"C","expl":"** ABD 都属于银监会监管。\n\n**提示：**本题涉及的考点是中国的金融机构体系和金融监管体系。中国的金融监管当局有中国人民银行、银监会、证监会和保监会，考生要把各个金融监管机构的监管的主体掌握清楚，和中国实际密切相关的知识点往往也是考查的热点。本考点涉及的题型有选择、判断。","score":1},{"no":14,"type":"single","stem":"某企业流动比率为 2，速动比率为 1，现金与有价证券占流动负债的比率为 0.5，流动负债为 1000 万元。该企业流动资产只有现金、有价证券、应收账款和存货四个项目，则该公司的存货为","options":["500 万元","1000 万元","1500 万元","2000 万元"],"answer":"B","expl":"**流动比率 = 流动资产 /流动负债 =2,速动比率 = (流动资产一存货 ) /流动负债 =1,流动负债为 1000，则流动资产为 2000，存货为 1000。\n\n**提示：**本题涉及的知识点是财务比率。公司财务中涉及到的财务比例数量繁多，考生要分类别熟悉各种财务比率的计算方法。他们的计算往往非常简单，只是财务比率的数量众多，考生容易混淆，所以考生需要勤加练习，勤加记忆。该考点涉及的题型有选择题、判断。\n\n1S.下列哪项是在计算相关现金流时需要计算的 （**B**）\n\nA.前期研发费用 B.营运资本的变化”C.筹资成本 D 市场调查费用\n\n**解析：**《公司财务》P100。初始现金流中包含营运资本投入。\n\n**提示：**本题涉及的考点是项目投资评估。考生在复习这部分内容时，要分清楚相关现金流和非相关现金流的区别。相关现金流是会影响项目投资评估的现金流，而非相关现金流则不会影响。该考点涉及的题型有选择题、判断题、名词解释、计算题。","score":1},{"no":16,"type":"single","stem":"李先生购买一处房产价值为 100 万元，首付金额为 20 万，其余向银行贷款。贷款年利率为 12% (年度百分率 ) ，按月还款，贷款期限为 20 年。如果按照等额本金的方式还款，则李先生第一个月大约需要问银行偿还","options":["11333 元","12333 元","13333 元","14333 元"],"answer":"A","expl":"**注意区分等额本金还款和等额本息还款区别，李先生第一月还款 = 第一月偿还本金 + 利息 =800000/240+800000x129%o/12=11333\n\n**提示：**本题涉及的考点是货款的偿还。等额本息法的特点是:每月的还款额相同，在月供中 \"本人金与利息 \"的分配比例中，前半段时期所还的利息比例大.本金比例小，还款期限过半后逐步转为本金比例大. 利息比例小。所支出的总利息比等额本金法多，而且货款期限越长，利息相差越大。等额本金法的特点是:每月的还款额不同，它是将货款本金掖还款的总月数均分〈等额本金 ) ，再加上上期利余本人金的月利息，形成一个月还款额，所以等额本金法第一个月的还款额最多，尔后逐月减少，越还越少。\n\n所支出的总利息比等额本息法少。复习该部分知识点时考生要注意掌握此类计算题的答题套路，往往看似复杂，其实计算并不复杂，只要明白其中的原理即可正确回答，近年来该知识点的考查频率还是很高的。该考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":19,"type":"single","stem":"R 公司目前有 1000 万元的资金可用于投资，因此需要从 10 个期限均为 5 年.投资额均为 200 万元，且净现值均大于 0 的项目中选择 5 个项目进行投资。那么公司应该按照哪一种标准进行选择?","options":["内部收益率最高","回收期之和最短","盘利指数之和最大","贴现回收期之和最短"],"answer":"C","expl":"**《公司财务》P93。资本限量决策的决策标准即在企业资本限定的情况下，如何通过投资项目的组合来获得最大收益，也就是 C 项和利指数之和最大。\n\n**提示：**本题涉及的考点是项目投资评估。考生在复习该部分内容的时候要注意掌握每一个项目投资评估指标的内涵.计算以及各自的优缺点。本考点的重要性不言而只，涉及的题型有选择题、判断题、计算题。","score":1},{"no":20,"type":"single","stem":"己知茶无负债公司的总资产价值为 10000,发行在外的普通股股票 500 股,息税前收益 EBIT 为 2000，中央财经大学爹融硕士 「2016 年 | 直题 w 0354 公司所得税税率为 40%。该公司决定发行价值 S000，年利息率 8% 的公司债赎回同等价值的公司股票。则该公司股票的赎回价格为","options":["20 了","22","24","26"],"answer":"C","expl":"**和计算题最后一题类似。发行债务会带来税盾效应，增大股东权益。\n\n**提示：**本题涉及的考点是股票回购和 MM 理论。负债之后公司的价值增加，而股票的价格等于公司的总价值除于股票数量，其实这道题目的计算相当简单，但是由于考生对 MM 理论和股票回购的理解不够深刻，导致当年的得分率非常低，只有百分之十左右的同学答对了本题。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":1,"type":"tf","stem":"准货币的流动性小于狭义货币，反映的是整个社会的潜在购买力。","options":["正确","错误"],"answer":"√","expl":"**准货币即 M2-M1，流动性小于 M1，反映社会潜在购买力。准货币是能够转化为狭义货币的信用工具或金融资产。\n\n**提示：**本题的考点是准货币.狱义货币和广义货币。《人金融学》P45。复习这部分内容的时候，需要注意掌握判断货币层次的标准，以及每一个货币层次包含的内容。该考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":2,"type":"tf","stem":"在浮动货币制度下，由于存在货币纪律约束，中央银行不可能超发货币。","options":["正确","错误"],"answer":"×","expl":"**在固定汇率制度下，政府为了维持汇率的稳定而不能过度增发货币，这就是货币纪律约束。\n\n**提示：**本题的考点是固定汇率制和浮动汇率制度的各自的特点。见《金融学》P74。考生需要注意掌握固定汇率制和浮动汇率制各自的定义以及优缺点。该考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":3,"type":"tf","stem":"利息转化为收益的一般形态导致了收益资本化。","options":["正确","错误"],"answer":"√","expl":"**利息转化为收益，导致收益资本化，即可以通过收益与利率的对比推算出相对应的资本金额。\n\n**提示：**本题的考点是收益资本化，这个概念相当重要。考生需要把概念背诵下来，相关的数学表达式也需要背诵。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":4,"type":"tf","stem":"有效边界线上的资产组合为最佳资产组合。〈 ) .货币市场利率是一国利率体系中的基准指标，是影响其他金融和经济指标的基础性变量。","options":["正确","错误"],"answer":"×","expl":"**有效边界上的是有效组合，但满足投资者效用最大的组合才是最佳资产组合〈即投资者的无差异曲线与有效边界相切点处所代表的组合 ) 。\n\n**提示：**本题涉及的考点是有效边界和最优资产组合。有效边界就是有效集，考生要区分清楚有效集和可行集的区别，要深刻把握何为最优资产组合的含义。脑海中需要有有效边界以及可征集的基本图像。\n\n本考点的重要性不言而只，涉及的题型有选择题、判断题、简答题、名词解释。\n\n.货币市场利率是一国利率体系中的基准指标，是影响其他金融和经济指标的基础性变量。〈 \\ )\n\n**解析：**货币市场利率是一国利率体系中的基准指标，是影响其它金融和经济指标的基础变量。\n\n**提示：**本题涉及的考点的是基准利率。《人金融学》P193。考生需要注意掌握基准利率的内涵，需要注意掌握哪些利率可以成为基准利率以及中国现行的基准利率体系是什么。本题涉及的考点是选择题、判断题、名词解释。","score":1},{"no":6,"type":"tf","stem":"风险中性的市场环境中，不存在套利的可能。","options":["正确","错误"],"answer":"√","expl":"**风险中性的市场环境下，不存在套利的可能，基础证券与衍生证券的期望收益率都恰好等于无风险利率，基础证券或衍生证券的任何盘亏经无风险利率的贴现就是他们的现值。\n\n**提示：**本题涉及的考点是风险中性的概念。《人金融学》P270。考生要注意把握风险中性的内涵。学会如何用风险中性法对金融衍生品尤其是期权进行定价，该知识点对考生的理解能力有一定的要求。该考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":7,"type":"tf","stem":"非存款类金融机构是一种高杠杆企业，自有资本低。","options":["正确","错误"],"answer":"×","expl":"**存款类金融机构自有资本低，是一种高杠杆企业。\n\n**提示：**本题涉及的考点是非存款类金融机构。考生要分状清楚存款类和非存款类人金融机构之间的区别。\n\n该考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":8,"type":"tf","stem":"与封闭式基金相比，开放式基金经理的经营压力比较小。","options":["正确","错误"],"answer":"×","expl":"**开放式基金经理压力大，因为开放式基金有赎回风险。\n\n**提示：**本题涉及的考点是开放式基金和封闭式基金。开放式基金和封闭式基金的概念在金融学考试中考查的频率也比较高，考生需要分辨开放式基金和封闭式基金各自的特点和两者之间的区别。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":9,"type":"tf","stem":"货币主义认为，货币需求函数在长期内是稳定的。","options":["正确","错误"],"answer":"√","expl":"**货币学派认为货币需求函数是稳定的。\n\n**提示：**本题涉及的考点是货币主义的货币需求理论。《人金融学》P409。货币需求理论在金融学考试中的重要性不言而只。考生要了解货币需求理论的发展框架，每个时期理论的基本内涵以及各个理论的提出者，特别师思斯的货币需求理论和弗里德曼的货币需求理论，两者的共同点和不同点需要考生着重把握。该考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":10,"type":"tf","stem":"基础货币等于库存现金与银行体系存款准备金之和。","options":["正确","错误"],"answer":"×","expl":"**基础货币 M0 应当还有流通中的现金。\n\n**提示：**本题涉及的考点是基础货币的内涵，曾多次在考试中考查。《人金融学》P423。在复习该部分内容时考生要认真阅读中央银行的资产负债表，了解中央银行的资产负债状况以及货币供给的原理，考生要注意掌握基础货币与货币供给量之间的关系。该考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":11,"type":"tf","stem":"按照菲利普斯曲线，在长期内，通货膨胀与失业率之间存在蔡换关系。","options":["正确","错误"],"answer":"×","expl":"**长期内，菲利普斯曲线是竖直的，不存在替换关系.\n\n**提示：**本题涉及的考点是菲利普斯曲线。菲利普斯曲线揭示了就业情况和通货膨胀率之间的关系。考生需要初 供求状况。S+AMs=I+AMd。其中  是储蓄流量，人 Ms 是货币的供给增量，此两项之和代表货币的供给量。I 是投资量，和 AMd 是人们的持币意愿的变化，此两项之和代表货币的需求量。等式左右均衡得到利率。政策主张:在投资流量和储蓄流量这对实际因素保持稳定的情况下，货币供求力的对比变化将会寻致利率的变动。才这一意义上讲，利率变动在一定程度上也是一种货币现象。由于可贷资金总量在很大程度上受制于中央银行，货币政策也就成了利率决定中必须考虑的重要因素。可贷资金理论仍然是从资金供求流量对比的视角来考察利率决定的问题从而决定其政策。《5) 新古典综合派“IS-LM”模型忆定义:利率由既定国民收入下的商品市场和货币市场共同决定，均衡利率是商品市场和货币市场同时达到均衡时的利率。GO 政策主张: IS 和 LM 曲线的交点即为商品市场和货币市场同时达到均衡时的均衡利率和均衡收入,当 IS 和 LM 曲线发生移动时,均衡利率和均衡收入也会发生变动,由于 IS 曲线是投资和储蓄变动引起的,LM 曲线是由货币供求引起的,因此政策因素导致的这些因素的变动必然带来均衡利率的变动。","points":["马殉思的利率决定理论 @ 定义:剩余价值在不同资本家中的分割作为起点，利息率在零和平均利润率之间变化，资金紧张时利率上升，资金宽裕时利率下降。适用于社会化大生产条件下的利率决定问题。利上县来源于利润，利息率取决于总利润在贷款人和借款人之间的分配比例。@ 政策主张:在平均利润率与零之间，利息率高低取决于利润率和总利润在贷款人和借款人之间分配的比例。一般来说，在资金供大于求时利率下降，在资金供不应求时利率上升，对于社会化大生产下的利率雇定具有一定指导意义。","古典学派 \"利率决定理论” 外定义:投资流量导致的资金需求与利率负相关，储车流量导致的资金供给与利率正相关，二者共同决定利率。@ 政策主张:古典经济学关注非货币的实际因素对利率决定的影响，利率的变化取决于投资流量与储蓄流量的均衡，因此利率决定的政策主张就是取决于投资与储蓄的均衡。","凯恩斯“流动性偏好理论” 中定义:利率取决于货币供求数量的对比，货币供给量由货币当局决定，而货币需求取决于人们的流动性偏好。在供给不变的情况下，流动性偏好增强，货币需求上升，利率上升，反之亦然。货币供求角度分析利率，适用于短期利率变化。包政策主张:与实际利率理论关注投资流量和储蓄流量的角度不同，流动性偏好理论是从货币供求存量对比的视角来分析利率的变化趋势。由于货币供求受短期因素的扰动较大，该理论在分析短期利率走势的变化时政策倾向更大。","新剑桥学派“可贷资金利率理论” 包定义:认为利率是借贷资金的价格，取决于可贷资金的供求状况，供给与利率正相关，需求与利率负相关。供求对比导臻利率变化，与中央银行的货币政策有关。该理论综合了古典学派的实际因素和凯恩斯学派的货币因素，认为利率是借贷资金的价格，取决于可贷资金的供求状况。S+AMs=I+AMd。其中  是储蓄流量，人 Ms 是货币的供给增量，此两项之和代表货币的供给量。I 是投资量，和 AMd 是人们的持币意愿的变化，此两项之和代表货币的需求量。等式左右均衡得到利率。政策主张:在投资流量和储蓄流量这对实际因素保持稳定的情况下，货币供求力的对比变化将会寻致利率的变动。才这一意义上讲，利率变动在一定程度上也是一种货币现象。由于可贷资金总量在很大程度上受制于中央银行，货币政策也就成了利率决定中必须考虑的重要因素。可贷资金理论仍然是从资金供求流量对比的视角来考察利率决定的问题从而决定其政策。","新古典综合派“IS-LM”模型忆定义:利率由既定国民收入下的商品市场和货币市场共同决定，均衡利率是商品市场和货币市场同时达到均衡时的利率。GO 政策主张: IS 和 LM 曲线的交点即为商品市场和货币市场同时达到均衡时的均衡利率和均衡收入,当 IS 和 LM 曲线发生移动时,均衡利率和均衡收入也会发生变动,由于 IS 曲线是投资和储蓄变动引起的,LM 曲线是由货币供求引起的,因此政策因素导致的这些因素的变动必然带来均衡利率的变动。"]},{"no":4,"type":"short","stem":"优先股的股权特性和债权特性体现在哪些方面，哪些企业适合采用优先股融资?","score":8,"body":"(1) 优先股定义优先股是享有优先权的股票。优先股的股东对公司资产、利润分配等享有优先权，理论上风险较小。但是优先股股东对公司事务无表决权。优先股股东没有选举及被选举权，一般来说对公司的经营没有参与权，优先股股东不能退股，只能通过优先股的赎回条款被公司赎回，但是能稳定分红的股份。所得无解释的股份。《2) 股权特性中优先股是一种没有到期期限的股权性质，@ 优先股不像债券一样，没有还本付息的义务;@@ 优先股的清偿顺序在债务之后，可以参与优先股股东权益相关的股东大会，并有剩余索取权。但是优先股股东在股东大会没有选举董事会以及被选举董事会的权利，不能在二级市场买卖，只能通过公司赎回优先股股东的股权，但是对于公司的分红具有稳定权利。(3) 债权特性中优先股的债权特性体现在定期支付优先股股利，股份公司通常在年终结算后，将盘利的一部分作为股息按配额分配给股东包形成企业的财务负担，因为定期发放稳定分红而对公司的财务形成一定压力;图优先股的清偿顺序在普通股之前，在债券索偿之后。《4) 适合发行优先股的企业一般来说适合于现金流较为充裕的企业，适合银行发行优先股作为二级资本，满足资本充足率要求。有具体适合以下四类公司: 中创业期、成长初期的公司股票估值较低，通过发行优先股，可在不稀释控制权的情况下融资。外资金需求量大、现金流稳定的公司发行优先股可以补充低成本的长期资金，降低资产负债率，改善公司的财务结构。@@ 商业银行等金融机构可以发行优先股补充一级资本，满足资本充足率的监管要求。由进行并购重组的公司发行优先股可以作为收购资产或换股的支付工具。","points":["优先股定义优先股是享有优先权的股票。优先股的股东对公司资产、利润分配等享有优先权，理论上风险较小。但是优先股股东对公司事务无表决权。优先股股东没有选举及被选举权，一般来说对公司的经营没有参与权，优先股股东不能退股，只能通过优先股的赎回条款被公司赎回，但是能稳定分红的股份。所得无解释的股份。","股权特性中优先股是一种没有到期期限的股权性质，@ 优先股不像债券一样，没有还本付息的义务;@@ 优先股的清偿顺序在债务之后，可以参与优先股股东权益相关的股东大会，并有剩余索取权。但是优先股股东在股东大会没有选举董事会以及被选举董事会的权利，不能在二级市场买卖，只能通过公司赎回优先股股东的股权，但是对于公司的分红具有稳定权利。","债权特性中优先股的债权特性体现在定期支付优先股股利，股份公司通常在年终结算后，将盘利的一部分作为股息按配额分配给股东包形成企业的财务负担，因为定期发放稳定分红而对公司的财务形成一定压力;图优先股的清偿顺序在普通股之前，在债券索偿之后。","适合发行优先股的企业一般来说适合于现金流较为充裕的企业，适合银行发行优先股作为二级资本，满足资本充足率要求。有具体适合以下四类公司: 中创业期、成长初期的公司股票估值较低，通过发行优先股，可在不稀释控制权的情况下融资。外资金需求量大、现金流稳定的公司发行优先股可以补充低成本的长期资金，降低资产负债率，改善公司的财务结构。@@ 商业银行等金融机构可以发行优先股补充一级资本，满足资本充足率的监管要求。由进行并购重组的公司发行优先股可以作为收购资产或换股的支付工具。"]},{"no":1,"type":"essay","stem":"资本市场国际化的意义、条件与风险是什么?评价我国资本市场国际化的进程以及政府推进资本市场国际化的策略。","score":14,"body":"资本市场国际化是指资本市场活动在全球范围内进行，资本可以在市场上自由流入或流出。(1) 意义:首先，资本市场国际化是促进金融发展、有效配置资源的需要。目前中国的金融体系依然不完善，表现在金融机构的生存和竞争能力弱，金融市场还很不发达、金融工具还十分单调等。十八大报告明确提出要“推进金融创新 \"”，历史经验表明，人金融创新的需求往往就是国际竞争和对外开放促成的。开放资本市场能够大大推动中国金融体系更快速有效地发展，我国会真正融入国际金融市场中，从而降低融资成本，提高资金收益率。此外，也能增加国内投资品种、分散风险、提高投资收益。其次，资本流动促进贸易进出口的增长。贸易发展促进了资本流动，资本流动加速了贸易发展，两者实现良性循环。通过开放资本市场，外资进入的行业、产业会大大拓宽，特别是在人民币地位日益提升的背景下，资本市场国际化可以为人民币国际化创造有利的条件。人民币的国际化对我国的贸易发展、对外投资、经济的全面国际化和经济实力增强都有重要意义。《2) 条件:健康的宏观经济环境，健全的市场价格机制，完善的国内金融市场，高效地微观企业主体;完备的金融监管体系，灵活的汇率调节机制，充足的国际清偿手段。(3) 风险: @ 溢出效应风险:在资本市场开放条件下，本国市场和外国市场在资金流动、组合管理等方面的联系加强使得国内市场与国外市场的相关性增加，并且随着资本市场开放进程的深化，这种相关性将愈加显著。因此，外国资本市场出现的波动，可能通过外国投资者在本国市场上投资行为的改变，以及国内投资者心理预期和投资行为的变化等渠道，将这种波动传导到国内市场，这就是所谓的联动效应或溢出效应。@ 波动性风险:所谓波动性风险，是指在资本市场对外开放的条件下，外国投资者的投资活动将造成或者加剧国内资本市场资产价格波动的风险。图进程:从投资者的国际化、金融中介的国际化、路国并购活动的开展这三个方面讨论现状。例如:沪港通、合格境外投资者、合格境内投资者、相关跨国并购活动、在伦敦发行人民币计价的债券.…… (4) 策略: 我国资本市场国际化进程属于渐进有序、稳健推进、选择合适的改革窗口期、防范风险。中完善信息披露制度，增加市场透明度。@ 扩大市场容量，提高市场流动性。多渐进有序的开放资本账户。网大力发展金融衍生品市场对冲风险。","points":["资本市场国际化是指资本市场活动在全球范围内进行，资本可以在市场上自由流入或流出。","意义:首先，资本市场国际化是促进金融发展、有效配置资源的需要。目前中国的金融体系依然不完善，表现在金融机构的生存和竞争能力弱，金融市场还很不发达、金融工具还十分单调等。十八大报告明确提出要“推进金融创新 \"”，历史经验表明，人金融创新的需求往往就是国际竞争和对外开放促成的。开放资本市场能够大大推动中国金融体系更快速有效地发展，我国会真正融入国际金融市场中，从而降低融资成本，提高资金收益率。此外，也能增加国内投资品种、分散风险、提高投资收益。其次，资本流动促进贸易进出口的增长。贸易发展促进了资本流动，资本流动加速了贸易发展，两者实现良性循环。通过开放资本市场，外资进入的行业、产业会大大拓宽，特别是在人民币地位日益提升的背景下，资本市场国际化可以为人民币国际化创造有利的条件。人民币的国际化对我国的贸易发展、对外投资、经济的全面国际化和经济实力增强都有重要意义。","条件:健康的宏观经济环境，健全的市场价格机制，完善的国内金融市场，高效地微观企业主体;完备的金融监管体系，灵活的汇率调节机制，充足的国际清偿手段。","风险: @ 溢出效应风险:在资本市场开放条件下，本国市场和外国市场在资金流动、组合管理等方面的联系加强使得国内市场与国外市场的相关性增加，并且随着资本市场开放进程的深化，这种相关性将愈加显著。因此，外国资本市场出现的波动，可能通过外国投资者在本国市场上投资行为的改变，以及国内投资者心理预期和投资行为的变化等渠道，将这种波动传导到国内市场，这就是所谓的联动效应或溢出效应。@ 波动性风险:所谓波动性风险，是指在资本市场对外开放的条件下，外国投资者的投资活动将造成或者加剧国内资本市场资产价格波动的风险。图进程:从投资者的国际化、金融中介的国际化、路国并购活动的开展这三个方面讨论现状。例如:沪港通、合格境外投资者、合格境内投资者、相关跨国并购活动、在伦敦发行人民币计价的债券.……","策略: 我国资本市场国际化进程属于渐进有序、稳健推进、选择合适的改革窗口期、防范风险。中完善信息披露制度，增加市场透明度。@ 扩大市场容量，提高市场流动性。多渐进有序的开放资本账户。网大力发展金融衍生品市场对冲风险。"]},{"no":2,"type":"essay","stem":"金融创新的动力是什么?运用金融创新原理，结合“大众创业、万众创新”，分析基于大数据的金融创新机制及其效果。","score":14,"body":"《1) 金融创新的动力中经济思潮的变迁;包需求刺激与供给推动 @@ 对不合理的金融管制回避，@ 新科技革命的推动。(2) 基于大数据的金融创新机制:结合“大众创业、万众创新 \"”，创新的时代赋予每个公民以创新的使命，对于在数据的挖掘和精确服务方面，数据的驱动和高速运营方面，数据的融合和价值的提升方面，大数据对信用管理、风险识别和风险管理的推动等方面均具有金融创新能力。就大众创业来说，大数据带来的数据红利是创新创业的优势突破口，对于新时代下创新创业的发挥具有显著的推动作用。(3) 金融创新机制效果中提高了金融机构的运作效率。在“大众创业、万众创新”的时代背景下，基于大数据的金融创新机制通过大量提供具有特定的内涵与特性的金融工具、金融服务、交易方式或融资技术等成果，从数量和质量两个方面同时提高需求者的满足程度，增加了金融商品和服务的效用，从而增强了金融机构的基本功能，提高了金融机构的运作效率，其次，提高了支付清算能力和速度，最后，满足了中小创业者的融资需求，并且大幅度增加了金融机构的资产和盘利率。包提高了金融市场的运作效率。首先，在大众创业的时代背景下，提高了市场价格对信息反应的有灵敏度，其次，增加了可供选择的金融商品种类;第三，增强了剔除个别风险的能力，第四，降低了交易成本与平均成本，使投资收益相对上升，吸引了更多投资者和筹资者进入市场，提高了交易的活跃程度。@@ 增强了金融产业发展能力。基于大数据的金融创新机制，大众创新的时代背景促使金融服务实体经济的结合度提升，促进了金融产业的双向发展能力。由金融作用力大为增强。金融作用力主要是指金融对整体经济运作和经济发展的作用能力，一般通过对总体经济活动和经济总量的影响及其作用程度体现出来。时代的创新精神得以体现，金融作用力对宏观经济的影响在大数据的赋能加持下，创新创业者得以通过更便捷的方式投融资，促使金融作用力增强。","points":["金融创新的动力中经济思潮的变迁;包需求刺激与供给推动 @@ 对不合理的金融管制回避，@ 新科技革命的推动。","基于大数据的金融创新机制:结合“大众创业、万众创新 \"”，创新的时代赋予每个公民以创新的使命，对于在数据的挖掘和精确服务方面，数据的驱动和高速运营方面，数据的融合和价值的提升方面，大数据对信用管理、风险识别和风险管理的推动等方面均具有金融创新能力。就大众创业来说，大数据带来的数据红利是创新创业的优势突破口，对于新时代下创新创业的发挥具有显著的推动作用。","金融创新机制效果中提高了金融机构的运作效率。在“大众创业、万众创新”的时代背景下，基于大数据的金融创新机制通过大量提供具有特定的内涵与特性的金融工具、金融服务、交易方式或融资技术等成果，从数量和质量两个方面同时提高需求者的满足程度，增加了金融商品和服务的效用，从而增强了金融机构的基本功能，提高了金融机构的运作效率，其次，提高了支付清算能力和速度，最后，满足了中小创业者的融资需求，并且大幅度增加了金融机构的资产和盘利率。包提高了金融市场的运作效率。首先，在大众创业的时代背景下，提高了市场价格对信息反应的有灵敏度，其次，增加了可供选择的金融商品种类;第三，增强了剔除个别风险的能力，第四，降低了交易成本与平均成本，使投资收益相对上升，吸引了更多投资者和筹资者进入市场，提高了交易的活跃程度。@@ 增强了金融产业发展能力。基于大数据的金融创新机制，大众创新的时代背景促使金融服务实体经济的结合度提升，促进了金融产业的双向发展能力。由金融作用力大为增强。金融作用力主要是指金融对整体经济运作和经济发展的作用能力，一般通过对总体经济活动和经济总量的影响及其作用程度体现出来。时代的创新精神得以体现，金融作用力对宏观经济的影响在大数据的赋能加持下，创新创业者得以通过更便捷的方式投融资，促使金融作用力增强。"]}]},{"year":2017,"included":37,"excluded":1,"questions":[{"no":1,"type":"single","stem":"关于国际货币制度描述正确的是","options":["国际金本位制和布雷顿森林体系都属于黄金货币化","国际金本位制和布雷顿森林体系都是以金平价为基础.具有自动调节机制的固定汇率制","布雷顿森林体系和牙买加体系都是黄金非货币化","布雷顿森林体系和牙买加体系下的固定汇率都由金平价决定"],"answer":"A","expl":"**国际金本位制和布雷顿森林体系都属于黄金货币化，牙买加体系是黄金非货币化；只有国际金本位制是以金平价为基础，实行具有自动调节机制的固定汇率制，并由金平价决定汇率。\n\n**提示：**《国际金融》课本并不考生需要每章都去看，但是国际货币体系这一章是本书的重点和考点。\n\n考生需要认真阅读，是对《金融学》课本的拓展。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":2,"type":"single","stem":"关于金本位制描述正确的是","options":["金本位制下的货币都是通过信用方式发行的","金本位制都具有货币流通自动调节机制","金本位制度下流通中的货币都是金铸币","金本位制中的货币材料都是黄金"],"answer":"D","expl":"**金币本位制下的货币不是通过信用方式发行的；金块本位制度.金汇兑本位制度下金铸币不允许流通。只有金币本位制下才有严格意义上的国际金本位制下的自动调节机制（即休谟机制）。金块和金汇兑本位制下本国内使用的是银行券，在券上注明了含金量。但金币仍然是本位货币，其货币材料为黄金。\n\n**提示：**本题同样考察国际货币体系中的金本位制度，建议考生通过列表的方式整理金币本位制度。金汇兑本位制度和金块本位制度的区别和联系。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":3,"type":"single","stem":"关于汇率理论以下描述正确的是","options":["购买力平价学说是以一价定律为假设前提的","汇兑心理学说侧重于分析长期汇率水平的决定因素","换汇成本学说是以国际借贷理论为基础发展起来的"],"answer":"A","expl":"**购买力平价学说是以一价定律为假设前提的；汇兑心理学说侧重于分析短期汇率水平的决定因素；利率平价理论认为利率高的国家其货币的即期汇率会升水，远期会贴水。\n\n换汇成本学说是以购买力平价理论为基础发展起来的。\n\n**提示：**本题涉及“汇率决定理论”，同样也是《国际金融》课本的重点章节和必看章节。考生需要掌握论”，其他理论只需掌握基本定义。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":4,"type":"single","stem":"关于汇率的影响以下描述正确的是","options":["本币贬值有利于吸引资本流入","马歇尔一勒纳条件是指当进出口商品需求弹性等于1时，本币贬值才能改善国际收支","J曲线效应说明本币升值使出口出现先降后升的变化","本币升值会增加对本币金融资产的需求"],"answer":"D","expl":"**本币升值有利于吸引资本流入；马歇尔一勒纳条件是指当进出口商品需求弹性大于1时，本币贬值才能改善国际收支，J曲线效应指本币贬值会使出口出现先降后升的变化。\n\n**提示：**本题涉及“汇率变化带来的影响”这部分内容的理解还是有一定难度的。考生一定理清汇率和利率物价、资产价格等关键变量之间的关系，不宜死记硬背。本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":7,"type":"single","stem":"对债权人而言，下列哪种情况最有利","options":["名义利率为6.12%，通货膨胀率为6.4%","名义利率为5.22%，通货膨胀率为一0.8%","名义利率为2.25%，通货膨胀率为0.4%","名义利率为2.52%，通货膨胀率为2.0%"],"answer":"B","expl":"**B项实际利率等于6.02%最大，对债权人有利。\n\n**提示：**本题考查名义利率和实际利率。债券实际利率是债权人的收益，债务人的成本。同学们需要掌握好费雪方程式。本考点涉及的题型有选择题、判断题。","score":1},{"no":8,"type":"single","stem":"以下不属于金融资产的金融工具是","options":["通货和存款","股票和投资基金证券","贷款承诺和信用证","贷款和债券"],"answer":"C","expl":"**C项属于金融负债（从银行的角度来考虑，贷款承诺和信用证均是潜在或现实的负债）。\n\n**提示：**本题考查对金融资产的理解。其实本题并不难，但是只有少数同学注意到了本题题眼是资产两个字，只需要区分资产和负债即可。本考点涉及的题型有选择题、判断题。","score":1},{"no":9,"type":"single","stem":"以下关于资本市场描述正确的是","options":["从发行方式看，我国IPO既是公募发行也是直接发行","证券交易所内交易的股票都是上市证券","证券交易所内的交易采用议价方式成交","高科技企业的股票都在创业板市场发行"],"answer":"B","expl":"**我国IPO是间接发行，需要承销商；证券交易所内的交易采用竞价方式成交（集合竞价，连续竞价）；不是高科技企业的股票都在创业板市场发行，比如格力电器在主板市场发行。\n\n**提示：**本题考查IPO发行方式，证券交易方式等常识。复习该部分知识点时考生需要区分直接发行、间接发行.公募发行.私募发行之间的区别。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":10,"type":"single","stem":"关于衍生金融工具市场描述正确的是","options":["远期交易合约的交易单位是交易所规定的标准化单位","期货交易既可以在场内市场也可以在场外市场进行","期权交易中看跌期权的买方具有决定是否买入合同标的物的权利","期货是在远期的基础上产生的，期权是在期货的基础上产生的"],"answer":"D","expl":"**期货交易合约的交易单位是交易所规定的标准化单位；期货交易不能在场外市场进行；期权交易中看跌期权的买方具有决定是否卖出合同标的物的权利。\n\n**提示：**本题考查期货和远期的区别。考生也需掌握期货和期权的区别。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":11,"type":"single","stem":"在我国，经营过程中会面临存款挤兑风险的金融机构是","options":["证券公司","保险公司","投资基金","信用合作社"],"answer":"D","expl":"**只有D项信用合作社属于存款类金融机构，存在挤兑风险。\n\n**提示：**本题考查存款类金融机构和非存款类金融机构的区别。挤兑风险只发生于存款类金融机构，复习该部分知识点时考生需要掌握两类机构分别包含了哪些内容。本考点涉及的题型有选择题、判断题。","score":1},{"no":12,"type":"single","stem":"凯恩斯的货币需求理论认为","options":["商品价格取决于商品价值和黄金的价值","货币需求仅指作为交易媒介的流通中货币的需求","交易动机的货币需求与收入水平存在正相关关系","货币需求具有稳定性的特点"],"answer":"C","expl":"**A、B、D不是凯恩斯理论的观点。\n\n**提示：**本题考查凯恩斯货币需求理论，复习该部分知识点时考生需要掌握整个货币需求理论的发展脉络。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":13,"type":"single","stem":"关于中央银行再贴现政策描述正确的是","options":["中央银行可以自主决定再贴现率，因此具有充分的主动性","再贴现政策调控效果和缓，对市场震动小","再贴现政策既可用于结构调整也可用于规模调整","再贴现政策实施效果不受经济周期的影响"],"answer":"C","expl":"**再贴现政策的效果，取决于商业银行贴现的意愿，非常被动；再贴现政策随时调整引起市场利率的经常波动，使商业银行无所适从；贴现政策实施效果受经济周期的影响。\n\n**提示：**本题考查中央银行三大法宝中的再贴现政策，复习该部分知识点时考生需要掌握三大货币政策工具各自的优缺点。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":14,"type":"single","stem":"在下列关于资产负债率、权益乘数和产权比率之间关系的表达式中，正确的是","options":["资产负债率十权益乘数=产权比率","资产负债率一权益乘数=产权比率","资产负债率x权益乘数=产权比率","资产负债率/权益乘数=产权比率"],"answer":"C","expl":"A.资产负债率十权益乘数=产权比率 B.资产负债率一权益乘数=产权比率 C.资产负债率x权益乘数=产权比率 D.资产负债率/权益乘数=产权比率所以，资产负债率x权益乘数=（负债总额/资产总额）×（资产总额/股东权益）=负债总额/股东权益= 产权比率。\n\n**提示：**本题考查财务比率，这三个财务指标是CPA考试的基础公式，但我们的教材上并未涉及。考生将这三个财务指标的转换公式记住即可。本考点涉及的题型有选择、判断题。","score":1},{"no":15,"type":"single","stem":"某项目每半年支付1000元现金流，并按照同样的模式持续到永远（假定年利率为16%）。该项目的当前价值最接近（）元","options":["6250","12981","12336","13560"],"answer":"B","expl":"**（1+R半年）^2=1+16%P=1000/R半年=12981元\n\n**提示：**本题考查现金流贴现模型，非常基础，因为半年为一期，所以要注意贴现率的计算。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":16,"type":"single","stem":"A和B是两个互斥项目，投资额均为100万元，两个项目后续的现金流如下，正确的是（时间 A B 1 2 3 4","options":["当贴现率为10%时，A项目的净现值为7.88万元","当贴现率为10%时，B项目的净现值为7.18万元","当贴现率低于两个项目净现值线的交叉点时，B项目的净现值更高","当贴现率高于两个项目净现值线的交叉点时，B项目的净现值更高"],"answer":"D","expl":"**曲线A比曲线B更陡峭，因为A对利率变化的敏感性更高，因此当贴现率高于两个项目净现值线的交叉点时，B项目的净现值更高。\n\n**提示：**本题考查用净现值法进行项目选择。复习该部分知识点时，考生需要把贴现率和项目净现值的关系图画出来加以理解，同时也要把握好净现值线与横轴的交点，就是该项目的内部收益率。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":17,"type":"single","stem":"李先生购买一处房产价值为100万元，首付金额为20万，其余向银行贷款。贷款年利率为12%（年度百分率），按月还款，贷款期限为20年。如果按照等额本金的方式还款，则李先生各月偿还额加总 【待核：低置信度】为","options":["964000","1264000","1764000","1894000"],"answer":"C","expl":"**注意区分等额本金还款和等额本息还款区别，等额本金还款法还款公式：M=L/n+（L-S）xR，其中，M—每月还款额，L一贷款本金，R一月 e":1},{"no":4,"type":"tf","stem":"基准利率是在商业票据市场和同业拆借市场的交易中产生的。","options":["正确","错误"],"answer":"×","expl":"**基准利率一般不会在商业票据市场中产生。\n\n**提示：**本题考查基准利率的内涵。基准利率是由市场决定的，包括同业拆借利率.回购利率.存贷款利率，同时考生需要多花时间去了解中国的基准利率，利率走廊和利率市场化等热点问题。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":5,"type":"tf","stem":"中央银行实施公开市场操作影响货币乘数进而影响货币供给。","options":["正确","错误"],"answer":"×","expl":"**中央银行实施公开市场操作会影响基础货币。\n\n**提示：**本题考查货币供给公式M=B·m和公开市场操作。考生需要掌握央行的“三大法宝”是如何影响 M=B·m公式中各个变量的。本考点涉及的题型有选择、判断题、简答题。","score":1},{"no":6,"type":"tf","stem":"我国目前货币层次中的狭义货币包括：流通中的现金、企业活期存款和居民活期存款。","options":["正确","错误"],"answer":"×","expl":"**狭义货币包括：流通中的现金和活期存款（不包括居民活期存款）。\n\n**提示：**本题考查货币层次划分。大家需要牢记M1、M2，准货币包括的内涵以及货币层次划分标准。\n\n本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":7,"type":"tf","stem":"正回购是融出资金的方式，逆回购是融入资金的方式。","options":["正确","错误"],"answer":"×","expl":"**正回购是融入资金的方式，逆回购是融出资金的方式。\n\n**提示：**本题涉及的知识点是“正回购”和“逆回购”。首先，考生需要把握回购的内涵；其次，考生需要知道在中国，回购行为是站在央行角度说的，即“正回购”是央行融入资金的行为，“逆回购”是央行向社会投放资金的行为。而在美国，与中国正好相反。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":8,"type":"tf","stem":"流动性偏好理论认为若出现流动性陷阱，货币供给的变动不再会影响利率水平。","options":["正确","错误"],"answer":"√","expl":"**流动性陷阱是凯恩斯提出的一种假说，当利率降低到无可再降低的地步时，任何货币量的增加，\n\n**提示：**本题考查复习该部分知识点时考生对“流动性陷阱”的理解。复习该部分知识点时考生必要完全理解“流动性陷阱”的图像，并能够绘制相关图像，以及“流动性陷阱”形成的原因。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":9,"type":"tf","stem":"商业银行和中央银行都是存款性金融机构，都要依据《巴塞尔协议》的规定，达到资本充足率的要求。","options":["正确","错误"],"answer":"×","expl":"**依据《巴塞尔协议》的规定，商业银行要达到资本充足率的要求。\n\n**提示：**本题涉及的知识点是《巴塞尔协议》。复习该部分知识点时考生需要掌握《巴塞尔协议》中的相关财务比率以及《马塞尔协议》的作用。这个文件是复试的重要考点。本考点涉及的题型有选择题、判断题。","score":1},{"no":10,"type":"tf","stem":"真实票据理论认为商业银行的资产业务应以短期和商业性贷款为主。","options":["正确","错误"],"answer":"√","expl":"**真实票据理论认为，商业银行的资产业务主要集中于以真实票据为基础的短期自偿性贷款，以保持与资金来源高度流动性相适应的资产的高度流动性。\n\n**提示：**本题考查“商业票据理论”。复习该部分知识点时考生需要掌握整个商业银行经营理论的发展框架，特别是资产管理理论中需要记忆的分支理论比较多。本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":11,"type":"tf","stem":"政策性银行的经营原则是安全性、流动性和盈利性。","options":["正确","错误"],"answer":"×","expl":"**盈利性不是政策性银行的经营原则，而是商业银行的经营原则。\n\n**提示：**本题考查政策性银行的经营原则。同时复习该部分知识点时考生还需掌握商业银行和中央银行的经营原则。本考点涉及的题型有选择题、判断题、简答题。\n\n【待核：低置信度】（**×**）\n\n**解析：**在货币政策和财政政策的配合上，“双松”或“双紧”用于总量调整，“一松一紧”用于结构调控。\n\n**提示：**本题考查货币政策和财政政策的搭配问题。复习该部分知识点时考生需要掌握政策搭配的四种情景，以及每种搭配为了实现怎样的政策目的。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":13,"type":"tf","stem":"衍生金融工具期限短，主要用于短期融资、套期保值和投机。","options":["正确","错误"],"answer":"×","expl":"**衍生金融工具要用于套利、套期保值和投机。\n\n**提示：**本题考查衍生金融工具的特点和作用。复习该部分知识点时考生需要把握衍生金融工具和原生金融工具的区别。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":14,"type":"tf","stem":"在资本预算中，修正的内部收益率（MIRR）不会出现多重解。","options":["正确","错误"],"answer":"√","expl":"**内部收益率会出现多重解；修正的内部收益率（MIRR）不会出现多重解。\n\n**提示：**本题考查项目评估中MIRR法的特点。复习该部分知识点时考生需要把握项目评估法中各方法的优点和缺点。其中难点在于内部收益率.MIIRR法和净现值法互相之间的对比。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":15,"type":"tf","stem":"在计算WACC时，权重应该选择以账面价值衡量的目标资本结构。","options":["正确","错误"],"answer":"×","expl":"**在计算WACC时，权重应该选择以市场价值衡量的目标资本结构。\n\n**提示：**本题考查RWACC的计算。资产价格分为账面价值和市场价值，在计算题中我们使用的价格均为市场价值，因为账面价值没有实际意义。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":16,"type":"tf","stem":"在有限合伙制企业中，并不是所有合伙人都只承担有限责任。","options":["正确","错误"],"answer":"√","expl":"**在有限合伙制企业中，合伙人分为普通合伙人和有限合伙人，普通合伙人承担无限连带责任，有限合伙人以出资为限承担有限责任。\n\n**提示：**本题考查合伙制企业的特点。《公司财务》p2。《公司财务》第一章最频繁的出题点就在企业的组织形式这块内容，相关法律条文会出小题，请复习该部分知识点时考生注意。本考点涉及的题型有选择题、判断题。","score":1},{"no":17,"type":"tf","stem":"如果公司预测未来市场利率会下降，则公司应该发行可赎回债券，这样未来利率下降时，公司可以事先约定的价格赎回债券，从而获得收益。","options":["正确","错误"],"answer":"√","expl":"**如果公司预测未来市场利率会下降，则债券未来价格上升，公司可以事先约定的价格赎回债券，从而获得收益。\n\n**提示：**本题考查对可赎回债券的理解。复习该部分知识点时考生需要了解可赎回债券和普通债券的区别以及公司在什么情况下会赎回债券等问题。本考点涉及的题型有选择题、判断题。","score":1},{"no":18,"type":"tf","stem":"一般而言，处于成长中的企业为了吸引投资者，多采取高股利政策。","options":["正确","错误"],"answer":"×","expl":"**成长中企业需要现金流进行投资，因此会采用低股利政策。\n\n**提示：**本题考查股利政策的选择的问题。《公司财务》p349。影响公司是否发放现金股利的因素，书上都有详细的讲解，考生需要好好把握。同时复习该部分知识点时，考生也需要掌握各个股利政策之间的区别，以及股利政策是否会影响公司价值等问题。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":19,"type":"tf","stem":"从看涨期权的角度看，公司的债权人持有的头寸是拥有公司和一份以公司为标的物.执行价格为负债到期支付额的看涨期权空头。","options":["正确","错误"],"answer":"√","expl":"**从期权角度看公司的权益和负债，分为股东买权角度、股东卖权角度、债权人买权角度、债权人卖权角度。\n\n**提示：**本题考查从期权角度看公司的权益和负 产负债表内，不影响其资产负债总额，但能影响银行当期损益，改变银行资产报酬率的经营活动。（2）分类：狭义的表外业务指那些未列入资产负债表，但同表内资产业务和负债业务关系密切，并在一定条件下会转为表内资产业务和负债业务的经营活动。广义的表外业务则除了包括狭义的表外业务，还包括结算、代理、咨询等无风险的经营活动，所以广义的表外业务是指商业银行从事的所有不在资产负债表内反映的业务。务；客户违约；由于市场条件的变化，银行对客户的保证变为银行实际资产的配置；在期权、期货和调换交易中，银行风险的不确定性更大。（4）意义：表外业务存在的原因主要有：一是规避资本管制，增加利润，因为巴塞尔协议对资本结构和各类资产的风险权数做了统一的规定，而表外业务对资本要求很低，这对扩大业务规模很有利。二是转移和分散风险，目前世界主要国家普遍实行浮动汇率制度，汇率经常性的变动使得商业银行的国际业务和外汇头寸管理困难重重，同时竞争激烈的情况下，存款来源也不稳定，银行面临资金缺口扩大，流动性风险增大，而表外业务如期权，期货和互换都可以起到分散风险和转移风险的功能，银行面临汇率波动可以进行套期保值等投资手段。三是成本低，风险相对较小。","points":["定义：表外业务（off-balancesheetbusiness），指商业银行所从事的，按照通行的会计准则不列入资产负债表内，不影响其资产负债总额，但能影响银行当期损益，改变银行资产报酬率的经营活动。","分类：狭义的表外业务指那些未列入资产负债表，但同表内资产业务和负债业务关系密切，并在一定条件下会转为表内资产业务和负债业务的经营活动。广义的表外业务则除了包括狭义的表外业务，还包括结算、代理、咨询等无风险的经营活动，所以广义的表外业务是指商业银行从事的所有不在资产负债表内反映的业务。务；客户违约；由于市场条件的变化，银行对客户的保证变为银行实际资产的配置；在期权、期货和调换交易中，银行风险的不确定性更大。","意义：表外业务存在的原因主要有：一是规避资本管制，增加利润，因为巴塞尔协议对资本结构和各类资产的风险权数做了统一的规定，而表外业务对资本要求很低，这对扩大业务规模很有利。二是转移和分散风险，目前世界主要国家普遍实行浮动汇率制度，汇率经常性的变动使得商业银行的国际业务和外汇头寸管理困难重重，同时竞争激烈的情况下，存款来源也不稳定，银行面临资金缺口扩大，流动性风险增大，而表外业务如期权，期货和互换都可以起到分散风险和转移风险的功能，银行面临汇率波动可以进行套期保值等投资手段。三是成本低，风险相对较小。"]},{"no":4,"type":"term","stem":"IPO折价","score":4,"body":"（1）概念：一只股票在首次公开发行后，上市交易首日的收盘价通常都会明显高于发行价，形成“首日收益”，这一现象被称为IPO折价。（2）特点：由于缺乏判断股票发行价格高低的绝对标准，因此金融学采用与市场价格比较的指标来判断，例如，新股上市的首日收益率。首日收益率是指新股上市首日的收盘价超过其发行价的百分比。折价的幅度通常用首日收益率度量。（3）现象：新股的折价是一个国际、国内股票市场普遍存在的问题。","points":["概念：一只股票在首次公开发行后，上市交易首日的收盘价通常都会明显高于发行价，形成“首日收益”，这一现象被称为IPO折价。","特点：由于缺乏判断股票发行价格高低的绝对标准，因此金融学采用与市场价格比较的指标来判断，例如，新股上市的首日收益率。首日收益率是指新股上市首日的收盘价超过其发行价的百分比。折价的幅度通常用首日收益率度量。","现象：新股的折价是一个国际、国内股票市场普遍存在的问题。"]},{"no":5,"type":"term","stem":"红利的客户效应","score":4,"body":"身，因其所处不同等级的边际税率，对企业股利政策的偏好也是不同的现象。（2）特点：收入高的投资者因其拥有较高的税率表现出偏好低股利支付率的股票，希望少分现金股利或不分现金股利，以更多的留存收益进行再投资，从而提高所持有的股票价格。而收入低的投资者以及享有税收优惠的投资者表现出偏好高股利支付率的股票，希望支付较高而且稳定的现金股利。","points":["身，因其所处不同等级的边际税率，对企业股利政策的偏好也是不同的现象","（2）特点：收入高的投资者因其拥有较高的税率表现出偏好低股利支付率的股票，希望少分现金股利或不分现金股利，以更多的留存收益进行再投资，从而提高所持有的股票价格","而收入低的投资者以及享有税收优惠的投资者表现出偏好高股利支付率的股票，希望支付较高而且稳定的现金股利"]},{"no":1,"type":"short","stem":"简述存款扩张倍数与货币乘数的区别及联系。","score":8,"body":"（1）货币乘数和存款货币扩张倍数都可用来阐明现代信用货币具有扩张性的特点，二者差别主要在于两点：\n\n①一是货币乘数和存款货币扩张倍数的分子分母构成不同。货币乘数是以货币供给量为分子、以基础货币为分母的比值；存款货币扩张倍数是以总存款为分子、以原始存款为分母的比值。\n\n②二是分析的角度和着力说明的问题不同。货币乘数是从中央银行的角度进行的分析，关注的是角度进行的分析，主要揭示了银行根本体系是如何通过吸收原始存款、发放贷款和办理转账结算等信用活动创造出数倍存款货币的。\n\n币每变动一个单位所引起的货币供应量增加或减少的倍数；存款扩张倍数又称存款乘数，是指总存款与原始存款之间的比率。相同点在于二者都用于阐明现代信用货币具有扩张性的特点。","points":["（1）货币乘数和存款货币扩张倍数都可用来阐明现代信用货币具有扩张性的特点，二者差别主要在于两点：","一是货币乘数和存款货币扩张倍数的分子分母构成不同。货币乘数是以货币供给量为分子、以基础货币为分母的比值；存款货币扩张倍数是以总存款为分子、以原始存款为分母的比值。","二是分析的角度和着力说明的问题不同。货币乘数是从中央银行的角度进行的分析，关注的是角度进行的分析，主要揭示了银行根本体系是如何通过吸收原始存款、发放贷款和办理转账结算等信用活动创造出数倍存款货币的。 币每变动一个单位所引起的货币供应量增加或减少的倍数；存款扩张倍数又称存款乘数，是指总存款与原始存款之间的比率。相同点在于二者都用于阐明现代信用货币具有扩张性的特点。"]},{"no":2,"type":"short","stem":"简述一国国际收支持续失衡对国内经济的影响。","score":8,"body":"一般来说，一国国际收支持续地高频失衡，可能在一些方面不利于国内经济的发展。\n\n（1）逆差对经济的影响：①由于外汇供给短缺，将导致本币汇率有贬值压力，短期资本大量外流，从而进一步恶化国际收支状况，甚至会导致货币危机。如果一国政府为保持其货币汇率稳定而动用国际储备，这又将导致对外货币供给的减少，追使国内经济紧缩，从而最终导致产出的下降和失业率的提高。同时，国内经济的紧缩会导致资本的大量流出。②以国际储备来弥补长期性逆差，将导致一国对外资产的持续减少，有损国家的对外信用。\n\n（2）顺差对经济的影响：顺差给本币带来升值压力为对冲升值压力，导致央行以外汇占款的形式被动投放基础货币，带来国内货币供给增长过快和通货膨胀的压力，对货币调控的自主性和有效性形成一定的制约。对于我国来说，国际收支大量顺差也意味着大量资源流向外向型经济部门，不利于产业结构、地区结构的调整。从贸易伙伴国的角度相应地出现国际收支赤字，这容易引起国际经济交往中的贸易摩擦和冲突，从而导致国际交易成本的上升。","points":["一般来说，一国国际收支持续地高频失衡，可能在一些方面不利于国内经济的发展。 （1）逆差对经济的影响：","由于外汇供给短缺，将导致本币汇率有贬值压力，短期资本大量外流，从而进一步恶化国际收支状况，甚至会导致货币危机。如果一国政府为保持其货币汇率稳定而动用国际储备，这又将导致对外货币供给的减少，追使国内经济紧缩，从而最终导致产出的下降和失业率的提高。同时，国内经济的紧缩会导致资本的大量流出。","以国际储备来弥补长期性逆差，将导致一国对外资产的持续减少，有损国家的对外信用。 （2）顺差对经济的影响：顺差给本币带来升值压力为对冲升值压力，导致央行以外汇占款的形式被动投放基础货币，带来国内货币供给增长过快和通货膨胀的压力，对货币调控的自主性和有效性形成一定的制约。对于我国来说，国际收支大量顺差也意味着大量资源流向外向型经济部门，不利于产业结构、地区结构的调整。从贸易伙伴国的角度相应地出现国际收支赤字，这容易引起国际经济交往中的贸易摩擦和冲突，从而导致国际交易成本的上升。"]},{"no":3,"type":"short","stem":"简述平方根定律、立方根定律和资产组合理论的异同。","score":8,"body":"鲍莫的“平方根定律”，惠伦在的“立方根定律\"和托宾的“托宾资产组合理论”都是对凯恩斯的货币需求理论的深入研究和扩展。这些理论都在凯恩斯流动偏好的理论基础上，从不同角度对凯恩斯理论进行发展，通过新的模型得出新的结论。\n\n（1）鲍莫尔模型在凯恩斯的货币需求分析中，交易性货币需求是收入的函数，而与利率无关。鲍莫尔模型即“平方根定律”，是美国经济学家威廉·杰克·鲍莫尔（WilliamJackBaumol）于1952年提出来的，该模型将利率因素引入交易性货币需求分析而得出的货币需求理论模型，论证了交易性货币需求也会受利率的影响，从而修正了凯恩斯关于交易性货币需求对利率不敏感的观点。\n\nC by M= 或M\n\n0.5-0.5 2i 这就是著名的“平方根定律”，用于交易的货币持有额或交易性的货币需求量与收入Y和利率i都有关，与收入的平方根线性正相关，与利率平方根的倒数线性正相关。\n\n（2）惠伦模型在凯恩斯的货币需求分析中，预防性货币需求是收入的函数，与利率无关。对于这一结论，1966年美国经济学家惠伦（Whalen）进行了发展，他论证了预防性货币需求与利率的函数关系，得出惠伦模型即立方根定律。\n\n预防性货币需求来自于人们对未来事物不确定性的考虑。人们无法保证在某一时期内的货币收入和货币支出与原来预料的完全一致，不测情况的发生可能导致已有的收入不能满足临时的货币支付要求，所谓预防性货币需求就是实际保持的货币超过正常的预期需求量的部分。惠伦认为预防性货币的需求量取决于两个因素:一是经支出状况，即支出与收入之差，只有当支出与收入之差大于所持有的货币量时才会将债券变现转化为货币，而这种可能性出现的概率受到每次收入与支出变化以及变现次数的影响，二是持币的机会成本，包括利息损失的成本和变现成本。\n\n(3) 托宾资产组合理论凯恩斯在货币投机需求理论中认为，人们根据对未来利率变化的预期，当市场利率低于预期利率时，投资者会大量持有现金，如果市场利率高于预期利率，人们减少货币持有债券。人们对于货币和债券这两种资产的选择，或是货币，或是债券，不能两者兼得。由于各人预期不同，因此总是有一部分人持有货币，另一部分人保持债券，但每个人只能二择其一。然而现实情况却与凯恩斯的理论不相吻合，投资者对自己预期往往不是那么自信，一般人都是既持有货币，同时又持有债券，于是许多学者对凯恩斯的理论发表了新的见解，其中最有代表性的就是“托宾模型”，主要研究在对未来预计不确定性存在的情况下，人们怎样选择最优的金融资产组合。\n\n詹姆斯托宾〈James Tobin) 认为，决定投资者资产组合的基本原则是预期效用极大化。投资者在选择其资产组合时，既要考虑所获收益的大小，又要考虑所冒风险的大小。在托宾模型中，资产的保存形式也只有两种:货币与债券。持有债券可以得到利息，但也要承担由于债券价格下跌而受损失的风险，因此债券称为风险性资产，持有货币虽没有收益，但也不必承担风险〈排除物价变动情况 ) ，故货币被称作安全性资产。《金融学》p406","points":["鲍莫的“平方根定律”，惠伦在的“立方根定律\"和托宾的“托宾资产组合理论”都是对凯恩斯的货币需求理论的深入研究和扩展。这些理论都在凯恩斯流动偏好的理论基础上，从不同角度对凯恩斯理论进行发展，通过新的模型得出新的结论。","鲍莫尔模型在凯恩斯的货币需求分析中，交易性货币需求是收入的函数，而与利率无关。鲍莫尔模型即“平方根定律”，是美国经济学家威廉·杰克·鲍莫尔（WilliamJackBaumol）于1952年提出来的，该模型将利率因素引入交易性货币需求分析而得出的货币需求理论模型，论证了交易性货币需求也会受利率的影响，从而修正了凯恩斯关于交易性货币需求对利率不敏感的观点。 C by M= 或M 0.5-0.5 2i 这就是著名的“平方根定律”，用于交易的货币持有额或交易性的货币需求量与收入Y和利率i都有关，与收入的平方根线性正相关，与利率平方根的倒数线性正相关。","惠伦模型在凯恩斯的货币需求分析中，预防性货币需求是收入的函数，与利率无关。对于这一结论，1966年美国经济学家惠伦（Whalen）进行了发展，他论证了预防性货币需求与利率的函数关系，得出惠伦模型即立方根定律。 预防性货币需求来自于人们对未来事物不确定性的考虑。人们无法保证在某一时期内的货币收入和货币支出与原来预料的完全一致，不测情况的发生可能导致已有的收入不能满足临时的货币支付要求，所谓预防性货币需求就是实际保持的货币超过正常的预期需求量的部分。惠伦认为预防性货币的需求量取决于两个因素:一是经支出状况，即支出与收入之差，只有当支出与收入之差大于所持有的货币量时才会将债券变现转化为货币，而这种可能性出现的概率受到每次收入与支出变化以及变现次数的影响，二是持币的机会成本，包括利息损失的成本和变现成本。","托宾资产组合理论凯恩斯在货币投机需求理论中认为，人们根据对未来利率变化的预期，当市场利率低于预期利率时，投资者会大量持有现金，如果市场利率高于预期利率，人们减少货币持有债券。人们对于货币和债券这两种资产的选择，或是货币，或是债券，不能两者兼得。由于各人预期不同，因此总是有一部分人持有货币，另一部分人保持债券，但每个人只能二择其一。然而现实情况却与凯恩斯的理论不相吻合，投资者对自己预期往往不是那么自信，一般人都是既持有货币，同时又持有债券，于是许多学者对凯恩斯的理论发表了新的见解，其中最有 入 SDR，可增强 SDR 代表性和稳定性，提高其作为国际储备资产吸引力，对稳定世界金融局势将起到重要作用。回金融市场角度:有利于国内金融改革和国际货币体系改革。人民币加入 SDR 有助于进一步推进利率市场化、汇率形成机制改革等各项金融改革，促进资本账户开放，推动人民币国际化进程。将人民币加入 SDR 篮子有利于人民币发挥在 SDR 的稳定、保值方面的作用，改变 SDR 的分配状况，推动国际货币体系改革。@@ 国际收支:促进资本项目开放，加快人民币可自由兑换进程 CD 国际金融合作:有利于提升亚投行国际影响力，对充分支持亚洲新兴经济体国家经济发展以及亚洲的货币金融合作将起到重要作用 63) 消极影响，从内部看，中国经济仍将处于新常态下的调整期，从外部来看，美元加息预期强烈，国际金融环境并不稳定。在这样的背景下，人民币加入 SDR 对中国经济所带来的风险不容忽视。局加大金融风险，影响国内宏观经济稳定。从内部看，中国经济仍将处于新常态下的调整期，从外部来看，美元加息预期强烈，国际金融环境并不稳定。人民币加入 SDR 的一个重要条件就是人民币可以自由兑换，资本项目开放也会导致金融风险加大。包影响货币政策有效性。资金的逐利性可能会冲击国内的货币供给，引起国内资金价格的涨跌，可能还会干扰到国内实体经济的发展，对金融监管提出挑战。","points":["意义:， SDR 特别提款权是国际货币基金组织在 1969 年为了解决布雷顿森林体系下国际储备不足的问题而创设的一种储备资产和记账单位，被称为“纸黄金 \"。它是基金组织根据成员国所缴纳的份额分配给会员国的一种账面资产，可以用来偿还基金组织贷款，偿付国际收支逆差，还可以充当国际储备货币，是普通提款权的一种补充。目前，特别提款权由美元、欧元、人民币、日元、英镑构成。","积极影吧: @ 货币角度:有利于人民币国际化，提高人民币的国际地位。加入 SDR 意味着人民币成为世界货币，并发挥计价、支付、结算、储备等国际货币职能。国际金融市场对人民币的需求会增加，能提升人民币在国际市场上的地位，有利于人民币国际化。@ 外汇储备角度:可以减少我国的外汇储备需求。目前我国持有约 4 万亿美元外汇储备，人民币成为国际储备货币，有利于减少我国外汇需求，可节省资金用于发展和增长。图汇率角度:降低汇率风险，促进国际贸易和投资发展。人民币加入 SDR 后，人民币将在国际市场上受到认可和接受，企业将更多地采用本币进行结算，有利于规避外汇风险，减少投资收益和成本的不确定性，促进贸易和投资发展。八国际储备角度:增强 SDR 作为国际储备资产的吸引力，促进世界金融的稳定发展。在美联储即将加息、欧元万亿量化宽松 (QE) 以及日元持续大幅贬值的影响下，相关国家外汇储备缩水，而人民币汇率则维持了相对稳定。因此人民币加入 SDR，可增强 SDR 代表性和稳定性，提高其作为国际储备资产吸引力，对稳定世界金融局势将起到重要作用。回金融市场角度:有利于国内金融改革和国际货币体系改革。人民币加入 SDR 有助于进一步推进利率市场化、汇率形成机制改革等各项金融改革，促进资本账户开放，推动人民币国际化进程。将人民币加入 SDR 篮子有利于人民币发挥在 SDR 的稳定、保值方面的作用，改变 SDR 的分配状况，推动国际货币体系改革。@@ 国际收支:促进资本项目开放，加快人民币可自由兑换进程 CD 国际金融合作:有利于提升亚投行国际影响力，对充分支持亚洲新兴经济体国家经济发展以及亚洲的货币金融合作将起到重要作用","消极影响，从内部看，中国经济仍将处于新常态下的调整期，从外部来看，美元加息预期强烈，国际金融环境并不稳定。在这样的背景下，人民币加入 SDR 对中国经济所带来的风险不容忽视。局加大金融风险，影响国内宏观经济稳定。从内部看，中国经济仍将处于新常态下的调整期，从外部来看，美元加息预期强烈，国际金融环境并不稳定。人民币加入 SDR 的一个重要条件就是人民币可以自由兑换，资本项目开放也会导致金融风险加大。包影响货币政策有效性。资金的逐利性可能会冲击国内的货币供给，引起国内资金价格的涨跌，可能还会干扰到国内实体经济的发展，对金融监管提出挑战。"]}]},{"year":2018,"included":32,"excluded":2,"questions":[{"no":1,"type":"single","stem":"关于货币形式的盖述正确的是","options":["与实物货币相比，金属货币具有易于保存的优点","金属货币的价值随着金银开采量的增减而频繁变动，因此被纸币所取代","纸币和存款货币都是中央银行产生后创造的货币形式","存款货币都是由商业银行业务派生出来的"],"answer":"A","expl":"**与实物货币相比，金属货币坚固耐摩，不易腐蚀，既便于流通，也适合于保存，选项 A 正确。金属货币的价值是其作为货币的交换价值，而不是其作为金或银的市场价值，而纸币取代金属货币的原因是纸币具有易于流通、不受金银开采量限制，选项 B 错误。纸币在中央银行产生之前已经出现，如宋代交子，选项 C 错误。存款货币中的派生存款是商业银行业务派生出来的，而原始存款不是，选项 D 错误。","score":1},{"no":2,"type":"single","stem":"关于目前的国际货币制度的阐述正确的是","options":["由于国际储备货币多元化，会产生“劣币驱逐良币”现象","美元与黄金保持固定比价，因此产生了“特里芬难题”","从汇率制度角度看，欧元区属于固定汇率制","目前人民币汇率制度属于有管理的独立浮动制"],"answer":"C","expl":"**“劣币驱逐良币”现象是金银复本位制导致的，国际储备货币的多元化不等同于本位币的多元化，选项 A 错误。“特里芬难题”的产生是因为美元与黄金挂钩，其他国家货币与美元挂钩导致的，并不是因为美元与黄金保持固定比价，选项 B 错误。欧元区内各国使用共同货币，属于固定汇率制，选项 C 正确。目前人民币汇率制度是以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度，不是有管理的独立浮动汇率制度，选项 D 错误。","score":1},{"no":3,"type":"single","stem":"汇率变化对证券市场影响的说法正确的是","options":["本币升值，国际资金流出，股票价格上升","本币升值，出口企业业绩下滑，引起股票价格下降","本币贬值，使得本国企业的国际竞争力下降，引起股票价格下降","本币贬值，吸引国际投资资金流入，引起证券价格上升"],"answer":"B","expl":"**从国际资金流动角度看，本币升值，国际资金流入，资本市场供不应求，股票价格上升，选项 A 和选项 D 错误。从进出口角度看，本币升值，出口减少，进口增多，本国商品国际竞争力下降，出口企业业绩下滑，引起出口企业的股票价格下跌，选项 B 正确，选项 C 错误。","score":1},{"no":4,"type":"single","stem":"与古典利率理论的观点相吻合的是","options":["货币需求增加会引起利率上升","利息是剩余价值的一部分","利率不会高于平均利润率","边际储蓄倾向提高会引起利率下降"],"answer":"D","expl":"**古典利率决定理论认为储蓄和投资流量的变动引起利率的变动，边际储蓄倾向提到会引起利率下降,选项 D 正确。选项 A 是凯恩斯利率决定利率的观点。选项 B 和 C 是马克思利率决定理论的观点。","score":1},{"no":5,"type":"single","stem":"远期合约的主要优点是","options":["可以灵活的依据交易双方的需要订立","标准化合约，可以减少交易成本","不受金融监管机构监管","没有违约风险"],"answer":"A","expl":"**远期合约不是标准化合约，在场外交易，交易双方可以灵活根据自身需要订立，灵活性高，但流动性弱。选项 A 正确，选项 B 错误。远期合约受到金融监管机构的监管，具有违约风险。","score":1},{"no":6,"type":"single","stem":"关于金融市场的阐述正确的是","options":["期货交易属于场外交易","黄金市场属于离岸金融市场","外汇市场是外汇买卖和借贷的市场","中央银行参与资本市场交易活动"],"answer":"C","expl":"**期货交易在场内交易，选项 A 错误。离岸金融市场，是指非本地居民之间，以银行为中介，在某种货币发行国国境之外，从事该种货币交易的市场，也.将它称为欧洲货币市场。黄金市场不属于离岸金融市场，B 错误。中央银行只能在货币市场上进行公开市场操作，选项 D 错误。","score":1},{"no":7,"type":"single","stem":"与同类企业相比，如果某上市公司市盘率偏低则意味着","options":["其企业价值被低估","其企业价值被高估","股票市场泡沫过大","股票市场交易低迷"],"answer":"A","expl":"**市熏率 = 每股市价 /每股净利润。假设每股乔利不变，当利润作为全部股利发放时，市盈率反应经过多长时间本金可以通过股息的形式收回。选项 C 和 D 都是关于整个股票市场的情况，不能反映单个上市公司与其他同类企业的市熏率差别，因此 C 和 D 选项排除。在 A 和了 B 选项中，选项 A 正确。市盘率越低，回收期越短，风险 :监管的协调性高，对监管中发现的问题能得到及时的处理和解决。","意义:金融机构资产组合总体风险容易判断;可以避免重复和交叉监管现象的出现，为金融机构创造公平竞争的市场环境。"]},{"no":4,"type":"term","stem":"财务危机成本","score":4,"body":"(1) 定义:财务危机成本〈financial crisis cost) ，是指企业在发生财务危机，即企业在履行偿债义务方面遇到极大困难，暂时或永久无法履行某些偿债义务时的成本。财务危机成本由公司股东承担，主要分为直接成本和间接成本。(2) 分类:直接成本是指企业破产、进行清算或重组发生的法律费用和管理费用，一般只占公司价值的很小一部分。间接成本有三个方面: @@ 当企业陷于财务困境时，由于客户担心服务受到影响及信心丧失通常会转向其他企业，致使公司经营能力受损，@@ 企业一旦陷入财务困境，债权人为了保护自身利益不受损失，纷纷上门讨债，导致股东被迫采取一些短期行为，这些行为将有损企业长期发展潜力、降低企业价值，图当公司拥有债务时，股东和债权人之间产生利益冲突，这时股东会寻求利己策略，给公司增加代理成本。","points":["定义:财务危机成本〈financial crisis cost) ，是指企业在发生财务危机，即企业在履行偿债义务方面遇到极大困难，暂时或永久无法履行某些偿债义务时的成本。财务危机成本由公司股东承担，主要分为直接成本和间接成本。","分类:直接成本是指企业破产、进行清算或重组发生的法律费用和管理费用，一般只占公司价值的很小一部分。间接成本有三个方面: @@ 当企业陷于财务困境时，由于客户担心服务受到影响及信心丧失通常会转向其他企业，致使公司经营能力受损，@@ 企业一旦陷入财务困境，债权人为了保护自身利益不受损失，纷纷上门讨债，导致股东被迫采取一些短期行为，这些行为将有损企业长期发展潜力、降低企业价值，图当公司拥有债务时，股东和债权人之间产生利益冲突，这时股东会寻求利己策略，给公司增加代理成本。"]},{"no":5,"type":"term","stem":"认股权证","score":4,"body":"(1) 定义:认股权证〈warrants) ，是公司发行的一种长期股票买入选择权，它本身不是股票，即不享受股利收益，也没有投票权，但它的持有者可以在规定的时间内按照事先确定的价格从发行股票的公司购买一定数量的股票。(2) 特点:认股权证主要有以下特征: @ 认股权权证是一种股票买权，它的发行目的主要是吸引广大投资者购买公司发行的债券或优先股。但认股权证不是一般的股票买权，认股权证的行权会增加公司流通在外的股票数量，包每份认股权证能认购的普通股股数是固定的，加认股权证上规定认购普通股票的价格;多认股权证上载明认股权证的有效期限。","points":["定义:认股权证〈warrants) ，是公司发行的一种长期股票买入选择权，它本身不是股票，即不享受股利收益，也没有投票权，但它的持有者可以在规定的时间内按照事先确定的价格从发行股票的公司购买一定数量的股票。","特点:认股权证主要有以下特征: @ 认股权权证是一种股票买权，它的发行目的主要是吸引广大投资者购买公司发行的债券或优先股。但认股权证不是一般的股票买权，认股权证的行权会增加公司流通在外的股票数量，包每份认股权证能认购的普通股股数是固定的，加认股权证上规定认购普通股票的价格;多认股权证上载明认股权证的有效期限。"]},{"no":1,"type":"short","stem":"从市场功能上看，金融市场中的一级市场与二级市场有何不同?","score":8,"body":"一级市场是证券发行市场，是发行人向投资者出售证券的市场，由于证券是在发行市场上首次作为商品进入资本市场的，因此称为一级市场。二级市场是证券流通市场，是指对已经发行的证券进行买卖，转让和流通的市场。证券一级市场和二级市场相辅相成，构成统一的证券市场。二者的主要区别及各自的特点如下: (1) 参与主体不同一级市场的参与主体为证券发行人、证券投资者和证券中介机构。其中证券发行人是构成一级市场的首要因素。创设证券在本质上是证券发行人向投资者募集资金的筹资行为，鉴于一级市场参与者的特殊结构，其市场功能的核心是协调证券发行人与证券投资者之间的关系。二级市场的主要参与者为投资者，它主要是证券持有人以及准备购买证券的货币持有人。此外，证券发行人和证券中介机构也是二级市场的参与者，但其职责在于辅助投资者进行和完成交易，而不是证券交易活动的独立参加者。作为例外情况，证券中介机构也可能会充当投资者。《2) 金融中介的角色不同一级市场的金融中介机构主要是指作为证券发行人与投资人交易媒介的证券承销人，它通常是负担承销义务的投资银行、证券公司或信托投资公司，主要在一级市场上起着沟通买卖、连接供求的重要的桥梁作用。二级市场的中介人主要有证券经纪人、证券商和第二经纪人，其中证券经纪人是在证券交易所充当交易中介而收取佣金的商人，必须是交易所会员，证券商是指买卖证券的自营证券、自负盘亏的商人;第二经纪人是指交易所经纪人与外界证券商或客户的中介人。《3) 市场组织形式不同。一级市场通常无固定场所，是一个无形市场。二级市场的组织方式可分为证券交易所交易、柜台交易和无形市场。证券交易所是高度组织化、制度化的市场，柜台交易和无形市场是松散、无组织的市场。","points":["一级市场是证券发行市场，是发行人向投资者出售证券的市场，由于证券是在发行市场上首次作为商品进入资本市场的，因此称为一级市场。二级市场是证券流通市场，是指对已经发行的证券进行买卖，转让和流通的市场。证券一级市场和二级市场相辅相成，构成统一的证券市场。二者的主要区别及各自的特点如下:","参与主体不同一级市场的参与主体为证券发行人、证券投资者和证券中介机构。其中证券发行人是构成一级市场的首要因素。创设证券在本质上是证券发行人向投资者募集资金的筹资行为，鉴于一级市场参与者的特殊结构，其市场功能的核心是协调证券发行人与证券投资者之间的关系。二级市场的主要参与者为投资者，它主要是证券持有人以及准备购买证券的货币持有人。此外，证券发行人和证券中介机构也是二级市场的参与者，但其职责在于辅助投资者进行和完成交易，而不是证券交易活动的独立参加者。作为例外情况，证券中介机构也可能会充当投资者。","金融中介的角色不同一级市场的金融中介机构主要是指作为证券发行人与投资人交易媒介的证券承销人，它通常是负担承销义务的投资银行、证券公司或信托投资公司，主要在一级市场上起着沟通买卖、连接供求的重要的桥梁作用。二级市场的中介人主要有证券经纪人、证券商和第二经纪人，其中证券经纪人是在证券交易所充当交易中介而收取佣金的商人，必须是交易所会员，证券商是指买卖证券的自营证券、自负盘亏的商人;第二经纪人是指交易所经纪人与外界证券商或客户的中介人。","市场组织形式不同。一级市场通常无固定场所，是一个无形市场。二级市场的组织方式可分为证券交易所交易、柜台交易和无形市场。证券交易所是高度组织化、制度化的市场，柜台交易和无形市场是松散、无组织的市场。"]},{"no":2,"type":"short","stem":"简述消费信用的内涵、形式与作用。","score":8,"body":"(1) 消费信用的内涵与形式消费信用是工商企业、银行和其他金融机构提供给消费者用于消费支出的一种信用形式。消费信用主要包括以下三种形式: 中内销:内销是工商企业对消费者提供的短期信用，即以延期付款的方式进行销售，到期后一次付清货款。四分期付款:分期付款是指消费者购买消费品或享受相关服务时，只需支付一部分货款，然后按合同条款分期支付其余货款的本金和利息，属于中长期消费信用。@@ 消费贷款:消费贷款是银行及其他金融机构采用信用放款或抵押放款方式对消费者发放的贷。消费贷款的期限一般比较长，属于长期消费信用。《2) 消费信用的积极作用在宏观层面，消费信用的重要意义几种体现在其对宏观经济的调节作用;在微观层面，消费信用是帮助个人实现生命周期内财务安排的最有效的途径。GD 消费信用与宏观经济调节消费信用是扩大有效需求，促进商品销售的一种有效手段，通过调整消费信用的规模和投向，能够在一定程度上调节消费需求的总量和结构，有利于市场供求在总量和结构上的平衡。消费信用还能针对某些领域和部门进行结构上的调节，从而起到促进或者限制某些领域或经济部门发展的作用。思消费信用与生命周期内的财务安排金融学需要解决的核心问题，是研究人们在不确定的环境中如何进行资源的时间配置。消费信用的介入提供了将未来的预期收入用于当前消费的有效途径，为人们在生命周期内进行财务安排提供了可能。(3) 消费信用的消极作用中消费信用的过度发展，会倾向于掩盖消费品的供求矛盾，容易导致虚假需求，生产者传递错误信息，寻致茶些消费品的生产盲目发展，严重时可能导致产能过剩和产品的大量积压。包过量发展的消费信用很容易导致信用膨胀。由于消费信贷是基于未来的收入预期，是将未来的收入拿到当前来集中消费，如果对消费信贷发放的规模和节奏控制不当，很容易导致某一时期信贷投放规模过大，从而导致通货膨胀的压力，这在经济繁荣时期尤其如此。@@ 由于消费信用对未来购买力的预支,如果消费信贷的借款人对未来预期收入发生了严重的误判，则会使得借球人的债务负担过重，甚至会导致其生活水平下降，从而增加社会的不稳定因素。","points":["消费信用的内涵与形式消费信用是工商企业、银行和其他金融机构提供给消费者用于消费支出的一种信用形式。消费 制度的缺陷逐渐暴露，大量资金实力薄弱的小银行发行的银行券往往不能竞现，加剧了货币流通的混乱和危机，与此同时，小银行的活动范围由于受到地区限制，其发行的银行券只能在很小的范围内流通，给生产和流通造成了很多困难。客观上要求在全国范围内由享有较高信誉的大银行来集中发行货币，以殉服分散发行造成的混乱。","票据交换和清算问题随着银行业务的不断发展，债权债务关系错综复杂，银行每天收受票据的数量也日益增多，由各家银行自行轧差进行当日结清发生困难，客观上要求建立一个全国统一的、权威的、公正的清算机构为之服务。","银行的支付保证能力问题银行的大量发展，一方面要防止一些银行为了逐利而无限扩大贷款，产生流动性不足甚至导致挤兑;另一方面要保证每个银行体系的支付能力，防止个别银行支付风险的传递和扩散，产生金融危机。客观上要求有一定权威性的银行机构,能够在商业银行发生资金困难时,给予必要的贷款支持,发挥“最后贷款人”的功能。","金融监管问题以营利为目的的金融企业之间存在激烈的竞争，但是与一般企业不同，金融企业联系着千家万户，因而它在竞争中的破产、倒闭给经济造成的震荡比普通企业大得多，因此客观上需要有一个代表政府一致的超然于所有金融企业之上的专门机构专事对金融业的监督和管理，以保证金融业的安全与规范化经济。","政府融资问题在资本主义制度确立和发展过程中，政府的作用越来越突出。政府职责的强化增加了开支，政府融资便成为一个重要问题。为保证和方便政府融资，发展或建立一个与政府有密切联系、能够直接或变相为政府筹资或融资的银行机构，也是中央银行产生的客观要求之一。"]},{"no":4,"type":"short","stem":"简述融资优先顺序理论 (pecking order) 的主要内容及其推论。","score":8,"body":"(1) 模型主要内容 Myers 和 Majluf 采用逆回选择模型剖析公司的再融资行为，假设公司经理和外部投资者之间存在信息不对称，分析了信息不对称对公司融资选择的影响，提出了优序融资理论。认为企业的融资决策是在综合各种因素如控制权的分散与财务成本根据成本最小化的原则依次选择不同的融资方式。呈该模型假设市场上有两类公司，价值分别为了和工，假设公司经理清楚地了解自己公司的权益价值，但是外部投资者不知道各个公司的股权价值，因而无法区分两类公司，公司的管理目标是老股东的权益价值最大化。在这些假设下，市场将出现分离均衡:世类公司选择发行股票筹集项目所需资金，而也类公司选择不发行股票并放弃项目投资机会。包分离均衡地出现说明，公司的融资行为具有向市场发送信号的作用。通过观察公司是否发行股票。外部投资者能够辨别也类公司和工类公司。而于类公司之所以放弃发行股票，是因为股票是信息敏感工具，信息不对称导致股票发行会稀释老股东的权益价值，且稀释作用大于项目净现值。(2) 主要推论只要是信息敏感工具，其发行就会对老股东的权益价值产生稀释作用，因而会存在分离均衡。由于不同金融工具对信息的敏感程度不同，因此，在信息不对称的情况下，发行不同金融工具产生的稀释作用也不同。一种金融工具对信息越敏感，其发行产生的稀释作用就越大，公司也就越不愿意发行这种工具。所以公司在为投资项目筹集资金时，首先选择内部融资，其次才考虑外部融资，如果需要进行外部筹资，公司将首先选择高级债务工具，然后选择低级债务工具，例如可转换债券与可转换优先股，最后才选择普通股票。","points":["模型主要内容 Myers 和 Majluf 采用逆回选择模型剖析公司的再融资行为，假设公司经理和外部投资者之间存在信息不对称，分析了信息不对称对公司融资选择的影响，提出了优序融资理论。认为企业的融资决策是在综合各种因素如控制权的分散与财务成本根据成本最小化的原则依次选择不同的融资方式。呈该模型假设市场上有两类公司，价值分别为了和工，假设公司经理清楚地了解自己公司的权益价值，但是外部投资者不知道各个公司的股权价值，因而无法区分两类公司，公司的管理目标是老股东的权益价值最大化。在这些假设下，市场将出现分离均衡:世类公司选择发行股票筹集项目所需资金，而也类公司选择不发行股票并放弃项目投资机会。包分离均衡地出现说明，公司的融资行为具有向市场发送信号的作用。通过观察公司是否发行股票。外部投资者能够辨别也类公司和工类公司。而于类公司之所以放弃发行股票，是因为股票是信息敏感工具，信息不对称导致股票发行会稀释老股东的权益价值，且稀释作用大于项目净现值。","主要推论只要是信息敏感工具，其发行就会对老股东的权益价值产生稀释作用，因而会存在分离均衡。由于不同金融工具对信息的敏感程度不同，因此，在信息不对称的情况下，发行不同金融工具产生的稀释作用也不同。一种金融工具对信息越敏感，其发行产生的稀释作用就越大，公司也就越不愿意发行这种工具。所以公司在为投资项目筹集资金时，首先选择内部融资，其次才考虑外部融资，如果需要进行外部筹资，公司将首先选择高级债务工具，然后选择低级债务工具，例如可转换债券与可转换优先股，最后才选择普通股票。"]},{"no":1,"type":"essay","stem":"2001 年一 2016 年间，我国国际收支经历了两个不同的阶段，先是国际收支持续双顺差，国际储备大幅增长，此后是非储备性质的金融账户逆差，导致国际收支总道差，国际储备大幅减少。请阐述在国际收支顺差、国际储备增长和国际收支逆差、国际储备减少的两种情景下，我国中央银行基础货币投放方式有何不同?为实现货币政策目标而进行的货币政策操作有何不同?","score":14,"body":"(1) 基础货币投放方式不同之处 @ 在国际收支顺差，国际储备增长的背景下，外汇占款导致基础货币被动投放，人民币对外有升值压力，对内有通胀压力。而稳定币值与物价是中央银行的货币政策目标之一，为实现该目标，中央银行需要采取紧缩的货币政策手段，如提高法定存款准备金率、提高再贷款、再贴现率或在公开市场上出售债券等。@ 在国际收支逆差，国际储备减少的背景下，基础货币量下降，人民币对外有贬值压力。为实现稳定币值与稳定物价的货币政策目标，中央银行此时需采取扩张的货币政策手段，如降低法定存款准备金率、降低再贷款、再贴现率或在公开市场上购买债券等。(2) 货币政策操作不同之处过去五年，中国始终注重处理好保持经济平稳较快发展、调整经济结构和管理通胀预期的关系，增强宏观政策的前瞻性、科学性、有效性，注意把握好政策的取向、力度和重点。在国际金融危机冲击最严重时，实施积极的财政政策和适度宽松的货币政策，此后根据宏观经济走势的变化，及时调整政策力度，适时退出刺激政策，实施积极的财政政策和稳健的货币政策。在货币政策运用上，始终注意把握稳增长、控物价和防风险之间的平衡。目前，中国的货币政策实行多目标制，为四项目标共同服务，第一是保持低通胀;第二是促进经济增长，第三是促进就业，第四是保持国际收支基本平衡。要优化货币政策目标体系，在最终目标方面，更加突出价格稳定目标，关注更广泛意义的整体价格水平稳定。这就意味着，在防通胀、稳增长、促就业、保持国际收支基本平衡的四大货币政策目标中，控制通胀〈即稳定物价 ) 的权重将高于其他三个目标。综合当前国内外经济形势，要在货币政策几大目标中取得平衡，就需要: @ 在保持稳健货币政策的连续性和稳定性前提下，增强前瞻性、针对性和灵活性，健全宏观审慎政策框架，发挥货币政策逆周期调节作用，促进金融资源优化配置，守住不发生系统性和区域性金融风险底线。@@ 坚持新发展理念，抓住主要了矛盾，货币政策要在多目标中把握好综合平衡。在实施稳健中性货币政策.增强微观主体活力和发挥好资本市场功能三者之间，形成三角形支撑框架，促进国民经济整体良性循环。@@ 健全货币政策和宏观审慎政策双支柱调控框架由保持货币信贷和社会融资规模合理增长 @@ 用好结构性货币政策工具，定向滴灌 @@ 加强货币政策工具创新;实施好民营企业债券融资支持工具 GO 按照市场化原则加大对民营企业的融资支持 @@ 用好定向降准、再贷款再贴现、抵押补充贷款等政策工具，扩大中期借贷便利合格担保品范围，加大对小微企业等重点领域和薄弱环节的金融支持。田要推动利率体系逐步“两轨合一轨”，增强人民币汇率双向浮动弹性，并在必要时加强宏观审慎管理。支持人民币在跨境贸易和投资中的使用，推进人民币对其他货币直接交易市场发展，更好地为跨境贸易人民币结算业务发展服务。","points":["基础货币投放方式不同之处 @ 在国际收支顺差，国际储备增长的背景下，外汇占款导致基础货币被动投放，人民币对外有升值压力，对内有通胀压力。而稳定币值与物价是中央银行的货币政策目标之一，为实现该目标，中央银行需要采取紧缩的货币政策手段，如提高法定存款准备金率、提高再贷款、再贴现率或在公开市场上出售债券等。@ 在国际收支逆差，国际储备减少的背景下，基础货币量下降，人民币对外有贬值压力。为实现稳定币值与稳定物价的货币政策目标，中央银行此时需采取扩张的货币政策手段，如降低法定存款准备金率、降低再贷款、再贴现率或在公开市场上购买债券等。","货币政策操作不同之处过去五年，中国始终注重处理好保持经济平稳较快发展、调整经济结构和管理通胀预期的关系，增强宏观政策的前瞻性、科学性、有效性，注意把握好政策的取向、力度和重点。在国际金融危机冲击最严重时，实施积极的财政政策和适度宽松的货币政策，此后根据宏观经济走势的变化，及时调整政策力度，适时退出刺激政策，实施积极的财政政策和稳健的货币政策。在货币政策运用上，始终注意把握稳增长、控物价和防风险之间的平衡。目前，中国的货币政策实行多目标制，为四项目标共同服务，第一是保持低通胀;第二是促进经济增长，第三是促进就业，第四是保持国际收支基本平衡。要优化货币政策目标体系，在最终目标方面，更加突出价格稳定目标，关注更广泛意义的整体价格水平稳定。这就意味着，在防通胀、稳增长、促就业、保持国际收支基本平衡的四大货币政策目标中，控制通胀〈即稳定物价 ) 的权重将高于其他三个目标。综合当前国内外经济形势，要在货币政策几大目标中取得平衡，就需要: @ 在保持稳健货币政策的连续性和稳定性前提下，增强前瞻性、针对性和灵活性，健全宏观审慎政策框架，发挥货币政策逆周期调节作用，促进金融资源优化配置，守住不发生系统性和区域性金融风险底线。@@ 坚持新发展理念，抓住主要了矛盾，货币政策要在多目标中把握好综合平衡。在实施稳健中性货币政策.增强微观主体活力和发挥好资本市场功能三者之间，形成三角形支撑框架，促进国民经济整体良性循环。@@ 健全货币政策和宏观审慎政策双支柱调控框架由保持货币信贷和社会融资规模合理增长 @@ 用好结构性货币政策工具，定向滴灌 @@ 加强货币政策工具创新;实施好民营企业债券融资支持工具 GO 按照市场化原则加大对民营企业的融资支持 @@ 用好定向降准、再贷款再贴现、抵押补充贷款等政策工具，扩大中期借贷便利合格担保品范围，加大对小微企业等重点领域和薄弱环节的金融支持。田要推动利率体系逐步“两轨合一轨”，增强人民币汇率双向浮动弹性，并在必要时加强宏观审慎管理。支持人民币在跨境贸易和投资中的使用，推进人民币对其他货币直接交易市场发展，更好地为跨境贸易人民币结算业务发展服务。"]},{"no":2,"type":"essay","stem":"2017 年我国金融监管部门针对资管市场发展中的问题出台了一系列监管新政，运用金融创新与金融监管的关系原理，梳理监管政策并分析构建有效的金融风险监管体系的路径。","score":14,"body":"(1) 金融监管和金融创新的关系金融监管与金融创新二者之间相互影响、相互作用、相互促进。中金融监管刺激了金融创新的产生随着经济的发展和金融环境的变化，许多对金融机构业务活动的限制已经过时，成为金融机构开展正常业务的障碍，甚至成为影响金融体系稳定的因素。金融机构为了绕开金融监管而求得自身的自由和发展，千方百计创造了很多新的金融工具和交易品种。如 NOW、SuperNOW、MMDA、CDs、ATS 等。@O 金融创新对传统金融监管提出了挑战金融创新使货币政策失灵。近年来大量同时具有结算和增值功能的新型金融商品的涌现，使中央银行观测本国金融流量结构失去了稳定基准，传统的三大货币政策，除公开市场业务外，再贴现政策和法定存款准备金政策都难以发挥作用。加金融创新使金融机构面临的风险加大。金融创新在转移和分散金融风险方面起到很大作用，但是从全球或全国的角度看，金融创新仅仅是转移或分散了某种风险，并不意味着减少风险;相反，人金融机构在利益驱动下会在更广的范围内和更大的数量上承担风险，一旦潜在风险转变为现实损失，其破坏性将远远超出传统意义上的金融风险。夯外金融创新还有可能增加金融业的系统风险，一方面是因为创新加大了原有的系统风险，另一方面是创新中产生了新的金融风险。由金融创新加大了人金融监管的难度。活跃的创新在提高金融运作速度和效率的同时，带来了诸多风险和问题，导致金融监管难度加大。《风险大了，货币政策多变，支付和信息系统创新，监管更难 ) (2) 金融监管政策的梳理中统一资管产品标准，合格投资者要求提高。思打破刚性兑付，实行净值化管理。加金融机构之间、机构与通道之间的刚竞也被打破。四规范资金地，禁止非标与资管产品期限错配: A.流动性管理升级 B.限制期限错配 C。向下穿透至底层资产、向上穿透至终端投资者。图统一产品杠杆，分级产品设计要求更高。@@ 消除多层撕套和通道。(3) 构建有效的金融监管体系的路径中坚持问题导向，推进金融机构和金融市场改革开放 a.增强金融服务实体经济能力。金融和实体经济是共生共荣的关系,服务实体经济是金融立业之本，也是防范金融风险的根本举措。为实体经济发展创造良好货币金融环境。要着力加强和改进金融调控，坚持以供给侧结构性改革为主线，以解决融资难融资贵问题为抓手，加强货币政策与其他相关政策协调配合，在稳增长、促改革、调结构、惠民生、防风险等方面形成调控合力。回归金融服务实体经济本源。金融业要专注主业，注重发展普惠金融、科技金融和绿色金融，引导更多金融资源配置到经济社会发展的重点领域和薄弱环节。强化金融机构防范风险主体责任。既要塑造金融机构资产负债表的健康，也要促进公司治理、内控体系、复杂人金融产品交易清算的健康。要严把市场准入关，加强金融机构股东资质管理，防止利益输送、内部交易、干预金融机构经营等行为。建立健全金融控股公司规制和监管，严格限制和规范非金融企业投资金融机构，从制度上隔离实业板块和金融板块。推进金融机构公司治理改革，切实承担起风险管理、遇制大案要案滋生的主体责任。b.深化金融市场改革，优化社会融资结构。积极有序发展股权融资，稳步提高直接融资比重。拓展多层次、多元化、互补型股权融资渠道，改革股票发行制度，减少市场价格〈指数 ) 干预，从根本上消除利益输送和腐败滋生土壤。加强对中小投资者权益的保护，完善市场化并购重组机制。用好市场化法治化债转股利器，发展私募股权投资基金 (PE) 等多元化投资主体，切实帮助企业降低杠杆率，推动“僵尸企业 \"市场出清。积极发展债券市场，扩大债券融资规模，丰富债券市场品种，统一监管标准，更好满足不同企业的发债融资需求。深化市场互联互通，完善金融基础设施。拓展保险市场的风险保障功能，引导期货市场健康发展。c.不断扩大金融对外开放，以竞争促进优化与繁荣。从更高层面认识对外开放的意义，坚持扩大对外开放的大方向，不断推动有关政策改革，更好实现“三驾马车”的对外开放:一是贸易投资的对外开放。二是深化人民币汇率形成机制改革，既要积极有为，扎实推进，又要顺势而为，水到渠成。三古减少外汇管制，稳步推进人民币国际化，便利对外经济活动，稳受有序实现资本项目可兑换。同时，在维护金融安全的前提下，放宽境外金融机构的市场准入限制，在立足国情的基础上促进金融市场规制与国际标准进一步接轨和提高。@@ 坚持底线思维，完善金融管理制度 a.加强和改进中央银行宏观调控职能，健全货币政策和宏观审慎政策双支柱调控框架。随着我国金融体系的杠杆率、关联性和复杂性不断提升，要更好地将币值稳定和金融稳定结合起来。货币政策主要针对整体经济和总量问题，保持经济稳定增长和物价水平基本稳定。宏观审慎政策则直接和集中作用于金融体系，着力减缓因金融体系顺周期波动和跨市场风险传染所导致的系统性金融风险。b.健全金融监管体系,加强统筹协调。中央监管部门要统筹协调。建立国务院金融稳定发展委员会，强化人民银行宏观审慎管理和系统性风险防范职责，切实落实部门监管职责。充分利用人民银行的机构和力量，统筹系统性风险防控与重要金融机构监管，对综合经营的金融控股公司、跨市场跨业态跨区域金融产品，明确监管主体，落实监管责任，统筹监管重要金融基础设施，统筹金融业综合统计，全面建立功能监管和行为监管框架，强化综合监管。统筹政策力度和节奏，防止登加共振。中央和地方金融管理要统筹协调。发挥中央和地方两个积极性，全国一盘棋，监管无死角。中央金融监管部门进行统一监管指导，制定统一的金融市场和金融业务监管规则，对地方金融监管有效监督，纠偏问责。地方负责地方金融机构风险防范处置，维护属地金融稳定，不得干预金融机构自主经营。严格监管持牌机构和坚决取缔非法金融活动要统筹协调。金融监管部门和地方政府要强化金融风险源头管控，坚持金融是特许经营行业，不得无证经营或超范围经营。一手抓金融机构乱搞同业、乱加杠杆、乱做表外业务、违法违规套利，一手抓非法集资、乱办交易场所等严重扰乱金融市场秩序的非法金融活动。稳妥有序推进互联网金融风险专项整治工作。监管权力和责任要统筹协调。建立层层负责的业务监督和履职问责制度。@@ 加强党的领导，确保金融改革发展正确方向 a.党的十九大对金融改革开放和防范系统性风险明确了顶层设计。坚持党中央对金融工作的集中统一领导，增强“四个意识”，落实全面从严治党要求，确保国家金融安全。中按照党中央决策落实各项工作部署。树立全局观念，相互配合支持，坚决贯彻落实金融领域重大方针政策、重大改革开放战略及规划，精心组织实施金融监管改革、人金融机构改革、人金融市场改革和防控金融风险的各项措施。b.加强金融系统党的领导和党的建设。党的领导同金融企业法人治理必须一体化,必须贯彻到公司治理全过程。二十国集团领导人安塔利亚峰会审议通过了《二十国集团 /经济合作与发展组织公司治理原则》，我们有条件推进改革与创新，形成符合我国国情的金融企业公司治理机制。@@ 贯彻党管干部原则，发挥党管人才优势。金融业是人才和智力密集的行业。有优秀的经营人才队伍，金融资源配置和风险管理效率就可以提高。有优秀的监管人才队伍，金融安全就能得到保障。建设好金融系统领导班子，建设一支政治过硬、作风优良、业务精通的高素质金融人才队伍。","points":["金融监管和金融创新的关系金融监管与金融创新二者之间相互影响、相互作用、相互促进。中金融监管刺激了金融创新的产生随着经济的发展和金融环境的变化，许多对金融机构业务活动的限制已经过时，成为金融机构开展正常业务的障碍，甚至成为影响金融体系稳定的因素。金融机构为了绕开金融监管而求得自身的自由和发展，千方百计创造了很多新的金融工具和交易品种。如 NOW、SuperNOW、MMDA、CDs、ATS 等。@O dy":"(1) 定义:逆回购 (Reverse repurchase) ，指资金融出方将资金融给资金融入方，收取有价证券作为质押，并在未来收回本息，并解除有价证券质押的交易行为。\n\n(2) 内涵:从表面上看，逆回购协议是一种证券买卖，但实际上是以证券为质押品而进行的一笔短期资金贷放。\n\n(3) 特点:首回购协议是一种表外业务，具有期限短、面额大、安全可靠的特点，逆回购协议的利率由双方协定而与作为质押品的证券利率无关。\n\n(央行道回购指中国人民银行向一级交易商购买有价证券，并约定在未来特定日期将有价证券卖还给一级交易商的交易行为。获得质押的债券，把钱借给商业银行，目的主要是向市场释放流动性。)","points":["定义:逆回购 (Reverse repurchase) ，指资金融出方将资金融给资金融入方，收取有价证券作为质押，并在未来收回本息，并解除有价证券质押的交易行为。","内涵:从表面上看，逆回购协议是一种证券买卖，但实际上是以证券为质押品而进行的一笔短期资金贷放。","特点:首回购协议是一种表外业务，具有期限短、面额大、安全可靠的特点，逆回购协议的利率由双方协定而与作为质押品的证券利率无关。 (央行道回购指中国人民银行向一级交易商购买有价证券，并约定在未来特定日期将有价证券卖还给一级交易商的交易行为。获得质押的债券，把钱借给商业银行，目的主要是向市场释放流动性。)"]},{"no":2,"type":"term","stem":"远期利率协议","score":4,"body":"(1) 定义，远期利率协议〈Forward interest rate agreement) ，远期利率协议是一种远期合约，买卖双方商定在未来某一特定的时期内按协议利率借贷一笔数额确定，以具体货币表示的名义本金的协议。\n\n(2) 目的:远期利率协议的买方是名义借款人，其订立远期利率协议的目的主要是为了规避利率上升的风险，远期利率协议的卖方则是名义贷款人，其订立远期利率协议的目的主要是为了规避利率下降的风险。之所以称为“名义”，是因为借贷双方不必交换本金，只是在结算日根据协议利率和参考利率之间的差额以及名义本金额，由交易一方付给另一方结算。\n\n(3) 影响:远期利率协议使商业银行实现了在不扩大资产负债表的情况下来避免利率风险，免除了因风险管理而带给资产负债表的进一步负担。","points":["定义，远期利率协议〈Forward interest rate agreement) ，远期利率协议是一种远期合约，买卖双方商定在未来某一特定的时期内按协议利率借贷一笔数额确定，以具体货币表示的名义本金的协议。","目的:远期利率协议的买方是名义借款人，其订立远期利率协议的目的主要是为了规避利率上升的风险，远期利率协议的卖方则是名义贷款人，其订立远期利率协议的目的主要是为了规避利率下降的风险。之所以称为“名义”，是因为借贷双方不必交换本金，只是在结算日根据协议利率和参考利率之间的差额以及名义本金额，由交易一方付给另一方结算。","影响:远期利率协议使商业银行实现了在不扩大资产负债表的情况下来避免利率风险，免除了因风险管理而带给资产负债表的进一步负担。"]},{"no":3,"type":"term","stem":"信用风险","score":4,"body":"(1) 定义:信用风险 (creditrisk) ，也称违约风险，是指不能按期偿还本金和支付利息的风险。\n\n(2) 特点:债务人的收入及盈利能力会随经营状况而发生变化，从而给债务本息能否及时偿还带来不确定性。\n\n(3) 意义:公司债券的偿还能力与宏观经济环境及公司经营状况息息相关，具有较大的不确定性，因而具有较高的违约风险。一般来说，信用风险低的债务，其利率也较低，信用风险高的债务其利率也相对较高。","points":["定义:信用风险 (creditrisk) ，也称违约风险，是指不能按期偿还本金和支付利息的风险。","特点:债务人的收入及盈利能力会随经营状况而发生变化，从而给债务本息能否及时偿还带来不确定性。","意义:公司债券的偿还能力与宏观经济环境及公司经营状况息息相关，具有较大的不确定性，因而具有较高的违约风险。一般来说，信用风险低的债务，其利率也较低，信用风险高的债务其利率也相对较高。"]},{"no":4,"type":"term","stem":"可转换债券","score":4,"body":"(1) 定义:可转换债券《convertible bonds) ，是指根据债券合同规定，债券持有人可以在一定时期内按照事先规定的转换比率或转换价格将其转换为普通股股票的公司债券。\n\n(2) 特点:债券持有者可以在条件有利时将可转换债券转换成公司普通股股票，而在条件不利时则不进行转换，选择每期获得持续稳定的固定收益。\n\n(3) 意义:由于这种债券给了债权人更多的选择权利，因此其利息成本低于不可转换债券。\n\n5S.可持续增长率 【参考答案】\n\n(1) 定义:可持续增长率〈Sustainable growth rate) ，可持续增长率是指不增发新股并保持目前经营效率和财务政策条件下公司销售所能增长的最大比率。\n\n(2) 内涵:此处经营效率指的是销售净利率和资产周转率,而财务政策指的是股利支付率和资本结构。\n\n(3) 公式:可持续增长率用公式表示为:可持续增长率 =ROE Xb。其中，ROE 为净资产利润率; b 为企业的再投资比率。\n\n(4) 延伸关系:可持续增长率与销售净利率、资产周转率、股利支付率、资产负债率成正相的关系。","points":["定义:可转换债券《convertible bonds) ，是指根据债券合同规定，债券持有人可以在一定时期内按照事先规定的转换比率或转换价格将其转换为普通股股票的公司债券。","特点:债券持有者可以在条件有利时将可转换债券转换成公司普通股股票，而在条件不利时则不进行转换，选择每期获得持续稳定的固定收益。","意义:由于这种债券给了债权人更多的选择权利，因此其利息成本低于不可转换债券。 5S.可持续增长率 【参考答案】","定义:可持续增长率〈Sustainable growth rate) ，可持续增长率是指不增发新股并保持目前经营效率和财务政策条件下公司销售所能增长的最大比率。","内涵:此处经营效率指的是销售净利率和资产周转率,而财务政策指的是股利支付率和资本结构。","公式:可持续增长率用公式表示为:可持续增长率 =ROE Xb。其中，ROE 为净资产利润率; b 为企业的再投资比率。；延伸关系:可持续增长率与销售净利率、资产周转率、股利支付率、资产负债率成正相的关系。"]},{"no":1,"type":"short","stem":"简述汇率变动对国内物价的影响机制。","score":8,"body":"《1) 第一，生产成本机制。人民币升值有助于带动进口原材料如燃料、能源价格的下跌，因此有助于降低国内企业的生产成本，带动我国国内物价的下降。《2) 第二，生产者和消费者的心理预期机制。生产者会把汇率的变动纳入特殊的生产成本，进而对生产函数产生负面影响，生产积极性降低。而消费者由于预期人民币未来的价值会更大则减少现在的消费支出。这两个因素共同作用使国内需求不足，物价水平下跌。《3) 第三，货币工资机制。人民币升值会带动进口品价格下降，推动消费水平的下降，导致实际工资上升，生产者因降低成本的需要而降低名义工资，名义工资的下降会进一步推动企业生产成本和消费水平的下降，循环不已，最终使我国国内物价指数下降。","points":["第一，生产成本机制。人民币升值有助于带动进口原材料如燃料、能源价格的下跌，因此有助于降低国内企业的生产成本，带动我国国内物价的下降。","第二，生产者和消费者的心理预期机制。生产者会把汇率的变动纳入特殊的生产成本，进而对生产函数产生负面影响，生产积极性降低。而消费者由于预期人民币未来的价值会更大则减少现在的消费支出。这两个因素共同作用使国内需求不足，物价水平下跌。","第三，货币工资机制。人民币升值会带动进口品价格下降，推动消费水平的下降，导致实际工资上升，生产者因降低成本的需要而降低名义工资，名义工资的下降会进一步推动企业生产成本和消费水平的下降，循环不已，最终使我国国内物价指数下降。"]},{"no":2,"type":"short","stem":"简述弗里德曼的货币需求理论的主要结论和政策主张。","score":8,"body":"《1) 弗里德曼的货币需求理论的主要结论: 恒久性收入的波动幅度比现期收入小得多，且货币流通速度也相对稳定，所以货币需求也比较稳定。因此，货币对于总体经济的影响主要来自于货币的供应方面。弗里德曼认为，人们在众多资产中选择货币，就像在众多的商品中进行选择一样，因此，对人们货币需求问题的分析可借助消费者选择理论来进行。与消费者对商品的选择一样，人们对货币的需求同样受这三类因素的影响，进而对影响货币需求的这三类因素进行了详细的分析: 收入或财富弗里德曼用长期的永恒收入〈Y) 来代表财富总额。永恒收入是指一个人在比较长的一个时期内的过去、现在和今后预期会得到的收入的加权平均数，具有稳定性的特点。弗里德曼认为，货币需求与永恒收入成正比关系，由总财富决定的永恒收入水平越高，货币需求就越大。弗里德曼进一步把财富分为人力财富和非人力财富两大类。人力财富是指个人获得收入的能力，其大小与接受教育的程度紧密相关非人力财富指各种物质性财富，如房屋.生产资料等。 上增强银行信用。作为信用中介的银行，其基本特征是高风险性和不稳定性，即银行大部分资金是以负债的形式吸收的机构和个人存款，自有资金只占全部资本的小部分，在经营管理不善或其他因素作用下导致不能按时清偿债务时，就易引起银行信用危机。@@ 有利于加强中央银行的监管力度，减轻中央银行的负担。存款保险的目的，一方面是在必要的情况下，执行赔偿的职责，另一方面，更为主要的是为了保障整个金融体系的稳定。《3) 存款保险制度的弊端: 外存款保险制度其最根本的问题在于它可能诱发道德风险。一方面，存款保险制度的存在使得存款者风险意识下降，特别是在利率市场化实现以后，他们就能不顾银行经营风险，将钱存到愿意支付最高存款利息的银行，另一方面，商业银行的风险约束机制也会弱化，在经营活动中就可能为追求高额利润而过度投机。凶鼓励银行儿而走险。存款保险制度刺激银行承受更多的风险，鼓励银行的冒险行为。因为银行知道，一旦遇到有麻烦，存款保险机构会挽救它们。这样那些资金实力弱、风险程度高的金融机构会得到实际的好处，而经营稳健的银行会在竞争中受到损害，从而给整个金融体系注入了不稳定因素并增大了银行体系的经营风险。","points":["存款保险制度的主要内容: 存款保险制度是一种金融保障制度，由符合条件的各类存款性金融机构集中起来建立一个保险机构，各存款机构作为投保人按一定存款比例向其缴纳保险费，建立存款保险准备金。当成员机构发生经营危机或面临破产倒闭时，存款保险机构向其提供财务救助或直接向存款人支付部分或全部存款，从而保护存款人利益，维护银行信用，稳定金融秩序。2015 年 5 月 1 日起，存款保险制度在中国正式实施，各家银行向保险机构统一缴纳保险费，一旦银行出现危机，保险机构将对存款人提供最高 50 万元的赔付额。","存款保险制度的好处: GD 有利于防范金融风险，稳定一国金融体系。在经济金融全球化背景下，国际金融市场动荡加剧，频频发生金融风波。如 1995 年的英国巴林银行倒闭事件，199%6 年的日本阪和银行倒闭事件等等,不仅严重影响了本国经济的正常运转和社会安定，还给国际金融市场带来了巨大冲击，建立存款保险制度不失为防范金融风险的可行选择之一。@ 有利于保护广大存户利益，总体上增强银行信用。作为信用中介的银行，其基本特征是高风险性和不稳定性，即银行大部分资金是以负债的形式吸收的机构和个人存款，自有资金只占全部资本的小部分，在经营管理不善或其他因素作用下导致不能按时清偿债务时，就易引起银行信用危机。@@ 有利于加强中央银行的监管力度，减轻中央银行的负担。存款保险的目的，一方面是在必要的情况下，执行赔偿的职责，另一方面，更为主要的是为了保障整个金融体系的稳定。","存款保险制度的弊端: 外存款保险制度其最根本的问题在于它可能诱发道德风险。一方面，存款保险制度的存在使得存款者风险意识下降，特别是在利率市场化实现以后，他们就能不顾银行经营风险，将钱存到愿意支付最高存款利息的银行，另一方面，商业银行的风险约束机制也会弱化，在经营活动中就可能为追求高额利润而过度投机。凶鼓励银行儿而走险。存款保险制度刺激银行承受更多的风险，鼓励银行的冒险行为。因为银行知道，一旦遇到有麻烦，存款保险机构会挽救它们。这样那些资金实力弱、风险程度高的金融机构会得到实际的好处，而经营稳健的银行会在竞争中受到损害，从而给整个金融体系注入了不稳定因素并增大了银行体系的经营风险。"]},{"no":4,"type":"short","stem":"达生公司决定发行债券进行融资,但考虑到当前利率较高，未来市场利率可能下调，因此董事会认为公司应该发行可赎回债券。预期利率下降是否是发行可赎回债券的充足理由，为什么?","score":8,"body":"预期利率下降可以是发行可屿回债券的原因之一，但不是发行可赎回债券的充足理由，分析如下:《1) 预期利率下降通常是发行可赎回债券的原因之一:可赎回债券是发行公司可以按照发行时规定的条款，以一定的条件和价格在公司认为合适的时间提前赎回的债券。其提前赎回债券的规定允许发行公司在未来市场利率降低时，采用换债方法提前贱回利息较高的债券，代之以利息较低的债券，将利恩变动的风险转让给债权人。因此，债券发行公司发行可赎回债券的原因通常是预期未来利率下降，以期在未来可以利用屿回条款进行换债操作。《2) 但预期利率下降不是发行可赎回债券的充分条件，还需考虑发行可赎回债券的直接成本和间接成本、预期未来利率下降的时机与幅度、换债成本等因素。如上述第〈1) 点所述，由于可赎回债券的发行对债务人有利，而对债权人不利，利息变动的风险完全由债权人承担，因此为弥补债权人的损失，可赎回债券的投资收益高于同等条件的不可赎回债券。知预期未来利率下降时间靠后且下降幅度较小，则可能存在换债后的收益无法弥补前期发行可财回债券带来的成本增加的情况。3) 妨外，换债成本也是影响可赎回债券发行决策的因素之一。当且仅当准备被置换的债务的赎回价格与新债的发行费用、旧债赎回的操作费用、重复的利息支出等各项换债成本之和小于没有赎回条款情况下的旧债的市场价值，换债才能给发债公司带来收益。","points":["预期利率下降可以是发行可屿回债券的原因之一，但不是发行可赎回债券的充足理由，分析如下:","预期利率下降通常是发行可赎回债券的原因之一:可赎回债券是发行公司可以按照发行时规定的条款，以一定的条件和价格在公司认为合适的时间提前赎回的债券。其提前赎回债券的规定允许发行公司在未来市场利率降低时，采用换债方法提前贱回利息较高的债券，代之以利息较低的债券，将利恩变动的风险转让给债权人。因此，债券发行公司发行可赎回债券的原因通常是预期未来利率下降，以期在未来可以利用屿回条款进行换债操作。","但预期利率下降不是发行可赎回债券的充分条件，还需考虑发行可赎回债券的直接成本和间接成本、预期未来利率下降的时机与幅度、换债成本等因素。如上述第","点所述，由于可赎回债券的发行对债务人有利，而对债权人不利，利息变动的风险完全由债权人承担，因此为弥补债权人的损失，可赎回债券的投资收益高于同等条件的不可赎回债券。知预期未来利率下降时间靠后且下降幅度较小，则可能存在换债后的收益无法弥补前期发行可财回债券带来的成本增加的情况。","妨外，换债成本也是影响可赎回债券发行决策的因素之一。当且仅当准备被置换的债务的赎回价格与新债的发行费用、旧债赎回的操作费用、重复的利息支出等各项换债成本之和小于没有赎回条款情况下的旧债的市场价值，换债才能给发债公司带来收益。"]},{"no":1,"type":"essay","stem":"基于货币供给模型，推导货币乘数的表达式，并结合在我国货币乘数中各影响因素的趋势变化，分析存款人、商业银行、中央银行等各类经济主体的经济行为对货币乘数产生的影响《〈请指明所使用符号的含义 ) 。","score":14,"body":"(1) 货币乘数及其推导: 由于基础货币是由通货（C） 和存款准备金有) 构成的，货币供给由现金（C） 和存款货币（D） 构成。现金本身是不能自我扩张的，能够引起货币供给量数倍扩张的只有存款准备金。用公式可以表 Ms_C+D 8H1 加加一 CRTR CR，其中 CD 为通货一存款比率，RD 为准备一存款比率。这两个比率共同决定 D D 了货币乘数。(2) 结合趋势变化，各经济主体对货币乘数的影响四居民:居民对货币乘数的影响主要通过通货一存款比率发生作用。居民持币增加，通货一存款比率就会提高，货币乘数就会变小。当中央银行对定期和活期存款采取不同的法定准备金挛时，居民对储蕾种类的选择将影响商业银行计提的法定存款准备金，从而影响准备一存款比率。同时居民的资产选择行为将影响居民储蓄存款的变化，并同时影响两个比率。@@ 企业:总共有三个方面的影响，分别是: a.企业的持币行为影响通货一存款比率，企业的持币偏好越强货币乘数越小; b.企业的理财及其资产组合影响企业存款的增减,影响存款的种类结构,进而影响通货一存款比率和准备一存款比率; c.企业的经济活动对贷款影响很大,一方面企业的经营状况影响商业银行的贷款决策,另一方面企业的贷款需求变化是存款货币创造的前提，对货币乘数有很大影响。图金融机构:总共有三个方面的影响，分别是: a.商业银行变动超额准备的行为影响准备一存款比率，超额准备金越多货币乘数越小; b.银行的贷款意愿越强，准备一存款比率越小，货币乘数越大; c.向中央银行借款的行为使准备一存款比率增加从而降低货币乘数。@ 政府:其对货币乘数的影响主要是通过弥补财政赤字的三种方式体现的。a.如果政府采用增税的方式弥补财政赤字,短期内并不直接影响货币乘数和货币供给,但在长期内将通过影响投资收益，使投资需求下降，贷款需求减少，导致货币乘数变小。b.若政府采用举债方式弥补财政赤字,在公众和商业银行购买国债时，虽然货币供给总量短期内不变，但货币结构将发生变化，各层次的货币乘数也将发生变化。c.如果政府采用向中央银行直接借款或透支的方式弥补财政赤字,政府现金支出将直接增加现金投放，从而影响通货一存款比率，政府的转移支付将使非政府部门的存款增加，引起银行存款的增加，导致准备一存款比率升高，进而影响货币乘数。示为 M","points":["货币乘数及其推导: 由于基础货币是由通货（C） 和存款准备金有) 构成的，货币供给由现金（C） 和存款货币（D） 构成。现金本身是不能自我扩张的，能够引起货币供给量数倍扩张的只有存款准备金。用公式可以表 Ms_C+D 8H1 加加一 CRTR CR，其中 CD 为通货一存款比率，RD 为准备一存款比率。这两个比率共同决定 D D 了货币乘数。","结合趋势变化，各经济主体对货币乘数的影响四居民:居民对货币乘数的影响主要通过通货一存款比率发生作用。居民持币增加，通货一存款比率就会提高，货币乘数就会变小。当中央银行对定期和活期存款采取不同的法定准备金挛时，居民对储蕾种类的选择将影响商业银行计提的法定存款准备金，从而影响准备一存款比率。同时居民的资产选择行为将影响居民储蓄存款的变化，并同时影响两个比率。@@ 企业:总共有三个方面的影响，分别是: a.企业的持币行为影响通货一存款比率，企业的持币偏好越强货币乘数越小; b.企业的理财及其资产组合影响企业存款的增减,影响存款的种类结构,进而影响通货一存款比率和准备一存款比率; c.企业的经济活动对贷款影响很大,一方面企业的经营状况影响商业银行的贷款决策,另一方面企业的贷款需求变化是存款货币创造的前提，对货币乘数有很大影响。图金融机构:总共有三个方面的影响，分别是: a.商业银行变动超额准备的行为影响准备一存款比率，超额准备金越多货币乘数越小; b.银行的贷款意愿越强，准备一存款比率越小，货币乘数越大; c.向中央银行借款的行为使准备一存款比率增加从而降低货币乘数。@ 政府:其对货币乘数的影响主要是通过弥补财政赤字的三种方式体现的。a.如果政府采用增税的方式弥补财政赤字,短期内并不直接影响货币乘数和货币供给,但在长期内将通过影响投资收益，使投资需求下降，贷款需求减少，导致货币乘数变小。b.若政府采用举债方式弥补财政赤字,在公众和商业银行购买国债时，虽然货币供给总量短期内不变，但货币结构将发生变化，各层次的货币乘数也将发生变化。c.如果政府采用向中央银行直接借款或透支的方式弥补财政赤字,政府现金支出将直接增加现金投放，从而影响通货一存款比率，政府的转移支付将使非政府部门的存款增加，引起银行存款的增加，导致准备一存款比率升高，进而影响货币乘数。示为 M"]},{"no":2,"type":"essay","stem":"2018 年上半年，人民币竞美元汇率走势较为平稳,但 6 月中旬至 10 月底期间，人民币欧美元汇率急剧贬值，一度跌至近破 7 关口。试分析人民币在此期间面临贬值压力的原因。","score":14,"body":"《1) 美元指数升高。美元指数从 4 月中旬的 89 升高到 10 月底的 9%6。人民币与美元呈现负相关关系，随着美元汇率走强，人民币相应走弱。美元走强的要原因是美国经济强劲复苏，意味着美国的生产率提高，如果美国的生产率提高比中国快，那么，美国国内的产品价格就会下降，增加美国国内自己商品的竞争力，从而增加美国自身商品需求，美元升值。从往年经验看，2017 年美国经济增长相对放组而中国经济增速较快，人民币柜对美元有升值。今年以来，美国经济增长明显加快，而中国经济增速放缓。所以人民币相对贬值，也符合“市场决定价格”原则。《2) 中美利差缩小。凯恩斯提出的利率平价理论可以解释中短期汇率波动，远期汇率的决定因素是货币短期利率之间的差额，资金倾向于从利率较低的国家流向利率较高的国家。2018 年中国实施了四次定同降准，由于货币供给增加的流动性效应，2018 年的利率水平比去年明显走低。中国利率相对美国利率降低，进一步导致中美利差收窗，故人民币呈现贬值压力。长期来看，中美利差倒挂的可能性也并非不存在。中美利差倒挂在金融危机前是一种正常现象。近年来中美利差为正的原因是美国实施量化宽松及低利率政策导致的。随着美国放弃使用非常规货币政策工具，中美利差存在进一步收罕甚至倒挂的可能。《3) 中美贸易战持续升级，避险情绪高涨。就贸易战本身而言，关税和限额长期汇率有一定影响。如果对进口商品加征关税或数量限制，就会减少国内对进口商品的需求，进而增加对国内商品的需求，导致本国货币升值。就避险情绪而言，对中美贸易摩擦升级的担忧导致人民币避险情绪上升，从而使人民币汇率进一步承压。此外，人民币汇率下降也并非政府的政策应对，而是有管理的浮动汇率制度下，经济在面临外部压力下的自动调节、维持内外均衡的自然反应。","points":["美元指数升高。美元指数从 4 月中旬的 89 升高到 10 月底的 9%6。人民币与美元呈现负相关关系，随着美元汇率走强，人民币相应走弱。美元走强的要原因是美国经济强劲复苏，意味着美国的生产率提高，如果美国的生产率提高比中国快，那么，美国国内的产品价格就会下降，增加美国国内自己商品的竞争力，从而增加美国自身商品需求，美元升值。从往年经验看，2017 年美国经济增长相对放组而中国经济增速较快，人民币柜对美元有升值。今年以来，美国经济增长明显加快，而中国经济增速放缓。所以人民币相对贬值，也符合“市场决定价格”原则。","中美利差缩小。凯恩斯提出的利率平价理论可以解释中短期汇率波动，远期汇率的决定因素是货币短期利率之间的差额，资金倾向于从利率较低的国家流向利率较高的国家。2018 年中国实施了四次定同降准，由于货币供给增加的流动性效应，2018 年的利率水平比去年明显走低。中国利率相对美国利率降低，进一步导致中美利差收窗，故人民币呈现贬值压力。长期来看，中美利差倒挂的可能性也并非不存在。中美利差倒挂在金融危机前是一种正常现象。近年来中美利差为正的原因是美国实施量化宽松及低利率政策导致的。随着美国放弃使用非常规货币政策工具，中美利差存在进一步收罕甚至倒挂的可能。","中美贸易战持续升级，避险情绪高涨。就贸易战本身而言，关税和限额长期汇率有一定影响。如果对进口商品加征关税或数量限制，就会减少国内对进口商品的需求，进而增加对国内商品的需求，导致本国货币升值。就避险情绪而言，对中美贸易摩擦升级的担忧导致人民币避险情绪上升，从而使人民币汇率进一步承压。此外，人民币汇率下降也并非政府的政策应对，而是有管理的浮动汇率制度下，经济在面临外部压力下的自动调节、维持内外均衡的自然反应。"]}]},{"year":2020,"included":28,"excluded":5,"questions":[{"no":1,"type":"single","stem":"下列关于货币职能的表述正确的是","options":["作为交换手段的货币特别强调货币本身的价值","货币发挥资产职能源于投机性货币需求","货币在财政收支活动中发挥资产职能","货币发挥支付职能可以自发调节流通中的货币量"],"answer":"B","expl":"** A 项交换手段的货币强调其购买力而非货币本身价值，C 项货币在财政收支活动中发挥支付手段的职能，D 错在没有说明前提，有内在价值的货币可以，无内在价值的信用货币则不可。","score":1},{"no":3,"type":"single","stem":"从流量角度及实体层面考察汇率决定的理论是","options":["利率平价说","购买力平价说","国际借贷说","货币分析说"],"answer":"C","expl":"**国际借贷说认为汇率是由外汇的供给和需求决定的，而外汇的供给和需求是由国际借贷所产生的，因此国际借贷关系是影响汇率变化的主要因素。国际借贷关系不仅包括贸易往来，还包括资本的输出和输入。涉及到流量角度和实体层面。","score":1},{"no":4,"type":"single","stem":"关于外汇的理解正确的是","options":["所有经济体发行的货币都能成为外汇","特别提款权不是经济体发行因而不属于外汇","中国的外汇口径是以外币表示的可以用作国际清偿的支付手段","一般而言外汇所包括的权益类证券应属高信用等级行，银行扣除贴现利息后，支付其贴现金额 9900 元，则银行支付的贴现率为《 )","1% 了.3%","0%6","10%"],"answer":"D","expl":"**外汇是指以外币表示的可以用作国际清偿的支付手段和资产，中外币现钞，包括纸币、和铸币; @@ 外币支付凭证或支付工具，包括票据、银行存款赁证、银行卡等，@@ 外币有价证券，包括债券、股票等，@@ 特别提款权;加其他外汇资产。C 项遗漏了支付手段和资产，故 A、B、C 错误。","score":1},{"no":6,"type":"single","stem":"若利用我国社会融资规模的统计数据测算商业银行影子银行业务规模,下列口径中较接近的是","options":["人民币贷款 + 外币贷款","委托贷款 + 信托贷款 + 未贴现银行承兑汇票","境内股票融资 + 债权融资","地方政府专项债"],"answer":"B","expl":"**影子银行定义:是指游离于银行监管体系之外，可能引发系统性风险和监管套利等问题的信用中介体系〈包括各类相关机构和业务活动 ) 。影子银行主要形式:中银行理财产品，包非银行金融机构贷款产品〈比如信托公司销售的信托产品 ) @@ 民间借贷。其中债权融资、人民币贷款以及地方政府专项债为非影子银行贷款。","score":1},{"no":7,"type":"single","stem":"下列满足利率风险结构分析的说法是","options":["违约风险的高低与违约概率负相关","同一信用级别的金融工具其利率与流动性风险同向变化","美国地方政府债券比美国国债应支付更高的利率","通胀严重时期降低名义利率有利于降低预期的通货膨胀损失"],"answer":"B","expl":"**违约风险越高，违约的概率越大，二者正相关，A 错误，美国地方政府债券比美国国债利率低，主要系地方政府债券免税，投资人更加关注税后利率，C 错误，根 可以是任何一种可自由兑换的但非市场所在国家的货币。这里的欧洲并不是一个地理名词。","points":["定义:欧洲货币市场〈euro currency market) 指非居民间以银行为中介在某种货币发行国国境之外从事该种货币借贷的市场，又可以称为离岸金融市场，是一种超越国界的市场，是国际货币市场的核心。","特点:在这个市场中，世界各国的参与者可以不受任何一国国内政策法令的约束，自由地参与市场交易活动。","范围:交易使用的货币可以是任何一种可自由兑换的但非市场所在国家的货币。这里的欧洲并不是一个地理名词。"]},{"no":4,"type":"term","stem":"分离定理","score":4,"body":"(1) 定义:分离定理指在投资组合中可以以无风险利率自由借贷的情况下投资人选择投资组合时都会选择无风险资产和最优风险投资组合的得最优组合点，因为这一点相对于其他的投资组合在风险上或是报酬上都具有优势。所以任何投资都会选择这一点。投资人对风险的态度，只会影响投入的资金数量，而不会影响最优风险组合点。分离定理也可以表述为最佳风险资产组合的确定独立于投资者的风险偶好。\n\n(2) 决定因素:它取决于各种可能风险组合的期望报酬率和标准差。\n\n(3) 内容:个人的投资行为可分为两个阶段:先确定最佳风险资产组合，后考虑无风险资产和最佳风险资产组合的理想组合。只有第二阶段受投资人风险反感程度的影响，只有在第二个阶段中投资人才决定是否融资，第一阶段也即确定最佳风险资产组合时不受投资者风险反感程度的影响。因此证券先择和资产分配可完全分离。\n\n.边际资本成本率 【参考答案】\n\n(1) 定义:边际资本成本率〈(Marginal capital cost rate) ，是指公司追加筹资的资本成本率，即公司新增一元资本所需负担的成本。\n\n(2) 特征:企业在未来追加筹资时，不能仅仅考虑目前所使用的资本的成本，还要考虑新筹资本的成本，即边际资本成本。公司追加筹资有时可能只采取某一种筹资方式。在筹资数额较大，或在目标资本结构既定的情况下，往往通过多种筹资方式的组合来实现。\n\n(3) 适用方法:边际资本成本需要按加权平均法来计算，其权数必须为市场价值权数，不应采用账面价值权数。","points":["定义:分离定理指在投资组合中可以以无风险利率自由借贷的情况下投资人选择投资组合时都会选择无风险资产和最优风险投资组合的得最优组合点，因为这一点相对于其他的投资组合在风险上或是报酬上都具有优势。所以任何投资都会选择这一点。投资人对风险的态度，只会影响投入的资金数量，而不会影响最优风险组合点。分离定理也可以表述为最佳风险资产组合的确定独立于投资者的风险偶好。","决定因素:它取决于各种可能风险组合的期望报酬率和标准差。","内容:个人的投资行为可分为两个阶段:先确定最佳风险资产组合，后考虑无风险资产和最佳风险资产组合的理想组合。只有第二阶段受投资人风险反感程度的影响，只有在第二个阶段中投资人才决定是否融资，第一阶段也即确定最佳风险资产组合时不受投资者风险反感程度的影响。因此证券先择和资产分配可完全分离。 .边际资本成本率 【参考答案】","定义:边际资本成本率〈(Marginal capital cost rate) ，是指公司追加筹资的资本成本率，即公司新增一元资本所需负担的成本。","特征:企业在未来追加筹资时，不能仅仅考虑目前所使用的资本的成本，还要考虑新筹资本的成本，即边际资本成本。公司追加筹资有时可能只采取某一种筹资方式。在筹资数额较大，或在目标资本结构既定的情况下，往往通过多种筹资方式的组合来实现。","适用方法:边际资本成本需要按加权平均法来计算，其权数必须为市场价值权数，不应采用账面价值权数。"]},{"no":1,"type":"short","stem":"如何理解通货膨胀目标制","score":8,"body":"通货膨胀目标制是中央银行直接以通货膨胀为目标并对外公布针对该目标的货币政策制度。在通货膨胀目标制下，传统的货币政策体系发生了重大变化，在政策工具与最终目标之间不再设立中间目标，货币政策的决策依据主要依靠定期对通货膨胀的预测。(1) 通货膨胀目标制实施的条件主要有:中中央银行的独立性;包货币政策的高度透明度;名利率的市场化，多浮动汇率制。(2) 通货膨胀目标制与传统货币体系相比呈现出以下特点:第一，在通货膨胀目标制下，货币政策承诺维持一个具体的长期通货膨胀水平，长期价格稳定将是压倒一切的首要的政策目标。第二，在长期通货膨胀目标值的约束下,为达到产出稳定等其他目标,中央银行短期内拥有采取灵活政策的权力一一这就是“弹性通货膨胀目标”这一术语的真正含义。第三，通货膨胀目标制要求货币政策决策者保持实质性的开放和透明等。","points":["通货膨胀目标制是中央银行直接以通货膨胀为目标并对外公布针对该目标的货币政策制度。在通货膨胀目标制下，传统的货币政策体系发生了重大变化，在政策工具与最终目标之间不再设立中间目标，货币政策的决策依据主要依靠定期对通货膨胀的预测。","通货膨胀目标制实施的条件主要有:中中央银行的独立性;包货币政策的高度透明度;名利率的市场化，多浮动汇率制。","通货膨胀目标制与传统货币体系相比呈现出以下特点:第一，在通货膨胀目标制下，货币政策承诺维持一个具体的长期通货膨胀水平，长期价格稳定将是压倒一切的首要的政策目标。第二，在长期通货膨胀目标值的约束下,为达到产出稳定等其他目标,中央银行短期内拥有采取灵活政策的权力一一这就是“弹性通货膨胀目标”这一术语的真正含义。第三，通货膨胀目标制要求货币政策决策者保持实质性的开放和透明等。"]},{"no":2,"type":"short","stem":"简述浮动汇率制优缺点","score":8,"body":"《1) 浮动汇率制的优点: 中有助于发挥汇率对国际收支的自动调节作用，从而使对外经济管理变得灵活主动; 凶减少国际游资的冲击，减少国际储备需求; 内外平衡易于协调，浮动汇率制下的汇率自动调节可以避免资本流动对政策效能的不利影响，从而实现对外均衡，国内均衡则主要依靠财政货币政策来调节。(2) 浮动汇率制的浆端: 中不利于国际贸易和投资的发展，汇率波动的难以预测使得国际贸易的成本、收益不易准确核算，阻碍其发展趋势; 包助长了国际金融市场上的投机活动,汇率的波动频率和幅度的加大为外汇投机活动提供了机会，加剧金融市场动荡; 时可能引发货币之间的竞相贬值，各国为了改善国际收支，可以实行本币汇率贬值的办法。网可能引发通货膨胀，固定汇率制下的货币纪律约束，使得政府为了维持汇率水平，不能过度增发货币，避免本币受到贬值压力，浮动汇率制下，货币当局可能偏好采取扩张性货币政策刺激经济增长，而不顾其对国际收支的影响。","points":["浮动汇率制的优点: 中有助于发挥汇率对国际收支的自动调节作用，从而使对外经济管理变得灵活主动; 凶减少国际游资的冲击，减少国际储备需求; 内外平衡易于协调，浮动汇率制下的汇率自动调节可以避免资本流动对政策效能的不利影响，从而实现对外均衡，国内均衡则主要依靠财政货币政策来调节。","浮动汇率制的浆端: 中不利于国际贸易和投资的发展，汇率波动的难以预测使得国际贸易的成本、收益不易准确核算，阻碍其发展趋势; 包助长了国际金融市场上的投机活动,汇率的波动频率和幅度的加大为外汇投机活动提供了机会，加剧金融市场动荡; 时可能引发货币之间的竞相贬值，各国为了改善国际收支，可以实行本币汇率贬值的办法。网可能引发通货膨胀，固定汇率制下的货币纪律约束，使得政府为了维持汇率水平，不能过度增发货币，避免本币受到贬值压力，浮动汇率制下，货币当局可能偏好采取扩张性货币政策刺激经济增长，而不顾其对国际收支的影响。"]},{"no":3,"type":"short","stem":"比较费雪方程式和剑桥方程式","score":8,"body":"《1) 费雪方程式: 20 世纪初，欧文:费雪提出了交易方程式: MV=PY。费雪认为，货币流通速度〈V) 可以视为一个和常数。实际国民收入 (Y) 也保持不变。所以货币供应量 (M) 的变化将完全体现在价格 (P) 的变化上。变形得 Ms=l/vxPY 上式就是由传统货币数量论推导得出的货币需求函数。从中可以看出，货币需求取决于名义国民收入。《2) 剑桥方程式;在研究货币需求问题时，剑桥学派重视微观主体的行为。剑桥学派认为，在其他条件不变的情况下，对每个人来说，名义货币需求与名义收入水平之间总保持着一个较为稳定的比例关系，对整个经济体系来说也是如此。剑桥方程式为: Ms=kPY，Ms 为货币供给量，P 为价格，Y 为名义国民收入, k 是比例系数，代表了人们愿意以货币这种形式持有的名义国民收入的比例。《3) 两个方程式的区别:中费雪方程式从宏观角度分析货币需求，剑桥方程式从微观角度分析货币需求。外费雪方程式强调的是货币的交易手段功能，剑桥方程式重视货币作为一种资产的功能。外费雪方程式把货币需求与支出流量联系在一起，重视货币支出的数量和速度，因此被称为现金交易说;剑桥方程式用货币形式保有资产存量的角度考虑货币需求，重视这个存量占收入的比例，因此被称为现金余额说。","points":["费雪方程式: 20 世纪初，欧文:费雪提出了交易方程式: MV=PY。费雪认为，货币流通速度〈V) 可以视为一个和常数。实际国民收入 (Y) 也保持不变。所以货币供应量 (M) 的变化将完全体现在价格 (P) 的变化上。变形得 Ms=l/vxPY 上式就是由传统货币数量论推导得出的货币需求函数。从中可以看出，货币需求取决于名义国民收入。","剑桥方程式;在研究货币需求问题时，剑桥学派重视微观主体的行为。剑桥学派认为，在其他条件不变的情况下，对每个人来说，名义货币需求与名义收入水平之间总保持着一个较为稳定的比例关系，对整个经济体系来说也是如此。剑桥方程式为: Ms=kPY，Ms 为货币供给量，P 为价格，Y 为名义国民收入, k 是比例系数，代表了人们愿意以货币这种形式持有的名义国民收入的比例。","两个方程式的区别:中费雪方程式从宏观角度分析货币需求，剑桥方程式从微观角度分析货币需求。外费雪方程式强调的是货币的交易手段功能，剑桥方程式重视货币作为一种资产的功能。外费雪方程式把货币需求与支出流量联系在一起，重视货币支出的数量和速度，因此被称为现金交易说;剑桥方程式用货币形式保有资产存量的角度考虑货币需求，重视这个存量占收入的比例，因此被称为现金余额说。"]},{"no":4,"type":"short","stem":"可转换债券一般都设置可转换条款,请问这些条款的主要内容是什么”设置赎回条款的主要目的是什么?","score":8,"body":"(1) 可转换债券:是指公司债券附加可转换条款，赋予债券持有人按预先确定的比例《转换比率 ) 转换为该公司普通股的选择权。由于投资者可以视被投资公司普通股的情况决定是否把可转换债券转换为普通股，即若是转换为普通股后的价值大于原可转换债券的价值，则选择进行转换，和否则不转换。(2) 可转换债券的主要条款: 转换价格:转换价格是指可转换债券转换为每股普通股份所支付的价格。转换比例:转换比例是指一定面额可转换债券可转换成普通股票的股数。转换期限:可转换证券的转换期限可以与债券的期限相同。但大多数情况下，发行人都规定某一具体期限，在有效期内允许可转换债券持有者按转换比例或转换价格转换成发行人的普通股票。赎回条款:促使债券持有人转换股份，可以使发行公司避免市场利率下降后，继续向债券持有人支付较高的债券票面利率所蒙受的损失。回售条款:可以保护债券投资人的利益，可以使投资者具有安全感，有利于吸引投资者。强制性转换条款:保证可转换债券顺利地转换成股票，实现发行公司扩大权益投资的目的。(3) 发行可转换债券设置赎回条款的目的: @ 促进债券持有人转换股份 @ 能使发行公司避免市场利率下降后，继续使债券持有人按照较高的债券票面利率支付利息所蒙受的损失。","points":["可转换债券:是指公司债券附加可转换条款，赋予债券持有人按预先确定的比例《转换比率 ) 转换为该公司普通股的选择权。由于投资者可以视被投资公司普通股的情况决定是否把可转换债券转换为普通股，即若是转换为普通股后的价值大于原可转换债券的价值，则选择进行转换，和否则不转换。","可转换债券的主要条款: 转换价格:转换价格是指可转换债券转换为每股普通股份所支付的价格。转换比例:转换比例是指一定面额可转换债券可转换成普通股票的股数。转换期限:可转换证券的转换期限可以与债券的期限相同。但大多数情况下，发行人都规定某一具体期限，在有效期内允许可转换债券持有者按转换比例或转换价格转换成发行人的普通股票。赎回条款:促使债券持有人转换股份，可以使发行公司避免市场利率下降后，继续向债券持有人支付较高的债券票面利率所蒙受的损失。回售条款:可以保护债券投资人的利益，可以使投资者具有安全感，有利于吸引投资者。强制性转换条款:保证可转换债券顺利地转换成股票，实现发行公司扩大权益投资的目的。","发行可转换债券设置赎回条款的目的: @ 促进债券持有人转换股份 @ 能使发行公司避免市场利率下降后，继续使债券持有人按照较高的债券票面利率支付利息所蒙受的损失。"]},{"no":1,"type":"essay","stem":"2019 年 8 月 17 日中国人民银行决定改革完善贷款市场报价利率 (LPR) 形成机制。截至 11 月底，该机制已经报价四次且伴随中央银行政策利率的下调而呈下降趋势。LPR 改革是否点味着利率市场化改革进入攻关期、结合我国利率市场化改革的进程和困境，从宏、微观角度分别阐述利率市场化改本的必要性、以及推进利率市场化的应进行的举措。","score":14,"body":"LPR 改革意味着我国利率市场化已进入攻关期，理由如下; 2015 年 10 月，我国央行放开存款利率上限，自此利率实现了狭义的市场化,但还存在很多的痛点和墙点，进一步市场化势在必行。(1) 必要性: 宏观角度上: 利率市场化有助于使市场对资源配置起决定性作用。利率是资金的价格，实现市场化有利于提高资源配置的效率。在利率管制下，利率无法实现资源配置信号的作用，导致资金和实物资源的错配。GO 利率市场化改革尚未实现真正的市场化。尽管名义上我国的利率市场化已经基本完成，几乎所有的利率名义上均己完全自由化，但实际上我国利率体系中各环节的传导实际上均还存在一定阻力。加货币政策的转型要求建立市场化的利率形成机制。随着金融深化，利率管制下适用的数量型货币政策逐渐失效，而通畅的利率传导机制是实现货币政策向价格型转型的必要条件。微观角度上: GD 从市场主体的发展角度上，我国中小企业的 GDP 占比比重越来越大，随着中小企业的发展，融资问题日益突出，因此贷款利率市场化有利于缓解中小企业融资难问题。《2) 措施:核心是疏通利率传导机制。有具体来说有: 中逐步放开存款利率隐形管制，并辅之以合适的市场化监管手段。当前市场利率定价自律机制起到存款利率管制的作用，应逐步提高该机制的宽容度。放开存款利率会提高中小银行的风险，因此应探索合适的市场化监管手段以取代当前的直接管制。吧培育合理基准利率作为货币政策操作目标，引导居民预期。市场化的利率体系中，需要有明确的基准利率以辅助定价、实现预期引导等。","points":["LPR 改革意味着我国利率市场化已进入攻关期，理由如下; 2015 年 10 月，我国央行放开存款利率上限，自此利率实现了狭义的市场化,但还存在很多的痛点和墙点，进一步市场化势在必行。","必要性: 宏观角度上: 利率市场化有助于使市场对资源配置起决定性作用。利率是资金的价格，实现市场化有利于提高资源配置的效率。在利率管制下，利率无法实现资源配置信号的作用，导致资金和实物资源的错配。GO 利率市场化改革尚未实现真正的市场化。尽管名义上我国的利率市场化已经基本完成，几乎所有的利率名义上均己完全自由化，但实际上我国利率体系中各环节的传导实际上均还存在一定阻力。加货币政策的转型要求建立市场化的利率形成机制。随着金融深化，利率管制下适用的数量型货币政策逐渐失效，而通畅的利率传导机制是实现货币政策向价格型转型的必要条件。微观角度上: GD 从市场主体的发展角度上，我国中小企业的 GDP 占比比重越来越大，随着中小企业的发展，融资问题日益突出，因此贷款利率市场化有利于缓解中小企业融资难问题。","措施:核心是疏通利率传导机制。有具体来说有: 中逐步放开存款利率隐形管制，并辅之以合适的市场化监管手段。当前市场利率定价自律机制起到存款利率管制的作用，应逐步提高该机制的宽容度。放开存款利率会提高中小银行的风险，因此应探索合适的市场化监管手段以取代当前的直接管制。吧培育合理基准利率作为货币政策操作目标，引导居民预期。市场化的利率体系中，需要有明确的基准利率以辅助定价、实现预期引导等。"]},{"no":2,"type":"essay","stem":"金融科技在我国方兴未艾。金融稳定理事会 (FSB,2017) 将“金融科技”(Fintech) 概括为通过技术手段推动金融创新，形成对金融市场、机构及金融服务产生重大影响的业务模式、技术应用以及流程和产品。结合近年来金融科技的应用和推广，请分析金融科技对我国金融发展的影响，并在此基础上给出相关监管政策调整的建议。","score":14,"body":"《1) 随痢金融科技的发展，以蚂蚁金服为代表的一类影子银行体系对我国金融发展产生了重要影响，包括: 中提高了金融机构的运作效率。首先，金融创新通过大量提供具有特定的内涵与特性的金融工具、金融服务、交易方式或融资技术等成果，从数量和质量两个方面同时提高需求者的满足程度，增加了金融商品和服务的效用，从而增强了金融机构的基本功能，提高了金融机构的运作效率，其次，提高了支付清算能力和速度，第三、大幅度增加了金融机构的资产和盈利率。包提高了金融市场的运作效率。首先，提高了市场价格对信息反应的灵敏度，其次，增加了可供选择的金融商品种类;第三，增强了剔除个别风险的能力;，第四，降低了交易成本与平均成本，使投资收益相对上升，吸引了更多投资者和筹资者进入市场，提高了交易的活跃程度。@@ 增强了金融产业发展能力。由金融作用力大为增强。金融作用力主要是指金融对整体经济运作和经济发展的作用能力，一般通过对总体经济活动和经济总量的影响及其作用程度体现出来。《2) 监管建议:鉴于金融科技和伴生的金融自由化加速了混业经营的趋势，因此提出以下监管建议: 中坚持金融活动全部纳入金融监管，金融业务必须持牌经营，同时要求支付回归本源，断开支付工具和其他金融产品的不当连接。思强化反芍断，出台《关于平台经济领域的反芍断》指南，推动大型互联网平台企业开放封闭场景，充分保障消费者支付选择权。@@ 落实审慎监管要求，完善公司治理，合规开展互联网存贷款、保险、基金等业务。综合上述三条建议，我们应当坚持发展和规范并重，支持和促进平台经济守正创新、行稳致远。激发市场主体活力和科技创新能力，促进平台企业不断提升金融服务，巩固和增强国际竞争力;，坚持从严监管和公平监管，保障数据产权及个人隐私，维护公平竞争的金融市场秩序。","points":["随痢金融科技的发展，以蚂蚁金服为代表的一类影子银行体系对我国金融发展产生了重要影响，包括: 中提高了金融机构的运作效率。首先，金融创新通过大量提供具有特定的内涵与特性的金融工具、金融服务、交易方式或融资技术等成果，从数量和质量两个方面同时提高需求者的满足程度，增加了金融商品和服务的效用，从而增强了金融机构的基本功能，提高了金融机构的运作效率，其次，提高了支付清算能力和速度，第三、大幅度增加了金融机构的资产和盈利率。包提高了金融市场的运作效率。首先，提高了市场价格对信息反应的灵敏度，其次，增加了可供选择的金融商品种类;第三，增强了剔除个别风险的能力;，第四，降低了交易成本与平均成本，使投资收益相对上升，吸引了更多投资者和筹资者进入市场，提高了交易的活跃程度。@@ 增强了金融产业发展能力。由金融作用力大为增强。金融作用力主要是指金融对整体经济运作和经济发展的作用能力，一般通过对总体经济活动和经济总量的影响及其作用程度体现出来。","监管建议:鉴于金融科技和伴生的金融自由化加速了混业经营的趋势，因此提出以下监管建议: 中坚持金融活动全部纳入金融监管，金融业务必须持牌经营，同时要求支付回归本源，断开支付工具和其他金融产品的不当连接。思强化反芍断，出台《关于平台经济领域的反芍断》指南，推动大型互联网平台企业开放封闭场景，充分保障消费者支付选择权。@@ 落实审慎监管要求，完善公司治理，合规开展互联网存贷款、保险、基金等业务。综合上述三条建议，我们应当坚持发展和规范并重，支持和促进平台经济守正创新、行稳致远。激发市场主体活力和科技创新能力，促进平台企业不断提升金融服务，巩固和增强国际竞争力;，坚持从严监管和公平监管，保障数据产权及个人隐私，维护公平竞争的金融市场秩序。"]}]},{"year":2021,"included":27,"excluded":3,"questions":[{"no":1,"type":"single","stem":"居民储蓄存款投资于货币基金，M1、M2 的变化","options":["使 Ml 降低","使 M2 降低","使 M2 不变","使 MIHMM2 的比例发生变动"],"answer":"C","expl":"**居民储蓄存款和货币市场共同基金同属于 m2，因此将居民储蓄存款转化为货币市场共同基金不会改变任一货币层次。","score":1},{"no":2,"type":"single","stem":"以下货币职能的行使中，需要观念的货币，并不需要现实货币的是","options":["交易职能","计价职能","支付手段","储藏货币"],"answer":"B","expl":"**货币履行价值斥度职能只需要观念上的货币。","score":1},{"no":3,"type":"single","stem":"根据利率平价理论，当本国货币利率上升时，正确的是","options":["本币即期汇率贴水","即期汇率不变","外汇远期升水","外币远期贴水"],"answer":"C","expl":"**根据利率平价理论，当本国利率上升时，外币将远期升水，以维持平价。","score":1},{"no":4,"type":"single","stem":"下列关于商业信用和银行信用区别错误的是","options":["银行信用克服了商业信用期限限制","银行信用克服了商业信用规模限制","商业信用产生先于银行信用","银行信用高度发展将取代商业信用 5.关于收益率，以下说法正确的是 ( )","零息债券的收益率一定大于 0","收益率与票面利率不相等，是因为债券的价格波动","如果证券的卖出价格大于买入价格，收益率一定大于票面利率","当期收益率一定等于票面利率"],"answer":"D","expl":"**虽然银行信用解决了商业信用的诸多短板，呈后来居上之势，但并不代表着银行信用将完全取代商业信用。\n\nS.关于收益率，以下说法正确的是 （**A**）\n\nA.零上县债券的收益率一定大于 0 B.收益率与票面利率不相等，是因为债券的价格波动 C.如果证券的卖出价格大于买入价格，收益率一定大于票面利率 D.当期收益率一定等于票面利率\n\n**解析：**收益率与票面利率并无必然联系，同时，债券发行价格与面值一般不同，故收益率与票面利率一般不同。如果债券买入价格大于面值，则收益率可能比票面利率小，当折价或溢价发行时，当期收益率不一定等于票面利率。","score":1},{"no":6,"type":"single","stem":"金融产品的组合风险不小于单个金 "score":8,"body":"(1) 凯恩斯的货币需求理论是基于流动性偏好的视角而展开的，其主要结论如下: 中认为人们持有货币的需求可以分为交易性需求、预防性需求和投机性需求。其中交易性需求和预防性需求主要取决于收入多少，而投机性货币需求主要取决于利率高低。包由于人们的预期时常变化，投机性货币需求变幻莫测，因此货币需求不仅对利率敏感，且货币需求函数也存在不稳定性。(2) 政策主张中由于货币需求函数不稳定且难以预测，货币需求量与总收入联系不紧密，因此在货币政策机制中，应当以利率而非货币供应量作为中介目标。包中央银行可以通过增加货币供给来降低利率，从而刺激投资和收入增长，但是当利率水平低到一定程度而触发流动性陷阱时，货币政策失效，此时应采用财政政策以刺激需求。(3) 理论发展中鲍莫尔将利率因素引入交易性货币需求，该理论认为，交易性货币需求取决于收入水平和利率水平。其公式表明，交易性货币需求是收入立的函数，随着用于交易的收入数量的增加，货币需求量随之增加，货币需求是利率 r 的函数，Fr 的指数说明，交易性货币需求与利率的变动呈反方向变化，其变动幅度较利率变动幅度而言更小。@ 立方根定律公式，立方根法则立方根定律是美国经济学家惠伦于 1966 年提出的。理论将利率因素引入预防性货币需求的分析，论证了预防性货币需求同样受到利率的影响。从而修正了凯恩斯的货币需求理论关于预防性货币需求对利率不敏感的情况。@@ 托宾模型理论是托宾对凯恩斯投机性货币需求理论的发展。通过这个理论，托宾论证了在未来不确定的情况下，人们依据总效用最大化原则在货币与债券之间进行组合，货币的投机需求与利率呈反方向变动。","points":["凯恩斯的货币需求理论是基于流动性偏好的视角而展开的，其主要结论如下: 中认为人们持有货币的需求可以分为交易性需求、预防性需求和投机性需求。其中交易性需求和预防性需求主要取决于收入多少，而投机性货币需求主要取决于利率高低。包由于人们的预期时常变化，投机性货币需求变幻莫测，因此货币需求不仅对利率敏感，且货币需求函数也存在不稳定性。","政策主张中由于货币需求函数不稳定且难以预测，货币需求量与总收入联系不紧密，因此在货币政策机制中，应当以利率而非货币供应量作为中介目标。包中央银行可以通过增加货币供给来降低利率，从而刺激投资和收入增长，但是当利率水平低到一定程度而触发流动性陷阱时，货币政策失效，此时应采用财政政策以刺激需求。","理论发展中鲍莫尔将利率因素引入交易性货币需求，该理论认为，交易性货币需求取决于收入水平和利率水平。其公式表明，交易性货币需求是收入立的函数，随着用于交易的收入数量的增加，货币需求量随之增加，货币需求是利率 r 的函数，Fr 的指数说明，交易性货币需求与利率的变动呈反方向变化，其变动幅度较利率变动幅度而言更小。@ 立方根定律公式，立方根法则立方根定律是美国经济学家惠伦于 1966 年提出的。理论将利率因素引入预防性货币需求的分析，论证了预防性货币需求同样受到利率的影响。从而修正了凯恩斯的货币需求理论关于预防性货币需求对利率不敏感的情况。@@ 托宾模型理论是托宾对凯恩斯投机性货币需求理论的发展。通过这个理论，托宾论证了在未来不确定的情况下，人们依据总效用最大化原则在货币与债券之间进行组合，货币的投机需求与利率呈反方向变动。"]},{"no":4,"type":"short","stem":"简述 IPO 折价及至少给出 2 种解释。","score":8,"body":"IPO 折价是指新股发行首日收益率通常很高。其解释通常有赢者诅咒理论、公司质量信和号传递模型、行为金融的解释等。以下给出三种解释:《1) 赢者诅融理论。市场投资者分为知情者和不知情者，如果新股发行平均不存在折价，则不知情者的新股投资将是亏损交易，因此会退出市场。所以为了吸引不知情的投资者，新股定价应偏低。《2) 公司质量信号传递模型。发行人折价发行股票是向投资者传递公司价值的信息，如果低价值公司也发送此信号进行模仿，会付出很大的代价。《3) 行为金融的解释。IPO 折价不是新股定价过低，而是市场对新股的估价偏高，投资者愿意以高于内在价值的价格购买新股。","points":["IPO 折价是指新股发行首日收益率通常很高。其解释通常有赢者诅咒理论、公司质量信和号传递模型、行为金融的解释等。以下给出三种解释:","赢者诅融理论。市场投资者分为知情者和不知情者，如果新股发行平均不存在折价，则不知情者的新股投资将是亏损交易，因此会退出市场。所以为了吸引不知情的投资者，新股定价应偏低。","公司质量信号传递模型。发行人折价发行股票是向投资者传递公司价值的信息，如果低价值公司也发送此信号进行模仿，会付出很大的代价。","行为金融的解释。IPO 折价不是新股定价过低，而是市场对新股的估价偏高，投资者愿意以高于内在价值的价格购买新股。"]},{"no":1,"type":"essay","stem":"随着金融浪潮的兴起,许多非银行金融机构和银行产生了许多金融创新产品，信托公司发展迅猛,还出现了银行表内业务表外化，影子银行等现象。论述金融脱媒和影子银行对货币供给的影响，对货币政策与金融稳定产生了哪些影响，并给出应对措施。","score":14,"body":"(1) 金融脱媒和影子银行对货币供给的影响:金融脱媒和影子银行的蓬勃发展，使得中央银行对货币供给的控制力减弱。影子银行是指可以实现货币的扩张，但是又不纳入传统监管口径内的金融机构。\n\n由于影子银行不受传统监管控制，不需要保持一定的法定存款准备金，因此其能够实现强大的货币扩张能力，从而扩大货币供应量。\n\n(2) 四对于货币政策而言，影子银行对货币政策的影响主要体现在央行紧缩货币政策时，当货币政策紧缩，社会公众从银行融资的难度增加，便会转向影子银行寻求帮助，在影子银行提供额外融资的情况下，央行的货币政策难以正常运行。\n\n@ 对于金融稳定的影响:影子银行和金融脱媒对我国的金融稳定具有正负双同影响。\n\na.对我国金融稳定的负效应。从客观性来看,尽管长期以来影子银行体系是对正规金融业务的一种有效补充，但其自身固有的特点及发展机制决定了其在运作过程中存在潜在的系统性风险，由于影子银行体系自身较大的不确定性，所以对金融稳定有着极大的负面影响:降低了宏观政策调控的有效性; 使得传统商业银行的系统性风险增大; b.影子银行对我国金融稳定的正效应。影子银行在社会融资总规模中的比重逐年提高,填补了我国传统商业银行信用中介功能的“缺位?和 \"不足”在一定程度上满足了各类市场主体对资金的需求;由于我国影子银行体系内部的激烈竞争导致 \"金融脱媒?趋势加快，部分影子银行发行的金融工具具备了较强的货币特性，货币政策传导机制的通道得到了很大的拓宽。\n\n(3) 政策建议〈应对措施 )\n\n@@O 改善货币政策框架。就货币政策传导渠道而言，就像银行主导的中国金融体系一样，信贷渠道也是中国传统的货币政策传导渠道的主要方式。各种类型的金融机构通过各种金融业务发挥了融资的作用。此外，影子银行的发展已经超越了银行的资产负债表，并且不断地向表外业务发展，使影子银行的规模超过银行贷款。\n\n@ 一方面，中央银行必须加强监督，加强信贷渠道的可控性。另一方面，非银行金融机构应该增加其资产的流动性，建立足够多元化的信贷体系，不断优化其信贷中介功能，满足不同市场参与者的资本需求，扩大信贷规模的传导渠道。\n\n轩在当前的情况下，中央银行已对存款利率的上限和贷款利率的下限放开。然而，由于中国的市场化程度较低，实施效果尚未达到预期效果。为了促进利率市场化，我们必须首先建立多层次的资本市场，不断提高金融深度和金融创新能力，为利率市场化提供健全的基础设施和稳定的金融环境。\n\n国加强影子银行的监管。从宏观方面考虑，应该建立自上而下的宏观监督机制，以加强各部门之","points":["金融脱媒和影子银行对货币供给的影响:金融脱媒和影子银行的蓬勃发展，使得中央银行对货币供给的控制力减弱。影子银行是指可以实现货币的扩张，但是又不纳入传统监管口径内的金融机构。 由于影子银行不受传统监管控制，不需要保持一定的法定存款准备金，因此其能够实现强大的货币扩张能力，从而扩大货币供应量。","四对于货币政策而言，影子银行对货币政策的影响主要体现在央行紧缩货币政策时，当货币政策紧缩，社会公众从银行融资的难度增加，便会转向影子银行寻求帮助，在影子银行提供额外融资的情况下，央行的货币政策难以正常运行。 @ 对于金融稳定的影响:影子银行和金融脱媒对我国的金融稳定具有正负双同影响。 a.对我国金融稳定的负效应。从客观性来看,尽管长期以来影子银行体系是对正规金融业务的一种有效补充，但其自身固有的特点及发展机制决定了其在运作过程中存在潜在的系统性风险，由于影子银行体系自身较大的不确定性，所以对金融稳定有着极大的负面影响:降低了宏观政策调控的有效性; 使得传统商业银行的系统性风险增大; b.影子银行对我国金融稳定的正效应。影子银行在社会融资总规模中的比重逐年提高,填补了我国传统商业银行信用中介功能的“缺位?和 \"不足”在一定程度上满足了各类市场主体对资金的需求;由于我国影子银行体系内部的激烈竞争导致 \"金融脱媒?趋势加快，部分影子银行发行的金融工具具备了较强的货币特性，货币政策传导机制的通道得到了很大的拓宽。","政策建议〈应对措施 ) @@O 改善货币政策框架。就货币政策传导渠道而言，就像银行主导的中国金融体系一样，信贷渠道也是中国传统的货币政策传导渠道的主要方式。各种类型的金融机构通 ":"single","stem":"下列关于人民币说法正确的是","options":["人民币是足值","发行储备是货币黄金","人民币发行是由中央人民银行控制总量和结构的","人民币加入 SDR 后已经实现了完全自由羌换"],"answer":"C","expl":"**人民币钞票是信用货币，本身没有价值，是依靠国家的税收信用建立起的，因此是非足值，A 选项错误，人民币的发行储备不是黄金，而主要是外汇占款的形式，B 选项错误，人民币目前完成经常项目下可自由兑换，但资本项目下兑换仍受限制。","score":1},{"no":9,"type":"single","stem":"衍生品的基本特征不包括","options":["杠杆效应","高风险","路期交易","存续期长"],"answer":"D","expl":"**与股票、有价证券的期限不同，衍生工具的存续期限都是短期性的，一般不超过 1 年，因为预测未来是很困难的事情，预测长期更难。","score":1},{"no":10,"type":"single","stem":"以下属于法定存款准备金制度的局限性的是","options":["对商业银行扰动大","作用效果慢","发达的金融市场","中央银行主动弱"],"answer":"A","expl":"**法定存款准备金制度的缺点是对商业银行的经营管理干扰较大，增加了银行流动性风险和管理的难度。法定准备金政策的优点包括作用力大，主动性强，见效快。","score":1},{"no":11,"type":"single","stem":"下列关于社会保障制度说法错误的是","options":["具有非强制性","具有互济性","调节收入分配","核心内容是社会保险"],"answer":"A","expl":"**社会保障是一种为丧失劳动能力和机会的人提供年费或补偿的制度，是保证社会安定的重要机制。社会保障制度是一种具有政策性、强制性的制度安排，旨在保障生存有困难的社会成员的基本生活需要。所以 A 选项错误。社会保障通常被认为有三个最重要的功能:一是保障的功能。二是互济的功能。三是调节收入分配关系的功能。","score":1},{"no":15,"type":"single","stem":"股东财富最大化指标是指","options":["公司净利泣","股票市值或现有股票的市值","每股收益","公司资源"],"answer":"B","expl":"**对于上市公司，股东财富是由股东所拥有的股票数量和股票市场价格两方面决定的。在股票数量一定时，股票价格达到最高，股东财富也就达到最大。","score":1},{"no":16,"type":"single","stem":"下列关于企业形式的说法正确的是","options":["合伙制企业和公司制企业都有双重课税的问题","独资企业和合伙制企业都只缴纳个人所得税","所有企业组织形式只有有限的生命周期","合伙制企业是当今企业形式中最为复杂的一种"],"answer":"B","expl":"**合伙制企业不需要双重课税，A 选项错误; B 选项正确，独资企业和合伙制企业都只缴纳个人所得税; C 选项错误，公司制企业无限存续，D 选项错误，公司制企业是当今企业形式中最为复杂的一种。","score":1},{"no":17,"type":"single","stem":"下列关于公司破产的说法正确的是","options":["破产清算的管理费属于间接成本","债权人比股东更在意公司破产","破产时内部员工流失属于间接成本","破产清算时公司资产价值显得更高"],"answer":"B","expl":"**破产清算的管理费、破产时内部员工流失属于直接成本，A、C 选项错误，B 选项错误，破产清算时公司资产价值会发生减值，D 选项错误。公司破产时，债权人更加关心对公司资产价值的保护，并将试图从股东手中抢到控制权。代理成本也使得他们有强烈的动机促使破产来保护他们的利益，避免股东更进一步消耗公司的资产。","score":1},{"no":18,"type":"single","stem":"1 年期利率 4%，2 年期利率 5%，第二年远期利率是","options":["49%60","3% (CC.0%","7%"],"answer":"C","expl":"**根据远期利率计算公式，(1+ 49%) 《1+DD=(1+5%)  ，解得二 6%。","score":1},{"no":19,"type":"single","stem":"预计的明年股乱收入与今年股票价格之比为","options":["股息收益率","资本利得率","股利支付率","
