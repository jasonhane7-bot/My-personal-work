<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>431 真题练习 · 中央财经大学</title>
<style>
:root{
  --paper:#FCFBF7; --card:#FFFEFB; --ink:#1A1915; --ink-2:#5E5A50; --ink-3:#8C8779;
  --rule:#E2DDD0; --wash:#F4F1E7; --jade:#2E6A52; --jade-w:#EDF3EE;
  --verm:#B23A2E; --verm-w:#F9EEEB;
  --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong",SimSun,"Times New Roman",serif;
  --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#131311; --card:#1B1B18; --ink:#EAE6DB; --ink-2:#A9A39A; --ink-3:#7B766C;
    --rule:#302F29; --wash:#22221D; --jade:#72BB98; --jade-w:#1A2A22;
    --verm:#E17B6B; --verm-w:#2B1D1A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
@media (max-width:640px){.wrap{padding:0 18px}}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(252,251,247,.92);
  border-bottom:1px solid var(--rule);
  backdrop-filter:saturate(140%) blur(8px);
}
@media (prefers-color-scheme:dark){.topbar{background:rgba(19,19,17,.92)}}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{
  width:38px;height:38px;flex:none;display:grid;place-items:center;
  border:1.5px solid var(--ink);font-family:var(--serif);font-size:15px;font-weight:600;
  letter-spacing:.01em;
}
.brand-text{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-text b{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.02em}
.brand-text em{font-style:normal;font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:26px;margin:0}
.stats div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.stats dt{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.stats dd{margin:0;font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums}
@media (max-width:720px){
  .stats{gap:16px}
  .stats dt{font-size:10px}
  .stats dd{font-size:15px}
  .brand-text em{display:none}
}

/* ---------- 筛选 ---------- */
.filters{padding-top:18px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;width:34px;flex:none}
.chip{
  border:1px solid var(--rule);background:transparent;border-radius:2px;
  padding:4px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
  font-variant-numeric:tabular-nums;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.wrong[aria-pressed="true"]{background:var(--verm);border-color:var(--verm);color:#fff}

/* ---------- 布局 ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:44px;align-items:start;padding:26px 0 80px}
.sheet{align-self:start;position:sticky;top:96px}
@media (max-width:1040px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-bottom:96px}
  .sheet{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;
    max-height:72vh;overflow:auto;background:var(--card);
    border-top:1px solid var(--rule);padding:20px 20px 28px;
    box-shadow:0 -12px 32px rgba(0,0,0,.08);
  }
  .sheet.open{display:block}
}

/* ---------- 试卷 ---------- */
.paper{
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:40px 48px 36px;position:relative;
}
@media (max-width:640px){.paper{padding:24px 20px 22px}}
.qmeta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.qmeta .num{font-family:var(--serif);font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qmeta .tag{border:1px solid var(--rule);border-radius:2px;padding:1px 6px;color:var(--ink-2)}
.qmeta .yr{margin-left:auto;font-variant-numeric:tabular-nums}
.stem{
  overflow-wrap:anywhere;
  font-family:var(--serif);font-size:19px;line-height:1.9;font-weight:500;
  margin:14px 0 24px;letter-spacing:.01em;text-wrap:pretty;
}
.stem p{margin:0 0 9px}
.stem p:last-child{margin-bottom:0}
.stemtable{width:100%;border-collapse:collapse;margin:10px 0 4px;font-family:var(--sans);font-size:12.5px}
.stemtable th,.stemtable td{border:1px solid var(--rule);padding:5px 8px;text-align:center}
.stemtable th{background:var(--wash);font-weight:600;color:var(--ink-2)}
@media (max-width:640px){.stem{font-size:17.5px;line-height:1.85}}
.opts{display:flex;flex-direction:column;gap:9px;margin:0 0 6px;padding:0}
.opt{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid var(--rule);border-radius:2px;
  padding:12px 15px;cursor:pointer;font-size:15px;line-height:1.6;
  transition:border-color .12s,background .12s,opacity .2s;
}
.opt:hover:not(:disabled){border-color:var(--ink-3);background:var(--wash)}
.opt .k{
  width:22px;height:22px;flex:none;margin-top:1px;display:grid;place-items:center;
  border:1px solid var(--rule);font-size:11.5px;font-weight:600;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .m{flex:none;font-size:13px;line-height:22px}
.opt.correct{border-color:var(--jade);background:var(--jade-w)}
.opt.correct .k{background:var(--jade);border-color:var(--jade);color:#fff}
.opt.correct .m{color:var(--jade)}
.opt.wrong{border-color:var(--verm);background:var(--verm-w)}
.opt.wrong .k{background:var(--verm);border-color:var(--verm);color:#fff}
.opt.wrong .m{color:var(--verm)}
.opt.muted{opacity:.45}
.opt.muted:hover{background:transparent;border-color:var(--rule)}
.opt.sel{border-color:var(--ink);background:var(--wash)}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt:disabled{cursor:default}

.toolbar{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn{
  border:1px solid var(--ink);background:transparent;border-radius:2px;
  padding:8px 18px;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s,opacity .12s;
}
.btn:hover{background:var(--wash)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{opacity:.86;background:var(--ink)}
.btn.ghost{border-color:var(--rule);color:var(--ink-2);padding:7px 14px;font-size:13px}
.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed;background:transparent}
.toolbar .sp{flex:1}
.hint{font-size:12px;color:var(--ink-3)}

/* ---------- 判定 ---------- */
.verdict{display:none;gap:16px;align-items:flex-start;margin-top:26px;padding-top:22px;border-top:1px solid var(--rule)}
.verdict.show{display:flex}
.stamp{
  flex:none;width:46px;height:46px;display:grid;place-items:center;border:2px solid currentColor;
  font-family:var(--serif);font-size:19px;font-weight:600;
  transform:rotate(-4deg);border-radius:1px;line-height:1;
}
.stamp.good{color:var(--jade)}
.stamp.bad{color:var(--verm)}
.vbody{min-width:0;padding-top:2px}
.vtitle{font-size:13.5px;font-weight:600;letter-spacing:.02em}
.vtitle.good{color:var(--jade)}
.vtitle.bad{color:var(--verm)}
.vans{overflow-wrap:anywhere;font-size:13px;color:var(--ink-2);margin-top:2px}
.vans b{font-family:var(--serif);font-size:14.5px;color:var(--ink);letter-spacing:.06em}
.explain{
  overflow-wrap:anywhere;
  margin-top:14px;padding-left:14px;border-left:2px solid var(--rule);
  font-family:var(--serif);font-size:14.5px;line-height:1.95;color:var(--ink-2);
  text-wrap:pretty;
}
.explain .lab{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:4px}
.explain b{color:var(--ink);font-weight:600}
.formula{font-family:var(--serif);letter-spacing:.01em}
.frac{display:inline-flex;flex-direction:column;vertical-align:-.45em;text-align:center;margin:0 3px;font-size:.92em;line-height:1.18}
.fnum{border-bottom:1px solid currentColor;padding:0 4px}
.fden{padding:0 4px}
.formula sub,.formula sup{font-size:.72em}
.explain code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--wash);padding:1px 4px;border-radius:2px}

/* ---------- 汇总 ---------- */
.summary{text-align:left}
.summary h2{font-family:var(--serif);font-size:26px;font-weight:600;margin:6px 0 18px}
.big{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.big b{font-family:var(--serif);font-size:52px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.big span{font-size:13px;color:var(--ink-3)}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:26px 0}
.sumrow div{background:var(--card);padding:14px 16px}
.sumrow dt{font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin:0 0 2px}
.sumrow dd{margin:0;font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums}
.bytype{margin:22px 0 0;font-size:13px;color:var(--ink-2)}
.bytype div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--rule)}

/* ---------- 翻页 ---------- */
.pager{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.pager .sp{flex:1}
.pager .prog{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sheetbtn{display:none}
@media (max-width:1040px){.sheetbtn{display:inline-block}}

/* ---------- 答题卡 ---------- */
.sheet h2{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--ink-3);margin:0 0 12px}
.scorebox{border:1px solid var(--rule);padding:14px 16px;margin-bottom:22px;border-radius:2px}
.scorebox .n{font-family:var(--serif);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.scorebox .n small{font-size:13px;color:var(--ink-3);margin-left:4px}
.scorebox .sub{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.sheetgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cell{
  aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--rule);border-radius:1px;
  background:transparent;font-size:11.5px;color:var(--ink-2);cursor:pointer;
  font-variant-numeric:tabular-nums;transition:transform .1s;
}
.cell:hover{border-color:var(--ink-3)}
.cell.ok{background:var(--jade-w);border-color:var(--jade);color:var(--jade)}
.cell.bad{background:var(--verm-w);border-color:var(--verm);color:var(--verm);font-weight:600}
.cell.cur{outline:1.5px solid var(--ink);outline-offset:1px}
.sheet-year{grid-column:1/-1;font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;margin:12px 0 2px;
  font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;margin-top:16px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border:1px solid var(--rule);margin-right:5px;vertical-align:-1px}
.legend i.ok{background:var(--jade-w);border-color:var(--jade)}
.legend i.bad{background:var(--verm-w);border-color:var(--verm)}
.sheetfoot{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.sheetfoot .btn{width:100%;text-align:center}
details.about{margin-top:16px;font-size:11.5px;color:var(--ink-3);line-height:1.7}
details.about summary{cursor:pointer;color:var(--ink-2);font-size:12px}
details.about p{margin:8px 0 0}
details.about table{border-collapse:collapse;margin-top:8px;width:100%;font-variant-numeric:tabular-nums}
details.about td{padding:2px 0;border-bottom:1px dashed var(--rule)}
details.about td:last-child{text-align:right}

.empty{text-align:center;padding:60px 20px;color:var(--ink-2)}
.empty b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:8px;color:var(--ink)}

/* ---------- 主观题 ---------- */
.tag2{border:1px solid var(--rule);border-radius:2px;padding:1px 6px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.calchint{font-size:12.5px;color:var(--ink-3);margin:-8px 0 14px}
.shelf{display:flex;flex-wrap:wrap;gap:7px;padding:12px;border:1px dashed var(--rule);border-radius:2px;background:var(--wash);margin-bottom:20px}
.fchip{
  border:1px solid var(--rule);background:var(--card);border-radius:2px;padding:5px 10px;
  font-size:12.5px;color:var(--ink-2);cursor:grab;max-width:100%;
  font-family:var(--serif);letter-spacing:.01em;
}
.fchip:hover{border-color:var(--ink-3);color:var(--ink)}
.fchip.sel{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.fchip.used{opacity:.3;cursor:default}
.steps{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.stno{font-family:var(--serif);font-size:13px;color:var(--ink-3);width:18px;flex:none}
.stmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stlabel{font-size:12px;color:var(--ink-3)}
.slot{
  width:100%;text-align:left;border:1px solid var(--rule);background:transparent;border-radius:2px;
  padding:7px 10px;font-family:var(--serif);font-size:13px;color:var(--ink-3);cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.slot.filled{color:var(--ink);border-color:var(--ink-3);background:var(--wash)}
.slot:hover:not(:disabled){border-color:var(--ink-3)}
.slot.over{border-color:var(--jade);background:var(--jade-w)}
.eq{color:var(--ink-3);font-size:14px;flex:none}
.num{
  width:96px;flex:none;border:1px solid var(--rule);background:transparent;border-radius:2px;
  padding:7px 9px;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);
}
.num:focus{outline:none;border-color:var(--ink)}
.unit{font-size:12px;color:var(--ink-3);flex:none;min-width:26px}
.mark{width:16px;flex:none;text-align:center;font-size:13px}
.step.good .slot,.step.good .num{border-color:var(--jade)}
.step.bad .slot,.step.bad .num{border-color:var(--verm)}
.step.good .mark{color:var(--jade)}
.step.bad .mark{color:var(--verm)}
.subarea{margin-top:6px}
.slabel{font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:6px}
textarea{
  width:100%;border:1px solid var(--rule);border-radius:2px;background:var(--card);color:var(--ink);
  padding:14px 16px;font-family:var(--serif);font-size:15px;line-height:1.9;resize:vertical;
  min-height:120px;
}
textarea:focus{outline:none;border-color:var(--ink-3)}
textarea[readonly]{background:var(--wash);color:var(--ink-2)}
.submeta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:6px}
.chainhead{font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin:22px 0 10px}
.chain{position:relative;padding-left:6px}
.node{display:flex;gap:12px;padding:10px 0;border-radius:2px}
.node .dot{
  width:20px;height:20px;flex:none;border:1px solid var(--rule);border-radius:50%;
  display:grid;place-items:center;font-size:11px;color:var(--ink-3);margin-top:2px;
}
.node .nbody{min-width:0}
.node .nbody b{font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.node .nbody p{margin:0;font-family:var(--serif);font-size:14px;line-height:1.85;color:var(--ink-2)}
.node.s2 .dot{background:var(--jade);border-color:var(--jade);color:#fff}
.node.s2 .nbody b{color:var(--jade)}
.node.s1 .dot{border-color:var(--jade);color:var(--jade)}
.node.s1 .nbody b{color:var(--ink-2)}
.node.s0 .nbody b{color:var(--ink-3)}
.node[data-p]{cursor:pointer}
.node[data-p]:hover{background:var(--wash)}
.ref{margin-top:18px;border-top:1px solid var(--rule);padding-top:14px}
.ref summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.refbody{font-family:var(--serif);font-size:14.5px;line-height:1.95;color:var(--ink-2);margin-top:10px;white-space:pre-wrap}
.gradenote{font-size:11.5px;color:var(--ink-3);margin-top:14px}
@media (max-width:640px){
  .step{flex-wrap:wrap}
  .stmain{flex:1 1 100%}
  .num{width:80px}
}

:focus-visible{outline:2px solid var(--verm);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <span class="mark">431</span>
      <span class="brand-text"><b>真题练习</b><em>中央财经大学 · 金融学综合</em></span>
    </div>
    <dl class="stats">
      <div><dt>已答</dt><dd id="stat-progress">0/0</dd></div>
      <div><dt>正确率</dt><dd id="stat-acc">—</dd></div>
      <div><dt>得分</dt><dd id="stat-score">0</dd></div>
    </dl>
  </div>
</div>

<div class="wrap filters">
  <div class="frow" id="year-row" role="group" aria-label="按年份筛选"></div>
  <div class="frow" id="type-row" role="group" aria-label="按题型筛选"></div>
</div>

<div class="wrap layout">
  <main>
    <article class="paper" id="paper"></article>
    <div class="pager">
      <button class="btn ghost" id="prev">上一题</button>
      <span class="sp"></span>
      <button class="btn sheetbtn" id="openSheet">答题卡</button>
      <span class="prog" id="prog"></span>
      <button class="btn" id="next">下一题</button>
    </div>
  </main>

  <aside class="sheet" id="sheet" aria-label="答题卡">
    <h2>答题卡</h2>
    <div class="scorebox">
      <div class="n"><span id="sheet-score">0</span><small>分</small></div>
      <div class="sub" id="sheet-sub">本组共 0 题</div>
    </div>
    <div class="sheetgrid" id="grid"></div>
    <div class="legend">
      <span><i class="ok"></i>答对</span>
      <span><i class="bad"></i>答错</span>
      <span><i></i>未做</span>
    </div>
    <div class="sheetfoot">
      <button class="btn ghost" id="resetQueue">重做本组</button>
      <button class="btn ghost" id="clearWrong">清空错题记录</button>
      <button class="btn ghost" id="closeSheet">收起答题卡</button>
    </div>
    <details class="about">
      <summary>题目来源与收录说明</summary>
      <div id="about-body"></div>
    </details>
  </aside>
</div>

<script id="bank" type="application/json">{"school":"中央财经大学","years":[{"year":2011,"included":39,"excluded":0,"questions":[{"no":1,"type":"single","stem":"以下货币制度中会发生劣币驱逐良币现象的是","options":["金银双本位","金银平行本位","金币本位","金汇兑本位"],"answer":"A","expl":"**金银双本位制下金、银两种金属同时被法律承认为金属，金、银铸币都可自由铸造，都有无限的法定支付能力。当金银铸币各按其本身所包含的价值并行流通时，市场上的商品就出现了金银两种价格，而这两种机构随着金银市场比价的不断变动而变动。为了克服由此造成的紊乱，很多国家用法律规定了金币与银币的比价。但金银市场比价并不会由于法定比例的确定而发生变化。于是法定比价和市场比价之间可能会出现差异，价值被高估的货币渐渐被贮藏，而劣币充斥市场。于是劣币驱逐良币律发挥作用。银贱则银币充斥市场，金贱则金币充斥市场。\n\n**提示：**本题涉及的考点是劣币驱逐良币效应。劣币驱逐良币效应，又称格雷欣法则，这个概念的重要性不言而喻。考生务必熟记这个概念的基本定义。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":2,"type":"single","stem":"认为利率纯粹是一种货币现象，利率水平由货币供给与货币需求均衡点决定的理论是","options":["马克思的利率决定理论","实际利率理论","可贷资金论","凯恩斯的利率决定理论"],"answer":"D","expl":"**凯恩斯完全抛弃了实际因素对利率水平的影响，其利率决定理论基本上是货币理论。凯恩斯认为，利率决定于货币供求数量，而货币需求量又基本取决于人们的流动性偏好。如果人们对流动性的偏好强，愿意持有的货币数量就增加，当货币的需求大于货币的供给时，利率上升；反之，人们的流动性偏好转弱时，那将是对货币的需求下降，利率下降。\n\n**提示：**本题涉及的考点是利率平价理论。利率平价理论是汇率决定理论中的一种。汇率决定理论是国际金融中最重要的一个模块。考生最需要掌握的两大汇率决定理论是购买力平价理论和利率平价理论，需要熟记两大理论涉及的概念和公式。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":3,"type":"single","stem":"投资银行在各国的称谓不同，在英国称为","options":["证券公司","商人银行","长期信贷银行","金融公司"],"answer":"B","expl":"**投资银行是专门为工商企业办理各项有关投资业务的银行。投资银行的名称，通用于欧洲大陆及美国等工业化国家，在英国称为商人银行，在日本则称证券公司。\n\n**提示：**本题涉及的考点是非存款类金融机构。该知识点比较生僻，重复考查的概率不大。本考点涉及的题型有选择题、判断题。","score":1},{"no":4,"type":"single","stem":"解释金本位制度时期外汇供求与汇率形成的理论是","options":["国际借贷说","购买力平价说","货币分析说","金融资产说"],"answer":"A","expl":"**国际借贷说，是在金本位制度盛行时期游行的一种阐释外汇供求与汇率形成的理论。该理论认为，外汇汇率变动由外汇供给与需求对比变动所引起，而外汇供求状况又取决于由国际贸易往来和资本流动所引起的全权债务关务。当一国的流动全权多于流动负债时，外汇的供给大于需求，因而本币将升值；反之将贬值。这一理论中的国际借贷关系，实际是指国际收支，故又称为国际收支说。\n\n**提示：**本题涉及的考点是汇率决定理论。考生复习汇率决定理论的时候需要把汇率决定理论和货币制度相联系，需要区分每种货币制度下面分别实施怎样的货币汇率决定机制。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":5,"type":"single","stem":"下列哪个国家不是欧元区国家","options":["斯洛文尼亚","希腊","瑞典","德国"],"answer":"C","expl":"**在蒙代尔提出的最适通货区理论基础上建立了欧元一体化的货币体系，使用欧元的国家为德国、法国、意大利、比利时、卢森堡、爱尔兰、希腊、西班牙、葡萄牙、奥地利、荷兰、斯洛文尼亚、塞浦路斯、马耳他、斯洛伐克、爱沙尼亚，称为欧元区。\n\n**提示：**本题涉及的考点是欧元区。国际金融部分近年来考察的分值越来越少，因此，该知识点重复考察的概率不大。不属于欧元区的国家数量较少，记忆相对容易，考生只需把瑞典不属于欧元区，这个知识点记住即可，本考点涉及的题型有选择题、判断题。","score":1},{"no":6,"type":"single","stem":"自动转账制度（ATS）这一制度创新属于","options":["避免风险的创新","技术进步推动的创新","规避行政管制的创新","降低经营成本的创新"],"answer":"C","expl":"**自动转账制度是20世纪70年代的一种创新。在美国，为了避免银行因招揽存款而进行不公平竞争，对储蓄利息，对活期存款不计息。而且自动转账制度这一创新就是为了不规避不准对活期存款付息的规定。\n\n**提示：**本题涉及的考点是金融创新。在金融创新这个章节中出现了很多新型的金融工具考生需要熟记，比方说SUPERNOW、ATS，来应付名词解释以及相应的选择、判断题。本考点涉及选择题、判断题、名词解释。","score":1},{"no":7,"type":"single","stem":"从中央银行制度看，美国联邦储备体系属于","options":["单一中央银行制度","复合中央银行制度","跨国中央银行制度","准中央银行制度"],"answer":"A","expl":"**单一中央银行制度是指国家单独建立中央银行机构，有如下两种具体情形：①一元式中央银行制度，这种体制是在一个国家内只建立一家统一的中央银行，机构设置一般采取总分行制。目前世界上绝大部分国家的中央银行都采取这种体制，我国也是如此。②二元式中央银行制度，这种体制是一国国内建立中央和地方两级中央银行机构，中央级机构是最高权力或管理机构，但地方级机构也有一定的独立权力。这是一种带有联邦式特点的中央银行制度。属于这种类型的国家有美国，德国等。\n\n**提示：**本题涉及的考点是中央银行制度的组织形式。每一种中央银行制度的组织形式都需要区分清楚。\n\n熟记每一种中央银行制度的组织形式下有哪些典型的国家，来应付相应的选择题，判断题。本考点涉及的题型有选择题、判断题。","score":1},{"no":8,"type":"single","stem":"认为银行只宜发放短期贷款的资产管理理论是","options":["可转换理论","预期收入理论","真实票据理论","可贷资金论"],"answer":"C","expl":"**真实票据理论又称商业贷款理论，该理论为了保持资金的高度流动性，贷款应是短期和商业性的；用于商品生产和流通过程的贷款是具有自偿性，最为理想。\n\n**提示：**本题涉及的考点是商业银行的经营管理理论。商业银行经营管理理论，从资产管理理论发展到负债管理理论再发展到资产负债综合管理理论，考生需要掌握整个发展的框架，每个理论定义以及每个理论之间的区别。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":9,"type":"single","stem":"根据“蒙代尔政策搭配理论”，当一国国际收支出现顺差、国内通货膨胀严重时，合理的政策选择为 【待核：识别置信度偏低","options":["扩张性货币政策和紧缩性财政政策","扩张性财政货币政策和货币升值","紧缩性财政货币政策和货币贬值","紧缩性货币政策和扩张性财政政策"],"answer":"A","expl":"**蒙代尔认为财政政策和货币政策对国际收支和名义收入有着相对不同的影响，因此，在固定汇率制下，得出了他的政策“分派原则”：只有把内部均衡目标分派给财政政策，外部均衡目标给货币政策，方能达到经济的全面均衡。依据这样的思路，有一个最佳政策配合的涉及：\n\n通货膨胀失业通货膨胀失业经济失衡状态国际收支盈余国际收支盈余国际收支赤字国际收支赤字紧缩性财政政策扩张性财政政策紧缩性财政政策扩张性财政政策最佳政策配合扩张性货币政策扩张性货币政策紧缩性货币政策扩张性货币政策\n\n**提示：**本题涉及的考点是蒙代尔的政策搭配原理，是考试的难点但不是重点，考生把上述表格中的四个状态熟记就能应付相应的试题，近年来初试考查该部分的可能性逐年减小。本考点涉及的题型有选择题，判断题。","score":1},{"no":10,"type":"single","stem":"面值为100元的永久性债券票面利率是10%，当市场利率为8%时，该债券的理论市场价格应该是","options":["100","125","110","1375"],"answer":"B","expl":"**根据债券价格计算公式：P=←该债券的理论市场价格应该是：\n\nrm 100x10% =125 P=- 8%\n\n**提示：**本题涉及的考点是债券价格的计算。考生只需掌握现金流贴现模型，即可正确应答此类题目，该计算相对基础。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":11,"type":"single","stem":"根据超调汇率决定模型，下列情形不真实的是","options":["汇率在短期内会偏离购买力平价","货币冲击发生时，商品市场调整快于金融市场调整","商品价格是粘性的D.不抵补利率平价成立"],"answer":"B","expl":"**汇率超调理论指出，浮动汇率制下汇率的剧烈波动的主要原因在于：面对某种初始的外部冲击，不仅资产的价格和商品的价格都可能过度反应，而且资产市场和商品市场的调整速度常常并不一致，商品价格具有“粘性”。\n\n**提示：**本题涉及的考点是汇率超调这个概念。汇率超调这个概念是一个相对有难度的概念。考生需要理解汇率超调的定义和相关图像的内涵。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":12,"type":"single","stem":"根据货币主义（弹性价格）汇率理论，下列哪一经济事件可能导致美元对日元贬值","options":["美联储提高利率，实行紧缩性货币政策","日本发生严重通货膨胀","美国实际国民收入呈上升趋势","美国提高对日本进口品的关税"],"answer":"A","expl":"**货币分析理论认为，汇率是两国货币的相对价格通过两国货币相对需求与供给来确定汇率水平。\n\n基本的货币模型为：ét=M*-Mt-a(y-y)+b-i)。其中，ér是以间接标价法表示的本币汇率，M、My、y、i分别代表外国与本国的货币供给变动率、国民收入变动率和利率水平。一国货币的汇率是本币与外币的比价，其决定及变动与本国与外国的这三类变量的变动差异有关。当其他条件不变，若外国货币供给的增长快于本国货币供给增长，将使本币汇率et升值，若本国增长率快于外国收入增长，那么对本国的货币需求就会增加，也将引致et升值；若本国名义利率高于外国名义利率，是意味着本国有较高的预期通胀率，这样，对本国货币的需求将降低，从而使er贬值。反之亦然。\n\n**提示：**本题涉及的考点是货币分析法。货币分析法是一个相对有难度的理论，考大型计算的可能性不大，但是考生需要掌握在这个理论中各个因素是怎样影响国与国之间的汇率的。本考点涉及的题型有选择题、判断题。","score":1},{"no":13,"type":"single","stem":"下列哪项是在计算相关现金流时需要计算的","options":["前期研发费用","营运资本的变化","筹资成本","市场调查费用"],"answer":"B","expl":"**对净营运资本的投资是任何资本预算分析的一个重要部分，把营运资本的投资当作项目的现金流出。随着项目的开展，对净营运资本的需求将有所增长。年与年之间的净营运资本的改变量增减的现金流量。\n\n**提示：**本题涉及的考点是相关现金流的计算。考生需要区分在项目投资决策的时候哪些现金流属于相关现金流，哪些现金流属于非相关现金流。本考点涉及的题型有选择题、判断题。","score":1},{"no":14,"type":"single","stem":"对于i，j两种证券，如果CAPM成立，那么下列哪个条件可以推出E(R,)=ER","options":["Pim=Pjm，其中 Pim’Pm分别代表证券i，j与市场组合回报率的相关系数","Cov(R，Rm)= Cov(R，Rm)，其中 Rm 为市场组合回报率",";=j，，分别为证券i，j的收益率的标准差","以上都不是"],"answer":"B","expl":"**根据CAPM模型，股票的期望收益率为：E（Rs）=RF+β（RM-RF）式中RF是无风险利率，RM\n\n-RF是市场组合的期望收益率与无风险利率之差，称为期望超额市场收益率或市场风险溢价。对于证券 i，贝塔的计算公式为：\n\nCov(Ri, Rm)\n\n【待核：低置信度】01,M 证券i的贝塔 Var(Rm)\n\nCov(Ri, RM)\n\noi, M Var(RM)\n\n**提示：**本题涉及的考点是CAPM模型和贝塔系数。该内容是金融学课本中的重中之重。考生需要掌握 CAPM的计算公式和贝塔系数计算公式，学会绘制相关的证券市场线的图像，本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":15,"type":"single","stem":"一般而言，在红利发放比率大致相同的情况下，拥有超常增长机会（即公司的再投资回报率高于投资者要求回报率）的公司","options":["市盈率（股票市场价格除以每股盈利，即P/E）比较低","市盈率与其他公司没有显著差异","市盈率比较高","其股票价格与红利发放率无关"],"answer":"C","expl":"**根据市盈率的计算公式推导得出：\n\n每股价格．1．NPVGO ERP R EPS 其中，左边是市盈率的计算公式，EPS表示每股盈利：R为公司股票的折现率：NPVGO代表了增长机会的（每股）净现值。这个等式显示了市盈率与增长机会的净现值相关，即当其他条件不变时，公司增长机会的净现值越大，其市盈率就越高。\n\n**提示：**本题涉及的考点是市盈率的计算。考生需要掌握市盈率的计算的基本公式。熟悉市盈率和各个变量，包括股票价格.公司增长率.资本成本等变量之间的关系。本考点涉及的题型有选择题、判断题。","score":1},{"no":16,"type":"single","stem":"X公司的损益数据如下所示： 数据单位：元销售额变动成本固定成本前收益固定成本息税前收益利息费用税前利润所得税净利润企业目前的营业杠杆和财务杠杆分别是多少","options":["营业杠杆为3.5，财务杠杆1.25","营业杠杆为3.5，财务杠杆1.5","营业杠杆为3，财务杠杆1.25","营业杠杆为3，财务杠杆1.5"],"answer":"C","expl":"**根据营业杠杆的计算公式：营业杠杆系数=（息税前利润EBIT+固定成本）/息税前利润EBIT企业目前的营业杠杆系数=（1000000+2000000）/1000000=3；\n\n根据财务杠杆系数的计算公式：DFL=EBIT/（EBIT-I），企业目前的财务杠杆=1000000/（1000000-200000）=1.25\n\n**提示：**本题涉及的考点是经营杠杆和财务杠杆的计算。考生需要掌握经营杠杆.财务杠杆的定义以及相关的计算公式。计算公式包括了简化前和简化后的公式。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":17,"type":"single","stem":"某永续年金在贴现率为5%时现值为1200元，那当贴现率为8%时，其现值为","options":["200","750","1000","1200"],"answer":"B","expl":"**永续年金现值的计算公式：\n\nC C C C C PV= 1200= 1+r+(1+r) +(1+ r)² 5% 根据题意可得方程：\n\nC 1200= 5% 由此可知C=60，所以，当贴现率为8%时该年金的现值：\n\nPV= =750（元）\n\n8%\n\n**提示：**本题涉及的考点是现金流现值的计算。考生只需要掌握现金流贴现模型即可正确应答本题。计算相对来说非常基础。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":19,"type":"single","stem":"某公司普通股的现金股利按照每年5%的固定速率增长，目前该公司普通股股票的市价为每股20元，预期下期股利为每股2元，那么该公司以当前价格发行股票筹资的成本为","options":["10%","15%","20%","25%"],"answer":"B","expl":"**普通股股票资金成本=普通股股东要求的必要报酬率=D/P+g=股利报酬率+股利增长率，所以，该公司发行股票的筹资成本=2/20+5%=15%。\n\n**提示：**本题涉及的考点是权益资本成本。考生只需要掌握基本的股票定价模型即可正确回答本题。计算权益资本成本，只需要将基础的股票定价模型进行一个简单的转换即可。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":20,"type":"single","stem":"下列哪个不是CAPM的假设","options":["投资者风险厌恶，且其投资行为是使其终期财富的期望效用最大","投资者是价格承受者，即投资者的投资行为不会影响市场上资产的价格运动","资产收益率满足多因子模型","资本市场上存在无风险资产，且投资者可以无风险利率无限贷款"],"answer":"C","expl":"**由于CAPM模型是以资产组合理论为基础，因此它除接受了马科维茨的全部假设条件以外，还附加了一些自己的假设条件，主要有：①投资者具有同质预期，即市场上的所有投资者对资产的评价和对经济形势的看法都是一致的，他们对资产收益和收益概率分布的看法也是一致的；②存在无风险资产，投资者可以无风险利率无限制地借入或者贷出资金。C项，套利定价理论（APT）假设资产收益率满足多因子模型。\n\n**提示：**本题涉及的考点是CAPM的前提假设。公司理财中有很多的理论，考生需要初步掌握每种理论的前提假设，也不考生需要死记硬背这些假设的具体内容，只需要有个大概的印象就足以应付考试。\n\n本考点涉及的题型有选择题、判断题。","score":1},{"no":1,"type":"tf","stem":"人民币是在1996年底实现经常项目下可自由兑换的。","options":["正确","错误"],"answer":"√","expl":"**1996年底，我国在外汇管理改革方面迈出了重要的一步，实现了人民币在贸易等经常项目下可兑换的承诺。**提示：**本题涉及的考点是人民币经常项目可兑换，是属于资本管制的范畴。人民币现已实现经常项目可兑换，但还未实现资本项目可兑换。近年来对人民币资本项目可兑换这个概念的考查比较普遍。考生需要把精力花在人民币资本项目可兑换这部分内容的了解上。本考点涉及的题型有选择题、判断题、论述题。","score":1},{"no":2,"type":"tf","stem":"收益资本化规律导致利息转化为收益的一般形态。","options":["正确","错误"],"answer":"×","expl":"**利息转化为收益的一般形态，其主要作用在于导致了收益的资本化，即各种有收益的事物，不论是否是一笔贷放出去的货币资金，甚至也不论它是否为一笔资本，都可以通过收益与利率的对比倒算出它相当于最大的资本金额。**提示：**本题涉及的考点是收益资本化。考生需要掌握收益资本化的概念和数学表达式。本题涉及的题型有选择题、判断题、名词解释。","score":1},{"no":3,"type":"tf","stem":"派生存款乘数与货币乘数没有本质的差异。","options":["正确","错误"],"answer":"×","expl":"**派生存款乘数是指中央银行新增一笔通货注入银行后，经银行体系连续存贷所引致的成倍的存款货币乘数。派生存款是指由商业银行发放贷款、办理贴现或投资等业务活动派生的存款。派生存款产生的过程，就是商业银行不断吸收存款、发放贷款、形成新的存款，最终导致银行体系存款总量增加的过程。银行存款货币创造机制所决定的存款总额，其最大扩张位倍数称为派生倍数，也称为派生乘数。货币乘数是指货币供给量与基础货币之比。**提示：**本题涉及的考点是存款扩张倍数和货币乘数之间的区别。建议考生通过列表格的方式来了解这两者的区别。书上相关内容对这个知识点作了非常详尽的阐述。本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":4,"type":"tf","stem":"中国人民银行基础货币占款最多的资产项目是国外资产。","options":["正确","错误"],"answer":"√","expl":"**基础货币是中国人民银行的负债项目，但央行的负债均需要有对应的资产，其中国外资产是中国人民银行资产项目中占比最大的。**提示：**本题涉及的考点是中央银行的资产负债表。考生需要分清楚哪些项目属于资产项目，哪些项目属于负债科目。本考点涉及的题型有选择题、判断题。","score":1},{"no":5,"type":"tf","stem":"汇率决定的资产组合分析法假定，本币资产与外币资产具有不可完全替代性。","options":["正确","错误"],"answer":"√","expl":"**资产组合分析法也称为汇率决定的资产组合平衡理论。该理论认为，货币只是人们可以持有的一系列金融资产中的一类，人们将根据各种资产收益和风险的权衡，将财富配置于各种可选择的国内外金融资产。投资根据经济形势和预期，及时调整其外币资产的比例，从而往往引起货币资本在各国间的大量流动，并对外汇率产生很大影响。这一理论运用一般均衡分析，综合考虑多种变量.多个市场影响汇率变化的因素，承认本币资产与外币资产的不完全替代性，较好反映了20世纪70年代之后各国货币金融性资产快速增长，流动加快的客观现实。**提示：**本题涉及的考点是汇率决定理论里面的资产组合分析法。考生需要大致掌握资产组合分析法的基本概念，以及资产组合分析法和货币分析法之间的区别。本考点涉及的题型有选择题、判断题。","score":1},{"no":6,"type":"tf","stem":"1844-1946年期间的英格兰银行属于复合制中央银行。","options":["正确","错误"],"answer":"√","expl":"中央银行制度。复合制中央银行指一国没有单独设立中央银行，而是把中央银行的业务和职能与商业银行的业务和职能集中于一家银行来执行。1844年，英国颁布《皮尔条例》，将英格兰银行拆分为两兰银行收归国有。可见1844-1946年间英格兰银行符合复合制中央银行的概念。\n\n**提示：**本题涉及的考点是中央银行的组织形式。考生需要掌握每一种中央银行组织形式的基本概念以及相对应的代表国家。中国美国的情况需要特别注意。本考点涉及的题型有选择、判断题。","score":1},{"no":7,"type":"tf","stem":"一般而言，同一标的资产的美式期权比欧式期权的价格略高。","options":["正确","错误"],"answer":"√","expl":"**期权又分美式期权和欧式期权。美式期权是指买方可以在期权的有效期内任何时间行使权利或者放弃行使权利的期权；欧式期权是指买方只可以在合约到期时行使权利的期权。由于美式期权赋予期权买方更大的选择空间，一般而言，同一标的资产的美式期权比欧式期权价格略高。**提示：**本题涉及的考点是美式期权和欧式期权的区别。考生要掌握美式期权和欧式期权的基本概念和区别以及影响期权定价的因素。本考点涉及的题型有选择题、判断题。","score":1},{"no":8,"type":"tf","stem":"远期利率协议的结算日是协议规定的借款期限满后的第一天。","options":["正确","错误"],"answer":"×","expl":"**结算日是在协议规定的借款期限的第一天。远期利率协议的结息日即名义借贷开始日期，也是交易一方向另一方交付结息金的日期。远期利率协议（FRA）是一种远期合约，合约的买卖双方约定未来某一定时间点作为利息起算日，约定某期限的协议利率.市场参照利率和计息名义本金数额，在利息起算日，双方按规定的协议利率、期限和名义本金额，由一方向另一方支付协议利率与参照利率之间的利息差额的贴现值。**提示：**本题涉及的考点是远期利率协议。在复习该部分内容的时候，考生需要掌握远期利率协议的基本概念，以及一些基础的计算。书上有相应的远期利率协议的计算题。本考点涉及的题型有选择题、判断题、计算题。计算题考到的概率较小。","score":1},{"no":9,"type":"tf","stem":"依据利率平价理论，利率高的货币远期汇率是升水，利率低的货币远期汇率是贴水。","options":["正确","错误"],"answer":"×","expl":"**根据利率平价理论，利率与汇率的关系：利率高的国家货币在远期外汇市场上贴水，利率低的国家货币在远期外汇市场上升水。**提示：**本题涉及的考点是利率平价理论。利率平价理论是汇率决定理论里面的非常重要的一块内容。考生需要掌握利率平价理论的基本公式以及相应的概念。本考点涉及的题型有选择题、判断题。","score":1},{"no":10,"type":"tf","stem":"利率升高，人们持有的货币减少，属于利率的收入效应。","options":["正确","错误"],"answer":"×","expl":"**一般将储蓄随利率提高而增加的现象称为利率对储蓄的替代效应；将储蓄随利率提高而降低的现象称为利率对储蓄的收入效应。替代效应表示人们在利率水平提高的情况下，愿意增加未来消费一储蓄，来替代当前消费。**提示：**本题涉及的考点是货币需求理论。货币需求理论这块内容的重要性不言而喻，考生需要掌握货币需求理论的内涵以及相应的公式。在复习货币需求理论这一章的时候要把货币需求理论发展的框架都掌握，每个理论的内涵.每个理论的提出者以及理论与理论之间相互的区别和联系都需要掌握。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":11,"type":"tf","stem":"在国际金本位制度下，由于铸币平价和黄金输送点的存在，各国的汇率波动非常剧烈。","options":["正确","错误"],"answer":"×","expl":"**在国际金本位制下，各国货币之间的汇率由它们各自的含金量之比决定。而外汇市场上的实际汇率则围绕两国货币含金量之比所确定的金平价上下波动，但这种波动被限定在黄金输送点之间，因此国际金本位制下的汇率制度是一种较为稳定的固定汇率制。**提示：**本题涉及的考点是金本位制度下的汇率决定理论。考生在复习汇率决定理论的时候要和国际货币制度相结合，每一种国际货币制度都对应了一种汇率决定理论，考生要把握好这个关系。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":12,"type":"tf","stem":"中央银行对外汇市场的非冲销式干预一般不会引起货币供应量的变化。","options":["正确","错误"],"answer":"×","expl":"**冲销性操作是指当汇率出现不恰当波动时，中央银行一方面进入外汇市场抛出或补进外汇使汇率达到适当水平，与之同时，则通过购买或出售政府债券等国内资产来抵消因干预汇率而释放或回笼本国货币的影响，以维持国内货币供应量不变。非冲销性操作是指央行在买卖外汇.干预市场的同时，并未采取任何抵消因干预汇率而影响本国货币供给的措施，从而外汇买卖的结果是国内货币供应量的净增或净减。**提示：**本题涉及的考点是非冲销式干预。考生需要掌握冲销式干预和非冲销式干预的区别，两者都是政府对外汇市场的调控，但是对国内货币供应量的影响是不同的。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":13,"type":"tf","stem":"假设投资者都是风险厌恶的，那么如果两个投资组合的期望收益相等，投资者会偏好风险更小的投资组合。","options":["正确","错误"],"answer":"√","expl":"**对于一个理性的投资者而言，他们都是厌恶风险而偏好收益的，对于相同的风险水平，他们会选择能提供最大预期收益率的组合；对于相同的预期收益率，他们会选择风险最小的组合。**提示：**本题涉及的考点是马科维茨的投资组合理论。考生需要理解投资组合理论的基本概念，有效集、可行集的基本绘制方法以及资本市场线的绘制方法。本考点涉及的题型有选择题、判断题。","score":1},{"no":14,"type":"tf","stem":"在计算项目的期间营运现金流量时，如果项目的部分资金来源于债务，那么需要在现金流中扣除利息费用，并按照WACC作为贴现率评估项目价值。","options":["正确","错误"],"answer":"×","expl":"**在计算项目的期间营运现金流量时，如果在现金流中扣除利息的费用，并按照WACC作为贴现率评估项目价值，就会产生分子与分母的不匹配（分子只包含权益，而分母全部包含），因此应当用权益报酬率作为分母贴现。**提示：**本题涉及的考点是用加权平均资本成本法估计项目价值。需要区分WACC法和APV法和FTE 法之间的区别。这三种计算方法在王汀汀的课本中有详细的阐述。本考点涉及的题型有选择题、判断题、简答题、计算题。","score":1},{"no":15,"type":"tf","stem":"公司经营环境较好，宏观经济处于上升周期时，面临发展机会的公司会采用较为保守的融资政策，较少的使用负债，因为未来发生财务危机的可能性小。","options":["正确","错误"],"answer":"×","expl":"**成长性企业具有较高的财务危机成本，所以负债较低。**提示：**本题涉及的考点是企业最佳资本结构。公司里公司财务上提到了两种确定企业最佳资本结构的理论，一种是权衡理论，一种是有序融资理论。考生需要掌握两者的概念以及在评估企业最佳资本结构时的不同运用。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":16,"type":"tf","stem":"假设利率（r）大于0，如果时间（t）足够长，那么现值利率因子PVIF（r，t）有可能小于0。","options":["正确","错误"],"answer":"×","expl":"**现值利率因子 PVIF(r,t)=(1+r) 1 当r>0时，现值利率因子PVIF（r，t）大于0。**提示：**本题涉及的考点是贴现因子。考生只需掌握贴现因子的基本计算公式即可，这个公式非常基础，务必要掌握。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":17,"type":"tf","stem":"在其他条件相同时期末年金终值等于期初年金终值的（1+r）倍。","options":["正确","错误"],"answer":"×","expl":"**n期先付年金（期初年金）与n期普通年金（期末年金）的收付款次数相同，但由于付款时间不同，n期先付年金终值比n期普通年金的终值多计算一期利息。因此n期先付年金的终值要在n期后付年金终值的基础上乘以（1+r）。**提示：**本题涉及的考点是年金终值的计算。考生一定要熟练掌握现金流贴现模型以及先付年金、后付年金之间的换算。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":18,"type":"tf","stem":"根据《证券法》的规定，我国股票发行管理实施核准制。","options":["正确","错误"],"answer":"√","expl":"**根据《证券法》第十条的规定，公开发行证券，必须符合法律.行政法规规定的条件，并依法报经国务院证券监督管理机构或者国务院授权的部门核准；未经依法核准，像任何单位和个人不得公开发行证券。但是2019年修订的《证券法》已经将核准制改为注册制。**提示：**本题涉及的考点是注册制、核准制。注册制改革是近年来的热点，考生需要掌握注册制的含义，收集相关的素材来应付可能的论述题考查。本考点涉及的题型有选择题、判断题、论述题。","score":1},{"no":19,"type":"tf","stem":"根据《中华人民共和国合伙企业法》，国有独资公司、国有企业、上市公司以及公益性的事业单位、社会团体不得成为普通合伙人。","options":["正确","错误"],"answer":"√","expl":"**所谓普通合伙人，是指在合伙企业中对合伙企业的债务依法承担无限连带责任的自然人.法人和其他组织。根据《合伙企业法》第三条规定，国有独资公司、国有企业、上市公司以及公益性事业单位、社会团体不得成为普通合伙人。**提示：**本题涉及的考点是公司的组织形式。本题考查的是法律的内容，知识点较为偏僻，重复考查的概率不大。此种类型的题目得分率相对来说较低，但是分值也比较低。考生也没有必要把书上的所有法律条款都死记硬背记下来，性价比不高。本考点涉及的题型有选择题、判断题。","score":1},{"no":20,"type":"tf","stem":"假如20岁时存入银行100元，以8%的年利率存45年，并以复利计息，根据七二法则，45年后，这笔资金的终值约为1000元。","options":["正确","错误"],"answer":"×","expl":"**“七二法则”是计算一笔投资需多少年可以倍增的简单公式。用72除以投资的年利率，结果就是投资倍增所需的年数。则投资倍增的时间是72/8=9（年）。根据七二规则，如果投资45年，则这笔投资翻了五倍，所以终值为100×25=3200（元）**提示：**本题涉及的考点是七二法则，这个概念在公司里在刘力的书上是没有的，但是在王汀汀的课本中有详细的描述。考生把这个概念单独记下来即可，本考点涉及的题型有选择题、判断题。","score":1}],"sub":[{"no":3,"type":"calc","stem":"（5分）考虑一个有效投资组合j，给定如下条件：\nE（Rj）=20%;E（Rm）=15%，Rf=5%;om=20% 求该投资组合的回报率标准差，以及该组合与市场之间的相关系数。","score":4,"body":"资本市场线的公式：\n\n【待核：低置信度】Rm - Rf Rp = Rf + 【待核：低置信度】8p 8m 根据已知条件可得方程：\n\n15%-5% 20%=5%+ 20% 解得：p=30% 资本资产定价模型：Ri=Rf+βim(Rm－Rf)\n\n根据已知条件可得方程：20%=5%+β(15%-5%)\n\n根据贝塔系数计息公式：\n\nCov(r;, rm)\n\n【待核：低置信度】β; = 【待核：低置信度】8m 代入已知条件可得方程：\n\nCov(ri, rm)\n\n1.5 = 20%2 解得：Cov(r，rm)=0.06 又因为：\n\nCov(ri,rm)\n\nβim = 【待核：低置信度】0i0m 代入已知条件可得：\n\n0.06 =1（此处β表示相关系数)\n\n20%x30%","points":["资本市场线的公式： 【待核：低置信度】Rm - Rf Rp = Rf + 【待核：低置信度】8p 8m 根据已知条件可得方程： 15%-5% 20%=5%+ 20% 解得：p=30% 资本资产定价模型：Ri=Rf+βim(Rm－Rf) 根据已知条件可得方程：20%=5%+β(15%-5%) 根据贝塔系数计息公式： Cov(r；rm) 【待核：低置信度】β","= 【待核：低置信度】8m 代入已知条件可得方程： Cov(ri, rm) 1.5 = 20%2 解得：Cov(r，rm)=0.06 又因为： Cov(ri,rm) βim = 【待核：低置信度】0i0m 代入已知条件可得： 0.06 =1（此处β表示相关系数) 20%x30%"]},{"no":4,"type":"calc","stem":"（5分）假设李先生今天花费100元买入50注双色球彩票，但是突然急需现金，因此想要将彩票转卖，如果你目前已经持有一个充分分散化的投资组合，那么你愿意花多少钱来购买这些彩票？（假设彩票明天将开奖并可以即时兑付，而根据历次开奖的经验，平均每投注2元可以收回1元）","score":4,"body":"根据题意可知：购买这些彩票的期望收益为50元，所以，投资者最多愿意花50元来购买这些彩票。","points":["根据题意可知：购买这些彩票的期望收益为50元，所以，投资者最多愿意花50元来购买这些彩票"]},{"no":5,"type":"calc","stem":"（10分）M公司是一个无负债公司，其每年预期税息前收益为10000元，股东要求的权益回报率为 16%，M公司所得税率为35%，但没有个人所得税，设所有交易都在完善的资本市场中进行，问：\n（1）M公司的价值为多少？\n（2）如果M公司借入面值为无负债公司价值的一半的利率为10%的债务，债务没有风险，并且所筹集的债务资金全部用于赎回股权，则此时公司的价值变为多少？而权益资本成本为多少？","score":4,"body":"（1）根据有公司所得税的MM命题I：无杠杆公司（即公司没有债务）的价值是EBIT（1-Tc）的现值。\n\n即：\n\nEBIT(1 - Tc)\n\n【待核：低置信度】Vu=- Ro 代入已知条件可得公司的价值：V=10000×（1-35%）/16%=40625（元）\n\n（2）M公司借入负债为40625/2元，则负债的税盾收益为7109.375元，公司用所筹集的资金全部赎回股权后股权价值减少40625/2元，增加7109.375元，公司总价值为40625+7109.375=47734.375元。\n\n有公司所得税时的MIM命题ⅡI：\n\nB Rs = R。+(1-tc)(R。- RB)\n\n所以，该公司的权益资本成本为16%+20312.5/27421.875x0.65×（16%-10%）=18.89%","points":["根据有公司所得税的MM命题I：无杠杆公司（即公司没有债务）的价值是EBIT（1-Tc）的现值。 即： EBIT(1 - Tc) 【待核：低置信度】Vu=- Ro 代入已知条件可得公司的价值：V=10000×（1-35%）/16%=40625（元）","M公司借入负债为40625/2元，则负债的税盾收益为7109.375元，公司用所筹集的资金全部赎回股权后股权价值减少40625/2元，增加7109.375元，公司总价值为40625+7109.375=47734.375元。 有公司所得税时的MIM命题ⅡI： B Rs = R。+(1-tc)(R。- RB) 所以，该公司的权益资本成本为16%+20312.5/27421.875x0.65×（16%-10%）=18.89%"]},{"no":1,"type":"term","stem":"百慕大式权证","score":3,"body":"（1）定义：权证指基础证券发行人或其以外的第三人发行的，约定持有人在规定期间内或特定到期日，有权按约定价格向发行人购买或出售标的证券，或以现金结算方式收取结算差价的有价证券，按行使期限，分为美式权证、欧式权证和百慕大式权证。百慕大权证是行权方式介于欧式权证和美式权证之间的权证，标准的百慕大权证通常在权证上市日和到期日之间多设定一个行权日。（2）特征：百慕大式权证（Bermudawarrant），是持有人可在设定的时间段或约定的到期日有权买卖标的证券，给予权证持有人更多的行权日选择，所以价格比同等条款欧式权证高，比同等条款美式证券低。","points":["定义：权证指基础证券发行人或其以外的第三人发行的，约定持有人在规定期间内或特定到期日，有权按约定价格向发行人购买或出售标的证券，或以现金结算方式收取结算差价的有价证券，按行使期限，分为美式权证、欧式权证和百慕大式权证。百慕大权证是行权方式介于欧式权证和美式权证之间的权证，标准的百慕大权证通常在权证上市日和到期日之间多设定一个行权日。","特征：百慕大式权证（Bermudawarrant），是持有人可在设定的时间段或约定的到期日有权买卖标的证券，给予权证持有人更多的行权日选择，所以价格比同等条款欧式权证高，比同等条款美式证券低。"]},{"no":2,"type":"term","stem":"费雪效应","score":3,"body":"（1）定义：费雪效应（FisherEffect)，指通货膨胀率和利率在长期中同比例变化的关系。美国经济学家费雪（Fisher）在其《利息理论》一书中阐述了这一关系。这一关系假定，在长期中通货膨胀率等于预期通货膨胀率。（2）特征：在其他条件不变的情况下，如果一国的预期通货膨胀率上升，最终会导致该国货币存款利率的同比例上升；反之，如果预期通货膨胀率下降，最终会导致货币存款利率的同比例下降。从国际资本流动来看，费雪效应体现了通货膨胀率、利率和汇率变化的关系。（3）影响：当其他条件不变时，若一国的预期通货膨胀率上升，在外汇市场上将导致该种货币的贬值；根据利率平价理论，这最终将导致该国货币存款利率的上升。这一关系还可以用相对购买力平价理论和利率平价理论的结合来说明。相对购买力平价表明，在一定时期内两国货币汇率变动的百分比等于两国通货膨胀率之差。利率平价表明，两国货币汇率预期变动的百分比等于两国货币存款的预期收益率之差，即两国货币存款未来的利率之差。在长期中，两国货币的汇率变动即为两国货币汇率的预期变动。这样，两国货币存款未来利率之差就等于两国通货膨胀之差。用公式表示：Ra-Rb=πa-πb，Ra 和Rb分别代表两国货币存款的利率，πa和πb分别代表两国的通货膨胀率。该公式表明，在其他条件不变时，一国通货膨胀率的上升最终将导致该国货币存款利率同比例上升。","points":["定义：费雪效应（FisherEffect)，指通货膨胀率和利率在长期中同比例变化的关系。美国经济学家费雪（Fisher）在其《利息理论》一书中阐述了这一关系。这一关系假定，在长期中通货膨胀率等于预期通货膨胀率。","特征：在其他条件不变的情况下，如果一国的预期通货膨胀率上升，最终会导致该国货币存款利率的同比例上升；反之，如果预期通货膨胀率下降，最终会导致货币存款利率的同比例下降。从国际资本流动来看，费雪效应体现了通货膨胀率、利率和汇率变化的关系。","影响：当其他条件不变时，若一国的预期通货膨胀率上升，在外汇市场上将导致该种货币的贬值；根据利率平价理论，这最终将导致该国货币存款利率的上升。这一关系还可以用相对购买力平价理论和利率平价理论的结合来说明。相对购买力平价表明，在一定时期内两国货币汇率变动的百分比等于两国通货膨胀率之差。利率平价表明，两国货币汇率预期变动的百分比等于两国货币存款的预期收益率之差，即两国货币存款未来的利率之差。在长期中，两国货币的汇率变动即为两国货币汇率的预期变动。这样，两国货币存款未来利率之差就等于两国通货膨胀之差。用公式表示：Ra-Rb=πa-πb，Ra 和Rb分别代表两国货币存款的利率，πa和πb分别代表两国的通货膨胀率。该公式表明，在其他条件不变时，一国通货膨胀率的上升最终将导致该国货币存款利率同比例上升。"]},{"no":3,"type":"term","stem":"马歇尔一勒纳\"条件","score":3,"body":"（1）定义：马歇尔一勒纳条件（Marshall-Lernercondition)，是美国经济学家勒纳（A.P.Lerner）在研究既定的进出口供给条件下一国货币贬值对国际收支的影响时提出的贬值改善国际收支的条件。（2）特点：在假定贸易商品进出口供给弹性无穷大的前提下，一国货币贬值能否改善国际收支取决于本国贸易品的需求价格弹性。假定以X表示本币计值的出口量，M表示外币计值的进口量，E表示外汇汇率，B表示以外币计值的贸易收支差额，则有：E 对外汇汇率E求导、并变形有：【待核：低置信度】dB __X(1. dXE.MEdME 【待核：低置信度】(2) dEE²( dEXXdEM 令：nx、nm分别表示出口商品和进口商品弹性的绝对值，则有：dB_X( 【待核：低置信度】M·E 【待核：低置信度】1-nx-—x (3) 【待核：低置信度】1m dEE² 由于假设初始国际收支处于均衡状态，即ME=X，有：【待核：低置信度】dEE² >0，即本币贬值有助于改善国际收支。【待核：低置信度】dM 条件+7m>1就是马歇尔一勒纳条件。马歇尔一勒纳条件表明，在进出口供给弹性无穷大的前提下，只要一国进出口需求弹性绝对值之和大于1，本国货币贬值就会改善国际收支状况。而且进出口需求价格弹性越大，本币贬值对贸易收支状况改善的作用越大。（4）应用：马歇尔一勒纳条件是弹性分析法的核心，也是一国是否采用货币贬值政策改善国际收支状为前提，在充分就业条件下，这一假设显然并不存在。因此，马歇尔一勒纳条件的应用也有很大的局限性。","points":["定义：马歇尔一勒纳条件（Marshall-Lernercondition)，是美国经济学家勒纳（A.P.Lerner）在研究既定的进出口供给条件下一国货币贬值对国际收支的影响时提出的贬值改善国际收支的条件。","特点：在假定贸易商品进出口供给弹性无穷大的前提下，一国货币贬值能否改善国际收支取决于本国贸易品的需求价格弹性。假定以X表示本币计值的出口量，M表示外币计值的进口量，E表示外汇汇率，B表示以外币计值的贸易收支差额，则有：E 对外汇汇率E求导、并变形有：【待核：低置信度】dB __X(1. dXE.MEdME 【待核：低置信度】","dEE²( dEXXdEM 令：nx、nm分别表示出口商品和进口商品弹性的绝对值，则有：dB_X( 【待核：低置信度】M·E 【待核：低置信度】1-nx-—x","【待核：低置信度】1m dEE² 由于假设初始国际收支处于均衡状态，即ME=X，有：【待核：低置信度】dEE² >0，即本币贬值有助于改善国际收支。【待核：低置信度】dM 条件+7m>1就是马歇尔一勒纳条件。马歇尔一勒纳条件表明，在进出口供给弹性无穷大的前提下，只要一国进出口需求弹性绝对值之和大于1，本国货币贬值就会改善国际收支状况。而且进出口需求价格弹性越大，本币贬值对贸易收支状况改善的作用越大。","应用：马歇尔一勒纳条件是弹性分析法的核心，也是一国是否采用货币贬值政策改善国际收支状为前提，在充分就业条件下，这一假设显然并不存在。因此，马歇尔一勒纳条件的应用也有很大的局限性。"]},{"no":4,"type":"term","stem":"融资租赁","score":3,"body":"（1）定义：融资租赁（financelease），是指由出租人代其购进或租进所需要的设备，然后再出租给承租人使用的租赁方式。（2）形式：其具体的形式有四种，即：直接购买租赁、回租租赁、转租赁和杠杆租赁。（3）应用条件：当企事业需要添置某些技术设备而又缺乏资金时，会采取这一形式，具有以下特征：设备的所有权和使用权相分离，融资和融物相结合。（4）发展特点：以分期付款租金形式获取融资租赁物，租金合同的不可解除性，至少涉及三个方面的当事人和两个合同。","points":["定义：融资租赁（financelease），是指由出租人代其购进或租进所需要的设备，然后再出租给承租人使用的租赁方式。","形式：其具体的形式有四种，即：直接购买租赁、回租租赁、转租赁和杠杆租赁。","应用条件：当企事业需要添置某些技术设备而又缺乏资金时，会采取这一形式，具有以下特征：设备的所有权和使用权相分离，融资和融物相结合。","发展特点：以分期付款租金形式获取融资租赁物，租金合同的不可解除性，至少涉及三个方面的当事人和两个合同。"]},{"no":5,"type":"term","stem":"半强有效市场","score":3,"body":"（1）有效市场分类：根据可获得的有关信息的分类不同，可将市场效率划分为弱有效、半强有效和强有效三种类型。（2）定义：半强有效市场（Semi-strongefficient market），指所有公开的可用信息假定都被反映在证券价格中，不仅包括证券价格序列信息，还包括公司财务报告信息，经济状况的通行资料和其他公开可用的有关公司价值的信息，公布的宏观经济形势和政策方面的信息。（3）内涵：半强有效的市场并不意味着所有的市场参与者都能马上接受并且理解所有公开有用的信息，","points":["有效市场分类：根据可获得的有关信息的分类不同，可将市场效率划分为弱有效、半强有效和强有效三种类型。","定义：半强有效市场（Semi-strongefficient market），指所有公开的可用信息假定都被反映在证券价格中，不仅包括证券价格序列信息，还包括公司财务报告信息，经济状况的通行资料和其他公开可用的有关公司价值的信息，公布的宏观经济形势和政策方面的信息。","内涵：半强有效的市场并不意味着所有的市场参与者都能马上接受并且理解所有公开有用的信息，"]},{"no":1,"type":"short","stem":"简述货币政策传导机制理论的主要内容。","score":6,"body":"简述货币政策传导机制理论的主要内容。\n\n（1）货币政策传导机制理论定义：货币政策传导机制指各种货币工具的运用引起中间目标的变动和社会经济生活的某些变化，从而实现中央银行货币政策的最终目标这样一个过程。\n\n（2）分类：它实际上包含两个方面内容：一是内部传导机制，即从货币工具选定、操作到金融体系货币供给或扩张的内部作用过程；二是由中间指标发挥外部影响，即对总支出起作用的过程。在西方，关于货币政策传导机制的分析，一般分为凯恩斯学派的传导机制理论和货币学派的传导机制理论。\n\n①凯恩斯学派的传导机制理论。\n\nA.概念：凯恩斯学派认为，当货币政策变动时，例如，中央银行通过公开市场购买债券，货币供应量增加，导致货币资产收益率下降；经济单位以货币买进债券，导致债券价格上升，市场利率下降，投资者则增加投资，引起总需求增加，导致产出增加，整个传导过程可表示为：货币政策工具一M（货币供应）→r（利率）→I（投资）→E（总支出）→Y（收入）。货币政策的作用过程，先是通过货币供应量的变动影响利率水平，再经利率水平的变动改变投资活动水平，最后导致收入水平的变动。\n\nB.货币政策对收入水平影响的大小取决于：a.货币政策对货币供应量的影响，这取决于基础货币和货币乘数；b.货币供应量的变化对利率的影响；c.利率变化对投资水平的影响；d.投资水平对收入水平的影响，这取决于投资乘数的大小。\n\nC.传导过程中各个环节是一环扣一环的，如果其中任意一节出现阻塞或障碍，都可能导致货币政策效果的减弱或无效。在这个传导机制发挥作用的过程中，最主要的是利率。\n\n②货币学派的传导机制理论。\n\nA.概念：货币学派认为，利率在货币传导机制中不起重要作用，而更强调货币供应量在整个传导机制上的直接效果。该学派认为，增加货币供应量在开始时会降低利率，银行增加贷款，货币收入增加和物价上升，从而导致消费支出和投资支出增加，引致产出提高，直到物价的上涨将多余的货币量完全吸收掉为止。因此，货币政策的传导机制主要不是通过利率间接的影响投资和收入，而是通过货币实际余额的变动直接影响支出和收入，可用符号表示为M一E一I一Y。其中M→E，是指货币供给量的变化直接影响支出。\n\nB.货币供给量不通过利率途径而直接影响支出的原因在于货币需求有其内在的稳定性，当作为外生变量的货币供给改变，由于货币需求并不改变，公众手持货币量会超过他们所愿意持有的货币时，从而必然增加支出。E一I，是指变化了的支出用于投资的过程，这是一个资产结构的调整过程，因为不同取向投资会相应引起不同资产相对收益率的变动，这就引起资产结构的调整。","points":["简述货币政策传导机制理论的主要内容。 （1）货币政策传导机制理论定义：货币政策传导机制指各种货币工具的运用引起中间目标的变动和社会经济生活的某些变化，从而实现中央银行货币政策的最终目标这样一个过程。 （2）分类：它实际上包含两个方面内容：一是内部传导机制，即从货币工具选定、操作到金融体系货币供给或扩张的内部作用过程；二是由中间指标发挥外部影响，即对总支出起作用的过程。在西方，关于货币政策传导机制的分析，一般分为凯恩斯学派的传导机制理论和货币学派的传导机制理论。","凯恩斯学派的传导机制理论。 A.概念：凯恩斯学派认为，当货币政策变动时，例如，中央银行通过公开市场购买债券，货币供应量增加，导致货币资产收益率下降；经济单位以货币买进债券，导致债券价格上升，市场利率下降，投资者则增加投资，引起总需求增加，导致产出增加，整个传导过程可表示为：货币政策工具一M（货币供应）→r（利率）→I（投资）→E（总支出）→Y（收入）。货币政策的作用过程，先是通过货币供应量的变动影响利率水平，再经利率水平的变动改变投资活动水平，最后导致收入水平的变动。 B.货币政策对收入水平影响的大小取决于：a.货币政策对货币供应量的影响，这取决于基础货币和货币乘数；b.货币供应量的变化对利率的影响；c.利率变化对投资水平的影响；d.投资水平对收入水平的影响，这取决于投资乘数的大小。 C.传导过程中各个环节是一环扣一环的，如果其中任意一节出现阻塞或障碍，都可能导致货币政策效果的减弱或无效。在这个传导机制发挥作用的过程中，最主要的是利率。","货币学派的传导机制理论。 A.概念：货币学派认为，利率在货币传导机制中不起重要作用，而更强调货币供应量在整个传导机制上的直接效果。该学派认为，增加货币供应量在开始时会降低利率，银行增加贷款，货币收入增加和物价上升，从而导致消费支出和投资支出增加，引致产出提高，直到物价的上涨将多余的货币量完全吸收掉为止。因此，货币政策的传导机制主要不是通过利率间接的影响投资和收入，而是通过货币实际余额的变动直接影响支出和收入，可用符号表示为M一E一I一Y。其中M→E，是指货币供给量的变化直接影响支出。 B.货币供给量不通过利率途径而直接影响支出的原因在于货币需求有其内在的稳定性，当作为外生变量的货币供给改变，由于货币需求并不改变，公众手持货币量会超过他们所愿意持有的货币时，从而必然增加支出。E一I，是指变化了的支出用于投资的过程，这是一个资产结构的调整过程，因为不同取向投资会相应引起不同资产相对收益率的变动，这就引起资产结构的调整。"]},{"no":2,"type":"short","stem":"简述国际收支失衡的原因和调整措施。","score":6,"body":"（1）国际收支失衡的原因导致国际收支失衡的原因是多种多样的，有经济因素的，也有非经济因素的。概括地讲，主要有以下几种原因：\n\n①季节性和偶然性原因。由于生产、消费有季节性失衡。典型的季节性国际收支失衡发生在以农产品作为主要出口商品的发展中国家。无规律的短期灾害如洪水、地震等自然灾害，也会造成一国出口减少，进口增加，引起国际收支失衡。季节性和偶然性国际收支失衡都是临时性的，它们对国内经济的危害相对较小。\n\n②周期性原因。因经济周期波动使经济条件变动而发生的盈余和赤字交互出现的国际收支失衡。\n\n例如，在经济繁荣时期，进口需求增加，可能出现经常项目赤字；在经济萧条时期，进口需求下降，可能出现经常项目盈余。从资本与金融项目看，经济繁荣时期，投资前景看好，资本注入增加；经济萧条时期，投资前景黯淡，资本流出增加。二战后，主要工业国的商业周期波动极易传播至其他国家，从而引起世界性的周期波动，致使各国国际收支出现周期性失衡。\n\n③货币性原因。由于一国的价格水平、利率水平等货币性因素与其他国家比较发生相对变动所引起的国际收支失衡，称为货币性失衡。例如，一国货币供应量增加过多，相对于其他国家而言，该国一般物价水平和生产成本便会普遍上升，该国的出口便会受到抑制，而进口则受到鼓励，从而造成该国经常项目收支恶化。另外，货币供应量过多，还会引起本国利率下降和资本流出增加，从而造成资本与金融项目的逆差。两者结合在一起，会造成一国国际收支逆差。货币性失衡不仅与一国经常项目有关，也同资本与金融项目有关。\n\n④结构性原因。指当国际分工格局或国际需求结构等国际经济结构发生变化时，一国的产业结构及相应的生产要素配置不能完全适应这种变化，从而发生的国际收支失衡，称为结构性失衡。各国由于地理环境、资源分布、技术水平、劳动生产率等经济条件不同，形成了各自的经济而已和产业结构，地调整其生产结构和出口商品结构，则会引起贸易和国际收支的失衡。\n\n5外汇投机和资本外逃造成的失衡。投机性资本流动是利用利率差别和预期的汇率变动来牟利的资本流动。投机性资本流动可能是稳定的，也可能是不稳定。不稳定的投机使汇率变动更加恶化，投机造成贬值，贬值又进一步刺激投机，从而使外汇市场变得更为混乱，资本大量外流。资本外逃是保值性资本流动。娄一个国家面临货币贬值外汇管制、政治动荡或战争威胁时，在这个国家拥有资产的居民与非居民就把其资金转移到他们认为稳定的国家，造成该国资本的大量外流。不稳定的投机和资本外逃具有突发性、规模大的特点，在国际资本迅速流动的今天，它们已成为一国国际收支失衡的一个重要原因。\n\n（2）国际收支失衡的调节措施一国国际收支失衡会对国家经济的稳定和发展产生不利影响，因而，必须保持国际收支平衡。如果一国国际收支经常出现失衡而收支差额较大，特别是发生长期性逆差时，必须要进行调节。国际收支调节可以分为自动调节和政策调节。自动调节通过汇率机制、收入机制和货币机制的调节能从一定程度上缓解一国的国际收支失衡，但自动调节只能在某些条件或经济环境下起作用，而且作用效果和程度也无法保证。因此，各国都采取一定的政策来调节国际收支，使国际收支朝着有利于本国经济稳定的方向发展。一般说，国际收支失衡的政策调节主要有以下几种：\n\n①外汇缓冲政策。外汇缓冲政策是指运用官方储备的变动或向外贷款，来对付国际收支临时性失衡的政策。一般做法是建立外汇平准基金，当国际收支失衡后，货币当局运用该基金在公开市场操作，买进或卖出外汇，消除超额的外汇供求。这种政策以外汇为缓冲体，故称外汇缓冲政策。运用外汇缓冲政策调节季节性、偶然性失衡和不正常资本流动造成的失衡是一种非常好的选择，它可以使外部失衡的影响止于外汇储备阶段，而不影响国内经济与金融。但以长期性失衡，该政策不但无益，反而有害，因此，不宜用于调节长期性失衡。\n\n②汇率调整政策。汇率调整就是指发生逆差时实行本币贬值，发生实行本币升值的政策。汇率调整旨在改变外汇的供求关系，经由进出口商品的价格变化、资本融进融出的实际收益成本的变化等渠道来实现政策目标。但通过汇率调整实现调节目标，要求本国进出口商品具有充分弹性，而且汇率调整，尤其是竞争性贬值容易引起民贸易伙伴的报复，从而引发币战。\n\n③需求管理政策。需求管理政策是运用扩张或紧缩性财政政策和货币来控制需求问题，进而消除国际收支的失衡。这是战后各国普遍采用的方法。财政政策一般是从收支两个方面进行调节，其主要政策工具有税收、政府支出和国债政策。财政当局根据国际收支失衡的不同情况，分别采取松动的或紧缩的财政预算对总需求进行直接调节，并通过国内企业的传递，特别是涉外企业的传导来实现对国际收支的调节。货币政策是货币当局运用各种政策工具调节货币供应量和利率，以实现一定的宏观经济目标的政策和措施总和。货币政策工具主要有法定准备金率、再贴现政策和公开市场业务等。对于由国内需求失衡引起的国际收支失衡，需求管理政策是一种有效的调节方式。\n\n④直接管制政策。直接管制政策是指对国际经济贸易采取直接行政干预的政策。它包括外汇管制和贸易管制。以直接管制作为国际收支调节政策的优点首先在于其效果迅速而显著。其次，在国际收支失衡的原因为局部性因素时，较易针对该部分实行管制，因而不必使整个经济变动。但直接管制政策不利于资源优化配置，而且容易招致他国报复。一般来说，直接管制政策作为国际收支调节手段，应以其他政策难以迅速取得效果的情况为限。","points":["（1）国际收支失衡的原因导致国际收支失衡的原因是多种多样的，有经济因素的，也有非经济因素的。概括地讲，主要有以下几种原因：","季节性和偶然性原因。由于生产、消费有季节性失衡。典型的季节性国际收支失衡发生在以农产品作为主要出口商品的发展中国家。无规律的短期灾害如洪水、地震等自然灾害，也会造成一国出口减少，进口增加，引起国际收支失衡。季节性和偶然性国际收支失衡都是临时性的，它们对国内经济的危害相对较小。","周期性原因。因经济周期波动使经济条件变动而发生的盈余和赤字交互出现的国际收支失衡。 例如，在经济繁荣时期，进口需求增加，可能出现经常项目赤字；在经济萧条时期，进口需求下降，可能出现经常项目盈余。从资本与金融项目看，经济繁荣时期，投资前景看好，资本注入增加；经济萧条时期，投资前景黯淡，资本流出增加。二战后，主要工业国的商业周期波动极易传播至其他国家，从而引起世界性的周期波动，致使各国国际收支出现周期性失衡。","货币性原因。由于一国的价格水平、利率水平等货币性因素与其他国家比较发生相对变动所引起的国际收支失衡，称为货币性失衡。例如，一国货币供应量增加过多，相对于其他国家而言，该国一般物价水平和生产成本便会普遍上升，该国的出口便会受到抑制，而进口则受到鼓励，从而造成该国经常项目收支恶化。另外，货币供应量过多，还会引起本国利率下降和资本流出增加，从而造成资本与金融项目的逆差。两者结合在一起，会造成一国国际收支逆差。货币性失衡不仅与一国经常项目有关，也同资本与金融项目有关。","结构性原因。指当国际分工格局或国际需求结构等国际经济结构发生变化时，一国的产业结构及相应的生产要素配置不能完全适应这种变化，从而发生的国际收支失衡，称为结构性失衡。各国由于地理环境、资源分布、技术水平、劳动生产率等经济条件不同，形成了各自的经济而已和产业结构，地调整其生产结构和出口商品结构，则会引起贸易和国际收支的失衡。 5外汇投机和资本外逃造成的失衡。投机性资本流动是利用利率差别和预期的汇率变动来牟利的资本流动。投机性资本流动可能是稳定的，也可能是不稳定。不稳定的投机使汇率变动更加恶化，投机造成贬值，贬值又进一步刺激投机，从而使外汇市场变得更为混乱，资本大量外流。资本外逃是保值性资本流动。娄一个国家面临货币贬值外汇管制、政治动荡或战争威胁时，在这个国家拥有资产的居民与非居民就把其资金转移到他们认为稳定的国家，造成该国资本的大量外流。不稳定的投机和资本外逃具有突发性、规模大的特点，在国际资本迅速流动的今天，它们已成为一国国际收支失衡的一个重要原因。 （2）国际收支失衡的调节措施一国国际收支失衡会对国家经济的稳定和发展产生不利影响，因而，必须保持国际收支平衡。如果一国国际收支经常出现失衡而收支差额较大，特别是发生长期性逆差时，必须要进行调节。国际收支调节可以分为自动调节和政策调节。自动调节通过汇率机制、收入机制和货币机制的调节能从一定程度上缓解一国的国际收支失衡，但自动调节只能在某些条件或经济环境下起作用，而且作用效果和程度也无法保证。因此，各国都采取一定的政策来调节国际收支，使国际收支朝着有利于本国经济稳定的方向发展。一般说，国际收支失衡的政策调节主要有以下几种：","外汇缓冲政策。外汇缓冲政策是指运用官方储备的变动或向外贷款，来对付国际收支临时性失衡的政策。一般做法是建立外汇平准基金，当国际收支失衡后，货币当局运用该基金在公开市场操作，买进或卖出外汇，消除超额的外汇供求。这种政策以外汇为缓冲体，故称外汇缓冲政策。运用外汇缓冲政策调节季节性、偶然性失衡和不正常资本流动造成的失衡是一种非常好的选择，它可以使外部失衡的影响止于外汇储备阶段，而不影响国内经济与金融。但以长期性失衡，该政策不但无益，反而有害，因此，不宜用于调节长期性失衡。；汇率调整政策。汇率调整就是指发生逆差时实行本币贬值，发生实行本币升值的政策。汇率调整旨在改变外汇的供求关系，经由进出口商品的价格变化、资本融进融出的实际收益成本的变化等渠道来实现政策目标。但通过汇率调整实现调节目标，要求本国进出口商品具有充分弹性，而且汇率调整，尤其是竞争性贬值容易引起民贸易伙伴的报复，从而引发币战。；需求管理政策。需求管理政策是运用扩张或紧缩性财政政策和货币来控制需求问题，进而消除国际收支的失衡。这是战后各国普遍采用的方法。财政政策一般是从收支两个方面进行调节，其主要政策工具有税收、政府支出和国债政策。财政当局根据国际收支失衡的不同情况，分别采取松动的或紧缩的财政预算对总需求进行直接调节，并通过国内企业的传递，特别是涉外企业的传导来实现对国际收支的调节。货币政策是货币当局运用各种政策工具调节货币供应量和利率，以实现一定的宏观经济目标的政策和措施总和。货币政策工具主要有法定准备金率、再贴现政策和公开市场业务等。对于由国内需求失衡引起的国际收支失衡，需求管理政策是一种有效的调节方式。；直接管制政策。直接管制政策是指对国际经济贸易采取直接行政干预的政策。它包括外汇管制和贸易管制。以直接管制作为国际收支调节政策的优点首先在于其效果迅速而显著。其次，在国际收支失衡的原因为局部性因素时，较易针对该部分实行管制，因而不必使整个经济变动。但直接管制政策不利于资源优化配置，而且容易招致他国报复。一般来说，直接管制政策作为国际收支调节手段，应以其他政策难以迅速取得效果的情况为限。"]},{"no":3,"type":"short","stem":"简述“最适度通货区理论”的内容。","score":6,"body":"（1）定义：“最适度货币区”理论认为，要使浮动汇率更好发挥作用，必须放弃各国的国家货币制度而实行区域性货币制度。“区域\"是指有特写含义的最适度货币区，由一些彼此间商品、劳动力、资本等生产要素可以自由流动，经济发展水平和通货膨胀率比较接近，经济政策比较协调的国家（地区）\n\n组成的一个独立货币区，在货币区内通过协调的货币、财政和汇率政策，达到充分就业、物价稳定和国际收支平衡。\n\n（2）内容上：最适度通货区理论又可以叫作最适度货币区理论，最早于1961年提出最适货币区理论的罗伯特·蒙代尔（RobertA.Mundell）主张生产要素流动性准则，“货币区\"内的汇率必须被固定；“最佳\"的标志就是有能力稳定区内就业和价格水平。最佳货币区不是按国家边界划定的，而是由地理区域限定的。他认为生产要素流动性与汇率的弹性具有相互替代的作用，这是因为，需求从一国转移到另一国所造成的国际收支调整要求，既可以通过两国汇率调整，也可以通过生产要素在两国间的移动来解决。在他看来，生产要素流动性越高的国家之间，越适宜于组成货币区；而与国外生产要素市场隔绝越大的国家，则越适宜于组成单独的货币区，实行浮动汇率制。\n\n（3）意义：①有利于促进本区经济一体化，并极大地提高区内总的经济福利。②有利于降低货币汇兑成本，规避区内货币之间的汇率风险。③有利于整合区内货币金融资源，降低投融资成本与风险④有利于加强区内一体化协作，并一致对外抵御竞争风险。\n\n【参考答案】\n\n（1）定义：财务危机是指企业明显无力按时偿还到期的无争议的债务的困难与危机。对于财务危机，通常公认有两种确定的方法：\n\n①法律对企业破产的定义，企业破产是用来衡量企业财务危机最常用的标准，也是最准确和最极端的标准；\n\n②以证券交易所对持续亏损、有重大潜在损失或者股价持续低于一定水平的上市公司给予特别处理或退市作为标准。\n\n（2）财务危机成本是在财务管理出现技术上或者企业破产的情况下所形成的直接成本和间接成本。\n\n①直接成本包括履行破产程序及开展破产工作的费用以及因破产所导致的企业无形资产的损失；\n\n②间接成本则包括发生财务危机但尚未达到破产地步时的经营管理所遇到的工作障碍对企业价值的贬值，以及企业债权与企业决策者之间的矛盾与斗争所影响的企业价值的贬值。\n\n分机财务危机成本的形成机理，其出现的原因可能有以下几种情况：\n\na.经营不善，管理者无能；\n\nb.市场变化，外部风险无法防范和转移；\n\nc.代理成本无穷大，主要是监督和激励成本过高；\n\nd.代理链条过长，表现为“剩余损失”过大；经理人的事前“逆向选择”使企业机会成本太高，或是事后的“道德风险”使企业不堪重负。\n\n其中第一、二项可归属于经营管理的机会成本，第三、四项属于代理成本，当这些成本超过一定的临界线，就使企业出现财务危机，可见，财务危机事实上是管理和代理两种因素导致的结果。代理和管理都是双刃剑；管理层次多，可以使管理精细化，提高经营效率，降低管理成本；而管理层次过多反过来可导致代理链条过长，使剩余损失增加，激励和监督成本也同时增加。尽管管理和代理成本无法清晰地分别计量，但它们发生的结果最终会影响企业价值。\n\n（3）财务危机成本承担\n\n①资本市场上，财务危机上将导致融资成本上升，财务危机成本会由股权及债券融资者承担。\n\n②在商品市场上，商品供应商会把财务危机的成本转嫁给商品销售者。\n\n③在人才市场上，企业发生财务危机时会流失优秀的人才，其成本由自已本身承担。","points":["（1）定义：“最适度货币区”理论认为，要使浮动汇率更好发挥作用，必须放弃各国的国家货币制度而实行区域性货币制度。“区域\"是指有特写含义的最适度货币区，由一些彼此间商品、劳动力、资本等生产要素可以自由流动，经济发展水平和通货膨胀率比较接近，经济政策比较协调的国家（地区） 组成的一个独立货币区，在货币区内通过协调的货币、财政和汇率政策，达到充分就业、物价稳定和国际收支平衡。 （2）内容上：最适度通货区理论又可以叫作最适度货币区理论，最早于1961年提出最适货币区理论的罗伯特·蒙代尔（RobertA.Mundell）主张生产要素流动性准则，“货币区\"内的汇率必须被固定；“最佳\"的标志就是有能力稳定区内就业和价格水平。最佳货币区不是按国家边界划定的，而是由地理区域限定的。他认为生产要素流动性与汇率的弹性具有相互替代的作用，这是因为，需求从一国转移到另一国所造成的国际收支调整要求，既可以通过两国汇率调整，也可以通过生产要素在两国间的移动来解决。在他看来，生产要素流动性越高的国家之间，越适宜于组成货币区；而与国外生产要素市场隔绝越大的国家，则越适宜于组成单独的货币区，实行浮动汇率制。 （3）意义：","有利于促进本区经济一体化，并极大地提高区内总的经济福利。","有利于降低货币汇兑成本，规避区内货币之间的汇率风险。","有利于整合区内货币金融资源，降低投融资成本与风险","有利于加强区内一体化协作，并一致对外抵御竞争风险。 【参考答案】 （1）定义：财务危机是指企业明显无力按时偿还到期的无争议的债务的困难与危机。对于财务危机，通常公认有两种确定的方法：","法律对企业破产的定义，企业破产是用来衡量企业财务危机最常用的标准，也是最准确和最极端的标准；；以证券交易所对持续亏损、有重大潜在损失或者股价持续低于一定水平的上市公司给予特别处理或退市作为标准。 （2）财务危机成本是在财务管理出现技术上或者企业破产的情况下所形成的直接成本和间接成本。；直接成本包括履行破产程序及开展破产工作的费用以及因破产所导致的企业无形资产的损失；；间接成本则包括发生财务危机但尚未达到破产地步时的经营管理所遇到的工作障碍对企业价值的贬值，以及企业债权与企业决策者之间的矛盾与斗争所影响的企业价值的贬值。 分机财务危机成本的形成机理，其出现的原因可能有以下几种情况： a.经营不善，管理者无能； b.市场变化，外部风险无法防范和转移； c.代理成本无穷大，主要是监督和激励成本过高； d.代理链条过长，表现为“剩余损失”过大；经理人的事前“逆向选择”使企业机会成本太高，或是事后的“道德风险”使企业不堪重负。 其中第一、二项可归属于经营管理的机会成本，第三、四项属于代理成本，当这些成本超过一定的临界线，就使企业出现财务危机，可见，财务危机事实上是管理和代理两种因素导致的结果。代理和管理都是双刃剑；管理层次多，可以使管理精细化，提高经营效率，降低管理成本；而管理层次过多反过来可导致代理链条过长，使剩余损失增加，激励和监督成本也同时增加。尽管管理和代理成本无法清晰地分别计量，但它们发生的结果最终会影响企业价值。 （3）财务危机成本承担；资本市场上，财务危机上将导致融资成本上升，财务危机成本会由股权及债券融资者承担。；在商品市场上，商品供应商会把财务危机的成本转嫁给商品销售者。；在人才市场上，企业发生财务危机时会流失优秀的人才，其成本由自已本身承担。"]},{"no":1,"type":"essay","stem":"论述美国量化宽松货币政策对中国货币政策操作的影响与应对策略。","score":12,"body":"（1）美国量化宽松政策的定义：量化宽松政策（“QE”）本质上是中央银行增加确定数量的基础货币以刺激经济的货币政策。是指通过购买国债等中长期债券，增加基础货币供给，面向市场注入大量流动性，用于增加经济中的货币供给，以鼓励开支和借贷，也被简化地形容为间接增印钞票。量化指的是扩大一定数量的货币发行，宽松即减少银行的资金压力。当银行和金融机构的有价证券被央行收购时，新发行的钱币便被成功地投入到私有银行体系。量化宽松政策所涉及的政府债券，不仅金额庞大，而且周期也较长。一般来说，只有在利率等常规工具不再有效的情况下，货币当局才会采取这种极端做法。（2）美国量化宽松货币政策对中国货币政策操作的影响美元贬值使得人民币汇率升值。为了维持汇率稳定，货币当局不得不放松货币供应，但考虑到我国当前通货膨胀依然处于5%以上的高位，货币政策应适当保持稳健，又由于货币政策的滞后性，其对经济的影响落后于经济局势的发展，因此给我国货币政策的执行带来选择难题，加大了操作难度。（3）在当前世界经济复苏乏力的局势下，欧美等经济体经济放缓的时候，新兴经济体应在增长的同时，控制物价水平，为世界经济整体复苏注入动力。（4）量化宽松政策对中国货币政策的应对策略 ①中国应减少外汇市场干预，适度加快人民币升值 ②实行稳健甚至是适度从紧的货币政策 ③加强资本流入管制 ④继续实行宽松积极的财政政策 5加强金融监管，提高金融风险的抵御能力 ?积极推动国际政策协调和国际货币改革因此，中国要在保证经济持续8%的增长率的同时，控制国内通胀，防止系统性的国家主权债务危机的负面影响。故货币政策的松紧在此局面下显得很重要，一定要控制数量和时点。","points":["（1）美国量化宽松政策的定义：量化宽松政策（“QE”）本质上是中央银行增加确定数量的基础货币以刺激经济的货币政策。是指通过购买国债等中长期债券，增加基础货币供给，面向市场注入大量流动性，用于增加经济中的货币供给，以鼓励开支和借贷，也被简化地形容为间接增印钞票。量化指的是扩大一定数量的货币发行，宽松即减少银行的资金压力。当银行和金融机构的有价证券被央行收购时，新发行的钱币便被成功地投入到私有银行体系。量化宽松政策所涉及的政府债券，不仅金额庞大，而且周期也较长。一般来说，只有在利率等常规工具不再有效的情况下，货币当局才会采取这种极端做法。（2）美国量化宽松货币政策对中国货币政策操作的影响美元贬值使得人民币汇率升值。为了维持汇率稳定，货币当局不得不放松货币供应，但考虑到我国当前通货膨胀依然处于5%以上的高位，货币政策应适当保持稳健，又由于货币政策的滞后性，其对经济的影响落后于经济局势的发展，因此给我国货币政策的执行带来选择难题，加大了操作难度。（3）在当前世界经济复苏乏力的局势下，欧美等经济体经济放缓的时候，新兴经济体应在增长的同时，控制物价水平，为世界经济整体复苏注入动力。（4）量化宽松政策对中国货币政策的应对策略","中国应减少外汇市场干预，适度加快人民币升值；实行稳健甚至是适度从紧的货币政策；加强资本流入管制","继续实行宽松积极的财政政策 5加强金融监管，提高金融风险的抵御能力 ?积极推动国际政策协调和国际货币改革因此，中国要在保证经济持续8%的增长率的同时，控制国内通胀，防止系统性的国家主权债务危机的负面影响。故货币政策的松紧在此局面下显得很重要，一定要控制数量和时点。"]},{"no":2,"type":"essay","stem":"论述现代商业银行经营管理的核心内容与管理方法。","score":12,"body":"历程：随着各个历史时期经营条件的变化，西方商业银行经营管理理论经历了资产管理、负债管理、资产负债综合管理的演变过程。（1）资产管理理论核心内容：是商业银行最传统的管理思路。在20世纪60年代以前，银行资金来源大多是吸收活期存款。在银行看来存款的主动权都在客户手中，银行自身的管理起不了决定性影响。而资金运用的主动权却操之于自已之手，所以银行必然会看重资产管理。在资产管理中，资产流动性的管理占有特别重要的地位。随着经济环境的变化和银行经营业务的发展，其理论历经了如下三个不同发展阶段。管理方法：①第一阶段是商业贷款理论，概括而言，即认为了保持资金的高度流动性，贷款应是短期和商业性的；用于商品生产和流通过程的贷款要是具有自偿性，最为理想。即使是以真实票据为依据贷款，有时，如危机时，也不能百分之百地保证归还。②第二阶段是可转换性理论。这是20世纪提出的。该理论认为，为了应付存款提取所需保持的流动性，商业银行可以将其资金的一部分投资于具备转让条件的证券上。由于这些盈利资产能够随时出售，转换为现金，所以贷款不一定非要局限于短期的和具有自偿性的投放范围。显然，这种理论是以金融工具和金融市场的发展为背景的。可转换性理论的产生，使商业银行资产的范围扩大，业务经营更加灵活多样。但是在人们竞相抛售证券的时候，银行也很难不受损失地将所持证券顺利转让。③第三阶段是预期收入理论。这种理论产生于20世纪40年代末。第二次世界大战后，经济的发展带来了对贷款需求的猛增，并且资金需求多样化。在这样的背景下，预期收入理论应运而生。这种理论为一笔好的贷款，应当以根据借款人未来收入或现金流量而制定的还款计划为基础。这样，无论放款期限长短，只要借款人具有可靠的预期收入，就不至于影响流动性。换言之，这种理论强调的不是贷款能否自偿，也不是担保品能否迅速变现，而是借款人的确有助于还款付息的任何预期收入。（2）负债管理理论的核心内容：负债管理理论是在金融创新中发展起来的理论。关于20世纪60年代开始的金融创新，其背景是，一方面银行面临资金来源不足的窘境；另一方面为了维持与客户的良好关系，又必须满足客户对融通资金的要求。因此，迫使银行不得不以创新方式去获取新的资金来源。负债管理的核心思想就是主张以借入资金的方法来保持银行流动性，增加银行收益。管理方法：负债管理认为，银行的流动性不仅可以通过加强资产管理获得，向外借款也可提供流动性：只要借款领域宽广，流动性就有保证。而且，负债业务管理有效，则无需经常保有大量高流动性资产，并可将资金投入到更有利可图的资产上，银行收益则将提高。负债管理开创了保持银行流动性的新途径：由单靠吸收存款的被动型负债方式，发展成向外借款的主动型负债方式；根据资产业务的需要组织负债，让负债去适应、支持资产。这就为银行扩大业务规模和范围创造了条件。（3）资产负债综合管理理论核心内容与管理方法：产生于20世纪70年代末80年代初。无论是资产管理还是负债管理，都只是侧重一个方面来对待银行的盈利性、流动性、安全性。于是很难避免重此轻此现象的发生。比如资产管理过于偏重安全性和流动性，往往以牺牲盈利为代价，这不足以鼓励银行经营的积极进取；而负债管理过分强调依赖外部借款，则增大了银行经营风险。因此，人们日益认识到，能将盈利性、流动性和安全性三者的组合推进到更为协调合理、更为有效率的管理，应该是对资产和负债并重的、综合性的管理。总结：事实上，上述所讨论的方法都属于风险管理的范畴。自20世纪70年代以来，金融的风险日益增大。面对这样的现实，风险实际是无处逃避和躲藏的。而且跌宕起伏的金融环境其实给金融机构以及金融专业人士提供了更大的机遇和挑战。成功的关键是学会驾驭与管理金融风险。因此，近20 年来，存款货币银行的风险管理备受关注并在管理系统中占有重要地位。对于金融机构来说，高超的风险管理技术和方法显得特别重要。目前关于风险管理的方法很多，其中受到重视的方法之一是VAR 技术，是一种用标准统计技术估计金融风险的方法。它的定义是：一种可以在正常的市场环境下，给定一定的时间区间和置信度水平，预计某种资产或资产组合最大损失的方法。","points":["历程：随着各个历史时期经营条件的变化，西方商业银行经营管理理论经历了资产管理、负债管理、资产负债综合管理的演变过程。（1）资产管理理论核心内容：是商业银行最传统的管理思路。在20世纪60年代以前，银行资金来源大多是吸收活期存款。在银行看来存款的主动权都在客户手中，银行自身的管理起不了决定性影响。而资金运用的主动权却操之于自已之手，所以银行必然会看重资产管理。在资产管理中，资产流动性的管理占有特别重要的地位。随着经济环境的变化和银行经营业务的发展，其理论历经了如下三个不同发展阶段。管理方法：","第一阶段是商业贷款理论，概括而言，即认为了保持资金的高度流动性，贷款应是短期和商业性的；用于商品生产和流通过程的贷款要是具有自偿性，最为理想。即使是以真实票据为依据贷款，有时，如危机时，也不能百分之百地保证归还。","第二阶段是可转换性理论。这是20世纪提出的。该理论认为，为了应付存款提取所需保持的流动性，商业银行可以将其资金的一部分投资于具备转让条件的证券上。由于这些盈利资产能够随时出售，转换为现金，所以贷款不一定非要局限于短期的和具有自偿性的投放范围。显然，这种理论是以金融工具和金融市场的发展为背景的。可转换性理论的产生，使商业银行资产的范围扩大，业务经营更加灵活多样。但是在人们竞相抛售证券的时候，银行也很难不受损失地将所持证券顺利转让。","第三阶段是预期收入理论。这种理论产生于20世纪40年代末。第二次世界大战后，经济的发展带来了对贷款需求的猛增，并且资金需求多样化。在这样的背景下，预期收入理论应运而生。这种理论为一笔好的贷款，应当以根据借款人未来收入或现金流量而制定的还款计划为基础。这样，无论放款期限长短，只要借款人具有可靠的预期收入，就不至于影响流动性。换言之，这种理论强调的不是贷款能否自偿，也不是担保品能否迅速变现，而是借款人的确有助于还款付息的任何预期收入。（2）负债管理理论的核心内容：负债管理理论是在金融创新中发展起来的理论。关于20世纪60年代开始的金融创新，其背景是，一方面银行面临资金来源不足的窘境；另一方面为了维持与客户的良好关系，又必须满足客户对融通资金的要求。因此，迫使银行不得不以创新方式去获取新的资金来源。负债管理的核心思想就是主张以借入资金的方法来保持银行流动性，增加银行收益。管理方法：负债管理认为，银行的流动性不仅可以通过加强资产管理获得，向外借款也可提供流动性：只要借款领域宽广，流动性就有保证。而且，负债业务管理有效，则无需经常保有大量高流动性资产，并可将资金投入到更有利可图的资产上，银行收益则将提高。负债管理开创了保持银行流动性的新途径：由单靠吸收存款的被动型负债方式，发展成向外借款的主动型负债方式；根据资产业务的需要组织负债，让负债去适应、支持资产。这就为银行扩大业务规模和范围创造了条件。（3）资产负债综合管理理论核心内容与管理方法：产生于20世纪70年代末80年代初。无论是资产管理还是负债管理，都只是侧重一个方面来对待银行的盈利性、流动性、安全性。于是很难避免重此轻此现象的发生。比如资产管理过于偏重安全性和流动性，往往以牺牲盈利为代价，这不足以鼓励银行经营的积极进取；而负债管理过分强调依赖外部借款，则增大了银行经营风险。因此，人们日益认识到，能将盈利性、流动性和安全性三者的组合推进到更为协调合理、更为有效率的管理，应该是对资产和负债并重的、综合性的管理。总结：事实上，上述所讨论的方法都属于风险管理的范畴。自20世纪70年代以来，金融的风险日益增大。面对这样的现实，风险实际是无处逃避和躲藏的。而且跌宕起伏的金融环境其实给金融机构以及金融专业人士提供了更大的机遇和挑战。成功的关键是学会驾驭与管理金融风险。因此，近20 年来，存款货币银行的风险管理备受关注并在管理系统中占有重要地位。对于金融机构来说，高超的风险管理技术和方法显得特别重要。目前关于风险管理的方法很多，其中受到重视的方法之一是VAR 技术，是一种用标准统计技术估计金融风险的方法。它的定义是：一种可以在正常的市场环境下，给定一定的时间区间和置信度水平，预计某种资产或资产组合最大损失的方法。"]},{"no":3,"type":"essay","stem":"比较投资预算方法中的NPV方法和IRR方法，他们各有什么优点，在什么情况下会出现不一致，如果出现不一致应以何者为准？","score":12,"body":"（1）项目投资的净现值法（NPV法）则可以归纳为：接受净现值大于0的项目，拒绝净现值为负的项目。净现值法是进行投资决策的明智选择，主要具有以下三个优点：①净现值使用了现金流量。公司可以直接使用项目经营所获取的现金流量（比如，分配股利、投资其他资本预算项目或是支付利息）。相比之下，利润则包含了许多人为的因素。对会计人员来说，利润是有用的，但却不能在资本预算中使用，因为利润并不等同于现金。金流量，使用这些方法时应当小心。③净现值对现金流量进行了合理的折现。而其他方法在处理现金流量时往往会忽略货币的时间价值。（2）项目投资的内部收益率（IRR法）的基本判定法则可以概括为：若内部收益率大于贴现率，项目可以接受；若内部收益率小于贴现率，项目不能接受。IRR方法的优点：提供了一个能体现出项目内在价值的数值。该数值并不依靠折现率，而且内部收益率本身不受资本市场利率的影响，而是取决于项目的现金流量。（3）内部收益率法本身存在一定的问题，在下述情况下，会与净现值法出现不一致。首先，在独立项目和互斥项目中都可能遇到的两个问题：①有些项目首先有现金流入，其后才需要现金流出，这种情况下内部收益率法的投资法则与一般法则正好相反；当内部收益率低于贴现率时，项目可行。②有些项目的现金流量多次变号，这样就会出现多个内部收益率。此时从业人员必须使用净现值法或修正内部收益率法。其次，互斥项目所独有的高内部收益率未必对应高净现值。这样，单纯的内部收益率法就不再适用（净现值法仍然可以使用）。（4）采用标准：综上可知，不管是哪种情况下，净现值法总是适用的。相比之下，内部收益率法只能在某种条件下使用。因此，如果内部收益率法与净现值法出现不一致，应以净现值法为准。","points":["（1）项目投资的净现值法（NPV法）则可以归纳为：接受净现值大于0的项目，拒绝净现值为负的项目。净现值法是进行投资决策的明智选择，主要具有以下三个优点：","净现值使用了现金流量。公司可以直接使用项目经营所获取的现金流量（比如，分配股利、投资其他资本预算项目或是支付利息）。相比之下，利润则包含了许多人为的因素。对会计人员来说，利润是有用的，但却不能在资本预算中使用，因为利润并不等同于现金。金流量，使用这些方法时应当小心。","净现值对现金流量进行了合理的折现。而其他方法在处理现金流量时往往会忽略货币的时间价值。（2）项目投资的内部收益率（IRR法）的基本判定法则可以概括为：若内部收益率大于贴现率，项目可以接受；若内部收益率小于贴现率，项目不能接受。IRR方法的优点：提供了一个能体现出项目内在价值的数值。该数值并不依靠折现率，而且内部收益率本身不受资本市场利率的影响，而是取决于项目的现金流量。（3）内部收益率法本身存在一定的问题，在下述情况下，会与净现值法出现不一致。首先，在独立项目和互斥项目中都可能遇到的两个问题：","有些项目首先有现金流入，其后才需要现金流出，这种情况下内部收益率法的投资法则与一般法则正好相反；当内部收益率低于贴现率时，项目可行。","有些项目的现金流量多次变号，这样就会出现多个内部收益率。此时从业人员必须使用净现值法或修正内部收益率法。其次，互斥项目所独有的高内部收益率未必对应高净现值。这样，单纯的内部收益率法就不再适用（净现值法仍然可以使用）。（4）采用标准：综上可知，不管是哪种情况下，净现值法总是适用的。相比之下，内部收益率法只能在某种条件下使用。因此，如果内部收益率法与净现值法出现不一致，应以净现值法为准。"]}]},{"year":2012,"included":40,"excluded":0,"questions":[{"no":1,"type":"single","stem":"货币层次是根据（）来划分的。","options":["安全性","收益性","流动性","风险性"],"answer":"C","expl":"**各国中央银行在确定货币供给的统计口径时，都以流动性的大小，以及作为流通手段和支付手段的方便程度作为标准。\n\n**提示：**本题的考点是货币层次的划分。复习这个知识点的同时，考生也要了解每种货币层次里面分别包含了怎样的内容，特别是M1，M2，准货币的定义。本考点涉及的题型有选择题、判断题。","score":1},{"no":2,"type":"single","stem":"下列信用形式属于银行信用的是","options":["商业汇票和银行承兑汇票","商业本票和银行汇票","商业汇票和银行本票","银行承兑汇票和银行本票"],"answer":"D","expl":"**汇票是分为银行汇票和商业汇票。银行汇票是由出票银行签发的。商业汇票是由出票人签发的，出票人一般是企业。商业汇票又分为商业承兑汇票（由银行以外付款人承兑）和银行承兑汇票（由银行承兑）两种。银行本票是银行签发的，承诺在见票时无条件支付确定金额给收款人或者持票人的票据。\n\n**提示：**本题涉及的考点是商业信用和银行信用的区别。考生需要了解商业信用和银行信用的相同点以及不同点。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":3,"type":"single","stem":"假设你花了100元获得一项资产，该资产以后每年会给你带来5元的稳定收入，假设市场利率等于 4%，那么你愿意最低以（）价格出售这项资产。","options":["100元","99元","101元","125元"],"answer":"D","expl":"**这项资产未来收益的现值为：\n\n【待核：低置信度】P=∑_ 5 【待核：低置信度】旨(1+ 4%) 4% 因此最低愿意以125元出售这项资产。\n\n**提示：**本题涉及的考点是资产价格的计算。考生只需掌握基本的现金流贴现模型即可正确应答本题。\n\n本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":4,"type":"single","stem":"以下关于利率的期限结构说法错误的是","options":["利率期限结构通常表现出短期利率波动大，长期利率波动小的特征","市场分割理论不能解释收益率曲线通常向上倾斜的特征","预期理论能够解释短期利率和长期利率的联动关系","流动性升水理论假设不同期限的债券之间存在不完全的替代性"],"answer":"B","expl":"**B项，市场分割理论认为资金在不同期限市场之间基本是不流动的。当长期市场上资金供不应求，导致利率上升的同时，短期内市场资金供过于求，导致利率下降，就会形成向上倾斜的收益率曲线。A项，利率期限结构是指在某一时点上，不同期限资金的收益率与到期期限之间的关系，长期利率比较稳定，短期利率经常波动。C项，预期利率认为，长期债券的现期利率是短期债券的预期利率的函数，长期利率与短期利率之间的关系取决于现期短期利率与未来预期短期利率之间的关系。D项，流动性偏好认为不同期限债券的风险程度与利率结构的关系，较为完整地建立了流动性偏好理论。根据流动性偏好理论，不同期限的债券之间存在不完全的替代性。\n\n**提示：**本题涉及到的利率期限结构是金融学的重点以及难点。考生要掌握利率期限结构理论中的预期理论、市场分割理论和流动性升水理论。每种理论的概念以及互相之间的对比都需要完全掌握并且理解。本考点涉及的题型有选择题、判断题、简答题、名词解释。","score":1},{"no":5,"type":"single","stem":"一位投资者以5元的价格买入A公司的股票，持有3个月后，以5.5元的价格出售，在持有期间A 公司派发了0.15元每股的红利。那么该投资者的投资收益率是","options":["12%","5%","3%","13%"],"answer":"D","expl":"**该投资者的投资收益率为：（5.5-5+0.15）/5=13%。\n\n**提示：**本题涉及的考点是收益率的计算。股票的收益率包括了股利收益率和资本利得收益率。该公式考生务必掌握，是公司理财书上的基本公式。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":6,"type":"single","stem":"下列关于证券发行的说法错误的是","options":["私募发行手续简单，节省费用，但流动性差","公募发行成本较高，但可以在短期内募集较大资金","直接发行受到很多法律限制","间接发行风险较大，发行费用高"],"answer":"D","expl":"**A项，私募发行有确定的投资者，发行手续简单，可以节省发行时间和发行费用，但投资者数量有限，证券流通性较差。B项，公募发行的发行条件比较严格，发行程序比较复杂，登记核准的时间较长，发行费用较高；公募发行以众多投资者为发行对象，证券发行的数量多，筹集资金的潜力大。\n\nC项，直接发行，如果发行额较大，由于缺乏专业人才和发行网点，发行者自身要担负较大的发行风险，受到很多法律限制。D项，间接发行，可在较短时期内筹集到所需资金，发行风险较小；但需支付一定的手续费，发行成本较高。\n\n**提示：**本题涉及的考点是私募发行.公募发行；直接发行.间接发行的特点。同样的考生也要通过对比分析的方法来理清楚私募发行、公募发行的相同点和不同点，直接发行、间接发行之间的相同点和不同点。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":7,"type":"single","stem":"商业银行的经营原则是","options":["安全性、风险性、盈利性统筹兼顾","安全性、盈利性、流动性统筹兼顾","风险性、流动性、盈利性统筹兼顾","盈利性、流动性、收益性统筹兼顾"],"answer":"B","expl":"**商业银行的经营原则是盈利性、安全性、流动性原则，并且有限地在三者之间寻求平衡。\n\n**提示：**本题涉及的考点是商业银行的经营原则。考生要熟悉商业银行的经营原则，同时也要熟记中央银行的经营原则，两者是有差异的，并且需要了解这三个原则之间互相之间的关系。本题涉及的题型有选择题、判断题、简答题。","score":1},{"no":8,"type":"single","stem":"以下业务属于中央银行资产业务的是","options":["货币发行、存款业务、发行中央银行票据","货币发行、在贷款、证券业务","再贴现、证券业务、外汇储备","外汇储备、再贴现、发行中央银行票据"],"answer":"C","expl":"**中央银行的业务可以分为负债业务、资产业务和中间业务。其中资产业务包括：贷款、再贴现、证券买卖、保管金银外汇储备等。负债业务包括：货币发行、代理国库、集中存款准备金、占用清算资金、其他负债业务等。\n\n**提示：**本题涉及考点是中央银行的资产负债表。考生要熟记自中央银行资产负债表中各项目的内容，哪些项目属于中央银行的资产，哪些属于负债。本题涉及题型有选择、判断。","score":1},{"no":0,"type":"single","stem":"2，那么经济中商业银行持有超额存款准备金和货币乘数分别是","options":["10亿和3.3","20亿和2.4","10亿和2","10亿和2.4"],"answer":"D","expl":"**由题可知，商业银行的法定存款准备金为：100x0.2=20（亿元），因此其超额存款准备金为：\n\n30-20=10（亿元）。货币乘数k=（c+1）／（Rd+e+c），其中c=20/100=0.2，代表通货与存款的利率；\n\nRd=0.2，代表法定存款准备金率；e=10/100=0.1，代表超额存款准备金率，由货币乘数k=（0.2+1）/ (0.2=0.1=0.2) =2.4。\n\n**提示：**本题涉及的考点是货币乘数的计算和超额准备金的概念。考生在掌握货币乘数计算的同时也需要掌握存款扩张倍数的计算，并且要分清楚两者之间的区别。本考点涉及的题型有选择题、判断题、简答题、计算题。","score":1},{"no":10,"type":"single","stem":"下列说法不正确的是","options":["金融全球化促进金融业提高效率","金融全球化增强国家宏观经济政策的效率","金融全球化会加大金融风险","金融全球化会增加国际金融体系的脆弱性"],"answer":"B","expl":"**金融全球化的积极影响主要有：提高金融市场运作的效率；促进资金在全球范围内的游戏配置；\n\n促进了国际投资和贸易的迅速发展以及促进了金融体制与金融结构的整合。同时金融全球的负面影响主要有：导致国际金融体系和金融机构内在脆弱性的加深；削弱国家货币政策的自主性；加大了各国金融监管的难度以及使资产价格过度波动的破坏性大。\n\n**提示：**本题涉及的考点是金融全球化。金融全球化是金融发展中的内容，考查的概率较小，试题一般可以通过简单的逻辑推理和排除法选出来，并不需要死记硬背，本考点涉及的题型有选择题、判断题。","score":1},{"no":11,"type":"single","stem":"在其他条件不变的情况下，根据汇率理论的弹性价格货币分析法，以下哪一项变化会导致本国货币对外升值","options":["本国的货币供应量相对于其他国家增加","本国的国民收入相对于其他国家增加","本国的利率相对于其他国家增加","本国的物价相对于其他国家上升"],"answer":"B","expl":"**汇率理论的弹性价格货币分析法的基本模型为：e=a（yi-y）+b（i-ii）+（Ms-Msi），其中y、yi 分别代表本国的国民收入和其他国家的国民收入；i、ii分别代表本国和其他国家的利率水平；Ms、Ms1 分别代表本国和其他国家的货币供应量。因此，导致本国货币对外升值也即é变小的原因有：本国的货币供应量相对于其他国家减少；本国的国民收入相对于其他国家增加；本国的利率相对于其他国家减少。\n\n**提示：**本题涉及的考点是弹性价格货币分析法。该考点不会考大型的计算，考生只需掌握弹性价格货币分析法中各个因素的改变将会怎样影响一国的汇率即可。本考点涉及的题型有选择题、判断题。","score":1},{"no":12,"type":"single","stem":"假设2012年1月8日外汇市场汇率行情是：伦敦市场1英镑=1.42美元，纽约市场1美元=1.58加元，多伦多市场100英镑=220加元，如一个投资者投入100万英镑套汇，那","options":["有套汇机会，获利1.98万英榜","有套汇机会，获利1.98万美元","有套汇机会，获利1.98万加元","无套利机会，获利为零"],"answer":"A","expl":"**若投机者投入100万英榜，那么他在伦敦市场可以换取142（万美元），然后进入纽约市场，142 美元则可兑换142×1.58=224.36（万加元），最后进入多伦多市场则可兑换224.36/2.2=101.98（万英榜），因此有套利机会，获利101.98-100=1.98（万英榜）。\n\n**提示：**本题涉及的考点是三角套汇，三角套汇的计算相对来说还是比较有难度的。三角套汇本质，其实就是各个货币之间的一个兑换过程。计算来说相对来说比较繁琐。国际金融在近年来的考试中计算有所减少。该题重复考查的概率不大。该考点涉及的题型有选择题、判断题、小型计算题。","score":1},{"no":13,"type":"single","stem":"根据蒙代尔的政策搭配原理，在固定汇率制度下，当一国同时处于通货膨胀和国际收支逆差时，应采用（）政策搭配。","options":["扩张性的财政政策和紧缩性的财政政策","扩张性的财政政策和扩张性的财政政策","紧缩性的财政政策和紧缩性的货币政策","紧缩性的财政政策和扩张性的财政政策"],"answer":"C","expl":"**蒙代尔的政策分派原则：在固定汇率制下，只有把内部均衡目标分派给财政政策，外部均衡目标分派给货币政策，方能达到经济的全面均衡。具体如下：\n\n通货膨胀失业通货膨胀失业经济失衡状态国际收支盈余国际收支盈余国际收支赤字国际收支赤字紧缩性财政政策扩张性财政政策紧缩性财政政策扩张性财政政策最佳政策配合扩张性货币政策扩张性货币政策紧缩性货币政策紧缩性货币政策因此，当一国同时处于通货膨胀和国际收支逆差时，应采用紧缩性的财政政策和紧缩性货币政策的政策搭配。\n\n**提示：**本题涉及的考点是蒙代尔的政策搭配原理。考生把上述表格中的四个状态熟记就能应付相应的试题，近年来初试考查该部分的可能性逐年减小。本考点涉及的题型有选择题，判断题。","score":1},{"no":14,"type":"single","stem":"S公司的财务数据如下：速动比率为1，流动比例为2，其中流动资产为4000元，则其存货规模为","options":["1500元","1800元","2000元","3000元"],"answer":"C","expl":"**流动比率和速动比率主要用于反映企业短期偿债能力。其中流动比率是企业流动资产与流动负债之比：速动比率是速动资产与流动负债的比率，其中速动资产等于流动资产减去存货。因此企业的流动负债为：4000/2=2000（元），速动资产为：2000×1=2000（元），因而存货=4000-2000=2000（元）。\n\n**提示：**本题涉及的考点是财务比率的运用。考生要熟记各种财务比率的公式：现金比率、流动比率、速动比率都是常见的衡量公司偿债能力的指标。本考点涉及的题型有选择题判断题计算题。考生复习财务比率的时候要把财务比例进行分类，比方说流动性指标、盈利指标、偿债能力指标、营运能力指标等。","score":1},{"no":15,"type":"single","stem":"下面对资本资产定价模型的描述中错误的是","options":["单个证券的期望收益率由两部分组成，无风险利率以及风险溢价","风险溢价的大小取决于β值的大小","β越大，单个证券的风险越高，得到的风险补偿也越高","β度量的是单个证券的全部风险，包括系统性风险和非系统性风险"],"answer":"D","expl":"**根据CAPM模型，股票的期望收益率为：E（Ri）=Rf+βi（E（Rm）一Rf）式中：E（Ri）为证券f的期望收益率；Rf为无风险收益率；E（Rm）为市场资产组合的期望收益率；βi为资产i的β系数。\n\n上式表明：单个证券的期望收益率由两部分组成，一是资金的时间价值，即无风险利率；二是投资者因承担系统风险而得到的风险报酬，即风险溢价。其中风险溢价的大小取决于βi值的大小，是用来度量系统风险的，βi越大，单个证券的风险越高，得到的风险补偿也越高。\n\n**提示：**本题涉及的考点是资本资产定价模型。资本资产定价模型属于每年必考题。小题会考，计算题更会考。考生要掌握贝塔系数的计算公式和含义，也要掌握对应的证券市场线的绘制方法。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":16,"type":"single","stem":"某永续年金在贴现率为5%时的现值为1000元，那么当贴现率为10%时，其现值为","options":["300","500","700","1000"],"answer":"B","expl":"**令永续年金每年固定收入为X，那么有X/5%=1000，得到X=50（元），那么当贴现率为10% 时，其现值为：50/10%=500（元）。\n\n**提示：**本题涉及的考点是永续年金的现值计算。考生只需掌握基本的现金流贴现模型即可正确回答本题。本考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":17,"type":"single","stem":"认股权证与普通看涨期权的区别不包括","options":["认股权证的执行将改变公司发行在外的股份数量","认股权证由股份公司发行，而看涨期权由投资者发行","认股权证没有有效期限制，始终有效","认股权证的价值与看涨期权有区别"],"answer":"C","expl":"**认购权证赋予权证持有者在一定期限内按照一定的价格向发行人购买数量的标的资产的权利，因此也是有些期限制的。认股权证与普通看涨期权的区别主要在于：①认股权证在进入交易市场之前，必须由发行股票的公司向市场发行；而普通看涨期权无需经过发行环节，只要买卖双方同意，就可直接成交；②认股权证行权后，公司总股本的增加等于行使股本权证时所购买的股票数量，从而对股票价格有摊薄或提升的作用；股票期权时所需的股票完全从市场上购入，上市公司的总股本并不会增减，期权行权对上市公司无任何影响。\n\n**提示：**本题涉及的考点是认股权证和看涨期权。考生在复习的时候要掌握认股权证和看涨期权的相同点和不同点以及各自的定义。同时也要掌握认股权证和可转债的相同点和不同点，因为认股权证和可转债都属于混合融资手段。考点涉及题型有选择题、判断题、简答题。","score":1},{"no":18,"type":"single","stem":"进行资本预算时，项目的期末现金流中不包括","options":["项目贷款的本金偿还","回收的净营运资本投资","处置残余资产所得","与处置残余资产相关的所得税"],"answer":"A","expl":"**终结现金流量是指项目经济寿命终了时发生的现金流量，主要包括经营现金流量和非经营新疆入以及出售时的税赋损益；②垫支营运资本的收回。\n\n**提示：**本题涉及的考点是项目现金流的计算。考生需要掌握初始现金流.营业现金流和终结现金流中分别包含了什么内容。本考点涉及的题型有选择题、判断题。","score":1},{"no":19,"type":"single","stem":"公司债务权益比为1，其权益资本成本为16%，公司债务成本为8%。如果公司所得税率为25%，那么在公司债务权益比为0时，其权益成本为多少？","options":["11.11%","12.00%","12.57%","13.33%"],"answer":"C","expl":"**根据有税的MM定理的命题IⅡ，Rs=Ro+B/S×（1-t）×（Ro-RB），即16%=Ro+1x75%x（Ro-8%），解上式得到公司的债务权益比为0时的权益成本Ro=12.57%。\n\n**提示：**本题涉及的考点是权益成本的计算。使用到了MM定理，MM定理包含了四个公式，其中MM 定理2（有税）比较复杂，考试的概率也非常高。考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":20,"type":"single","stem":"按照股利政策的在手鸟理论，投资者偏好以现金红利的方式获得投资回报的主要原因","options":["一般而言，投资者现金红利收入的税率较低","投资者认为现金红利的风险比资本利得的风险低","现金红利收入有延迟纳税的好处","投资者不理性"],"answer":"B","expl":"**股利政策的在手鸟理论认为，用留存收益再投资给投资者的收益具有很大的不确定性，并且投资风险将随着时间的推移而进一步增大，因此，投资者更喜欢现金股利，而不大喜欢将利润留给公司。\n\n公司分配的股利越多，公司的市场价值也就越多大。\n\n**提示：**本题涉及的考点是公司的股利政策理论。这部分知识点的重要性不言而喻，涉及到的理论种类年的考研中涉及到了股利的客户效应理论，而这个内容是在刘力的课本中所没有的。但是在王汀汀的课本中却有阐述。本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":1,"type":"tf","stem":"实际利率和名义利率都可能为负值。","options":["正确","错误"],"answer":"×","expl":"**实际利率是指物价水平不变，从而货币购买力不变条件下的利息率。名义利率是指包括补偿通货膨胀（包括通货紧缩）风险的利率。名义利率不可能为负，不会出现倒负利息的情况。当通货膨胀率高于名义利率时，实际利率为负值。**提示：**本题涉及的考点是实际利率和名义利率之间的关系，考生需要掌握费雪方程式。该方程式揭示了实际利率和名义利率之间的关系。本考点涉及的题型有选择题、判断题。","score":1},{"no":2,"type":"tf","stem":"有效市场假说是说明资产价格与信息之间关系的理论。其中，弱有效市场假说认为当前的市场价格已经反映了所有公开信息。","options":["正确","错误"],"answer":"×","expl":"**弱式有效市场认为证券价格充分反映了历史上一系列交易价格和交易量中所隐含的信息；而半强式有效市场假说认为当前的证券价格反映了所有的公开的信息。**提示：**本题涉及的考点是有效市场假说。考生需要掌握弱有效市场，半强式有效市场和强有效市场各自成立的条件以及在不同有效程度的市场上的特点。本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":3,"type":"tf","stem":"本币升值会通过贸易渠道推高资产价格。","options":["正确","错误"],"answer":"×","expl":"**从贸易渠道上看，本币升值将抑制本国出口企业的业绩，进而导致资产价格的下降。**提示：**本题涉及的考点是汇率变化对资产价格的影响。考生不仅需要掌握汇率变化对资产价格带来的影响，还需要掌握汇率变化带来的其他方面的影响，这块内容可以在金融学课本以及国际金融课本中找到。该考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":4,"type":"tf","stem":"期货与远期本质上是一致的，形式上的差别之一是期货具有标准化的合约，在交易所集中交易；而远期合约标准化程度较低，并不在交易所交易。","options":["正确","错误"],"answer":"√","expl":"**期货合约和远期合约本质是一致的，都是在交易时约定将来某一时间按约定的条件买卖一定数量的某种标的物的合约。它们的区别之一是期货具有标准化的合约，在交易所集中交易；二远期合约标准化程度较低，没有固定的交易场所。**提示：**本题涉及的考点是期货和远期的区别。考生要掌握各类金融衍生品之间的区别，比如期货和远期，期货和期权的对比。考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":5,"type":"tf","stem":"商业银行经营管理的缺口管理理论强调商业银行资产和负债的利率风险应该相互匹配，认为商业银行可以平衡利率敏感性资产和利率敏感性负债来规避利率风险，也可以通过主动调整缺口来获利。【待核：低置信度","options":["正确","错误"],"answer":"√","expl":"**商业银行采用缺口管理方法的目的是，根据对利率变化趋势的预测，相机调整利率敏感性资金的配置结构，以实现利润最大化的目标或扩大净利利息差额率。**提示：**本题涉及的考点是商业银行的缺口管理。考生需要掌握商业银行管理理论的发展历程，从资产管理理论发展到负债管理理论，再到资产负债综合管理理论。缺口管理是资产负债综合管理理论中的一种。本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":6,"type":"tf","stem":"古典货币需求理论中的交易方程式和剑桥方程式的根本区别是，剑桥方程式是从宏观视角分析货币需求，而交易方程式是从微观视角分析货币需求。","options":["正确","错误"],"answer":"×","expl":"**费雪的交易方程式仅从货币的交易媒介功能考查，全社会一定时期一定价格水平下的总交易量与所需要的名义货币量的比例关系，没有考虑微观主体动机对货币需求的影响。剑桥学派在研究货币方式保持自已资产的问题。**提示：**本题涉及的考点是货币需求理论。货币需求理论在金融学的学习中非常重要。考生需要掌握整个理论体系中的每一个理论的提出者.定义以及互相的区别。了解交易方程式和费雪方程方程式；交易方程式和剑桥方程式的侧重点以及各自的区别。该考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":7,"type":"tf","stem":"自然失业率假设认为，长期内通货膨胀与失业率之间不存在替代关系，因为长期中人们会调整通货膨胀预期，使预期通货膨胀与实际通货膨胀一致，失业维持在自然失业率上。","options":["正确","错误"],"answer":"√","expl":"**根据自然失业率假说，任何一个资本主义社会都存在这样一个失业率水平，其大小取决于社会的技术水平.资源数量和文化传统。长期而言，经济总是趋向于自然失业率，通货膨胀与失业率之间不存在替代关系。**提示：**本题涉及的考点是通货膨胀和失业率之间的关系。考生需要掌握好菲利普斯曲线所揭示的失业率和通货膨胀率之间的替代关系，同时也需要掌握理性预期学派对长期失业率和通货膨胀率之间关系的看法。自然失业率正是理性预期学派中的一个概念。本考点涉及的题型有选择题、判断题。","score":1},{"no":8,"type":"tf","stem":"货币政策操作指标需要满足可测性、可控性、相关性和抗扰性的特点。货币供应量的相关性、抗扰性较好，但可测性和可控性不足，因此不是好的操作指标。","options":["正确","错误"],"answer":"×","expl":"**货币政策操作中介指标需要满足可测性.可控性、相关性和抗扰性的特点。货币供应量具有很强的可测性，并且能够满足可控性和相关性的需求，而且抗扰性也较好。**提示：**本题涉及的考点是货币政策操作指标的特点。在复习该考点的时候，考生需要掌握货币政策操作指标分别包含了怎样的内容，中介指标包含了怎样的内容，各大指标有什么特点，该部分知识点内容繁多，重要性非常高。本考点涉及题型有选择题、判断题、简答题。","score":1},{"no":9,"type":"tf","stem":"合理金融结构能够完善金融服务功能，并降低金融市场的系统性风险，促进经济发展。","options":["正确","错误"],"answer":"√","expl":"**金融结构则是指各种金融工具和金融机构的形式.性质及其相对规模，也就是说金融结构是由金融工具与金融机构共同决定的。一国金融结构的形成取决于多种因素，其中主要是社会经济制度和经济发展程度。合理的进入结构是商品经济顺畅运行的条件和促进因素，能够完善进入的服务功能，降低金融的系统性风险，调节社会经济结构，促进经济结构向合理化方向发展。**提示：**本题涉及的考点是金融结构。知识点比较偏僻，只需掌握基础的概念即可。本考点涉及的题型有选择题、判断题。","score":1},{"no":10,"type":"tf","stem":"只要实现部分准备金制度，商业银行就可以创造派生存款。","options":["正确","错误"],"answer":"×","expl":"**存款货币的创造必须具备两个紧密联系的必要前提条件：其一，各个银行对于自己所吸收的存款只需保留一定比例的准备金；余下部分可以用来发放贷款和进行投资，并且都进行银行清算系统，这样贷款和投资又可以变为转存款，创造出支票货币。如果只有部分准备金制度，而没有银行清算系统，那么就不会出现存款货币的创造。**提示：**本题涉及的考点是商业银行创造派生存款的前提条件。考生需要掌握商业银行创造派生存款的三个前提条件。本考点涉及题型有选择题、判断题、简答题。","score":1},{"no":11,"type":"tf","stem":"国际储备的功能包括储备资产的增值保值和提高对外投资的收益率。","options":["正确","错误"],"answer":"×","expl":"**国际储备的功能包括：弥补国际收支赤字、调节本币汇率、充当信用保证以及防患突发事件。**提示：**本题涉及的考点是国际储备的功能。国际储备的功能这一个知识点和考研的热点息息相关，因为中国是世界上国际储备量最大的国家。所以考生对国际储备的功能以及如何管理国际储备这几个问题都要熟练掌握。本考点涉及题型有选择、判断、简答、论述题。","score":1},{"no":12,"type":"tf","stem":"欧洲货币市场的美元利差一般都会高于美国国内市场的美元利差。","options":["正确","错误"],"answer":"×","expl":"**欧洲货币市场的美元利差一般都会低于美国国内市场的美元利差，因为欧洲货币市场存款利率较高，贷款利率较低，市场化程度高。**提示：**本题涉及的知识点是欧洲货币市场和欧洲美元。考生要掌握这两个名词的含义，同时在复习时债券等。本考点涉及的题型有选择题、判断题、名词解释。","score":1},{"no":13,"type":"tf","stem":"特里芬难题是指美元作为国际货币在满足国际清偿力和维持美元信心之间的矛盾。","options":["正确","错误"],"answer":"√","expl":"**特里芬难题是指美元承担了相互矛盾的双重职能：①为世界经济增长和国家贸易发展提供清偿能力；②维持美元的币信，保持美元同黄金的兑换比例。信心和清偿力又存在着不可克服的矛盾，美元供给太多就会有不能兑换的危险，从而发生信心问题，美元供给太少就会发生国际清偿力不足的问题。**提示：**本题涉及的考点是特里芬难题，这也是布雷顿森林体系最终走向崩溃的原因。同时考生也需要掌握布雷顿森林体系的定义、功能、优点以及不足。本考点涉及的题型有选择题、判断题、名词解释、简答题。","score":1},{"no":14,"type":"tf","stem":"期限相同且每年付款金额相同时，先付年金的现值大于后付年金现值。","options":["正确","错误"],"answer":"√","expl":"**当期限相同.每年付款金额相同时，在同样折现率水平下，现值的计算公式为：先付年金现值 =Ax[（P/A，i，n-1）+1]，后付年金现值=Ax（P/A，I，n）。根据现值计算公式可知，先付年金的折现期限比后付年金的折现期限短，所以先付年金的现值大于后付年金的现值。**提示：**本题涉及的考点是先付年金现值的计算和后付年金现值的计算。考生需要熟悉基本的先付年金，后付年金的现值计算公式和终值计算公式，特别是先付年金后付年金的现值系数和终值系数的计算以及相互之间的转换。考点涉及的题型有选择题、判断题、计算题。","score":1},{"no":15,"type":"tf","stem":"在风险与期望收益的坐标系内，位于证券市场线（SML）上方的证券的定价偏高。","options":["正确","错误"],"answer":"×","expl":"**在风险与期望收益的坐标系内，位于证券市场先（SML）上方的证券是定价偏低的证券，因为在相同的风险下，在证券市场线上方的证券，其期望收益偏高。价格必须上升，直至其期望收益率位于证券市场线上。**提示：**考生要理解证券市场线的画法，即横坐标、纵坐标分别代表了什么含义，考生也要分清楚证券市场线和资本市场线之间的区别。本考点涉及的题型有选择题、判断题、简答题、名词解释。","score":1},{"no":16,"type":"tf","stem":"根据《中华人民共和国合伙企业法》，国有独资企业可以成为普通合伙人。","options":["正确","错误"],"answer":"×","expl":"**根据《中华人民共和国合伙企业法》，以下公式不得成为普通合伙人：国有企业、上市公司以及国有独资企业。**提示：**本题涉及的考点是企业的组织形式。该部分内容经常以法律的形式考查，因此复习该部分内容时要着重记忆相关的法律规定，本考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":17,"type":"tf","stem":"按照标准普尔的债券评级标准，垃圾债券是指评级在BB及以下的债券。","options":["正确","错误"],"answer":"√","expl":"**垃圾债券，也称为高风险债券。评信级别在标准普尔公司BB级及以下的公司发行的债券。**提示：**本题涉及的考点是债券的信用评级。该知识点记忆相对繁琐，但是在初试复试的选择判断中会频繁考查，因此希望考生引起警惕。标准·普尔公司信用等级标准从高到低可划分为：AAA级、AA级、A级、BBB级、BB级、B级、CCC级、CC级C级和D级。穆迪投资服务公司信用等级标准从高到低可划分为：Aaa级，Aa级、A级、Baa级、Ba级B级Caa级、Ca级、C级。本考点涉及的题型有选择题、判断题。","score":1},{"no":18,"type":"tf","stem":"通常，当市场利率下降时，可赎回债券被赎回的可能性会增大。","options":["正确","错误"],"answer":"√","expl":"为是债券与看涨期权的结合体。在市场利率跌至比课赎回债券的票面利率低得多的时候，债务人如果认为将债券赎回并且按照较低的利率重新发行债券，比按现有的债券票面利率继续支付利息要合算，就会将其赎回。因此当市场利率下降时，可赎回债券被赎回的可能性会增大。\n\n**提示：**本题涉及的考点是可赎回债券。考生需要理解可赎回债券的含义以及在什么情况下可赎回债券跟容易被赎回。本考点涉及的题型有选择题、判断题。","score":1},{"no":19,"type":"tf","stem":"内部收益率是项目的实际收益率，随着项目风险的变动而变化。","options":["正确","错误"],"answer":"×","expl":"**内部收益率（IRR）是投资收益现值与其初始投资额相等时的收益率，即净现值为零时的贴现率。是一项投资渴望达到的报酬率，而不是实际收益率。**提示：**本题涉及的考点是内部收益率指标。内部收益率指标是项目评价指标中的一种，考生不仅要掌握内部收益率指标的计算方法，还要掌握其他的项目评价指标的特点，以及各个指标之间的相同点和不同点。该考点涉及的题型有选择题、判断题、简答题。","score":1},{"no":20,"type":"tf","stem":"在无税收的MM定理中，如果公司负债，那么由于股东仅享有剩余索取权，其收益的波动性要大于无负债公司，所以负债公司的股东所要求的回报率大于无负债公司的股东所要求的回报率。","options":["正确","错误"],"answer":"×","expl":"**无税收的MM定理的结论：①债转股后如果盈利未变化，那么企业的股票价值也不变；②股东期望收益率会随着财务杠杆的上升而上升，也就是说负债公司的股东所要求的回报率大于无负债公司的股东所要求的回报率；③股东每股盈利也会随着财务杠杆的上升而上升。**提示：**本题涉及的考点是无税时的MM理论。考生要掌握无税时的MM理论揭示了公司在无负债时的价值等于有负债时的价值，也要掌握公司的股东报酬率是怎样随着负债数额的增加而变化的。本考点涉及的题型有选择题、判断题、计算题。","score":1}],"sub":[{"no":1,"type":"calc","stem":"在CAPM的假设下，一个有效投资组合的期望收益率为25%。给定如下条件：\nE（Rm）=15%，Rf=5%，om=20%，其中Rm和om分别是市场组合的期望收益率和标准差，Rf为无风险利率。求该投资组合的回报率标准差，以及该组合与市场之间的相关系数。","score":10,"body":"资本市场线揭示了有效组合的收益和风险之间的均衡关系，这种均衡关系可以用资本 [E(rm)-rF 【待核：低置信度】E(rp) = rF + 8m 市场的方程来描述：\n\nE（Rp）、op一—有效组合P的期望收益率和标准差; E（Rm）、om一市场组合M的期望收益率和标准差；\n\nrF一无风险证券收益率将题目中的数值代入上式得到：25%=5%+[（15%-5%）/20%]xop 解得该投资组合的回报率标准差op=40% 由CAPM模型可知：E（ri）=rF+[E（rM）-rF]βi 将数值代入上式得到：25%=5%+（15%-5%）xβ解得β=2, 又因为β=pxop/om，解得该组合与市场之间的相关系数p=1。","points":["资本市场线揭示了有效组合的收益和风险之间的均衡关系，这种均衡关系可以用资本 [E(rm)-rF 【待核：低置信度】E(rp) = rF + 8m 市场的方程来描述： E（Rp）、op一—有效组合P的期望收益率和标准差","E（Rm）、om一市场组合M的期望收益率和标准差","rF一无风险证券收益率将题目中的数值代入上式得到：25%=5%+[（15%-5%）/20%]xop 解得该投资组合的回报率标准差op=40% 由CAPM模型可知：E（ri）=rF+[E（rM）-rF]βi 将数值代入上式得到：25%=5%+（15%-5%）xβ解得β=2, 又因为β=pxop/om，解得该组合与市场之间的相关系数p=1。"]},{"no":2,"type":"calc","stem":"假设关于资本结构的MM理论成立。A公司目前市场价值为1700000元，其中包括价值为500000 元的负债（债务没有风险，并且为永续债务）。公司未来每一期的EBIT保持不变，债务利率（税前）\n为10%，公司所得税率为40%。如果公司完全由股东提供资金，那么股东所要求的回报率为20%。求 A公司目前（有负债）的净利润，并计算如果公司完全由股东提供资金，那么公司的价值是多少？","score":10,"body":"（1）根据有负债条件下得MM理论，V1=VU+TxD，D代表公司负债。\n\n通过转化，V1=EBIT（1-T）/r0+TxD，EBIT代表息税前利润，T代表公司税率；D代表公司负债，r0是无杠杆公司的权益报酬。\n\n1700000=EBIT（1-40%）/20%+40%×500000 所以EBIT=500000（元）\n\n再根据EBIT=净利润+所得税+利息，可得净利润=EBIT一所得税一利息=（500000-500000×10%）（1-40%）=270000（元）\n\n（2）根据无负债条件下得MM理论，VU=EBIT（1-T）/r0=500000（1-40%）/20%=1500000（元）\n\n所以，公司的价值V=1500000（元）","points":["根据有负债条件下得MM理论，V1=VU+TxD，D代表公司负债。 通过转化，V1=EBIT（1-T）/r0+TxD，EBIT代表息税前利润，T代表公司税率；D代表公司负债，r0是无杠杆公司的权益报酬。 1700000=EBIT（1-40%）/20%+40%×500000 所以EBIT=500000（元） 再根据EBIT=净利润+所得税+利息，可得净利润=EBIT一所得税一利息=（500000-500000×10%）（1-40%）=270000（元）","根据无负债条件下得MM理论，VU=EBIT（1-T）/r0=500000（1-40%）/20%=1500000（元） 所以，公司的价值V=1500000（元）"]},{"no":3,"type":"calc","stem":"五年前，罗先生的公司购入了10辆预期使用寿命为15年的卡车，每辆价格为150000元，目前这些旧车还能继续使用10年时间，期末残值为0。现在，他正在考虑是否购买5辆新型卡车替代这10辆旧车。一辆新车的工作能力与两辆旧车完全相当。每辆新车的价格为250000元，预期寿命为10年，期末残值为0.如果购买了这5辆新车，则公司的年经营费用会下降100000元。而旧车目前能以30000 元的价格出售。该公司税率为40%，并且采用直线折旧。假设资本成本为8%，那么该公司是否应该替换旧车？\n年利率为8%的复利现值系数表和年金现值系数表时间复利现值系数年金现值系数 1\n0.9259\n0.9259 2\n0.8573\n1.7833 3\n0.7938\n2.5771 4\n0.7350\n3.3121 5\n0.6806\n3.9927 6\n0.6302\n4.6229 7\n0.5835\n5.2064 8\n0.5403\n5.7466 9\n0.5002\n6.2469\n0.4632\n6.7101","score":10,"body":"公司是否换车取决于公司换车所带来的未来净现金流量是否大于零。\n\n公司换车产生的未来现金流量：\n\n①购买新车的费用为5×250000=1250000元，现值=1250000（元）\n\n②获得旧车出售带来的收入和由于出售资产损失节税=30000×10+10×（150000-150000/15×5-30000）\n\nx40%=300000+280000=580000（元），现值=580000（元）\n\n③新车使用期每年折旧所带来的税收节约=（5×250000/10-10×150000/15）×40%=10000（元）\n\n公司的年经营费用会下降带来费用的节约=100000×（1-40%）=60000（元）\n\n现值（60000+10000）×（P/A，8%，10）=70000×6.7101=469707（元）\n\n公司换车产生的未来现金净流量的现值=-1250000+580000+469707=-200293（元）<0 所以该公司换车是不利的，不应该替换旧车。","points":["公司是否换车取决于公司换车所带来的未来净现金流量是否大于零。 公司换车产生的未来现金流量：","购买新车的费用为5×250000=1250000元，现值=1250000（元）","获得旧车出售带来的收入和由于出售资产损失节税=30000×10+10×（150000-150000/15×5-30000） x40%=300000+280000=580000（元），现值=580000（元）","新车使用期每年折旧所带来的税收节约=（5×250000/10-10×150000/15）×40%=10000（元） 公司的年经营费用会下降带来费用的节约=100000×（1-40%）=60000（元） 现值（60000+10000）×（P/A，8%，10）=70000×6.7101=469707（元） 公司换车产生的未来现金净流量的现值=-1250000+580000+469707=-200293（元）<0 所以该公司换车是不利的，不应该替换旧车。"]},{"no":1,"type":"term","stem":"格雷欣法则","score":4,"body":"（1）定义：格雷欣法则（Gresham'srule），是一种劣币驱逐良币的现象。指在实行金银复本位制的条件下，当金银的市场兑换比例与法定兑换比例不一致时，市场比价比法定比价高的金属货币（良币）将逐渐退出流通，而市场比价比法定比价低的金属货币（劣币）将逐渐充斥市场，形成良币退藏，劣币充斥的现象。（2）原因：“劣币驱逐良币\"的根本原因在于金银复本位制与货币作为一般等价物的排他性、独占性的矛盾。（3）（3）影响：法则表明，在双本位制下，虽然国家规定金银同时充当货币材料，金币和银币同时都是本位币，但在流动过程中，实际上只有一种货币发挥本币作用，而另一种货币则变成了普通商品。因此双本位也是一种不稳定的货币制度。","points":["定义：格雷欣法则（Gresham'srule），是一种劣币驱逐良币的现象。指在实行金银复本位制的条件下，当金银的市场兑换比例与法定兑换比例不一致时，市场比价比法定比价高的金属货币（良币）将逐渐退出流通，而市场比价比法定比价低的金属货币（劣币）将逐渐充斥市场，形成良币退藏，劣币充斥的现象。","原因：“劣币驱逐良币\"的根本原因在于金银复本位制与货币作为一般等价物的排他性、独占性的矛盾。","影响：法则表明，在双本位制下，虽然国家规定金银同时充当货币材料，金币和银币同时都是本位币，但在流动过程中，实际上只有一种货币发挥本币作用，而另一种货币则变成了普通商品。因此双本位也是一种不稳定的货币制度。"]},{"no":2,"type":"term","stem":"流动性风险","score":4,"body":"分类概念：流动性风险（liquidityrisk），有两种含义：一种是由于市场的流动性不高，导致证券持有者无法及时变现而出现损失的风险。这种风险叫做市场或产品流动性风险。另一种是金融交易者本身现金流出现困难，不得不提前低价变现金融资产时，可能将账面损失变为实际损失的风险。这种风险叫做现金风险。","points":["分类概念：流动性风险（liquidityrisk），有两种含义：一种是由于市场的流动性不高，导致证券持有者无法及时变现而出现损失的风险；这种风险叫做市场或产品流动性风险","另一种是金融交易者本身现金流出现困难，不得不提前低价变现金融资产时，可能将账面损失变为实际损失的风险；这种风险叫做现金风险"]},{"no":3,"type":"term","stem":"J曲线效应","score":4,"body":"（1）概念：期望本币贬值来扩大出口，缓解国际贸易逆差的压力，但是发现本国货币贬值后，最初发生的情况往往正好相反，经常项目收支状况反而会比原先恶化，进口增加而出口减少。这一变化被称为“J曲线效应”（2）特点：其原因在于最初的一段时期内由于消费和生产行为的“粘性作用”，进口和出口的贸易量并不会发生明显的变化，但由于汇率的改变，以外国货币计价的出口收入相对减少，以本国货币计价的进口支出相对增加，从而造成经常项目收支逆差增加或是顺差减少。（3）影响：经过一段时间后，这一状况开始改变，进口商品逐渐减少，出口商品逐渐增加，使经常项目收支向有利的方向发展，先是抵消原先的不利影响，然后使经常项目收支状况得到根本性的改善。这一变化过程可能会维持数月甚至一两年，根据各国不同情况而定。因此汇率变化对贸易状况的影响是具有“时滞\"效应的。","points":["概念：期望本币贬值来扩大出口，缓解国际贸易逆差的压力，但是发现本国货币贬值后，最初发生的情况往往正好相反，经常项目收支状况反而会比原先恶化，进口增加而出口减少。这一变化被称为“J曲线效应”","特点：其原因在于最初的一段时期内由于消费和生产行为的“粘性作用”，进口和出口的贸易量并不会发生明显的变化，但由于汇率的改变，以外国货币计价的出口收入相对减少，以本国货币计价的进口支出相对增加，从而造成经常项目收支逆差增加或是顺差减少。","影响：经过一段时间后，这一状况开始改变，进口商品逐渐减少，出口商品逐渐增加，使经常项目收支向有利的方向发展，先是抵消原先的不利影响，然后使经常项目收支状况得到根本性的改善。这一变化过程可能会维持数月甚至一两年，根据各国不同情况而定。因此汇率变化对贸易状况的影响是具有“时滞\"效应的。"]},{"no":4,"type":"term","stem":"财务危机","score":4,"body":"（1）定义：财务危机（financialcrisis），是指企业明显无力按时偿还到期的无争议的债务的困难与危机。（2）形成原因：内部控制薄弱；风险意识淡薄；投资决策失误；过度负债经营对企业财务的不利影响。（3）确定方式：对于财务危机，通常公认有两种确定的方法：一是法律对企业破产的定义，企业破产是用来衡量企业财务危机最常用的标准，也是最准确和最极端的标准；二是以证券交易所对持续亏损、有重大潜在损失或者股价持续低于一定水平的上市公司给予特别处理或退市作为标准。（4）影响：财务危机是导致企业生存危机的重要因素，因此，需要针对可能造成财务危机的因素，采取监测和预防措施，及早防范财务风险，控制财务危机。","points":["定义：财务危机（financialcrisis），是指企业明显无力按时偿还到期的无争议的债务的困难与危机。","形成原因：内部控制薄弱；风险意识淡薄；投资决策失误；过度负债经营对企业财务的不利影响。","确定方式：对于财务危机，通常公认有两种确定的方法：一是法律对企业破产的定义，企业破产是用来衡量企业财务危机最常用的标准，也是最准确和最极端的标准；二是以证券交易所对持续亏损、有重大潜在损失或者股价持续低于一定水平的上市公司给予特别处理或退市作为标准。","影响：财务危机是导致企业生存危机的重要因素，因此，需要针对可能造成财务危机的因素，采取监测和预防措施，及早防范财务风险，控制财务危机。"]},{"no":5,"type":"term","stem":"有效投资组合和有效边界","score":4,"body":"（1）概念：有效投资组合是指在一定的收益水平上承担最小的风险或在一定的风险水平上获得最大收益的资产组合。在几何分析法中，用来描述一项投资组合的风险与回报之间的关系，在以风险为横轴，预期回报率为纵轴的坐标上显示为一条曲线，所有落在这条曲线上的风险回报组合都是在一定风险或最低风险下可以获得的最大回报即有效投资组合。有效资产组合集是由一系列临界线导出来的，因此又称为有效边界。（2）影响：有效边界（Effective boundary），是建立最优投资组合和证券估值最重要和有用的金融学理论。曲线上，那些还没有达到或接近有效边界的投资组合可以采取多元化投资在不增加风险的情况下提高回报率，或在降低风险的情况下不降低回报率。","points":["概念：有效投资组合是指在一定的收益水平上承担最小的风险或在一定的风险水平上获得最大收益的资产组合。在几何分析法中，用来描述一项投资组合的风险与回报之间的关系，在以风险为横轴，预期回报率为纵轴的坐标上显示为一条曲线，所有落在这条曲线上的风险回报组合都是在一定风险或最低风险下可以获得的最大回报即有效投资组合。有效资产组合集是由一系列临界线导出来的，因此又称为有效边界。","影响：有效边界（Effective boundary），是建立最优投资组合和证券估值最重要和有用的金融学理论。曲线上，那些还没有达到或接近有效边界的投资组合可以采取多元化投资在不增加风险的情况下提高回报率，或在降低风险的情况下不降低回报率。"]},{"no":1,"type":"short","stem":"简述证券基本面分析的主要内容。","score":8,"body":"证券基本面分析是以证券的内在价值为依据，着重对影响证券价格及其走势的各项因素的分析，以此来决定购买何种证券以及何时购买。其假设前提是：证券的价格是由其内在价值决定的，价格受政治的、经济的、心理的等诸多因素的影响而频繁变动，很难与价值完全一致，但总是围绕价值上下波动。（1）证券基本面分析的目的如下：①评估证券的内在价值，其作用在于为判断证券市场价格的高低确立一个参照标准。②预估价格走势。因素分析，即试图通过对与证券价格存在逻辑联系的各种因素的分析，探索证券价格决定及其变动的内在原因，并在此基础上对证券价格的走势进行判断。（2）证券基本面分析的要素有：①经济要素：经济周期、国家的财政状况、金融环境、国际收支状况、行业经济地位的变化和国家汇率的调整都将影响股价的沉浮。’ ②政治因素：国家的政策调整或改变，领导人更迭，国际政治风波频仍，在国际舞台上扮演较为 ③公司自身因素：股票自身价值是决定股价最基本的因素，而这主要取决于发行公司的经营业绩、资信水平以及连带而来的股息红利派发状况、发展前景、股票预期收益水平等。④行业因素：行业在国民经济中地位的变更，行业的发展前景和发展潜力，新兴行业引来的冲击等，以及上市公司在行业中所处的位置、经营业绩、经营状况、资金组合的改变和领导层人事变动等都会影响相关股票的价格。③市场因素：投资者的动向，大户的意向和操纵，公司间的合作或相互持股，信用交易和期货交易的增减，投机者的套利行为，公司的增资方式和增资额度等，均可能对股价形成较大影响。③心理因素：投资人在受到各个方面的影响后产生心理状态改变，往往导致情绪波动，判断失误，做出盲目追随大户、狂抛抢购行为，这往往也是引起股价狂跌暴涨的重要因素。","points":["证券基本面分析是以证券的内在价值为依据，着重对影响证券价格及其走势的各项因素的分析，以此来决定购买何种证券以及何时购买。其假设前提是：证券的价格是由其内在价值决定的，价格受政治的、经济的、心理的等诸多因素的影响而频繁变动，很难与价值完全一致，但总是围绕价值上下波动。（1）证券基本面分析的目的如下：","评估证券的内在价值，其作用在于为判断证券市场价格的高低确立一个参照标准。","预估价格走势。因素分析，即试图通过对与证券价格存在逻辑联系的各种因素的分析，探索证券价格决定及其变动的内在原因，并在此基础上对证券价格的走势进行判断。（2）证券基本面分析的要素有：","经济要素：经济周期、国家的财政状况、金融环境、国际收支状况、行业经济地位的变化和国家汇率的调整都将影响股价的沉浮。’","政治因素：国家的政
